 영역별로 나누기\u003c/a>\u003ca href=\"#ch2\">03 · 정신적 몰입과 실제 압박을 구분\u003c/a>\u003ca href=\"#ch3\">04 · 엇갈린 취향을 조정하는 선택지\u003c/a>\u003ca href=\"#ch4\">05 · 언어·수치심·프라이멀의 맥락\u003c/a>\u003ca href=\"#ch5\">06 · 변경·중단·종료 후의 관계 운영\u003c/a>\u003ca href=\"#ch6\">07 · 복합 사례 종합 분석\u003c/a>\u003ca href=\"#ch7\">08 · 부록 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">고급 / 01\u003c/div>\u003ch2>고급은 강한 활동이 아니라 복잡한 판단\u003c/h2>\u003cp class=\"lede\">이 자료에서 알아볼 것: 여러 역할·감정·시간·합의가 겹칠 때 경계를 읽고 관계를 조정한다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>관계의 복잡성\u003c/h3>\u003cp>한 사람이 여러 역할을 갖거나 상대·상황별로 다른 역할을 선택할 수 있다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>판단의 복잡성\u003c/h3>\u003cp>취향·동의·체감·위험·관계 감정을 구분하며 모호함을 줄인다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>운영의 복잡성\u003c/h3>\u003cp>합의 변경·갈등·종료·사생활·회복 방식을 지속적으로 조정한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>진도와 무관한 선택\u003c/h3>\u003cp>높은 강도·지속 관계·특정 역할을 선택하지 않아도 이해 수준과 무관하다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">고급 / 02\u003c/div>\u003ch2>넓은 권한 위임도 영역별로 나누기\u003c/h2>\u003cp class=\"lede\">마스터·슬레이브·지속 관계 같은 이름만으로 실제 권한을 정할 수 없다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>확인할 영역\u003c/th>\u003cth>설명해야 하는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>관계 명칭\u003c/td>\u003ctd>두 사람이 그 단어에 부여한 의미\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권한 목록\u003c/td>\u003ctd>맡긴 결정과 맡기지 않은 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시간·장소\u003c/td>\u003ctd>언제 시작·종료하고 어디서 적용하는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예외\u003c/td>\u003ctd>업무·가족·개인 일정 등 역할을 적용하지 않는 맥락\u003c/td>\u003c/tr>\u003ctr>\u003ctd>변경권\u003c/td>\u003ctd>논의·유예·철회의 방식\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인 생활\u003c/td>\u003ctd>외부 관계·생계·의료 등 일방 통제로 확대하지 않기\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">명칭의 강렬함보다 실제 합의 내용을 본다. 상징적 소속감과 실제 소유권은 다르다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">고급 / 03\u003c/div>\u003ch2>정신적 몰입과 실제 압박을 구분\u003c/h2>\u003cp class=\"lede\">권위·인정·안도감을 선호하는 것과 거절하기 어렵게 만드는 것은 다르다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>관찰 지점\u003c/th>\u003cth>합의된 역할 표현\u003c/th>\u003cth>다시 점검할 상황\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>인정\u003c/td>\u003ctd>구체적 선택·노력을 칭찬\u003c/td>\u003ctd>애정을 잃을까 봐 원치 않는 참여\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권위\u003c/td>\u003ctd>맡긴 결정을 책임 있게 주도\u003c/td>\u003ctd>명칭을 이유로 새 권한 요구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>장난\u003c/td>\u003ctd>주고받는 도발과 반격\u003c/td>\u003ctd>거절을 계속 역할로 재해석\u003c/td>\u003c/tr>\u003ctr>\u003ctd>복종\u003c/td>\u003ctd>스스로 선택한 범위에서 맡김\u003c/td>\u003ctd>관계 유지를 위해 한계를 숨김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돌봄\u003c/td>\u003ctd>원하는 도움·거리 확인\u003c/td>\u003ctd>도움을 이유로 독립성 제한\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">개별 행동 하나로 사람을 진단하지 않는다. 현재 의사·선택권·거절 후 반응을 구체적으로 확인한다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">고급 / 04\u003c/div>\u003ch2>엇갈린 취향을 조정하는 선택지\u003c/h2>\u003cp class=\"lede\">함께 할 수 있는 영역을 찾는 것과 한쪽의 경계를 바꾸려는 것은 다르다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>유지\u003c/h3>\u003cp>현재 양쪽이 원하는 범위를 계속 유지한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>축소\u003c/h3>\u003cp>활동·빈도·적용 시간을 줄이거나 일부를 제외한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>대체\u003c/h3>\u003cp>같은 동기를 충족하는 다른 합의된 활동을 선택한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>보류·종료\u003c/h3>\u003cp>불확실하면 보류하고, 겹치는 영역이 없으면 해당 관계·활동을 끝낼 수 있다.\u003c/p>\u003c/article>\u003c/div>\u003cdetails class=\"role-pair\">\u003csummary>규율은 원하는데 수치심 표현은 싫다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>규칙과 수치심을 한 묶음으로 취급할 필요가 없다.\u003c/p>\u003cdiv class=\"callout\">명확한 규칙·과제는 남기고 비하·수치심 표현은 제외할 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>구속은 좋아하지만 지배 관계는 싫다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>활동 수용과 권한 위임은 별개다.\u003c/p>\u003cdiv class=\"callout\">활동 중심의 대등한 구조가 가능한지 별도로 합의한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>프레이지만 항상 수동적이고 싶지는 않다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>추격 구도의 역할이 일상 성격이나 모든 권한을 정하지 않는다.\u003c/p>\u003cdiv class=\"callout\">상황·활동별 역할과 전환 조건을 분리한다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">고급 / 05\u003c/div>\u003ch2>언어·수치심·프라이멀의 맥락\u003c/h2>\u003cp class=\"lede\">같은 말이나 반응의 의미가 사람·관계·장면에 따라 바뀐다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>맥락\u003c/th>\u003cth>확인할 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>비하 표현\u003c/td>\u003ctd>허용 단어·호칭·금지 주제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수치심\u003c/td>\u003ctd>누가 있는지, 공개 여부, 허용 상황\u003c/td>\u003c/tr>\u003ctr>\u003ctd>프라이멀\u003c/td>\u003ctd>역할 표현과 실제 거절·중단의 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>브랫\u003c/td>\u003ctd>장난의 범위, 반격의 허용, 실제 불쾌감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>칭찬·인정\u003c/td>\u003ctd>좋아하는 표현, 부담이 되는 표현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>새 상황\u003c/td>\u003ctd>이전의 동의가 새 관객·장소·활동까지 포함하는지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">과거에 좋아했던 단어라도 현재 싫다고 하면 현재 의사를 따른다. 취향은 맥락과 시간에 따라 바뀔 수 있다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">고급 / 06\u003c/div>\u003ch2>변경·중단·종료 후의 관계 운영\u003c/h2>\u003cp class=\"lede\">원하는 사후 반응과 다음 합의를 다룬다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>즉시 대응\u003c/h3>\u003cp>중단·철회가 있으면 해당 활동과 역할 권한을 멈춘다. 설명이나 설득을 먼저 요구하지 않는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>원하는 반응\u003c/h3>\u003cp>접촉·대화·휴식·거리를 각각 확인한다. 상대를 편하게 해주려는 돌봄도 강요하지 않는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>나중의 대화\u003c/h3>\u003cp>편한 시점에 좋았던 점·불편한 점·다음에 바꿀 점을 구체적으로 나눈다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>기록과 사생활\u003c/h3>\u003cp>역할명·기록·사진·대화 공개는 별도 동의 문제다. 활동 참여를 공개 동의로 바꾸지 않는다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout caution\">몸이나 마음의 문제가 생긴 경우 이 자료로 상태를 판단하거나 치료하지 않는다. 필요한 전문 지원과 활동 합의는 별개다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">고급 / 07\u003c/div>\u003ch2>복합 사례 종합 분석\u003c/h2>\u003cp class=\"lede\">역할·동의·강도·맥락·관계 감정을 나누어 해석한다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>서브가 오늘은 규칙을 적용하지 말자고 했다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>정체성과 현재 참여 여부가 다르다.\u003c/p>\u003cdiv class=\"callout\">기존 규칙에 대한 변경·중단 요청을 현재 의사로 다룬다. 불복종의 벌로 바꾸지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>장면 밖에서 같은 호칭을 쓰지 않아 상대가 화났다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>호칭의 적용 구간이 불명확하다.\u003c/p>\u003cdiv class=\"callout\">일상 적용과 예외를 다시 정한다. 합의가 없었던 부분을 위반으로 확정하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>강한 자극은 원하지만 소유 표현은 싫다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>신체 자극과 정서·권한 취향이 다르다.\u003c/p>\u003cdiv class=\"callout\">강도만으로 소유 표현·지배 관계를 추가하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>관계가 지속되며 이전 한계가 달라졌다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>변화 자체를 실패나 가짜 성향으로 평가하지 않는다.\u003c/p>\u003cdiv class=\"callout\">새 한계를 기준으로 범위·빈도·활동을 재조정한다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">고급 / 08\u003c/div>\u003ch2>부록 · 전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003cdiv class=\"coursefooter\">\u003ca href=\"03_intermediate.html\">← 이전 과정 · 중급\u003c/a>\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"05_situations.html\">다음 과정 · 상황별 이해 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\": {\"power\": {\"title\": \"권한을 맡기는 범위\", \"axis\": \"결정권·적용 영역\", \"levels\": [\"역할 권한을 맡기지 않는다.\", \"부탁한 단일 선택만 잠시 맡긴다.\", \"정해진 장면의 제한된 결정만 맡긴다.\", \"합의한 장면에서 여러 결정을 맡긴다.\", \"구체적으로 정한 넓은 범위의 권한을 맡긴다. 철회권은 유지된다.\"], \"change\": \"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\", \"not\": \"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"}, \"bondage\": {\"title\": \"본디지·로프·구속\", \"axis\": \"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\", \"levels\": [\"구속 활동을 원하지 않거나 이번에는 사용하지 않는다.\", \"구속의 상징·미적 분위기에만 관심을 둔다.\", \"좁게 정한 활동 범위와 짧은 역할 경험을 선호한다.\", \"활동의 구조·지속·몰입을 더 분명히 합의한다.\", \"본인이 높은 강도로 느끼는 제한·몰입을 선호한다. 구체적 한계는 별도로 정한다.\"], \"change\": \"무엇을 제한하는지, 얼마나 지속하는지, 감각과 몰입을 어떻게 느끼는지가 다르다. 이 네 요소를 한꺼번에 올리지 않는다.\", \"not\": \"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"}, \"impact\": {\"title\": \"스팽킹·임팩트 계열\", \"axis\": \"받는 사람이 느끼는 자극 강도·지속·허용 범위\", \"levels\": [\"해당 자극을 사용하지 않는다.\", \"아주 낮은 감각만 선호하며 통증을 원하지 않을 수도 있다.\", \"낮은 강도의 개별 허용 자극을 선호한다.\", \"본인 기준 중간 정도의 자극을 선호한다.\", \"본인 기준 높은 자극을 선호한다. 동의한 상한을 넘지 않는다.\"], \"change\": \"같은 활동명이라도 체감 강도·반복·지속 선호가 다르다. 공통된 도구·횟수·세기로 이 단계를 정의할 수 없다.\", \"not\": \"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"}, \"discipline\": {\"title\": \"훈육·규칙·과제\", \"axis\": \"규칙의 수·엄격함·적용 시간·피드백 방식\", \"levels\": [\"의무 규칙을 두지 않는다.\", \"선택 가능한 가벼운 약속만 둔다.\", \"소수의 분명한 규칙과 피드백을 합의한다.\", \"여러 규칙을 일관된 구조로 적용한다.\", \"엄격한 규칙 구조를 선호한다. 합의 변경·중단은 위반으로 취급하지 않는다.\"], \"change\": \"규칙의 구조와 엄격함이 달라진다. 벌의 강도·모욕·일상 통제는 별도 항목이다.\", \"not\": \"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"}, \"service\": {\"title\": \"서비스·봉사·돌봄\", \"axis\": \"기여의 비중·담당 범위·지속성\", \"levels\": [\"서비스 역할을 설정하지 않는다.\", \"가끔 작은 도움이나 배려를 선호한다.\", \"합의한 특정 도움·과제를 즐긴다.\", \"관계에서 정기적인 기여나 돌봄 역할을 중요하게 여긴다.\", \"지속적인 기여·돌봄을 핵심 취향으로 여긴다. 생활 전권·자기 소진을 의미하지 않는다.\"], \"change\": \"자발적인 기여의 비중과 구조가 달라진다. 서비스 돔은 상대 필요 중심의 주도, 서비스 서브는 봉사·기여 중심으로 표현될 수 있다.\", \"not\": \"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"}, \"protocol\": {\"title\": \"프로토콜·호칭·의식\", \"axis\": \"격식·절차의 수·일상 적용 범위\", \"levels\": [\"특별한 호칭·절차를 두지 않는다.\", \"상징이나 간단한 인사 정도만 선호한다.\", \"특정 장면에서 정한 호칭·절차를 쓴다.\", \"여러 절차를 일관되게 유지한다.\", \"격식 높은 관계 형식을 선호한다. 장소·상황별 예외는 별도로 정한다.\"], \"change\": \"격식의 정도와 적용 범위가 달라진다. 호칭 하나가 모든 명령권을 부여하지는 않는다.\", \"not\": \"일상·공개 공간에 같은 절차를 자동 확장하지 않는다.\"}, \"primal\": {\"title\": \"프라이멀·헌터/프레이\", \"axis\": \"추격·경쟁 역할의 비중과 몰입\", \"levels\": [\"해당 역할 구도를 사용하지 않는다.\", \"말·분위기 수준의 가벼운 도전만 선호한다.\", \"합의한 짧은 역할 구도를 즐긴다.\", \"역할의 긴장·경쟁·몰입을 뚜렷하게 선호한다.\", \"강한 역할 몰입을 선호한다. 실제 중단·거절과 역할 표현은 구별한다.\"], \"change\": \"역할 몰입과 경쟁 분위기가 달라진다. 헌터·프레이를 자동으로 돔·서브와 동일시하지 않는다.\", \"not\": \"프레이의 실제 거절을 역할 연기로 추정하지 않는다.\"}, \"brat\": {\"title\": \"브랫·티징·장난\", \"axis\": \"도발의 빈도·표현 수위·역할 비중\", \"levels\": [\"도발·반항 역할을 원하지 않는다.\", \"가벼운 농담이나 받아치기를 즐긴다.\", \"합의된 떠보기·장난스러운 반항을 즐긴다.\", \"도전·반응 교환을 관계의 중요한 요소로 여긴다.\", \"강한 반항 역할·긴장감을 선호한다. 표현의 한계는 구체적으로 정한다.\"], \"change\": \"상호작용의 비중과 허용 표현이 달라진다. 상대를 화나게 하거나 굴복시키는 것이 필수 목표는 아니다.\", \"not\": \"브랫이라는 이름이 실제 거절을 무시할 허가가 되지 않는다.\"}, \"language\": {\"title\": \"디그레이데이션·휴밀리에이션\", \"axis\": \"허용 단어·상황·심리적 강도\", \"levels\": [\"비하·수치심 연출을 원하지 않는다.\", \"명시적으로 허용한 아주 가벼운 표현만 선호한다.\", \"정해진 단어·상황에서 제한적인 역할 표현을 선호한다.\", \"허용한 표현과 맥락 안에서 더 깊은 심리적 몰입을 선호한다.\", \"본인이 높은 강도로 느끼는 몰입을 선호한다. 금지 단어·주제는 그대로 유지한다.\"], \"change\": \"단어의 자극성과 수치심은 개인차가 크다. 한 단어를 모든 사람에게 같은 단계로 분류할 수 없다.\", \"not\": \"디그레이데이션은 비하 표현, 휴밀리에이션은 수치심의 맥락에 초점이 있다. 서로 겹치지만 동일하지 않다.\"}, \"sensory\": {\"title\": \"감각·기대·칭찬\", \"axis\": \"감각 집중·기대감·정서적 몰입\", \"levels\": [\"해당 연출을 사용하지 않는다.\", \"편안한 분위기나 약한 감각 변화만 선호한다.\", \"특정 감각·기대·인정 경험에 선택적으로 집중한다.\", \"집중과 몰입을 더 중요한 요소로 여긴다.\", \"강한 집중·정서적 몰입을 선호한다. 통증이나 높은 위험이 필수는 아니다.\"], \"change\": \"집중·감각·감정의 체감이 달라진다. 칭찬 중심 활동은 신체 강도를 높이는 단계가 아니다.\", \"not\": \"감각 제한·강한 기대 연출의 위험이나 부담은 단순 단계와 별도로 확인한다.\"}, \"roleplay\": {\"title\": \"펫·돌봄·상징 역할극\", \"axis\": \"역할의 비중·지속·절차·몰입\", \"levels\": [\"역할극을 사용하지 않는다.\", \"상징·호칭·분위기만 가볍게 즐긴다.\", \"특정 장면에 한정한 역할을 즐긴다.\", \"여러 절차와 반응을 포함해 역할에 몰입한다.\", \"역할을 중요한 취향으로 여긴다. 역할 밖 : \"structure\", \"name\": \"특정 상대 한정\", \"desc\": \"정한 상대에게만 성향 표현; 타인에게 일반화 금지\", \"family\": null}], \"pairs\": [[\"도미넌트 ↔ 서브미시브\", \"합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\", \"결정권의 방향\", \"돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\"], [\"탑 ↔ 바텀\", \"특정 활동을 진행하는 쪽 ↔ 받는 쪽\", \"활동의 방향\", \"탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\"], [\"마스터·미스트리스 ↔ 슬레이브\", \"합의한 관계에서 넓은 권한 위임을 표현하는 명칭\", \"관계의 범위·형식\", \"돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\"], [\"새디스트 ↔ 마조히스트\", \"합의한 자극을 주는 취향 ↔ 받는 취향\", \"자극의 방향·선호\", \"새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\"], [\"스위치·사도마조히스트\", \"역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\", \"전환의 대상·상황\", \"스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\"], [\"브랫 ↔ 브랫 테이머\", \"합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\", \"반응 교환\", \"브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\"], [\"헌터·프레데터 ↔ 프레이\", \"추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\", \"프라이멀 역할\", \"헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\"], [\"리거 ↔ 로프버니·로프 바텀\", \"로프 구속을 구성하는 역할 ↔ 받는 역할\", \"로프 활동의 방향\", \"로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\"], [\"디그레이더 ↔ 디그레이디\", \"합의한 비하 표현을 제공 ↔ 수용\", \"언어·심리적 맥락\", \"실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\"], [\"스팽커 ↔ 스팽키\", \"스팽킹을 제공 ↔ 수용\", \"특정 활동의 방향\", \"스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\"], [\"훈육자·트레이너 ↔ 트레이니\", \"합의한 규칙·과제를 진행 ↔ 배우고 수행\", \"규칙·피드백 구조\", \"훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\"], [\"서비스 돔·서비스 서브\", \"상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\", \"서비스를 표현하는 방식\", \"서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\"], [\"오너·펫·펫 트레이너\", \"성인 간 소속·동물 역할극을 이끌거나 받음\", \"상징 역할·돌봄\", \"실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\"], [\"케어기버 ↔ 돌봄 수용 역할\", \"성인 간 돌봄 제공 ↔ 돌봄 수용\", \"안정감·돌봄\", \"돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\"], [\"센슈얼리스트·감각 지향\", \"감각·분위기·집중을 중심으로 즐김\", \"감각 경험\", \"통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\"]]}\u003c/script>\u003cscript>\n(()=>{'use strict';const q=id=>document.getElementById(id),data=JSON.parse(q('courseData').textContent),chapters=[...document.querySelectorAll('.chapter')];let index=0,present=false;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function update(){chapters.forEach((c,i)=>c.classList.toggle('current',i===index));document.querySelectorAll('.sidebar a').forEach((a,i)=>a.classList.toggle('active',i===index));q('slideCount').textContent=(index+1)+' / '+chapters.length;q('prevButton').disabled=index===0;q('nextButton').disabled=index===chapters.length-1}function go(i){index=Math.max(0,Math.min(chapters.length-1,i));update();if(present)window.scrollTo({top:0,behavior:'instant'});else chapters[index].scrollIntoView({behavior:'smooth',block:'start'})}q('modeButton').onclick=()=>{present=!present;document.body.classList.toggle('present',present);q('modeButton').textContent=present?'읽기 모드':'집중 읽기';q('modeButton').setAttribute('aria-pressed',String(present));q('liveStatus').textContent=present?'집중 읽기 · 좌우 화살표로 장 이동 · 장 안에서는 스크롤':'읽기 모드 · 전체 스크롤';go(index)};document.querySelectorAll('.sidebar a').forEach((a,i)=>a.onclick=e=>{e.preventDefault();go(i)});q('prevButton').onclick=()=>go(index-1);q('nextButton').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(!present||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});q('fullButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else q('liveStatus').textContent='브라우저의 전체 화면 기능을 사용하세요.'}catch(e){q('liveStatus').textContent='전체 화면 전환이 제한됩니다.'}};q('printButton').onclick=()=>window.print();let previous=[];window.addEventListener('beforeprint',()=>{previous=[...document.querySelectorAll('details')].map(d=>[d,d.open]);previous.forEach(([d])=>d.open=true);document.querySelectorAll('.entry').forEach(x=>{x.dataset.beforeprint=x.hidden?'1':'0';x.hidden=false})});window.addEventListener('afterprint',()=>{previous.forEach(([d,v])=>d.open=v);document.querySelectorAll('.entry').forEach(x=>{x.hidden=x.dataset.beforeprint==='1';delete x.dataset.beforeprint})});\nconst categories={role:'역할',traits:'세부 취향',activities:'활동',materials:'소재',style:'스타일',focus:'중심',structure:'관계 구조'};if(q('termGrid')){for(const term of data.catalog){const c=el('article',undefined,'entry');c.dataset.category=term.category;c.dataset.search=(term.name+' '+term.desc).toLowerCase();c.append(el('div',categories[term.category],'category'),el('h3',term.name),el('p',term.desc));q('termGrid').append(c)}const filter=()=>{const text=q('termSearch').value.trim().toLowerCase(),cat=q('termCategory').value;let n=0;document.querySelectorAll('.entry').forEach(c=>{c.hidden=!!((text&&!c.dataset.search.includes(text))||(cat!=='all'&&cat!==c.dataset.category));if(!c.hidden)n++});q('termCount').textContent=n+' / '+data.catalog.length+'개 항목'};q('termSearch').oninput=filter;q('termCategory').onchange=filter;filter()}\nif(q('activityPick')){const activities=data.catalog.filter(x=>x.category==='activities');for(const a of activities){const o=el('option',a.name);o.value=a.id;q('activityPick').append(o)}const render=()=>{const a=activities.find(x=>x.id===q('activityPick').value),f=data.families[a.family];q('activityBox').replaceChildren(el('h3',a.name),el('p',a.desc),el('p','比較基準'.replace('比較基準','비교 기준')+': '+f.axis,'muted'));q('activityBody').replaceChildren();f.levels.forEach((t,i)=>{const tr=el('tr');tr.append(el('td',String(i)),el('td',t));q('activityBody').append(tr)});q('activitySummary').replaceChildren(el('p',f.change),el('p','혼동하지 않기: '+f.not))};q('activityPick').onchange=render;render()}\nif(q('profilePick')){const profiles=[['약한 신체 자극 / 깊은 몰입',[1,4,3,2,0],'신체 강도는 낮아도 신뢰·권한 위임·몰입을 중요하게 여길 수 있다.'],['높은 자극 / 권한 위임 없음',[4,2,0,0,0],'강한 자극을 선호해도 지배·복종 관계나 일상 통제는 원하지 않을 수 있다.'],['엄격한 규칙 / 일상 적용 없음',[0,3,2,4,0],'신체 자극 없이 규칙과 몰입을 선호하고, 장면 밖 역할은 원하지 않을 수 있다.']];const render=()=>{const [name,value #111}.theme-choice{display:none!important}}\n\u003c/style>\u003c/head>\u003cbody>\u003caside class=\"love-rights\" aria-label=\"자료 권리 안내\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\" aria-current=\"page\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">05 상황별 이해 · 내 취향과 경계 알아보기\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"내용 목차\">\u003ca href=\"#ch0\">01 · 나에게 맞는 취향을 알아가는 법\u003c/a>\u003ca href=\"#ch1\">02 · 같은 취향인데 왜 다르게 느낄까?\u003c/a>\u003ca href=\"#ch2\">03 · 좋아하지만 여기까지는 싫을 수 있다\u003c/a>\u003ca href=\"#ch3\">04 · 모호한 취향을 구체적으로 말하기\u003c/a>\u003ca href=\"#ch4\">05 · 일상과 플레이가 헷갈리는 상황\u003c/a>\u003ca href=\"#ch5\">06 · 마음이 바뀌거나 불편할 때\u003c/a>\u003ca href=\"#ch6\">07 · 취향을 설명할 때 확인할 것\u003c/a>\u003ca href=\"#ch7\">08 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">상황별 이해 / 01\u003c/div>\u003ch2>나에게 맞는 취향을 알아가는 법\u003c/h2>\u003cp class=\"lede\">성향 이름을 바로 정하지 않아도 괜찮다. 궁금한 것과 원하는 것을 조금씩 구분하면 된다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>궁금함\u003c/h3>\u003cp>뜻이 궁금하거나 상상만 흥미로울 수 있다. 실제로 경험하고 싶다는 뜻은 아니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>좋아함\u003c/h3>\u003cp>어떤 분위기·감각·관계 방식이 마음에 들 수 있다. 그 활동의 모든 형태를 좋아할 필요는 없다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>원함\u003c/h3>\u003cp>지금 이 상대·상황·범위에서 원하는지는 별도의 질문이다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>원하지 않음\u003c/h3>\u003cp>이유를 길게 설명하지 않아도 된다. 싫은 것을 견뎌야 성향이 인정되는 것은 아니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">성향은 시험 결과처럼 하나로 고정하지 않아도 된다. 여러 키워드가 겹치거나 상대·상황·시간에 따라 달라질 수 있다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">상황별 이해 / 02\u003c/div>\u003ch2>같은 취향인데 왜 다르게 느낄까?\u003c/h2>\u003cp class=\"lede\">활동의 이름보다 좋아하는 지점과 싫은 조건이 더 구체적인 정보를 준다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>같은 이름\u003c/th>\u003cth>서로 다른 선호의 예\u003c/th>\u003cth>확인할 부분\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>도미넌트\u003c/td>\u003ctd>차분한 안내 / 장난스러운 주도 / 명확한 규칙\u003c/td>\u003ctd>주도 방식과 맡기는 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>서브미시브\u003c/td>\u003ctd>특정 선택만 맡김 / 인정받는 경험 / 합의한 규칙\u003c/td>\u003ctd>위임 범위와 자기 의견\u003c/td>\u003c/tr>\u003ctr>\u003ctd>본디지\u003c/td>\u003ctd>미적 분위기 / 집중 / 구속의 감각\u003c/td>\u003ctd>무엇에 끌리는지와 제외할 부분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스팽킹\u003c/td>\u003ctd>감각 / 역할 분위기 / 합의된 규칙의 맥락\u003c/td>\u003ctd>자극과 역할의 의미를 따로\u003c/td>\u003c/tr>\u003ctr>\u003ctd>디그레이디\u003c/td>\u003ctd>특정 표현만 허용 / 특정 장면만 허용\u003c/td>\u003ctd>허용 단어·금지 주제·상황\u003c/td>\u003c/tr>\u003ctr>\u003ctd>프레이\u003c/td>\u003ctd>추격 역할의 긴장 / 장난스러운 경쟁\u003c/td>\u003ctd>역할과 실제 거절의 구분\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">이 표는 가능한 차이의 예시다. 어떤 동기를 가졌는지 이름만 보고 추측하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">상황별 이해 / 03\u003c/div>\u003ch2>좋아하지만 여기까지는 싫을 수 있다\u003c/h2>\u003cp class=\"lede\">관심·역할·강도·일상 적용은 각각 선택할 수 있다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>“지시는 좋지만 일상 간섭은 싫어요.”\u003c/h3>\u003cp>합의한 장면에서의 주도권과 외출·교류 같은 일상 결정권은 별개다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>“강한 감각은 좋지만 소유 표현은 싫어요.”\u003c/h3>\u003cp>신체 자극 선호가 정서적 소속감이나 지배 관계를 자동 포함하지 않는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>“구속은 좋지만 통증은 원하지 않아요.”\u003c/h3>\u003cp>본디지 취향과 피학 취향을 같은 것으로 볼 필요가 없다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>“장난은 좋지만 그 호칭은 싫어요.”\u003c/h3>\u003cp>브랫·티징 취향이 모든 단어와 반격을 허용하는 것은 아니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">좋아하는 항목을 말하는 것만큼, 싫은 조건과 제외할 부분을 말하는 것도 취향 설명의 일부다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">상황별 이해 / 04\u003c/div>\u003ch2>모호한 취향을 구체적으로 말하기\u003c/h2>\u003cp class=\"lede\">“소프트하게” 한마디보다 어떤 점이 가볍기를 원하는지 덧붙이면 전달하기 쉽다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>모호한 표현\u003c/th>\u003cth>더 구체적으로 표현한 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>소프트한 게 좋아요.\u003c/td>\u003ctd>말투는 부드럽게, 일상에서는 제안까지만 원해요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>복종하는 게 좋아요.\u003c/td>\u003ctd>제가 맡기겠다고 한 선택만 이끌어주면 좋아요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>브랫 같은 관계가 좋아요.\u003c/td>\u003ctd>가벼운 떠보기와 반격은 좋지만 굴복을 강요하는 결말은 싫어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙이 있으면 좋아요.\u003c/td>\u003ctd>몇 가지 분명한 약속은 좋지만 종료 후에는 적용하지 않았으면 해요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수치심 취향이 있어요.\u003c/td>\u003ctd>허용하는 표현과 금지 단어를 먼저 나눠서 정하고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>아직 잘 모르겠어요.\u003c/td>\u003ctd>궁금한 것과 실제로 원하는 것을 구분해 알아가고 싶어요.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">예시 문장은 그대로 사용할 의무가 없다. 자신의 말로 범위·상한·제외 항목을 덧붙이면 된다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">상황별 이해 / 05\u003c/div>\u003ch2>일상과 플레이가 헷갈리는 상황\u003c/h2>\u003cp class=\"lede\">한 구간에서의 합의가 다른 구간으로 자동 이어지는 것은 아니다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>장면에서는 지시를 따랐는데, 다음 날도 같은 규칙을 요구한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>이전 장면의 역할 권한과 다음 날 일상에 대한 합의는 다르다.\u003c/p>\u003cdiv class=\"callout\">일상에도 적용하기로 한 범위가 없다면 장면의 규칙을 그대로 이월하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>도발하거나 말싸움에서 밀렸으니 참여하기로 한 것이라고 한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>장난·논쟁·경쟁의 결과는 활동에 대한 동의가 아니다.\u003c/p>\u003cdiv class=\"callout\">현재 실제로 원하는지, 어떤 역할·상황에 동의하는지 별도로 구분한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>같은 역할 이름을 쓰니 취향도 잘 맞을 거라고 생각한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>역할 이름이 같아도 좋아하는 스타일·활동·강도는 다를 수 있다.\u003c/p>\u003cdiv class=\"callout\">키워드가 겹치는 것과 함께 원하는 범위가 겹치는 것은 다르다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>관계가 깊어졌으니 더 높은 강도로 가야 한다고 생각한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>관계의 깊이와 활동 강도는 같은 척도가 아니다.\u003c/p>\u003cdiv class=\"callout\">같은 범위를 유지하거나 줄이거나 제외하는 선택도 가능하다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">상황별 이해 / 06\u003c/div>\u003ch2>마음이 바뀌거나 불편할 때\u003c/h2>\u003cp class=\"lede\">과거 취향과 현재 의사가 다를 수 있다. 바뀐 한계를 기준으로 이야기하면 된다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>지금 느끼는 것\u003c/th>\u003cth>표현할 수 있는 말\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>그만하고 싶다\u003c/td>\u003ctd>지금은 멈추고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>강도가 부담스럽다\u003c/td>\u003ctd>이 정도는 원하지 않아요. 범위를 줄이고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특정 표현이 싫다\u003c/td>\u003ctd>그 단어·호칭은 빼주세요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>오늘은 참여하고 싶지 않다\u003c/td>\u003ctd>오늘은 역할 없이 평소처럼 지내고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>혼자 있고 싶다\u003c/td>\u003ctd>지금은 접촉보다 거리를 두고 쉬고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나중에 정리하고 싶다\u003c/td>\u003ctd>지금 설명하기는 어려워요. 편해진 뒤 다시 이야기하고 싶어요.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">중단·거절 뒤에 설명이나 설득을 먼저 요구하지 않는다. 명백한 거절을 숨은 욕망이나 역할 장난으로 바꾸지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">상황별 이해 / 07\u003c/div>\u003ch2>취향을 설명할 때 확인할 것\u003c/h2>\u003cp class=\"lede\">자기 성향을 증명하는 평가표가 아니라, 아직 미정인 부분을 찾는 참고 목록이다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>역할\u003c/h3>\u003cp>내가 맡고 싶은 역할은 무엇인가? 상대·상황에 따라 달라지는가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>좋아하는 경험\u003c/h3>\u003cp>자극·신뢰·인정·기여·질서·장난 중 무엇이 중요한가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>현재 원하는 범위\u003c/h3>\u003cp>상상·관심과 실제 참여 의사를 구분했는가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>구간과 상한\u003c/h3>\u003cp>일상과 플레이에서 원하는 표현과 넘지 않을 선은 무엇인가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>금지·조건\u003c/h3>\u003cp>싫은 단어·상황·활동, 별도로 확인할 조건이 있는가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>변경·종료\u003c/h3>\u003cp>마음이 바뀌면 어떻게 말하고, 끝난 뒤 어떤 거리·대화·휴식을 원하는가?\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">빈칸이 있어도 괜찮다. 아직 모르는 것은 미정으로 남기고, 자동으로 허용된 것으로 다루지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">상황별 이해 / 08\u003c/div>\u003ch2>전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\": {\"power\": {\"title\": \"권한을 맡기는 범위\", \"axis\": \"결정권·적용 영역\", \"levels\": [\"역할 권한을 맡기지 않는다.\", \"부탁한 단일 선택만 잠시 맡긴다.\", \"정해진 장면의 제한된 결정만 맡긴다.\", \"합의한 장면에서 여러 결정을 맡긴다.\", \"구체적으로 정한 넓은 범위의 권한을 맡긴다. 철회권은 유지된다.\"], \"change\": \"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\", \"not\": \"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"}, \"bondage\": {\"title\": \"본디지·로프·구속\", \"axis\": \"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\", \"levels\": [\"구속 활동을 원하지 않거나 이번에는 사용하지 않는다.\", \"구속의 상징·미적 분위기에만 관심을 둔다.\", \"좁게 정한 활동 범위와 짧은 역할 경험을 선호한다.\", \"활동의 구조·지속·몰입을 더 분명히 합의한다.\", \"본인이 높은 강도로 느끼는 제한·몰입을 선호한다. 구체적 한계는 별도로 정한다.\"], \"change\": \"무엇을 제한하는지, 얼마나 지속하는지, 감각과 몰입을 어떻게 느끼는지가 다르다. 이 네 요소를 한꺼번에 올리지 않는다.\", \"not\": \"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"}, \"impact\": {\"title\": \"스팽킹·임팩트 계열\", \"axis\": \"받는 사람이 느끼는 자극 강도·지속·허용 범위\", \"levels\": [\"해당 자극을 사용하지 않는다.\", \"아주 낮은 감각만 선호하며 통증을 원하지 않을 수도 있다.\", \"낮은 강도의 개별 허용 자극을 선호한다.\", \"본인 기준 중간 정도의 자극을 선호한다.\", \"본인 기준 높은 자극을 선호한다. 동의한 상한을 넘지 않는다.\"], \"change\": \"같은 활동명이라도 체감 강도·반복·지속 선호가 다르다. 공통된 도구·횟수·세기로 이 단계를 정의할 수 없다.\", \"not\": \"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"}, \"discipline\": {\"title\": \"훈육·규칙·과제\", \"axis\": \"규칙의 수·엄격함·적용 시간·피드백 방식\", \"levels\": [\"의무 규칙을 두지 않는다.\", \"선택 가능한 가벼운 약속만 둔다.\", \"소수의 분명한 규칙과 피드백을 합의한다.\", \"여러 규칙을 일관된 구조로 적용한다.\", \"엄격한 규칙 구조를 선호한다. 합의 변경·중단은 위반으로 취급하지 않는다.\"], \"change\": \"규칙의 구조와 엄격함이 달라진다. 벌의 강도·모욕·일상 통제는 별도 항목이다.\", \"not\": \"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"}, \"service\": {\"title\": \"서비스·봉사·돌봄\", \"axis\": \"기여의 비중·담당 범위·지속성\", \"levels\": [\"서비스 역할을 설정하지 않는다.\", \"가끔 작은 도움이나 배려를 선호한다.\", \"합의한 특정 도움·과제를 즐긴다.\", \"관계에서 정기적인 기여나 돌봄 역할을 중요하게 여긴다.\", \"지속적인 기여·돌봄을 핵심 취향으로 여긴다. 생활 전권·자기 소진을 의미하지 않는다.\"], \"change\": \"자발적인 기여의 비중과 구조가 달라진다. 서비스 돔은 상대 필요 중심의 주도, 서비스 서브는 봉사·기여 중심으로 표현될 수 있다.\", \"not\": \"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"}, \"protocol\": {\"title\": \"프로토콜·호칭·의식\", \"axis\": \"격식·절차의 수·일상 적용 범위\", \"levels\": [\"특별한 호칭·절차를 두지 않는다.\", \"상징이나 간단한 인사 정도만 선호한다.\", \"특정 장면에서 정한 호칭·절차를 쓴다.\", \"여러 절차를 일관되게 유지한다.\", \"격식 높은 관계 형식을 선호한다. 장소·상황별 예외는 별도로 정한다.\"], \"change\": \"격식의 정도와 적용 범위가 달라진다. 호칭 하나가 모든 명령권을 부여하지는 않는다.\", \"not\": \"일상·공개 공간에 같은 절차를 자동 확장하지 않는다.\"}, \"primal\": {\"title\": \"프라이멀·헌터/프레이\", \"axis\": \"추격·경쟁 역할의 비중과 몰입\", \"levels\": [\"해당 역할 구도를 사용하지 않는다.\", \"말·분위기 수준의 가벼운 도전만 선호한다.\", \"합의한 짧은 역할 구도를 즐긴다.\", \"역할의 긴장·경쟁·몰입을 뚜렷하게 선호한다.\", \"강한 역할 몰입을 선호한다. 실제 중단·거절과 역할 표현은 구별한다.\"], \"change\": \"역할 몰입과 경쟁 분위기가 달라진다. 헌터·프레이를 자동으로 돔·서브와 동일시하지 않는다.\", \"not\": \"프레이의 실제 거절을 역할 연기로 추정하지 않는다.\"}, \"brat\": {\"title\": \"브랫·티징·장난\", \"axis\": \"도발의 빈도·표현 수위·역할 비중\", \"levels\": [\"도발·반항 역할을 원하지 않는다.\", \"가벼운 농담이나 받아치기를 즐긴다.\", \"합의된 떠보기·장난스러운 반항을 즐긴다.\", \"도전·반응 교환을 관계의 중요한 요소로 여긴다.\", \"강한 반항 역할·긴장감을 선호한다. 표현의 한계는 구체적으로 정한다.\"], \"change\": \"상호작용의 비중과 허용 표현이 달라진다. 상대를 화나게 하거나 굴복시키는 것이 필수 목표는 아니다.\", \"not\": \"브랫이라는 이름이 실제 거절을 무시할 허가가 되지 않는다.\"}, \"language\": {\"title\": \"디그레이데이션·휴밀리에이션\", \"axis\": \"허용 단어·상황·심리적 강도\", \"levels\": [\"비하·수치심 연출을 원하지 않는다.\", \"명시적으로 허용한 아주 가벼운 표현만 선호한다.\", \"정해진 단어·상황에서 제한적인 역할 표현을 선호한다.\", \"허용한 표현과 맥락 안에서 더 깊은 심리적 몰입을 선호한다.\", \"본인이 높은 강도로 느끼는 몰입을 선호한다. 금지 단어·주제는 그대로 유지한다.\"], \"change\": \"단어의 자극성과 수치심은 개인차가 크다. 한 단어를 모든 사람에게 같은 단계로 분류할 수 없다.\", \"not\": \"디그레이데이션은 비하 표현, 휴밀리에이션은 수치심의 맥락에 초점이 있다. 서로 겹치지만 동일하지 않다.\"}, \"sensory\": {\"title\": \"감각·기대·칭찬\", \"axis\": \"감각 집중·기대감·정서적 몰입\", \"levels\": [\"해당 연출을 사용하지 않는다.\", \"편안한 분위기나 약한 감각 변화만 선호한다.\", \"특정 감각·기대·인정 경험에 선택적으로 집중한다.\", \"집중과 몰입을 더 중요한 요소로 여긴다.\", \"강한 집중·정서적 몰입을 선호한다. 통증이나 높은 위험이 필수는 아니다.\"], \"change\": \"집중·감각·감정의 체감이 달라진다. 칭찬 중심 활동은 신체 강도를 높이는 단계가 아니다.\", \"not\": \"감각 제한·강한 기대 연출의 위험이나 부담은 단순 단계와 별도로 확인한다.\"}, \"roleplay\": {\"title\": \"펫·돌봄·상징 역할극\", \"axis\": \"역할의 비중·지속·절차·몰입\", \"levels\": [\"역할극을 사용하지 않는다.\", \"상징·호칭·분위기만 가볍게 즐긴다.\", \"특정 장면에 한정한 역할을 즐긴다.\", \"여러 절차와 반응을 포함해 역할에 몰입한다.\", \"역할을 중요한 취향으로 여긴다. 역할 밖 독립성과 중단권은 유지된다.\"], \"change\": \"역할극의 깊이와 적용 시간이 달라진다. 성인 간 허구적 역할이며 실제 동물·미성년자와 무관하다.\", \"not\": \"역할 명칭을 실제 인격·권리의 소거로 해석하지 않는다.\"}, \"aesthetic\": {\"title\": \"소재·미적 연출·관계 상징\", \"axis\": \"취향의 중요도·연출의 비중\", \"levels\": [\"특별한 선호가 없다.\", \"있으면 좋은 분위기 요소다.\", \"특정 소재·상징을 선택적으로 선호한다.\", \"장면·관계 만족에서 중요한 요소다.\", \"핵심적인 선호다. 신체 자극·권한 범위는 별개다.\"], \"change\": \"소재·복장·상징을 얼마나 중요하게 여기는지가 다르다. 더 강한 자극으로 이어지는 단계가 아니다.\", \"not\": \"칼라·계약 연출·특정 복장이 실제 소유권이나 영구 동의를 만들지는 않는다.\"}}, \"catalog\": [{\"id\": \"role:none\", \"category\": \"role\", \"name\": \"미지정\", \"desc\": \"기존 역할 유지\", \"family\": null}, {\"id\": \"role:dom\", \"category\": \"role\", \"name\": \"도미넌트\", \"desc\": \"합의한 범위에서 주도권을 맡음\", \"family\": null}, {\"id\": \"role:sub\", \"category\": \"role\", \"name\": \"서브미시브 · 서브 · 섭\", \"desc\": \"자발적으로 주도권을 맡김\", \"family\": null}, {\"id\": \"role:switch\", \"cat us\", \"name\": \"경쟁 중심\", \"desc\": \"실력·말싸움·도전; 패배=복종 아님\", \"family\": null}, {\"id\": \"structure:ds\", \"category\": \"structure\", \"name\": \"지배·복종 관계\", \"desc\": \"합의한 권한을 주고받는 관계\", \"family\": null}, {\"id\": \"structure:ms\", \"category\": \"structure\", \"name\": \"마스터·슬레이브 관계\", \"desc\": \"넓은 권한 위임을 표현하는 관계명; 구체적 범위·철회권 유지\", \"family\": null}, {\"id\": \"structure:activity\", \"category\": \"structure\", \"name\": \"활동 중심\", \"desc\": \"관계 위계 없이 특정 활동의 진행·수용에 집중\", \"family\": null}, {\"id\": \"structure:sceneOnly\", \"category\": \"structure\", \"name\": \"장면 한정\", \"desc\": \"정한 장면에서만 역할 활성; 일상은 별개\", \"family\": null}, {\"id\": \"structure:ongoing\", \"category\": \"structure\", \"name\": \"지속 관계\", \"desc\": \"합의한 역할을 장기적으로 유지; 항상 플레이하는 뜻 아님\", \"family\": null}, {\"id\": \"structure:dailyAgreed\", \"category\": \"structure\", \"name\": \"일상 일부 적용\", \"desc\": \"구체적으로 정한 일상 영역만 역할 적용\", \"family\": null}, {\"id\": \"structure:switching\", \"category\": \"structure\", \"name\": \"역할 전환형\", \"desc\": \"상대·상황별 합의로 역할 변경\", \"family\": null}, {\"id\": \"structure:onePartner\", \"category\": \"structure\", \"name\": \"특정 상대 한정\", \"desc\": \"정한 상대에게만 성향 표현; 타인에게 일반화 금지\", \"family\": null}], \"pairs\": [[\"도미넌트 ↔ 서브미시브\", \"합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\", \"결정권의 방향\", \"돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\"], [\"탑 ↔ 바텀\", \"특정 활동을 진행하는 쪽 ↔ 받는 쪽\", \"활동의 방향\", \"탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\"], [\"마스터·미스트리스 ↔ 슬레이브\", \"합의한 관계에서 넓은 권한 위임을 표현하는 명칭\", \"관계의 범위·형식\", \"돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\"], [\"새디스트 ↔ 마조히스트\", \"합의한 자극을 주는 취향 ↔ 받는 취향\", \"자극의 방향·선호\", \"새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\"], [\"스위치·사도마조히스트\", \"역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\", \"전환의 대상·상황\", \"스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\"], [\"브랫 ↔ 브랫 테이머\", \"합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\", \"반응 교환\", \"브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\"], [\"헌터·프레데터 ↔ 프레이\", \"추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\", \"프라이멀 역할\", \"헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\"], [\"리거 ↔ 로프버니·로프 바텀\", \"로프 구속을 구성하는 역할 ↔ 받는 역할\", \"로프 활동의 방향\", \"로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\"], [\"디그레이더 ↔ 디그레이디\", \"합의한 비하 표현을 제공 ↔ 수용\", \"언어·심리적 맥락\", \"실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\"], [\"스팽커 ↔ 스팽키\", \"스팽킹을 제공 ↔ 수용\", \"특정 활동의 방향\", \"스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\"], [\"훈육자·트레이너 ↔ 트레이니\", \"합의한 규칙·과제를 진행 ↔ 배우고 수행\", \"규칙·피드백 구조\", \"훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\"], [\"서비스 돔·서비스 서브\", \"상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\", \"서비스를 표현하는 방식\", \"서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\"], [\"오너·펫·펫 트레이너\", \"성인 간 소속·동물 역할극을 이끌거나 받음\", \"상징 역할·돌봄\", \"실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\"], [\"케어기버 ↔ 돌봄 수용 역할\", \"성인 간 돌봄 제공 ↔ 돌봄 수용\", \"안정감·돌봄\", \"돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\"], [\"센슈얼리스트·감각 지향\", \"감각·분위기·집중을 중심으로 즐김\", \"감각 경험\", \"통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\"]]}\u003c/script>\u003cscript>\n(()=>{'use strict';const q=id=>document.getElementById(id),data=JSON.parse(q('courseData').textContent),chapters=[...document.querySelectorAll('.chapter')];let index=0,present=false;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function update(){chapters.forEach((c,i)=>c.classList.toggle('current',i===index));document.querySelectorAll('.sidebar a').forEach((a,i)=>a.classList.toggle('active',i===index));q('slideCount').textContent=(index+1)+' / '+chapters.length;q('prevButton').disabled=index===0;q('nextButton').disabled=index===chapters.length-1}function go(i){index=Math.max(0,Math.min(chapters.length-1,i));update();if(present)window.scrollTo({top:0,behavior:'instant'});else chapters[index].scrollIntoView({behavior:'smooth',block:'start'})}q('modeButton').onclick=()=>{present=!present;document.body.classList.toggle('present',present);q('modeButton').textContent=present?'읽기 모드':'집중 읽기';q('modeButton').setAttribute('aria-pressed',String(present));q('liveStatus').textContent=present?'집중 읽기 · 좌우 화살표로 장 이동 · 장 안에서는 스크롤':'읽기 모드 · 전체 스크롤';go(index)};document.querySelectorAll('.sidebar a').forEach((a,i)=>a.onclick=e=>{e.preventDefault();go(i)});q('prevButton').onclick=()=>go(index-1);q('nextButton').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(!present||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});q('fullButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else q('liveStatus').textContent='브라우저의 전체 화면 기능을 사용하세요.'}catch(e){q('liveStatus').textContent='전체 화면 전환이 제한됩니다.'}};q('printButton').onclick=()=>window.print();let previous=[];window.addEventListener('beforeprint',()=>{previous=[...document.querySelectorAll('details')].map(d=>[d,d.open]);previous.forEach(([d])=>d.open=true);document.querySelectorAll('.entry').forEach(x=>{x.dataset.beforeprint=x.hidden?'1':'0';x.hidden=false})});window.addEventListener('afterprint',()=>{previous.forEach(([d,v])=>d.open=v);document.querySelectorAll('.entry').forEach(x=>{x.hidden=x.dataset.beforeprint==='1';delete x.dataset.beforeprint})});\nconst categories={role:'역할',traits:'세부 취향',activities:'활동',materials:'소재',style:'스타일',focus:'중심',structure:'관계 구조'};if(q('termGrid')){for(const term of data.catalog){const c=el('article',undefined,'entry');c.dataset.category=term.category;c.dataset.search=(term.name+' '+term.desc).toLowerCase();c.append(el('div',categories[term.category],'category'),el('h3',term.name),el('p',term.desc));q('termGrid').append(c)}const filter=()=>{const text=q('termSearch').value.trim().toLowerCase(),cat=q('termCategory').value;let n=0;document.querySelectorAll('.entry').forEach(c=>{c.hidden=!!((text&&!c.dataset.search.includes(text))||(cat!=='all'&&cat!==c.dataset.category));if(!c.hidden)n++});q('termCount').textContent=n+' / '+data.catalog.length+'개 항목'};q('termSearch').oninput=filter;q('termCategory').onchange=filter;filter()}\nif(q('activityPick')){const activities=data.catalog.filter(x=>x.category==='activities');for(const a of activities){const o=el('option',a.name);o.value=a.id;q('activityPick').append(o)}const render=()=>{const a=activities.find(x=>x.id===q('activityPick').value),f=data.families[a.family];q('activityBox').replaceChildren(el('h3',a.name),el('p',a.desc),el('p','比較基準'.replace('比較基準','비교 기준')+': '+f.axis,'muted'));q('activityBody').replaceChildren();f.levels.forEach((t,i)=>{const tr=el('tr');tr.append(el('td',String(i)),el('td',t));q('activityBody').append(tr)});q('activitySummary').replaceChildren(el('p',f.change),el('p','혼동하지 않기: '+f.not))};q('activityPick').onchange=render;render()}\nif(q('profilePick')){const profiles=[['약한 신체 자극 / 깊은 몰입',[1,4,3,2,0],'신체 강도는 낮아도 신뢰·권한 위임·몰입을 중요하게 여길 수 있다.'],['높은 자극 / 권한 위임 없음',[4,2,0,0,0],'강한 자극을 선호해도 지배·복종 관계나 일상 통제는 원하지 않을 수 있다.'],['엄격한 규칙 / 일상 적용 없음',[0,3,2,4,0],'신체 자극 없이 규칙과 몰입을 선호하고, 장면 밖 역할은 원하지 않을 수 있다.']];const render=()=>{const [name,values,text]=profiles[+q('profilePick').value];q('profileBox').replaceChildren(el('h3',name),el('p',text));['신체 자극','심리 몰입','권한 위임','규칙 엄격함','일상 적용'].forEach((name,i)=>{const c=el('div',undefined,'metric'),r=el('div',undefined,'metric-line');r.append(el('span',name),el('span',values[i]+' / 4'));const track=el('div',undefined,'track'),bar=el('span');bar.style.width=values[i]*25+'%';track.append(bar);c.append(r,track);q('profileBox').append(c)})};q('profilePick').onchange=render;render()}\n\nif('IntersectionObserver'in window){const o=new IntersectionObserver(entries=>{if(present)return;for(const x of entries)if(x.isIntersecting){index=chapters.indexOf(x.target);update()}},{rootMargin:'-10% 0px -65% 0px'});chapters.forEach(c=>o.observe(c))}update();})();\n\u003c/script>\u003cfooter class=\"love-rights love-rights-footer\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/footer>\u003cscript>\n(()=>{'use strict';const key='love-bdsm-theme';const filenames=['01_intro.html','02_beginner.html','03_intermediate.html','04_advanced.html','05_situations.html'];let theme='light';try{const saved=localStorage.getItem(key);if(saved==='dark')theme='dark'}catch(e){}const embedded=window.parent!==window;if(embedded)document.documentElement.dataset.embedded='true';function apply(t){theme=t==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-choice]').forEach(s=>s.value=theme)}apply(theme);const tools=document.querySelector('.tools');if(tools&&!embedded){const l=document.createElement('label');l.className='theme-choice';l.append(document.createTextNode('화면'));const s=document.createElement('select');s.setAttribute('aria-label','화면 모드');s.dataset.themeChoice='true';for(const [v,t]of [['light','밝은 모드'],['dark','어두운 모드']]){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}s.value=theme;s.onchange=()=>{apply(s.value);try{localStorage.setItem(key,theme)}catch(e){}if(embedded)parent.postMessage({type:'love-bdsm-theme',theme},'*')};l.append(s);tools.prepend(l)}window.addEventListener('message',e=>{if(e.source!==parent||!e.data)return;if(e.data.type==='love-bdsm-set-theme')apply(e.data.theme)});document.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(!embedded||!a)return;const href=a.getAttribute('href');let index=filenames.indexOf(href);if(href==='index.html')index=0;if(index>=0){e.preventDefault();parent.postMessage({type:'love-bdsm-navigate',index},'*')}});if(embedded)parent.postMessage({type:'love-bdsm-ready'},'*');})();\n\u003c/script>\u003c/body>\u003c/html>"}]</script><script>
(()=>{'use strict';const docs=JSON.parse(document.getElementById('documents').textContent),tabs=[...document.querySelectorAll('[role=tab]')],container=document.getElementById('readers'),selector=document.getElementById('theme'),frames=new Map();let active=0,theme='light';try{if(localStorage.getItem('love-bdsm-theme')==='dark')theme='dark'}catch(e){}function apply(t){theme=t==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;selector.value=theme;try{localStorage.setItem('love-bdsm-theme',theme)}catch(e){}for(const frame of frames.values())frame.contentWindow?.postMessage({type:'love-bdsm-set-theme',theme},'*')}
function show(i,changeHash=true){if(!Number.isInteger(i)||i<0||i>=docs.length)i=0;active=i;tabs.forEach((tab,n)=>{tab.setAttribute('aria-selected',String(n===i));tab.tabIndex=n===i?0:-1});let frame=frames.get(i);if(!frame){frame=document.createElement('iframe');frame.className='reader';frame.id='reader-'+i;frame.setAttribute('title',docs[i].label+' · '+docs[i].title);frame.setAttribute('role','tabpanel');frame.setAttribute('aria-labelledby','tab-'+i);frame.setAttribute('allow','fullscreen');frame.srcdoc=docs[i].html;frame.onload=()=>frame.contentWindow?.postMessage({type:'love-bdsm-set-theme',theme},'*');container.append(frame);frames.set(i,frame)}for(const [n,f]of frames)f.hidden=n!==i;if(changeHash)history.replaceState(null,'','#'+docs[i].slug);document.getElementById('status').textContent=docs[i].label+' 자료를 열었습니다.';document.title='BDSM 자료 · '+docs[i].label+' | 러브';}
tabs.forEach((tab,i)=>{tab.onclick=()=>show(i);tab.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();show(n);tabs[n].focus()}});selector.onchange=()=>apply(selector.value);window.addEventListener('hashchange',()=>show(docs.findIndex(d=>d.slug===location.hash.slice(1)),false));window.addEventListener('message',e=>{const frame=[...frames.values()].find(f=>f.contentWindow===e.source);if(!frame||!e.data)return;if(e.data.type==='love-bdsm-ready')frame.contentWindow.postMessage({type:'love-bdsm-set-theme',theme},'*');if(e.data.type==='love-bdsm-theme')apply(e.data.theme);if(e.data.type==='love-bdsm-navigate')show(e.data.index)});apply(theme);show(docs.findIndex(d=>d.slug===location.hash.slice(1)),false);})();
