<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHELTER-GRID QA</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2129;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f3a5f;
  --green: #3fb950;
  --green-dim: #1a3a2a;
  --yellow: #d29922;
  --yellow-dim: #3d2e00;
  --red: #f85149;
  --red-dim: #4a1e1e;
  --orange: #db6d28;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface2: #f0f3f6;
    --border: #d0d7de;
    --text: #1f2328;
    --text-dim: #656d76;
    --accent: #0969da;
    --accent-dim: #ddf4ff;
    --green: #1a7f37;
    --green-dim: #dafbe1;
    --yellow: #9a6700;
    --yellow-dim: #fff8c5;
    --red: #cf222e;
    --red-dim: #ffebe9;
    --orange: #bc4c00;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2129;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f3a5f;
  --green: #3fb950;
  --green-dim: #1a3a2a;
  --yellow: #d29922;
  --yellow-dim: #3d2e00;
  --red: #f85149;
  --red-dim: #4a1e1e;
  --orange: #db6d28;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}

header {
  text-align: center;
  padding: 32px 16px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
header h1 { font-size: 1.5rem; margin-bottom: 4px; }
header p { color: var(--text-dim); font-size: 0.85rem; }

/* Progress bar */
.progress-bar-wrap {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.progress-track {
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width 0.3s ease;
  width: 0%;
}
.progress-counts {
  display: flex;
  gap: 12px;
  font-size: 0.75rem;
  margin-top: 6px;
}
.progress-counts span { display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-pass { background: var(--green); }
.dot-fail { background: var(--red); }
.dot-pending { background: var(--text-dim); }

/* Filter tabs */
.filter-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-tab {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-tab:hover { border-color: var(--accent); color: var(--text); }
.filter-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* Priority badges */
.priority { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 8px; white-space: nowrap; }
.priority-must { background: var(--red-dim); color: var(--red); }
.priority-important { background: var(--yellow-dim); color: var(--yellow); }
.priority-check { background: var(--green-dim); color: var(--green); }

/* Category */
.category {
  margin-bottom: 28px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
}
.category-header {
  padding: 14px 16px;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.category-header:hover { background: var(--border); }
.category-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.category-title .arrow { transition: transform 0.2s; font-size: 0.8rem; color: var(--text-dim); }
.category-header.collapsed .arrow { transform: rotate(-90deg); }
.category-stats { font-size: 0.75rem; color: var(--text-dim); }
.category-body { padding: 0; }
.category-header.collapsed + .category-body { display: none; }

/* Test item */
.test-item {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
}
.test-item:first-child { border-top: none; }
.test-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.test-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 36px;
  padding-top: 2px;
  font-weight: 600;
}
.test-name { font-weight: 600; font-size: 0.9rem; flex: 1; }

/* Status buttons */
.status-btns {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.status-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.status-btn:hover { border-color: var(--accent); transform: scale(1.05); }
.status-btn.active-pass { background: var(--green-dim); border-color: var(--green); }
.status-btn.active-fail { background: var(--red-dim); border-color: var(--red); }

/* Details */
.test-details {
  margin: 10px 0 0 46px;
  font-size: 0.82rem;
  color: var(--text-dim);
}
.test-details .detail-block {
  margin-bottom: 6px;
}
.detail-label {
  font-weight: 600;
  color: var(--text);
  margin-right: 4px;
}
.detail-warn { color: var(--orange); }

/* Memo */
.memo-wrap {
  margin: 10px 0 0 46px;
}
.memo-wrap textarea {
  width: 100%;
  min-height: 50px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text);
  font-size: 0.82rem;
  font-family: inherit;
  resize: vertical;
  line-height: 1.5;
}
.memo-wrap textarea:focus { outline: none; border-color: var(--accent); }
.memo-wrap textarea::placeholder { color: var(--text-dim); }

/* Toggle detail */
.toggle-detail {
  margin: 6px 0 0 46px;
  font-size: 0.75rem;
  color: var(--accent);
  cursor: pointer;
  display: inline-block;
}
.toggle-detail:hover { text-decoration: underline; }

/* Export panel */
.export-panel {
  position: sticky;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 16px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  z-index: 100;
}
.export-btn {
  padding: 10px 20px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.15s;
}
.export-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
.export-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.export-btn.primary:hover { opacity: 0.9; }
.export-btn.danger { border-color: var(--red); color: var(--red); }
.export-btn.danger:hover { background: var(--red-dim); }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  z-index: 999;
  transition: transform 0.3s ease;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Hidden for detail toggle */
.details-hidden { display: none; }

@media (max-width: 600px) {
  .container { padding: 12px; }
  header h1 { font-size: 1.2rem; }
  .test-details { margin-left: 0; }
  .memo-wrap { margin-left: 0; }
  .toggle-detail { margin-left: 0; }
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>SHELTER-GRID QA 체크리스트</h1>
  <p>테스트 입력 → 정상 출력 → ⚠️ 수정 필요 신호 │ 항목별 체크 + 메모</p>
</header>

<div class="progress-bar-wrap">
  <div class="progress-info">
    <span id="progressLabel">진행률 0%</span>
    <span id="progressFraction">0 / 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-counts">
    <span><span class="dot dot-pass"></span> 통과 <b id="countPass">0</b></span>
    <span><span class="dot dot-fail"></span> 수정필요 <b id="countFail">0</b></span>
    <span><span class="dot dot-pending"></span> 미확인 <b id="countPending">0</b></span>
  </div>
</div>

<div class="filter-tabs" id="filterTabs">
  <div class="filter-tab active" data-filter="all">전체</div>
  <div class="filter-tab" data-filter="pending">미확인</div>
  <div class="filter-tab" data-filter="pass">✅ 통과</div>
  <div class="filter-tab" data-filter="fail">⚠️ 수정필요</div>
  <div class="filter-tab" data-filter="memo">메모있음</div>
</div>

<div id="qaContent"></div>
</div>

<div class="export-panel">
  <button class="export-btn" onclick="expandAll()">전체 펼치기</button>
  <button class="export-btn" onclick="collapseAll()">전체 접기</button>
  <button class="export-btn primary" onclick="copyFeedback()">📋 피드백 복사</button>
  <button class="export-btn primary" id="dlBtn" onclick="downloadFeedback()">💾 피드백 다운로드</button>
  <button class="export-btn danger" onclick="resetAll()">🗑️ 초기화</button>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = [
  {
    cat: "1", title: "UI 출력", priority: "must",
    items: [
      { id: "1-1", name: "고정UI 출력 여부",
        input: '아무 인게임 행동 (예: "주변을 둘러본다")',
        expect: "응답 최하단에 고정UI 1회 출력\n📅DAY│🕰️│📍│🌤️│🧟\n❤️│⚡│🍽️│💧│🧠│☣️│💉│🩹",
        warn: "고정UI 누락 / 2회 이상 반복 / 본문 중간에 섞임 / 항목 일부 누락" },
      { id: "1-2", name: "미확인 수치 처리",
        input: "게임 시작 직후 행동 (수치 초기화 전)",
        expect: '확정되지 않은 수치 = "미확인" 표시',
        warn: "임의 숫자 등장 (HP 78 등) / 전부 미확인이어야 할 시점에 특정 수치만 숫자" },
      { id: "1-3", name: "자동UI 작동",
        input: "전투 후 부상 / 아이템 획득 / 셸터 자원 변화",
        expect: "해당 변화 항목만 고정UI 직전에 자동UI 출력",
        warn: "변화 없는데 출력 / 변화 있는데 누락 / 전체 상태 매번 나열 / 미세변화 남발" },
      { id: "1-4", name: "위기등급 표시",
        input: "셸터 평시 → NORMAL / 위기 발생 시",
        expect: "NORMAL이면 🚨줄 생략 / LEVEL n이면 🚨 LEVEL n · 위기유형 표시",
        warn: "NORMAL인데 🚨 출력 / LEVEL2+인데 🚨 누락 / 유형 없이 LEVEL만 표시" }
    ]
  },
  {
    cat: "2", title: "수치 시스템", priority: "must",
    items: [
      { id: "2-1", name: "수치 임의생성 금지",
        input: "/상태",
        expect: "확정된 수치만 표시, 나머지 미확인",
        warn: "설정·갱신 안 된 수치에 숫자 등장 / 턴마다 근거 없이 변동" },
      { id: "2-2", name: "수치 누적·미초기화",
        input: "전투에서 HP 50 → 다음 장면 /상태",
        expect: "HP 50 유지 (치료·휴식 없이 회복X)",
        warn: "장면 전환 후 HP 100 복귀 / 근거 없는 자동 회복" },
      { id: "2-3", name: "미세변화 억제",
        input: '"물 한 모금" vs "하루 종일 결식 이동"',
        expect: "미세→서술 처리만 / 장시간→수치 변화+자동UI",
        warn: "물 한 모금에 HYD+3 / 장시간 결식인데 변화 없음" },
      { id: "2-4", name: "INF 비공개 원칙",
        input: "교상 발생 후 /상태 → 병원 검사",
        expect: "검사 전 INF=미확인 / 검사 후 수치 공개",
        warn: "교상 직후 INF 수치 노출 / 메타 힌트 삽입 / 검사 없이 수치 공개" },
      { id: "2-5", name: "TOX·TOL 관리",
        input: "RUSH 2회 연속 / S계열 1회 투여",
        expect: "RUSH→TOX↑+RUSH TOL↑ / S계열→별도 관리",
        warn: "복수 사용에 TOX 변화 없음 / 관련 없는 약물에 내성 적용" }
    ]
  },
  {
    cat: "3", title: "약물 시스템", priority: "important",
    items: [
      { id: "3-1", name: "효과+대가 동시판정",
        input: '"RUSH를 투여한다"',
        expect: "전투각성 효과 + TOX 상승 + 부작용 가능성",
        warn: "효과만, 대가 없음 / 자동완치·자동성공" },
      { id: "3-2", name: "S계열 지속시간",
        input: "B등급 S계열 투여 → 시간 경과",
        expect: "4~6일 효과 → 종료 후 감염 재개 가능",
        warn: "등급 무관 동일 시간 / 억제제로 완치 / 영구 억제" },
      { id: "3-3", name: "가짜면역제·영구백신",
        input: 'NPC "완전면역제가 있다" 제안',
        expect: "가짜면역제 = 완전면역X / 사기·위험 가능성",
        warn: "영구백신 실제 작동 / 감염 완전 치료 성공" },
      { id: "3-4", name: "약물 품질 구분",
        input: "암시장 vs 병원 정규 약물",
        expect: "암시장=D등급·불확실 / 병원=B등급↑·양호",
        warn: "암시장에서 A등급 / 품질 구분 없이 동일 효과" }
    ]
  },
  {
    cat: "4", title: "감염 시스템", priority: "important",
    items: [
      { id: "4-1", name: "감염 경로",
        input: "좀비에게 물림 vs 옆을 지나감",
        expect: "교상→감염판정 / 단순 접근→감염X",
        warn: "공기감염·접촉감염 발생 / 교상 없이 감염 경고" },
      { id: "4-2", name: "잠복기",
        input: "손목 교상 vs 목 교상",
        expect: "말단→잠복기 길어짐 / 두부 인접→짧아짐",
        warn: "부위 무관 동일 잠복기 / 즉시 좀비화" },
      { id: "4-3", name: "동물 감염",
        input: "야생 개 물림 / 물고기 섭취",
        expect: "동물 감염 가능 / 어류 오염육 위험 존재",
        warn: "동물 감염 무시 / 식물에서 감염 발생" },
      { id: "4-4", name: "좀비 활동성",
        input: "한겨울 vs 한여름 야외 이동",
        expect: "저온→활동성↑ / 고온→활동성↓",
        warn: "기온과 활동성 반대 / 항상 동일 활동성" }
    ]
  },
  {
    cat: "5", title: "진행 리듬·사건", priority: "must",
    items: [
      { id: "5-1", name: "평온 장면 유지",
        input: '셸터 내 일상 ("배급 받으러 간다")',
        expect: "평온한 일상 진행 / 매턴 위기·떡밥 삽입X",
        warn: "배급에 갑자기 좀비 침입 / 매턴 불길한 무전·경고음" },
      { id: "5-2", name: "사건 후 후유증",
        input: "대형 전투 직후 → 다음 행동",
        expect: "부상·피로·자원소모 유지 / 새 대형사건X",
        warn: "직후 또 대형 위기 / 부상·피로 소멸 / 소모자원 복구" },
      { id: "5-3", name: "한 장면 문제 1개",
        input: "순찰 중 이상 발견",
        expect: "주된 문제 1개 + 부차 변수 1개 정도",
        warn: "좀비+부상자+무전두절+정체불명 세력 동시 / 3개+ 독립 문제" },
      { id: "5-4", name: "대형사건 선행조건",
        input: "10턴 연속 평온",
        expect: "작은 이상징후 가능 / 갑작스런 대형사건X",
        warn: "전조 없이 대규모 침입 / 맥락 없는 랜덤 대형사건" },
      { id: "5-5", name: "일상업무 과사건화",
        input: '"교대근무 한다"',
        expect: "정상업무 → 짧게 처리 또는 배경으로 넘어감",
        warn: "교대마다 사건 / 물류마다 습격 / 반복업무 매번 전면장면화" }
    ]
  },
  {
    cat: "6", title: "NPC·캐릭터", priority: "important",
    items: [

const PRIORITY_MAP = { must: ["🔴 필수", "priority-must"], important: ["🟡 중요", "priority-important"], check: ["🟢 확인", "priority-check"] };
const STORAGE_KEY = "shelter-grid-qa-v1";

let state = {};

function loadState() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { state = {}; }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function getItemState(id) {
  if (!state[id]) state[id] = { status: "pending", memo: "" };
  return state[id];
}

function render() {
  const c = document.getElementById("qaContent");
  let html = "";
  DATA.forEach(cat => {
    const [pLabel, pClass] = PRIORITY_MAP[cat.priority];
    const catStats = cat.items.map(i => getItemState(i.id).status);
    const pass = catStats.filter(s => s === "pass").length;
    const fail = catStats.filter(s => s === "fail").length;
    const total = cat.items.length;
    html += `<div class="category" data-cat="${cat.cat}">
      <div class="category-header" onclick="toggleCat(this)">
        <div class="category-title"><span class="arrow">▼</span> ${cat.cat}. ${cat.title} <span class="priority ${pClass}">${pLabel}</span></div>
        <div class="category-stats">${pass}✅ ${fail}⚠️ / ${total}</div>
      </div>
      <div class="category-body">`;
    cat.items.forEach(item => {
      const s = getItemState(item.id);
      html += `<div class="test-item" data-id="${item.id}" data-status="${s.status}" data-hasmemo="${s.memo ? 'yes' : 'no'}">
        <div class="test-top">
          <span class="test-id">${item.id}</span>
          <span class="test-name">${item.name}</span>
          <div class="status-btns">
            <button class="status-btn ${s.status === 'pass' ? 'active-pass' : ''}" onclick="setStatus('${item.id}','pass')" title="통과">✅</button>
            <button class="status-btn ${s.status === 'fail' ? 'active-fail' : ''}" onclick="setStatus('${item.id}','fail')" title="수정필요">⚠️</button>
          </div>
        </div>
        <div class="toggle-detail" onclick="toggleDetail(this)">▶ 상세 보기</div>
        <div class="test-details details-hidden">
          <div class="detail-block"><span class="detail-label">입력:</span>${esc(item.input)}</div>
          <div class="detail-block"><span class="detail-label">정상:</span>${esc(item.expect)}</div>
          <div class="detail-block"><span class="detail-label detail-warn">⚠️ 수정필요:</span>${esc(item.warn)}</div>
        </div>
        <div class="memo-wrap">
          <textarea placeholder="피드백 메모 (선택)" oninput="setMemo('${item.id}', this.value)">${esc(s.memo)}</textarea>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
  updateProgress();
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function toggleCat(el) { el.classList.toggle("collapsed"); }

function toggleDetail(el) {
  const det = el.nextElementSibling;
  if (det.classList.contains("details-hidden")) {
    det.classList.remove("details-hidden");
    el.textContent = "▼ 상세 접기";
  } else {
    det.classList.add("details-hidden");
    el.textContent = "▶ 상세 보기";
  }
}

function setStatus(id, status) {
  const s = getItemState(id);
  s.status = s.status === status ? "pending" : status;
  saveState();
  const item = document.querySelector(`.test-item[data-id="${id}"]`);
  if (item) {
    item.dataset.status = s.status;
    const btns = item.querySelectorAll(".status-btn");
    btns[0].className = `status-btn ${s.status === 'pass' ? 'active-pass' : ''}`;
    btns[1].className = `status-btn ${s.status === 'fail' ? 'active-fail' : ''}`;
  }
  updateCatStats(id);
  updateProgress();
}

function setMemo(id, val) {
  const s = getItemState(id);
  s.memo = val;
  const item = document.querySelector(`.test-item[data-id="${id}"]`);
  if (item) item.dataset.hasmemo = val ? "yes" : "no";
  saveState();
}

function updateCatStats(id) {
  const catNum = id.split("-")[0];
  const cat = DATA.find(c => c.cat === catNum);
  if (!cat) return;
  const el = document.querySelector(`.category[data-cat="${catNum}"] .category-stats`);
  if (!el) return;
  const pass = cat.items.filter(i => getItemState(i.id).status === "pass").length;
  const fail = cat.items.filter(i => getItemState(i.id).status === "fail").length;
  el.textContent = `${pass}✅ ${fail}⚠️ / ${cat.items.length}`;
}

function updateProgress() {
  let total = 0, pass = 0, fail = 0, pending = 0;
  DATA.forEach(cat => cat.items.forEach(item => {
    total++;
    const s = getItemState(item.id).status;
    if (s === "pass") pass++;
    else if (s === "fail") fail++;
    else pending++;
  }));
  const checked = pass + fail;
  const pct = total ? Math.round(checked / total * 100) : 0;
  document.getElementById("progressLabel").textContent = `진행률 ${pct}%`;
  document.getElementById("progressFraction").textContent = `${checked} / ${total}`;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("countPass").textContent = pass;
  document.getElementById("countFail").textContent = fail;
  document.getElementById("countPending").textContent = pending;
}

function expandAll() {
  document.querySelectorAll(".category-header").forEach(h => h.classList.remove("collapsed"));
  document.querySelectorAll(".category-body").forEach(b => b.style.display = "");
}

function collapseAll() {
  document.querySelectorAll(".category-header").forEach(h => h.classList.add("collapsed"));
}

// Filter
document.getElementById("filterTabs").addEventListener("click", e => {
  const tab = e.target.closest(".filter-tab");
  if (!tab) return;
  document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  const f = tab.dataset.filter;
  document.querySelectorAll(".test-item").forEach(item => {
    let show = true;
    if (f === "pending") show = item.dataset.status === "pending";
    else if (f === "pass") show = item.dataset.status === "pass";
    else if (f === "fail") show = item.dataset.status === "fail";
    else if (f === "memo") show = item.dataset.hasmemo === "yes";
    item.style.display = show ? "" : "none";
  });
  // Show/hide categories with no visible items
  document.querySelectorAll(".category").forEach(cat => {
    const visible = cat.querySelectorAll(".test-item:not([style*='display: none'])");
    cat.style.display = visible.length ? "" : "none";
  });
});

function buildFeedbackText() {
  let lines = [];
  lines.push("SHELTER-GRID QA 테스트 피드백");
  lines.push("생성일시: " + new Date().toLocaleString("ko-KR"));
  lines.push("═".repeat(40));
  lines.push("");

  let totalPass = 0, totalFail = 0, totalPending = 0;

  DATA.forEach(cat => {
    let catLines = [];
    cat.items.forEach(item => {
      const s = getItemState(item.id);
      const icon = s.status === "pass" ? "✅" : s.status === "fail" ? "⚠️" : "⬜";
      if (s.status === "pass") totalPass++;
      else if (s.status === "fail") totalFail++;
      else totalPending++;

      if (s.status === "fail" || s.memo.trim()) {
        catLines.push(`${icon} [${item.id}] ${item.name}`);
        if (s.memo.trim()) {
          catLines.push(`   → ${s.memo.trim()}`);
        }
        catLines.push("");
      }
    });
    if (catLines.length > 0) {
      lines.push(`■ ${cat.cat}. ${cat.title}`);
      lines.push("-".repeat(30));
      lines.push(...catLines);
    }
  });

  // Summary at top
  let summary = [];
  summary.push("SHELTER-GRID QA 테스트 피드백");
  summary.push("생성일시: " + new Date().toLocaleString("ko-KR"));
  summary.push("═".repeat(40));
  summary.push(`총 항목: ${totalPass + totalFail + totalPending} │ ✅ 통과: ${totalPass} │ ⚠️ 수정필요: ${totalFail} │ ⬜ 미확인: ${totalPending}`);
  summary.push("═".repeat(40));
  summary.push("");

  // Check if anything to report
  const hasContent = DATA.some(cat => cat.items.some(item => {
    const s = getItemState(item.id);
    return s.status === "fail" || s.memo.trim();
  }));

  if (!hasContent) {
    summary.push("(수정필요 항목이나 메모가 없습니다)");
    return summary.join("\n");
  }

  // Rebuild with summary header
  let result = [...summary];
  DATA.forEach(cat => {
    let catLines = [];
    cat.items.forEach(item => {
      const s = getItemState(item.id);
      const icon = s.status === "pass" ? "✅" : s.status === "fail" ? "⚠️" : "⬜";
      if (s.status === "fail" || s.memo.trim()) {
        catLines.push(`${icon} [${item.id}] ${item.name}`);
        if (s.memo.trim()) {
          catLines.push(`   → ${s.memo.trim()}`);
        }
        catLines.push("");
      }
    });
    if (catLines.length > 0) {
      result.push(`■ ${cat.cat}. ${cat.title}`);
      result.push("-".repeat(30));
      result.push(...catLines);
    }
  });
  return result.join("\n");
}

function copyFeedback() {
  const text = buildFeedbackText();
  navigator.clipboard.writeText(text).then(() => showToast("📋 피드백 복사 완료!")).catch(() => {
    // Fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast("📋 피드백 복사 완료!");
  });
}

let _downloads = null;
(async () => {
  try {
    const claude = window.claude;
    if (claude && claude.use) {
      _downloads = await claude.use("downloads");
    }
  } catch(e) {}
  // Hide download button if capability unavailable
  const dlBtn = document.getElementById("dlBtn");
  if (!_downloads && dlBtn) dlBtn.style.display = "none";
})();

async function downloadFeedback() {
  const text = buildFeedbackText();
  const now = new Date();
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const filename = `SHELTER-GRID_QA_피드백_${ts}.txt`;

  if (_downloads) {
    try {
      await _downloads.save({ filename, data: text });
      showToast("💾 피드백 파일 다운로드!");
    } catch(e) {
      if (e && e.code === "declined") return;
      showToast("다운로드 실패 — 복사를 이용해주세요");
    }
  } else {
    showToast("다운로드 불가 — 복사를 이용해주세요");
  }
}

function resetAll() {
  if (!confirm("모든 체크 상태와 메모를 초기화할까요?")) return;
  state = {};
  saveState();
  render();
  showToast("🗑️ 초기화 완료");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

loadState();
render();
</script>
