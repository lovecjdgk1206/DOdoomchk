">01 · 개념과 큰 분류\u003c/a>\u003ca href=\"#ch1\">02 · 역할과 성향\u003c/a>\u003ca href=\"#ch2\">03 · 스타일 조합\u003c/a>\u003ca href=\"#ch3\">04 · 강도의 여러 축\u003c/a>\u003ca href=\"#ch4\">05 · 활동별 단계 비교\u003c/a>\u003ca href=\"#ch5\">06 · 일상과 플레이\u003c/a>\u003ca href=\"#ch6\">07 · 경계·오해 정리\u003c/a>\u003ca href=\"#ch7\">08 · 용어 사전·출처\u003c/a>\u003c/nav>\u003cmain>\n\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">01 / INTRODUCTION\u003c/div>\u003ch1>같은 이름,\u003cbr>다른 취향과 강도.\u003c/h1>\u003cp class=\"lede\">BDSM의 역할·성향·활동을 구분하고, 무엇을 기준으로 ‘가볍다’ 혹은 ‘강하다’고 말하는지 이해하는 자료.\u003c/p>\u003cdiv class=\"row\">\u003cspan class=\"tag\">성인 대상\u003c/span>\u003cspan class=\"tag\">입문·개념 안내\u003c/span>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>오늘의 중심 질문\u003c/strong>\u003cbr>“나는 무슨 성향인가?”와 “어느 정도를 원하는가?”는 다른 질문입니다. 역할 이름 하나로 허용 행동·강도·관계 전체를 알 수 없습니다.\u003c/div>\u003cdiv class=\"grid three\">\u003cdiv class=\"card\">\u003cdiv class=\"num\">B / D\u003c/div>\u003ch3>구속·훈육\u003c/h3>\u003cp>움직임의 제한, 합의한 규칙·과제·피드백 구조.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"num\">D / S\u003c/div>\u003ch3>지배·복종\u003c/h3>\u003cp>누가 어떤 결정권을 맡고, 어떤 범위에서 위임하는가.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"num\">S / M\u003c/div>\u003ch3>가학·피학\u003c/h3>\u003cp>특정 맥락의 자극을 주고받는 취향. 권한 관계와는 별개.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"reference\">BDSM의 큰 분류: NCSF 용어 자료 [1]. 모든 요소를 동시에 선호할 필요는 없습니다.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>이 자료에서 배우는 것\u003c/h3>\u003cp>역할과 활동의 차이 / 여러 성향의 조합 / 활동별 비교 기준 / 일상과 플레이의 분리 / 개인별 경계.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>먼저 정할 전제\u003c/h3>\u003cp>성인 간 명시적 합의, 동의 변경·철회, 개인차를 전제로 설명합니다. 성적 활동 없이 역할·신뢰·미적 경험을 즐기는 경우도 있습니다.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">02 / ROLES &amp; PREFERENCES\u003c/div>\u003ch2>성향명은 무엇을 말해줄까?\u003c/h2>\u003cp class=\"lede\">주도권, 활동의 방향, 자극 취향, 관계 명칭은 서로 다른 정보를 담습니다.\u003c/p>\u003cdiv class=\"callout\">\u003cstrong>돔 = 탑 = 새디스트, 서브 = 바텀 = 마조히스트?\u003c/strong>\u003cbr>겹칠 수 있지만 같은 말은 아닙니다. 한 사람에게 여러 키워드가 함께 붙을 수 있습니다.\u003c/div>\u003cdiv id=\"rolePairs\">\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>마스터·슬레이브는 ‘하드 다음 단계’가 아닙니다.\u003c/strong>\u003cbr>관계 이름은 합의한 구조를 표현합니다. 실제 권한 범위·활동·자극·지속 시간을 따로 확인해야 합니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">03 / COMBINATIONS\u003c/div>\u003ch2>수식어가 붙으면 표현 방식이 달라집니다.\u003c/h2>\u003cp class=\"lede\">소프트·서비스·브랫을 하나의 강도 순서에 놓지 않습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>분류\u003c/th>\u003cth>예시 키워드\u003c/th>\u003cth>알려주는 정보\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>역할\u003c/td>\u003ctd>돔·서브·리거·프레이\u003c/td>\u003ctd>주도권 또는 맡는 활동 역할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지향점\u003c/td>\u003ctd>서비스·돌봄·칭찬·규율\u003c/td>\u003ctd>어떤 경험·상호작용을 중요하게 여기는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스타일\u003c/td>\u003ctd>소프트·온화형·엄격형·장난형\u003c/td>\u003ctd>어떤 태도로 표현하는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반응 성향\u003c/td>\u003ctd>브랫·선택적 위임·자기주장\u003c/td>\u003ctd>어떤 방식으로 호응·반응하는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>활동\u003c/td>\u003ctd>본디지·스팽킹·훈육\u003c/td>\u003ctd>무엇에 관심이 있는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>강도·범위\u003c/td>\u003ctd>낮은 신체 자극·깊은 몰입·장면 한정\u003c/td>\u003ctd>어느 축에서 어느 정도를 원하는가\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"styleCards\" class=\"grid\">\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>소프트 + 서비스 지향 + 돔\u003c/h3>\u003cp>부드러운 태도로 상대의 필요를 살피며 주도할 수 있습니다. 신체 자극 강도는 이 조합만으로 알 수 없습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>자기주장형 + 브랫 + 서브\u003c/h3>\u003cp>의견·반격·조건을 표현하면서 합의한 상황에 자발적으로 참여할 수 있습니다. 소심하거나 무조건 순종적일 필요는 없습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>온화형 + 새디스트\u003c/h3>\u003cp>말투는 온화하고 자극 취향은 가학적일 수 있습니다. 태도의 온화함과 자극 수준은 다른 축입니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>엄격형 + 장면 한정\u003c/h3>\u003cp>플레이의 합의 규칙은 엄격하게 적용해도 일상 관계는 대등할 수 있습니다.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"reference\">소프트 돔은 커뮤니티에서 쓰이는 스타일 표현입니다 [3]. ‘온화형·절제형·자기주장형’ 등 일부 표현은 이해를 돕는 설명용 수식어이며 공식 유형명이 아닙니다.\u003c/p>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">04 / INTENSITY AXES\u003c/div>\u003ch2>‘얼마나 강한가’를 한 숫자로 묶지 않기.\u003c/h2>\u003cp class=\"lede\">신체 자극이 낮아도 심리 몰입은 깊을 수 있습니다. 적용 시간이 길어도 매 순간 강한 활동을 하는 것은 아닙니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>비교 축\u003c/th>\u003cth>낮거나 좁은 쪽\u003c/th>\u003cth>높거나 넓은 쪽\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>신체 자극\u003c/td>\u003ctd>통증을 원하지 않음·약한 감각\u003c/td>\u003ctd>본인 기준 강한 자극 선호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>심리적 몰입\u003c/td>\u003ctd>가벼운 분위기·짧은 역할\u003c/td>\u003ctd>강한 긴장·깊은 역할 몰입\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권한 위임\u003c/td>\u003ctd>특정 선택만 잠시 맡김\u003c/td>\u003ctd>구체적으로 합의한 여러 결정·영역\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙 엄격함\u003c/td>\u003ctd>선택 가능한 약속·유연한 조정\u003c/td>\u003ctd>명확한 기준·일관된 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지속·빈도\u003c/td>\u003ctd>짧게·가끔\u003c/td>\u003ctd>길게·정기적으로\u003c/td>\u003c/tr>\u003ctr>\u003ctd>적용 범위\u003c/td>\u003ctd>특정 장면만\u003c/td>\u003ctd>합의한 일부 일상 영역에도 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>취향의 중요도\u003c/td>\u003ctd>있으면 좋은 요소\u003c/td>\u003ctd>만족에서 중요한 요소\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"controls\">\u003clabel for=\"profileSelect\">가상 인물의 취향 비교\u003c/label>\u003cselect id=\"profileSelect\">\u003coption value=\"0\">신체 자극은 낮게 / 신뢰·몰입은 깊게\u003c/option>\u003coption value=\"1\">자극은 높게 / 권한 관계는 대등하게\u003c/option>\u003coption value=\"2\">규칙은 분명하게 / 일상 적용은 없이\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"profileReadout\" class=\"card\">\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>이 숫자는 가상 사례의 설명값입니다.\u003c/strong>\u003cbr>진단·숙련도·안전성 점수가 아닙니다. 위험도는 강도와 별도이며, 낮은 강도처럼 보여도 활동 특성에 따라 위험할 수 있습니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">05 / ACTIVITY COMPARISON\u003c/div>\u003ch2>활동마다 다른 단계 기준.\u003c/h2>\u003cp class=\"lede\">활동을 골라 어떤 축이 달라지는지 비교하세요. 0~4는 설명용 비교 칸이며 입문 순서나 공통 등급이 아닙니다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"activitySelect\">활동 선택 · 34개\u003c/label>\u003cselect id=\"activitySelect\">\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"familySelect\">설명 기준으로 선택\u003c/label>\u003cselect id=\"familySelect\">\u003c/select>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"activityReadout\">\u003cdiv class=\"card\">\u003cspan class=\"eyebrow\" id=\"activityAxis\">\u003c/span>\u003ch3 id=\"activityTitle\">\u003c/h3>\u003cp id=\"activityDefinition\">\u003c/p>\u003cp id=\"activityFamily\" class=\"muted\">\u003c/p>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>비교 칸\u003c/th>\u003cth>선호·합의의 차이\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"activityStages\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>무엇이 달라지나요?\u003c/strong>\u003cp id=\"activityChange\">\u003c/p>\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>혼동하지 않기\u003c/strong>\u003cp id=\"activityNot\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>같은 단계 ≠ 같은 경험\u003c/h3>\u003cp>한 사람이 ‘낮음’이라고 느끼는 것을 다른 사람은 부담스럽게 느낄 수 있습니다. 허용 단어·상황·시간·강도를 개인의 말로 구체화해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>단계 ≠ 목표\u003c/h3>\u003cp>0에 머물러도 되고 특정 활동을 제외해도 됩니다. 관계가 깊어진다고 높은 단계로 옮겨가야 하는 것은 아닙니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"print-note hidden\">\u003cp>인쇄본에는 현재 선택한 활동·기준의 비교표가 들어갑니다. 다른 활동은 HTML의 선택 메뉴에서 확인할 수 있습니다.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">06 / CONTEXT &amp; LIMITS\u003c/div>\u003ch2>일상과 플레이의 상한은 따로.\u003c/h2>\u003cp class=\"lede\">같은 사람도 상황에 따라 다른 표현을 원합니다. 성향이 존재한다는 사실과 지금 실행해도 된다는 것은 다릅니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>일상 표현의 예\u003c/th>\u003cth>가능한 모습\u003c/th>\u003cth>자동 포함되지 않는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>표현 없음\u003c/td>\u003ctd>기존 성격·관계로 대화\u003c/td>\u003ctd>BDSM 역할 도입\u003c/td>\u003c/tr>\u003ctr>\u003ctd>은근한 기질\u003c/td>\u003ctd>말투·여유·가벼운 주도성\u003c/td>\u003ctd>실제 명령권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>장난·제안\u003c/td>\u003ctd>티키타카·선택 가능한 제안\u003c/td>\u003ctd>이행 강요·거절 처벌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특정 규칙\u003c/td>\u003ctd>정한 상황에서만 합의한 약속\u003c/td>\u003ctd>다른 생활 영역의 통제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지속적 관계\u003c/td>\u003ctd>합의한 여러 영역에서 역할 유지\u003c/td>\u003ctd>생활 전권·철회 불가\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>일상은 은근하게, 플레이는 분명하게\u003c/h3>\u003cp>평소에는 가벼운 주도성만 드러내고, 별도 합의한 장면에서는 역할과 규칙을 더 분명하게 표현할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>일상 관계는 혐관·라이벌일 수도\u003c/h3>\u003cp>반감·경쟁심과 활동 취향은 별개입니다. 말싸움에서 밀리는 것, 도발하는 것, 장난을 받아주는 것은 플레이 동의가 아닙니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>시작 → 범위 유지 → 종료 → 복귀\u003c/strong>\u003cbr>시작 조건을 확인하고 합의한 범위 안에서만 진행합니다. 종료·중단 후에는 역할 권한을 계속 행사하지 않습니다. 사후의 대화·거리·휴식도 개인 선호에 맞춥니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">07 / BOUNDARIES &amp; MISCONCEPTIONS\u003c/div>\u003ch2>강도를 말하기 전에, 경계를 구분하기.\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>하드 리밋\u003c/h3>\u003cp>하지 않기로 정한 경계. 다른 활동을 좋아하거나 높은 강도를 선호해도 이 경계는 별개입니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>소프트 리밋\u003c/h3>\u003cp>현재는 꺼려지거나 조건부인 경계. 자동 허용이 아니며, 새 논의와 명시적 동의가 필요합니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>중단 표현·신호\u003c/h3>\u003cp>합의한 중단 표현과 신호를 존중합니다. 명백한 동의 철회도 적용되며 역할 연기로 재해석하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>사후 돌봄\u003c/h3>\u003cp>원하는 휴식·대화·거리·확인 방식은 사람마다 다릅니다. 돌봄이나 접촉도 강요하지 않습니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>흔한 오해\u003c/th>\u003cth>구분해서 이해하기\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>바닐라는 0단계 입문자다\u003c/td>\u003ctd>BDSM 선호 여부를 나타낼 수 있는 말이다. 모두가 입문해야 하는 것이 아니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>하드일수록 진짜 성향이다\u003c/td>\u003ctd>정체성의 진위·숙련도와 강도는 다른 문제다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돔이면 통제하고 새디여야 한다\u003c/td>\u003ctd>합의한 권한만 맡는다. 가학 취향·통증은 별도다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>서브면 자기 의견이 없어야 한다\u003c/td>\u003ctd>성격·자기주장과 자발적 권한 위임은 다른 축이다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>브랫은 거절해도 사실은 원하는 것이다\u003c/td>\u003ctd>역할 장난과 실제 거절을 구분한다. 이름으로 동의를 추정하지 않는다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>로프버니면 강한 통증을 좋아한다\u003c/td>\u003ctd>구속·미적 경험·집중·신뢰 등 동기가 다양하다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>엣지플레이는 하드의 다음 단계다\u003c/td>\u003ctd>위험·개인의 경계와 관련된 표현이다. 권장 성장 단계가 아니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>동의하면 모든 것이 안전해진다\u003c/td>\u003ctd>동의와 위험은 별개다. 합의가 신체적·심리적 위험을 없애지는 않는다.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reference\">동의와 사전 허용의 기본 개념은 NCSF 자료 [1][2]를 참고했습니다. 이 자료는 의료·법률 판단이나 실제 수행 교육을 제공하지 않습니다.\u003c/p>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">08 / GLOSSARY &amp; REFERENCES\u003c/div>\u003ch2>용어를 찾아보는 확장 사전.\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리한 142개 항목. 별칭은 같은 항목에 묶었습니다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"glossarySearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"glossarySearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디, 서비스\">\u003c/div>\u003cdiv>\u003clabel for=\"glossaryCategory\">분류\u003c/label>\u003cselect id=\"glossaryCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">세부 취향\u003c/option>\u003coption value=\"activities\">활동·플레이\u003c/option>\u003coption value=\"materials\">소재·상징\u003c/option>\u003coption value=\"style\">표현 스타일\u003c/option>\u003coption value=\"focus\">만족의 중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv id=\"glossaryCount\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv id=\"glossaryEntries\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>사전의 범위\u003c/strong>\u003cbr>모든 커뮤니티의 명칭·개인 취향을 완결한 공식 목록은 아닙니다. 관계·활동 명칭과 설명용 번역·수식어가 함께 포함되어 있습니다. 새 용어를 접하면 역할, 활동, 스타일, 강도 중 무엇을 가리키는지부터 확인하세요.\u003c/div>\u003ch3 style=\"margin-top:40px\">출처와 편집 기준\u003c/h3>\u003col class=\"source-list\">\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003cbr>\u003csmall>BDSM의 큰 분류, 역할·권한·동의에 관한 기본 개념.\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003cbr>\u003csmall>명시적 합의와 허용 범위를 구분하는 참고 자료.\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/roles/dominant-wzwjm\" target=\"_blank\" rel=\"noopener\">Dominant\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/roles/primal-hunter-neeth\" target=\"_blank\" rel=\"noopener\">Primal Hunter\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/roles/rope-bunny-mmklo\" target=\"_blank\" rel=\"noopener\">Rope Bunny\u003c/a>\u003cbr>\u003csmall>커뮤니티에서 사용하는 명칭·별칭의 참고. 이용자 기여형 자료로, 표준 분류나 임상적 근거와 구별.\u003c/small>\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·가상 사례는 이해를 돕기 위한 자체 구성입니다. 물리적 실행법·매듭·도구 사용·자극 세기 지침은 포함하지 않았습니다.\u003c/p>\u003c/section>\n\u003cdiv class=\"coursefooter\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"02_beginner.html\">다음 과정 · 초급 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">1 / 8\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\n\u003cscript id=\"lectureData\" type=\"application/json\">{\"families\": {\"power\": {\"title\": \"권한을 맡기는 범위\", \"axis\": \"결정권·적용 영역\", \"levels\": [\"역할 권한을 맡기지 않는다.\", \"부탁한 단일 선택만 잠시 맡긴다.\", \"정해진 장면의 제한된 결정만 맡긴다.\", \"합의한 장면에서 여러 결정을 맡긴다.\", \"구체적으로 정한 넓은 범위의 권한을 맡긴다. 철회권은 유지된다.\"], \"change\": \"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\", \"not\": \"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"}, \"bondage\": {\"title\": \"본디지·로프·구속\", \"axis\": \"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\", \"levels\": [\"구속 활동을 원하지 않거나 이번에는 사용하지 않는다.\", \"구속의 상징·미적 분위기에만 관심을 둔다.\", \"좁게 정한 활동 범위와 짧은 역할 경험을 선호한다.\", \"활동의 구조·지속·몰입을 더 분명히 합의한다.\", \"본인이 높은 강도로 느끼는 제한·몰입을 선호한다. 구체적 한계는 별도로 정한다.\"], \"change\": \"무엇을 제한하는지, 얼마나 지속하는지, 감각과 몰입을 어떻게 느끼는지가 다르다. 이 네 요소를 한꺼번에 올리지 않는다.\", \"not\": \"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"}, \"impact\": {\"title\": \"스팽킹·임팩트 계열\", \"axis\": \"받는 사람이 느끼는 자극 강도·지속·허용 범위\", \"levels\": [\"해당 자극을 사용하지 않는다.\", \"아주 낮은 감각만 선호하며 통증을 원하지 않을 수도 있다.\", \"낮은 강도의 개별 허용 자극을 선호한다.\", \"본인 기준 중간 정도의 자극을 선호한다.\", \"본인 기준 높은 자극을 선호한다. 동의한 상한을 넘지 않는다.\"], \"change\": \"같은 활동명이라도 체감 강도·반복·지속 선호가 다르다. 공통된 도구·횟수·세기로 이 단계를 정의할 수 없다.\", \"not\": \"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"}, \"discipline\": {\"title\": \"훈육·규칙·과제\", \"axis\": \"규칙의 수·엄격함·적용 시간·피드백 방식\", \"levels\": [\"의무 규칙을 두지 않는다.\", \"선택 가능한 가벼운 약속만 둔다.\", \"소수의 분명한 규칙과 피드백을 합의한다.\", \"여러 규칙을 일관된 구조로 적용한다.\", \"엄격한 규칙 구조를 선호한다. 합의 변경·중단은 위반으로 취급하지 않는다.\"], \"change\": \"규칙의 구조와 엄격함이 달라진다. 벌의 강도·모욕·일상 통제는 별도 항목이다.\", \"not\": \"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"}, \"service\": {\"title\": \"서비스·봉사·돌봄\", \"axis\": \"기여의 비중·담당 범위·지속성\", \"levels\": [\"서비스 역할을 설정하지 않는다.\", \"가끔 작은 도움이나 배려를 선호한다.\", \"합의한 특정 도움·과제를 즐긴다.\", \"관계에서 정기적인 기여나 돌봄 역할을 중요하게 여긴다.\", \"지속적인 기여·돌봄을 핵심 취향으로 여긴다. 생활 전권·자기 소진을 의미하지 않는다.\"], \"change\": \"자발적인 기여의 비중과 구조가 달라진다. 서비스 돔은 상대 필요 중심의 주도, 서비스 서브는 봉사·기여 중심으로 표현될 수 있다.\", \"not\": \"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"}, \"protocol\": {\"title\": \"프로토콜·호칭·의식\", \"axis\": \"격식·절차의 수·일상 적용 범위\", \"levels\": [\"특별한 호칭·절차를 두지 않는다.\", \"상징이나 간단한 인사 정도만 선호한다.\", \"특정 장면에서 정한 호칭·절차를 쓴다.\", \"여러 절차를 일관되게 유지한다.\", \"격식 높은 관계 형식을 선호한다. 장소·상황별 예외는 별도로 정한다.\"], \"change\": \"격식의 정도와 적용 범위가 달라진다. 호칭 하나가 모든 명령권을 부여하지는 않는다.\", \"not\": \"일상·공개 공간에 같은 절차를 자동 확장하지 않는다.\"}, \"primal\": {\"title\": \"프라이멀·헌터/프레이\", \"axis\": \"추격·경쟁 역할의 비중과 몰입\", \"levels\": [\"해당 역할 구도를 사용하지 않는다.\", \"말·분위기 수준의 가벼운 도전만 선호한다.\", \"합의한 짧은 역할 구도를 즐긴다.\", \"역할의 긴장·경쟁·몰입을 뚜렷하게 선호한다.\", \"강한 역할 몰입을 선호한다. 실제 중단·거절과 역할 표현은 구별한다.\"], \"change\": \"역할 몰입과 경쟁 분위기가 달라진다. 헌터·프레이를 자동으로 돔·서브와 동일시하지 않는다.\", \"not\": \"프레이의 실제 거절을 역할 연기로 추정하지 않는다.\"}, \"brat\": {\"title\": \"브랫·티징·장난\", \"axis\": \"도발의 빈도·표현 수위·역할 비중\", \"levels\": [\"도발·반항 역할을 원하지 않는다.\", \"가벼운 농담이나 받아치기를 즐긴다.\", \"합의된 떠보기·장난스러운 반항을 즐긴다.\", \"도전·반응 교환을 관계의 중요한 요소로 여긴다.\", \"강한 반항 역할·긴장감을 선호한다. 표현의 한계는 구체적으로 정한다.\"], \"change\": \"상호작용의 비중과 허용 표현이 달라진다. 상대를 화나게 하거나 굴복시키는 것이 필수 목표는 아니다.\", \"not\": \"브랫이라는 이름이 실제 거절을 무시할 허가가 되지 않는다.\"}, \"language\": {\"title\": \"디그레이데이션·휴밀리에이션\", \"axis\": \"허용 단어·상황·심리적 강도\", \"levels\": [\"비하·수치심 연출을 원하지 않는다.\", \"명시적으로 허용한 아주 가벼운 표현만 선호한다.\", \"정해진 단어·상황에서 제한적인 역할 표현을 선호한다.\", \"허용한 표현과 맥락 안에서 더 깊은 심리적 몰입을 선호한다.\", \"본인이 높은 강도로 느끼는 몰입을 선호한다. 금지 단어·주제는 그대로 유지한다.\"], \"change\": \"단어의 자극성과 수치심은 개인차가 크다. 한 단어를 모든 사람에게 같은 단계로 분류할 수 없다.\", \"not\": \"디그레이데이션은 비하 표현, 휴밀리에이션은 수치심의 맥락에 초점이 있다. 서로 겹치지만 동일하지 않다.\"}, \"sensory\": {\"title\": \"감각·기대·칭찬\", \"axis\": \"감각 집중·기대감·정서적 몰입\", \"levels\": [\"해당 연출을 사용하지 않는다.\", \"편안한 분위기나 약한 감각 변화만 선호한다.\", \"특정 감각·기대·인정 경험에 선택적으로 집중한다.\", \"집중과 몰입을 더 중요한 요소로 여긴다.\", \"강한 집중·정서적 몰입을 선호한다. 통증이나 높은 위험이 필수는 아니다.\"], \"change\": \"집중·감각·감정의 체감이 달라진다. 칭찬 중심 활동은 신체 강도를 높이는 단계가 아니다.\", \"not\": \"감각 제한·강한 기대 연출의 위험이나 부담은 단순 단계와 별도로 확인한다.\"}, \"roleplay\": {\"title\": \"펫·돌봄·상징 역할극\", \"axis\": \"역할의 비중·지속·절차·몰입\", \"levels\": [\"역할극을 사용하지 않는다.\", \"상징·호칭·분위기만 가볍게 즐긴다.\", \"특정 장면에 한정한 역할을 즐긴다.\", \"여러 절차와 반응을 포함해 역할에 몰입한다.\", \"역할을 중요한 취향으로 여긴다. 역할 밖 독립성과 중단권은 유지된다.\"], \"change\": \"역할극의 깊이와 적용 시간이 달라진다. 성인 간 허구적 역할이며 실제 동물·미성년자와 무관하다.\", \"not\": \"역할 명칭을 실제 인격·권리의 소거로 해석하지 않는다.\"}, \"aesthetic\": {\"title\": \"소재·미적 연출·관계 상징\", \"axis\": \"취향의 중요도·연출의 비중\", \"levels\": [\"특별한 선호가 없다.\", \"있으면 좋은 분위기 요소다.\", \"특정 소재·상징을 선택적으로 선호한다.\", \"장면·관계 만족에서 중요한 요소다.\", \"핵심적인 선호다. 신체 자극·권한 범위는 별개다.\"], \"change\": \"소재·복장·상징을 얼마나 중요하게 여기는지가 다르다. 더 강한 자극으로 이어지는 단계가 아니다.\", \"not\": \"칼라·계약 연출·특정 복장이 실제 소유권이나 영구 동의를 만들지는 않는다.\"}}, \"catalog\": [{\"id\": \"role:none\", \"category\": \"role\", \"name\": \"미지정\", \"desc\": \"기존 역할 유지\", \"family\": null}, {\"id\": \"role:dom\", \"category\": \"role\", \"name\": \"도미넌트\", \"desc\": \"합의한 범위에서 주도권을 맡음\", \"family\": null}, {\"id\": \"role:sub\", \"category\": \"role\", \"name\": \"서브미시브 · 서브 · 섭\", \"desc\": \"자발적으로 주도권을 맡김\", \"family\": null}, {\"id\": \"role:switch\", \"category\": \"role\", \"name\": \"스위치\", \"desc\": \"합의에 따라 지배·복종 역할 전환\", \"family\": null}, {\"id\": \"role:top\", \"category\": \"role\", \"name\": \"탑\", \"desc\": \"활동을 진행; 지배권과 별개\", \"family\": null}, {\"id\": \"role:bottom\", \"category\": \"role\", \"name\": \"바텀\", \"desc\": \"활동을 받음; 복종과 별개\", \"family\": null}, {\"id\": \"role:master\", \"category\": \"role\", \"name\": \"마스터\", \"desc\": \"합의한 지속적 권한 관계를 이끄는 역할; 명칭만으로 전권·고강도 아님\", \"family\": null}, {\"id\": \"role:mistress\", \"category\": \"role\", \"name\": \"미스트리스\", \"desc\": \"마스터에 대응해 쓰이는 역할 명칭; 범위는 개별 합의\", \"family\": null}, {\"id\": \"role:slave\", \"category\": \"role\", \"name\": \"슬레이브\", \"desc\": \"합의한 관계에서 폭넓은 권한을 자발적으로 위임; 철회권 유지\", \"family\": null}, {\"id\": \"role:sadist\", \"category\": \"role\", \"name\": \"새디스트 · 새디\", \"desc\": \"합 \", \"category\": \"structure\", \"name\": \"일상 일부 적용\", \"desc\": \"구체적으로 정한 일상 영역만 역할 적용\", \"family\": null}, {\"id\": \"structure:switching\", \"category\": \"structure\", \"name\": \"역할 전환형\", \"desc\": \"상대·상황별 합의로 역할 변경\", \"family\": null}, {\"id\": \"structure:onePartner\", \"category\": \"structure\", \"name\": \"특정 상대 한정\", \"desc\": \"정한 상대에게만 성향 표현; 타인에게 일반화 금지\", \"family\": null}], \"pairs\": [[\"도미넌트 ↔ 서브미시브\", \"합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\", \"결정권의 방향\", \"돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\"], [\"탑 ↔ 바텀\", \"특정 활동을 진행하는 쪽 ↔ 받는 쪽\", \"활동의 방향\", \"탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\"], [\"마스터·미스트리스 ↔ 슬레이브\", \"합의한 관계에서 넓은 권한 위임을 표현하는 명칭\", \"관계의 범위·형식\", \"돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\"], [\"새디스트 ↔ 마조히스트\", \"합의한 자극을 주는 취향 ↔ 받는 취향\", \"자극의 방향·선호\", \"새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\"], [\"스위치·사도마조히스트\", \"역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\", \"전환의 대상·상황\", \"스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\"], [\"브랫 ↔ 브랫 테이머\", \"합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\", \"반응 교환\", \"브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\"], [\"헌터·프레데터 ↔ 프레이\", \"추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\", \"프라이멀 역할\", \"헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\"], [\"리거 ↔ 로프버니·로프 바텀\", \"로프 구속을 구성하는 역할 ↔ 받는 역할\", \"로프 활동의 방향\", \"로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\"], [\"디그레이더 ↔ 디그레이디\", \"합의한 비하 표현을 제공 ↔ 수용\", \"언어·심리적 맥락\", \"실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\"], [\"스팽커 ↔ 스팽키\", \"스팽킹을 제공 ↔ 수용\", \"특정 활동의 방향\", \"스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\"], [\"훈육자·트레이너 ↔ 트레이니\", \"합의한 규칙·과제를 진행 ↔ 배우고 수행\", \"규칙·피드백 구조\", \"훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\"], [\"서비스 돔·서비스 서브\", \"상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\", \"서비스를 표현하는 방식\", \"서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\"], [\"오너·펫·펫 트레이너\", \"성인 간 소속·동물 역할극을 이끌거나 받음\", \"상징 역할·돌봄\", \"실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\"], [\"케어기버 ↔ 돌봄 수용 역할\", \"성인 간 돌봄 제공 ↔ 돌봄 수용\", \"안정감·돌봄\", \"돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\"], [\"센슈얼리스트·감각 지향\", \"감각·분위기·집중을 중심으로 즐김\", \"감각 경험\", \"통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\"]]}\u003c/script>\u003cscript>\n(()=>{'use strict';const data=JSON.parse(document.getElementById('lectureData').textContent),q=id=>document.getElementById(id),chapters=[...document.querySelectorAll('.chapter')];let index=0,present=false;const categoryLabels={role:'역할',traits:'세부 취향',activities:'활동·플레이',materials:'소재·상징',style:'표현 스타일',focus:'만족의 중심',structure:'관계 구조'};const activities=data.catalog.filter(x=>x.category==='activities');function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}\nfor(const [name,definition,axis,misunderstanding]of data.pairs){const d=node('details',undefined,'role-pair');d.append(node('summary',name));const body=node('div',undefined,'body');body.append(node('p',definition),node('p','중심 축: '+axis,'axis'),node('p',misunderstanding,'muted'));d.append(body);q('rolePairs').append(d)}\nfor(const s of data.catalog.filter(x=>x.category==='style')){const c=node('div',undefined,'card');c.append(node('h3',s.name),node('p',s.desc));q('styleCards').append(c)}\nfor(const a of activities){const o=node('option',a.name);o.value=a.id;q('activitySelect').append(o)}for(const [key,f]of Object.entries(data.families)){const o=node('option',f.title);o.value=key;q('familySelect').append(o)}\nfunction renderActivity(activity,family){const f=data.families[family];q('activityTitle').textContent=activity?activity.name:f.title;q('activityDefinition').textContent=activity?activity.desc:'선택한 기준의 개념 비교입니다. 특정 활동의 공통 실행법을 뜻하지 않습니다.';q('activityAxis').textContent='비교 기준 / '+f.axis;q('activityFamily').textContent=activity?'공유하는 설명 기준: '+f.title:'설명 기준 직접 보기';q('activityStages').replaceChildren();const names=['0 · 사용 안 함','1 · 아주 가볍게','2 · 제한적으로','3 · 더 분명하게','4 · 높은 비중·몰입'];f.levels.forEach((text,i)=>{const tr=node('tr');tr.append(node('td',names[i]),node('td',text));q('activityStages').append(tr)});q('activityChange').textContent=f.change;q('activityNot').textContent=f.not;q('familySelect').value=family}\nq('activitySelect').onchange=()=>{const a=activities.find(x=>x.id===q('activitySelect').value);renderActivity(a,a.family)};q('familySelect').onchange=()=>renderActivity(null,q('familySelect').value);renderActivity(activities[0],activities[0].family);\nconst profiles=[{name:'낮은 신체 자극 + 깊은 신뢰·몰입',values:[1,4,3,2,0],text:'신체 자극은 약하게 선호하지만, 합의한 역할과 판단을 맡기는 경험은 깊게 원할 수 있습니다. 일상 적용은 별도로 원하지 않는 사례입니다.'},{name:'높은 자극 선호 + 대등한 권한 관계',values:[4,2,0,0,0],text:'활동의 자극을 선호해도 지배·복종 관계나 생활 규칙은 원하지 않을 수 있습니다. 활동의 방향과 관계 권한을 구분하는 사례입니다.'},{name:'분명한 규칙 + 장면 한정',values:[0,3,2,4,0],text:'통증 없이도 규칙·절차를 중요하게 여기며 몰입할 수 있습니다. 엄격한 규칙이 일상 통제나 강한 신체 자극과 같지 않은 사례입니다.'}];\nfunction renderProfile(){const p=profiles[+q('profileSelect').value];q('profileReadout').replaceChildren(node('h3',p.name),node('p',p.text));const g=node('div',undefined,'profile');['신체 자극','심리 몰입','권한 위임','규칙 엄격함','일상 적용'].forEach((name,i)=>{const m=node('div',undefined,'metric');const row=node('div',undefined,'metric-line');row.append(node('span',name),node('span',p.values[i]+' / 4'));const track=node('div',undefined,'track');const bar=node('span');bar.style.width=p.values[i]*25+'%';track.append(bar);m.append(row,track);g.append(m)});q('profileReadout').append(g)}q('profileSelect').onchange=renderProfile;renderProfile();\nfor(const item of data.catalog){const entry=node('article',undefined,'entry');entry.dataset.category=item.category;entry.dataset.search=(item.name+' '+item.desc).toLowerCase();entry.append(node('div',categoryLabels[item.category],'category'),node('h3',item.name),node('p',item.desc));if(item.category==='activities'){const b=node('button','단계 비교 보기');b.style.marginTop='12px';b.className='no-print';b.onclick=()=>{q('activitySelect').value=item.id;renderActivity(item,item.family);go(4)};entry.append(b)}q('glossaryEntries').append(entry)}\nfunction filter(){const text=q('glossarySearch').value.trim().toLowerCase(),cat=q('glossaryCategory').value;let count= round:white;color:#111}.theme-choice{display:none!important}}\n\u003c/style>\u003c/head>\u003cbody>\u003caside class=\"love-rights\" aria-label=\"자료 권리 안내\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\" aria-current=\"page\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">02 초급 · 역할·취향·스타일 구분\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"장별 목차\">\u003ca href=\"#ch0\">01 · 이름을 외우기 전에 분류부터\u003c/a>\u003ca href=\"#ch1\">02 · 역할 15쌍을 정확하게 읽기\u003c/a>\u003ca href=\"#ch2\">03 · 본디지·스팽·훈육은 같은 축인가\u003c/a>\u003ca href=\"#ch3\">04 · 수식어 조합을 해석하기\u003c/a>\u003ca href=\"#ch4\">05 · 취향·호기심·동의는 다르다\u003c/a>\u003ca href=\"#ch5\">06 · 사례 해설: 이름만으로 판단한 오류\u003c/a>\u003ca href=\"#ch6\">07 · 부록 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">초급 / 01\u003c/div>\u003ch2>이름을 외우기 전에 분류부터\u003c/h2>\u003cp class=\"lede\">이 자료에서 알아볼 것: 역할·활동·스타일·강도를 섞지 않고 한 사람의 취향을 읽는다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>역할\u003c/h3>\u003cp>어떤 위치를 맡는가. 도미넌트·서브·리거·프레이처럼 권한 또는 활동의 방향을 표현한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>활동\u003c/h3>\u003cp>무엇에 관심이 있는가. 본디지·스팽킹·훈육·감각 활동처럼 경험의 종류를 표현한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>스타일·지향\u003c/h3>\u003cp>어떻게 표현하고 무엇을 중시하는가. 소프트·서비스·칭찬·규율 등이 붙는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>강도·범위\u003c/h3>\u003cp>어느 축에서 어느 정도, 어떤 상황까지 원하는가. 이름에서 자동 추론하지 않는다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">\u003cb>읽는 순서:\u003c/b> 이름 → 분류 → 제공·수용 방향 → 중심 경험 → 적용 상황 → 개인별 한계.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">초급 / 02\u003c/div>\u003ch2>역할 15쌍을 정확하게 읽기\u003c/h2>\u003cp class=\"lede\">같은 사람이 여러 역할을 가질 수 있고, 상대에 따라 달라질 수 있다.\u003c/p>\u003cdiv>\u003cdetails class=\"role-pair\">\u003csummary>도미넌트 ↔ 서브미시브\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 결정권의 방향\u003c/p>\u003cdiv class=\"callout\">돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>탑 ↔ 바텀\u003c/summary>\u003cdiv class=\"body\">\u003cp>특정 활동을 진행하는 쪽 ↔ 받는 쪽\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 활동의 방향\u003c/p>\u003cdiv class=\"callout\">탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>마스터·미스트리스 ↔ 슬레이브\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 관계에서 넓은 권한 위임을 표현하는 명칭\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 관계의 범위·형식\u003c/p>\u003cdiv class=\"callout\">돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>새디스트 ↔ 마조히스트\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 자극을 주는 취향 ↔ 받는 취향\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 자극의 방향·선호\u003c/p>\u003cdiv class=\"callout\">새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>스위치·사도마조히스트\u003c/summary>\u003cdiv class=\"body\">\u003cp>역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 전환의 대상·상황\u003c/p>\u003cdiv class=\"callout\">스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>브랫 ↔ 브랫 테이머\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 반응 교환\u003c/p>\u003cdiv class=\"callout\">브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>헌터·프레데터 ↔ 프레이\u003c/summary>\u003cdiv class=\"body\">\u003cp>추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 프라이멀 역할\u003c/p>\u003cdiv class=\"callout\">헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>리거 ↔ 로프버니·로프 바텀\u003c/summary>\u003cdiv class=\"body\">\u003cp>로프 구속을 구성하는 역할 ↔ 받는 역할\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 로프 활동의 방향\u003c/p>\u003cdiv class=\"callout\">로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>디그레이더 ↔ 디그레이디\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 비하 표현을 제공 ↔ 수용\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 언어·심리적 맥락\u003c/p>\u003cdiv class=\"callout\">실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>스팽커 ↔ 스팽키\u003c/summary>\u003cdiv class=\"body\">\u003cp>스팽킹을 제공 ↔ 수용\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 특정 활동의 방향\u003c/p>\u003cdiv class=\"callout\">스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>훈육자·트레이너 ↔ 트레이니\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 규칙·과제를 진행 ↔ 배우고 수행\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 규칙·피드백 구조\u003c/p>\u003cdiv class=\"callout\">훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>서비스 돔·서비스 서브\u003c/summary>\u003cdiv class=\"body\">\u003cp>상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 서비스를 표현하는 방식\u003c/p>\u003cdiv class=\"callout\">서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>오너·펫·펫 트레이너\u003c/summary>\u003cdiv class=\"body\">\u003cp>성인 간 소속·동물 역할극을 이끌거나 받음\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 상징 역할·돌봄\u003c/p>\u003cdiv class=\"callout\">실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>케어기버 ↔ 돌봄 수용 역할\u003c/summary>\u003cdiv class=\"body\">\u003cp>성인 간 돌봄 제공 ↔ 돌봄 수용\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 안정감·돌봄\u003c/p>\u003cdiv class=\"callout\">돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>센슈얼리스트·감각 지향\u003c/summary>\u003cdiv class=\"body\">\u003cp>감각·분위기·집중을 중심으로 즐김\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 감각 경험\u003c/p>\u003cdiv class=\"callout\">통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">초급 / 03\u003c/div>\u003ch2>본디지·스팽·훈육은 같은 축인가\u003c/h2>\u003cp class=\"lede\">활동 이름은 강도나 관계 서열을 결정하지 않는다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>활동 묶음\u003c/th>\u003cth>경험의 중심\u003c/th>\u003cth>따로 확인할 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>본디지·로프\u003c/td>\u003ctd>구속·미적 표현·신뢰·집중\u003c/td>\u003ctd>제공/수용, 제한의 범위, 지속, 감각\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스팽킹·임팩트\u003c/td>\u003ctd>특정 자극 경험\u003c/td>\u003ctd>체감 자극, 방향, 지속, 제외 범위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>훈육·규율\u003c/td>\u003ctd>규칙·과제·피드백\u003c/td>\u003ctd>규칙 수, 엄격함, 적용 상황\u003c/td>\u003c/tr>\u003ctr>\u003ctd>프라이멀·추격 역할\u003c/td>\u003ctd>추격·경쟁·본능적 분위기\u003c/td>\u003ctd>역할, 표현 범위, 중단 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>칭찬·서비스·돌봄\u003c/td>\u003ctd>인정·기여·안정감\u003c/td>\u003ctd>주고받는 방향, 빈도, 부담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>비하·수치심 역할\u003c/td>\u003ctd>언어·상황에 대한 심리적 경험\u003c/td>\u003ctd>허용 단어, 금지 주제, 장소·관객 여부\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">활동이 같아도 동기가 다를 수 있다. 스팽킹을 좋아한다고 벌을 원한다고 단정하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">초급 / 04\u003c/div>\u003ch2>수식어 조합을 해석하기\u003c/h2>\u003cp class=\"lede\">소프트는 태도, 서비스는 지향점, 브랫은 반응 성향을 설명할 수 있다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>소프트·서비스 지향·돔\u003c/h3>\u003cp>부드러운 태도로 상대의 필요와 반응을 살피며 주도. 신체 자극 수준은 아직 미정.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>규율형·칭찬 중심·돔\u003c/h3>\u003cp>규칙은 분명하게, 피드백은 인정·격려 중심. 모욕·강한 벌은 자동 포함되지 않음.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>자기주장형·브랫·서브\u003c/h3>\u003cp>의견과 장난을 표현하면서 특정 범위에서 자발적으로 권한을 맡김.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리거·미적 연출 지향\u003c/h3>\u003cp>구속의 시각적 구성이나 몰입을 중시. 서열·통증은 필수 조건이 아님.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프레이·스위치\u003c/h3>\u003cp>추격 역할에서는 프레이를 선호하면서 권한 관계는 상황별 전환 가능.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그레이디·장면 한정\u003c/h3>\u003cp>허용된 표현을 장면 안에서만 선호. 일상의 무례·비하를 허용한다는 뜻은 아님.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">조합이 생소하면 짧은 뜻을 덧붙인다. 설명용 수식어를 통일된 공식 유형으로 소개하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">초급 / 05\u003c/div>\u003ch2>취향·호기심·동의는 다르다\u003c/h2>\u003cp class=\"lede\">관심이 있다고 지금 참여하고 싶거나 모든 변형을 허용하는 것은 아니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>표현\u003c/th>\u003cth>알 수 있는 것\u003c/th>\u003cth>알 수 없는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>궁금하다\u003c/td>\u003ctd>호기심이 있다\u003c/td>\u003ctd>실제 경험을 원하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상상은 좋다\u003c/td>\u003ctd>상상 속 선호가 있다\u003c/td>\u003ctd>현실 실행을 원하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이 활동을 좋아한다\u003c/td>\u003ctd>어떤 경험의 선호가 있다\u003c/td>\u003ctd>현재 상대·장소·강도에 동의하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지난번에 했다\u003c/td>\u003ctd>과거 참여가 있었다\u003c/td>\u003ctd>오늘도 원하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나는 서브다\u003c/td>\u003ctd>본인의 역할 정체성을 표현한다\u003c/td>\u003ctd>누구에게나 복종하는지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">“어떤 상황에서는 좋고 어떤 상황에서는 싫은가?”를 확인하면 취향의 실제 범위를 알기 쉽다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">초급 / 06\u003c/div>\u003ch2>사례 해설: 이름만으로 판단한 오류\u003c/h2>\u003cp class=\"lede\">해설을 펼쳐 어디서 추론이 과해졌는지 비교한다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>“돔이니까 질투하면 외출을 막아도 된다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>역할 이름을 일상 전권으로 확대했다.\u003c/p>\u003cdiv class=\"callout\">역할 선호와 일상 이동·교류에 대한 합의는 별개다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>“로프버니면 서브이고 통증도 좋아한다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>활동 수용을 관계 복종·통증 취향으로 연결했다.\u003c/p>\u003cdiv class=\"callout\">구속의 미적 경험이나 집중을 좋아할 수도 있다. 각 축을 따로 본다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>“브랫이면 싫다는 말도 장난이다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>성향명으로 현재 거절의 뜻을 지웠다.\u003c/p>\u003cdiv class=\"callout\">합의한 역할 표현과 실제 거절을 구분하며, 명백한 중단은 존중한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>“서비스 돔은 사실 서브다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>서비스의 방향과 관계 권한을 섞었다.\u003c/p>\u003cdiv class=\"callout\">상대 필요 중심으로 주도하는 돔도 있을 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">초급 / 07\u003c/div>\u003ch2>부록 · 전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003cdiv class=\"coursefooter\">\u003ca href=\"01_intro.html\">← 이전 과정 · 입문\u003c/a>\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"03_intermediate.html\">다음 과정 · 중급 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\": {\"power\": {\"title\": \"권한을 맡기는 범위\", \"axis\": \"결정권·적용 영역\", \"levels\": [\"역할 권한을 맡기지 않는다.\", \"부탁한 단일 선택만 잠시 맡긴다.\", \"정해진 장면의 제한된 결정만 맡긴다.\", \"합의한 장면에서 여러 결정을 맡긴다.\", \"구체적으로 정한 넓은 범위의 권한을 맡긴다. 철회권은 유지된다.\"], \"change\": \"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\", \"not\": \"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"}, \"bondage\": {\"title\": \"본디지·로프·구속\", \"axis\": \"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\", \"levels\": [\"구속 활동을 원하지 않거나 이번에는 사용하지 않는다.\", \"구속의 상징·미적 분위기에만 관심을 둔다.\", \"좁게 정한 활동 범위와 짧은 역할 경험을 선호한다.\", \"활동의 구조·지속·몰입을 더 분명히 합의한다.\", \"본인이 높은 강도로 느끼는 제한·몰입을 선호한다. 구체적 한계는 별도로 정한다.\"], \"change\": \"무엇을 제한하는지, 얼마나 지속하는지, 감각과 몰입을 어떻게 느끼는지가 다르다. 이 네 요소를 한꺼번에 올리지 않는다.\", \"not\": \"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"}, \"impact\": {\"title\": \"스팽킹·임팩트 계열\", \"axis\": \"받는 사람이 느끼는 자극 강도·지속·허용 범위\", \"levels\": [\"해당 자극을 사용하지 않는다.\", \"아주 낮은 감각만 선호하며 통증을 원하지 않을 수도 있다.\", \"낮은 강도의 개별 허용 자극을 선호한다.\", \"본인 기준 중간 정도의 자극을 선호한다.\", \"본인 기준 높은 자극을 선호한다. 동의한 상한을 넘지 않는다.\"], \"change\": \"같은 활동명이라도 체감 강도·반복·지속 선호가 다르다. 공통된 도구·횟수·세기로 이 단계를 정의할 수 없다.\", \"not\": \"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"}, \"discipline\": {\"title\": \"훈육·규칙·과제\", \"axis\": \"규칙의 수·엄격함·적용 시간·피드백 방식\", \"levels\": [\"의무 규칙을 두지 않는다.\", \"선택 가능한 가벼운 약속만 둔다.\", \"소수의 분명한 규칙과 피드백을 합의한다.\", \"여러 규칙을 일관된 구조로 적용한다.\", \"엄격한 규칙 구조를 선호한다. 합의 변경·중단은 위반으로 취급하지 않는다.\"], \"change\": \"규칙의 구조와 엄격함이 달라진다. 벌의 강도·모욕·일상 통제는 별도 항목이다.\", \"not\": \"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"}, \"service\": {\"title\": \"서비스·봉사·돌봄\", \"axis\": \"기여의 비중·담당 범위·지속성\", \"levels\": [\"서비스 역할을 설정하지 않는다.\", \"가끔 작은 도움이나 배려를 선호한다.\", \"합의한 특정 도움·과제를 즐긴다.\", \"관계에서 정기적인 기여나 돌봄 역할을 중요하게 여긴다.\", \"지속적인 기여·돌봄을 핵심 취향으로 여긴다. 생활 전권·자기 소진을 의미하지 않는다.\"], \"change\": \"자발적인 기여의 비중과 구조가 달라진다. 서비스 돔은 상대 필요 중심의 주도, 서비스 서브는 봉사·기여 중심으로 표현될 수 있다.\", \"not\": \"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"}, \"protocol\": {\"title\": \"프로토콜·호칭·의식\", \"axis\": \"격식·절차의 수·일상 적용 범위\", \"levels\": [\"특별한 호칭·절차를 두지 않는다.\", \"상징이나 간단한 인사 정도만 선호한다.\", \"특정 장면에서 정한 호칭·절차를 쓴다.\", \"여러 절차를 일관되게 유지한다.\", \"격식 높은 관계 형식을 선호한다. 장소·상황별 예외는 별도로 정한다.\"], \"change\": \"격식의 정도와 적용 범위가 달라진다. 호칭 하나가 모든 명령권을 부여하지는 않는다.\", \"not\": \"일상·공개 공간에 같은 절차를 자동 확장하지 않는다.\"}, \"primal\": {\"title\": \"프라이멀·헌터/프레이\", \"axis\": \"추격·경쟁 역할의 비중과 몰입\", \"levels\": [\"해당 역할 구도를 사용하지 않는다.\", \"말·분위기 수준의 가벼운 도전만 선호한다.\", \"합의한 짧은 역할 구도를 즐긴다.\", \"역할의 긴장·경쟁·몰입을 뚜렷하게 선호한다.\", \"강한 역할 몰입을 선호한다. 실제 중단·거절과 역할 표현은 구별한다.\"], \"change\": \"역할 몰입과 경쟁 분위기가 달라진다. 헌터·프레이를 자동으로 돔·서브와 동일시하지 않는다.\", \"not\": \"프레이의 실제 거절을 역할 연기로 추정하지 않는다.\"}, \"brat\": {\"title\": \"브랫·티징·장난\", \"axis\": \"도발의 빈도·표현 수위·역할 비중\", \"levels\": [\"도발·반항 역할을 원하지 않는다.\", \"가벼운 농담이나 받아치기를 즐긴다.\", \"합의된 떠보기·장난스러운 반항을 즐긴다.\", \"도전·반응 교환을 관계의 중요한 요소로 여긴다.\", \"강한 반항 역할·긴장감을 선호한다. 표현의 한계는 구체적으로 정한다.\"], \"change\": \"상호작용의 비중과 허용 표현이 달라진다. 상대를 화나게 하거나 굴복시키는 것이 필수 목표는 아니다.\", \"not\": \"브랫이라는 이름이 실제 거절을 무시할 허가가 되지 않는다.\"}, \"language\": {\"title\": \"디그레이데이션·휴밀리에이션\", \"axis\": \"허용 단어·상황·심리적 강도\", \"levels\": [\"비하·수치심 연출을 원하지 않는다.\", \"명시적으로 허용한 아주 가벼운 표현만 선호한다.\", \"정해진 단어·상황에서 제한적인 역할 표현을 선호한다.\", \"허용한 표현과 맥락 안에서 더 깊은 심리적 몰입을 선호한다.\", \"본인이 높은 강도로 느끼는 몰입을 선호한다. 금지 단어·주제는 그대로 유지한다.\"], \"change\": \"단어의 자극성과 수치심은 개인차가 크다. 한 단어를 모든 사람에게 같은 단계로 분류할 수 없다.\", \"not\": \"디그레이데이션은 비하 표현, 휴밀리에이션은 수치심의 맥락에 초점이 있다. 서로 겹치지만 동일하지 않다.\"}, \"sensory\": {\"title\": \"감각·기대·칭찬\", \"axis\": \"감각 집중·기대감·정서적 몰입\", \"levels\": [\"해당 연출을 사용하지 않는다.\", \"편안한 분위기나 약한 감각 변화만 선호한다.\", \"특정 감각·기대·인정 경험에 선택적으로 집중한다.\", \"집중과 몰입을 더 중요한 요소로 여긴다.\", \"강한 집중·정서적 몰입을 선호한다. 통증이나 높은 위험이 필수는 아니다.\"], \"change\": \"집중·감각·감정의 체감이 달라진다. 칭찬 중심 활동은 신체 강도를 높이는 단계가 아니다.\", \"not\": \"감각 제한·강한 기대 연출의 위험이나 부담은 단순 단계와 별도로 확인한다.\"}, \"roleplay\": {\"title\": \"펫·돌봄·상징 역할극\", \"axis\": \"역할의 비중·지속·절차·몰입\", \"levels\": [\"역할극을 사용하지 않는다.\", \"상징·호칭·분위기만 가볍게 즐긴다.\", \"특정 장면에 한정한 역할을 즐긴다.\", \"여러 절차와 반응을 포함해 역할에 몰입한다.\", \"역할을 중요한 취향으로 여긴다. 역할 밖 독립성과 중단권은 유지된다.\"], \"change\": \"역할극의 깊이와 적용 시간이 달라진다. 성인 간 허구적 역할이며 실제 동물·미성년자와 무관하다.\", \"not\": \"역할 명칭을 실제 인격·권리의 소거로 해석하지 않는다.\"}, \"aesthetic\  ↔ 자발적으로 맡기는 쪽\", \"결정권의 방향\", \"돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\"], [\"탑 ↔ 바텀\", \"특정 활동을 진행하는 쪽 ↔ 받는 쪽\", \"활동의 방향\", \"탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\"], [\"마스터·미스트리스 ↔ 슬레이브\", \"합의한 관계에서 넓은 권한 위임을 표현하는 명칭\", \"관계의 범위·형식\", \"돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\"], [\"새디스트 ↔ 마조히스트\", \"합의한 자극을 주는 취향 ↔ 받는 취향\", \"자극의 방향·선호\", \"새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\"], [\"스위치·사도마조히스트\", \"역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\", \"전환의 대상·상황\", \"스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\"], [\"브랫 ↔ 브랫 테이머\", \"합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\", \"반응 교환\", \"브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\"], [\"헌터·프레데터 ↔ 프레이\", \"추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\", \"프라이멀 역할\", \"헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\"], [\"리거 ↔ 로프버니·로프 바텀\", \"로프 구속을 구성하는 역할 ↔ 받는 역할\", \"로프 활동의 방향\", \"로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\"], [\"디그레이더 ↔ 디그레이디\", \"합의한 비하 표현을 제공 ↔ 수용\", \"언어·심리적 맥락\", \"실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\"], [\"스팽커 ↔ 스팽키\", \"스팽킹을 제공 ↔ 수용\", \"특정 활동의 방향\", \"스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\"], [\"훈육자·트레이너 ↔ 트레이니\", \"합의한 규칙·과제를 진행 ↔ 배우고 수행\", \"규칙·피드백 구조\", \"훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\"], [\"서비스 돔·서비스 서브\", \"상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\", \"서비스를 표현하는 방식\", \"서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\"], [\"오너·펫·펫 트레이너\", \"성인 간 소속·동물 역할극을 이끌거나 받음\", \"상징 역할·돌봄\", \"실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\"], [\"케어기버 ↔ 돌봄 수용 역할\", \"성인 간 돌봄 제공 ↔ 돌봄 수용\", \"안정감·돌봄\", \"돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\"], [\"센슈얼리스트·감각 지향\", \"감각·분위기·집중을 중심으로 즐김\", \"감각 경험\", \"통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\"]]}\u003c/script>\u003cscript>\n(()=>{'use strict';const q=id=>document.getElementById(id),data=JSON.parse(q('courseData').textContent),chapters=[...document.querySelectorAll('.chapter')];let index=0,present=false;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function update(){chapters.forEach((c,i)=>c.classList.toggle('current',i===index));document.querySelectorAll('.sidebar a').forEach((a,i)=>a.classList.toggle('active',i===index));q('slideCount').textContent=(index+1)+' / '+chapters.length;q('prevButton').disabled=index===0;q('nextButton').disabled=index===chapters.length-1}function go(i){index=Math.max(0,Math.min(chapters.length-1,i));update();if(present)window.scrollTo({top:0,behavior:'instant'});else chapters[index].scrollIntoView({behavior:'smooth',block:'start'})}q('modeButton').onclick=()=>{present=!present;document.body.classList.toggle('present',present);q('modeButton').textContent=present?'읽기 모드':'집중 읽기';q('modeButton').setAttribute('aria-pressed',String(present));q('liveStatus').textContent=present?'집중 읽기 · 좌우 화살표로 장 이동 · 장 안에서는 스크롤':'읽기 모드 · 전체 스크롤';go(index)};document.querySelectorAll('.sidebar a').forEach((a,i)=>a.onclick=e=>{e.preventDefault();go(i)});q('prevButton').onclick=()=>go(index-1);q('nextButton').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(!present||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});q('fullButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else q('liveStatus').textContent='브라우저의 전체 화면 기능을 사용하세요.'}catch(e){q('liveStatus').textContent='전체 화면 전환이 제한됩니다.'}};q('printButton').onclick=()=>window.print();let previous=[];window.addEventListener('beforeprint',()=>{previous=[...document.querySelectorAll('details')].map(d=>[d,d.open]);previous.forEach(([d])=>d.open=true);document.querySelectorAll('.entry').forEach(x=>{x.dataset.beforeprint=x.hidden?'1':'0';x.hidden=false})});window.addEventListener('afterprint',()=>{previous.forEach(([d,v])=>d.open=v);document.querySelectorAll('.entry').forEach(x=>{x.hidden=x.dataset.beforeprint==='1';delete x.dataset.beforeprint})});\nconst categories={role:'역할',traits:'세부 취향',activities:'활동',materials:'소재',style:'스타일',focus:'중심',structure:'관계 구조'};if(q('termGrid')){for(const term of data.catalog){const c=el('article',undefined,'entry');c.dataset.category=term.category;c.dataset.search=(term.name+' '+term.desc).toLowerCase();c.append(el('div',categories[term.category],'category'),el('h3',term.name),el('p',term.desc));q('termGrid').append(c)}const filter=()=>{const text=q('termSearch').value.trim().toLowerCase(),cat=q('termCategory').value;let n=0;document.querySelectorAll('.entry').forEach(c=>{c.hidden=!!((text&&!c.dataset.search.includes(text))||(cat!=='all'&&cat!==c.dataset.category));if(!c.hidden)n++});q('termCount').textContent=n+' / '+data.catalog.length+'개 항목'};q('termSearch').oninput=filter;q('termCategory').onchange=filter;filter()}\nif(q('activityPick')){const activities=data.catalog.filter(x=>x.category==='activities');for(const a of activities){const o=el('option',a.name);o.value=a.id;q('activityPick').append(o)}const render=()=>{const a=activities.find(x=>x.id===q('activityPick').value),f=data.families[a.family];q('activityBox').replaceChildren(el('h3',a.name),el('p',a.desc),el('p','比較基準'.replace('比較基準','비교 기준')+': '+f.axis,'muted'));q('activityBody').replaceChildren();f.levels.forEach((t,i)=>{const tr=el('tr');tr.append(el('td',String(i)),el('td',t));q('activityBody').append(tr)});q('activitySummary').replaceChildren(el('p',f.change),el('p','혼동하지 않기: '+f.not))};q('activityPick').onchange=render;render()}\nif(q('profilePick')){const profiles=[['약한 신체 자극 / 깊은 몰입',[1,4,3,2,0],'신체 강도는 낮아도 신뢰·권한 위임·몰입을 중요하게 여길 수 있다.'],['높은 자극 / 권한 위임 없음',[4,2,0,0,0],'강한 자극을 선호해도 지배·복종 관계나 일상 통제는 원하지 않을 수 있다.'],['엄격한 규칙 / 일상 적용 없음',[0,3,2,4,0],'신체 자극 없이 규칙과 몰입을 선호하고, 장면 밖 역할은 원하지 않을 수 있다.']];const render=()=>{const [name,values,text]=profiles[+q('profilePick').value];q('profileBox').replaceChildren(el('h3',name),el('p',text));['신체 자극','심리 몰입','권한 위임','규칙 엄격함','일상 적용'].forE 니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\" aria-current=\"page\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">03 중급 · 강도·상한·상황별 합의\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"장별 목차\">\u003ca href=\"#ch0\">01 · 강도는 여러 축의 조합\u003c/a>\u003ca href=\"#ch1\">02 · 자신의 단계 기준을 정의하는 법\u003c/a>\u003ca href=\"#ch2\">03 · 활동 34개의 단계 차이 비교\u003c/a>\u003ca href=\"#ch3\">04 · 상한·금지선·조건부 허용\u003c/a>\u003ca href=\"#ch4\">05 · 일상과 플레이를 별도로 설계\u003c/a>\u003ca href=\"#ch5\">06 · 합의표를 읽는 연습\u003c/a>\u003ca href=\"#ch6\">07 · 사례 해설: 서로 다른 상한\u003c/a>\u003ca href=\"#ch7\">08 · 부록 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">중급 / 01\u003c/div>\u003ch2>강도는 여러 축의 조합\u003c/h2>\u003cp class=\"lede\">이 자료에서 알아볼 것: 모호한 “소프트·하드”를 개인별 기준과 상한으로 구체화한다.\u003c/p>\u003cdiv class=\"controls\">\u003clabel for=\"profilePick\">가상 프로필 선택\u003c/label>\u003cselect id=\"profilePick\">\u003coption value=\"0\">약한 신체 자극 / 깊은 몰입\u003c/option>\u003coption value=\"1\">높은 자극 / 권한 위임 없음\u003c/option>\u003coption value=\"2\">엄격한 규칙 / 일상 적용 없음\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"profileBox\" class=\"card\">\u003c/div>\u003cdiv class=\"callout\">그래프의 0~4는 가상 사례의 설명값이다. 진단·숙련도·안전 점수가 아니다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">중급 / 02\u003c/div>\u003ch2>자신의 단계 기준을 정의하는 법\u003c/h2>\u003cp class=\"lede\">표현·허용 범위·상한을 정하지 않은 숫자는 사람마다 다르게 해석된다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>축\u003c/th>\u003cth>낮은 쪽\u003c/th>\u003cth>높은 쪽\u003c/th>\u003cth>단계 기준의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>신체 자극\u003c/td>\u003ctd>약한 감각\u003c/td>\u003ctd>본인 기준 강한 자극\u003c/td>\u003ctd>본인이 느끼는 감각·허용 범위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>심리 몰입\u003c/td>\u003ctd>가벼운 분위기\u003c/td>\u003ctd>깊은 역할 몰입\u003c/td>\u003ctd>허용하는 역할·말·긴장감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권한 위임\u003c/td>\u003ctd>특정 선택\u003c/td>\u003ctd>여러 합의 영역\u003c/td>\u003ctd>누가 어떤 결정을 맡는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙 엄격함\u003c/td>\u003ctd>선택형 약속\u003c/td>\u003ctd>일관된 규칙\u003c/td>\u003ctd>규칙 수·예외·변경 조건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지속·빈도\u003c/td>\u003ctd>가끔·짧게\u003c/td>\u003ctd>정기적·길게\u003c/td>\u003ctd>빈도·종료 조건·부담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일상 적용\u003c/td>\u003ctd>장면만\u003c/td>\u003ctd>여러 합의 영역\u003c/td>\u003ctd>허용 장소·대상·상황\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">멍·상처·참는 능력을 성향 강도의 공통 등급표로 쓰지 않는다. 활동의 기술적 위험은 별도로 판단한다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">중급 / 03\u003c/div>\u003ch2>활동 34개의 단계 차이 비교\u003c/h2>\u003cp class=\"lede\">활동마다 다른 기준을 사용한다. 같은 설명 축을 공유하는 활동도 있다.\u003c/p>\u003cdiv class=\"controls\">\u003clabel for=\"activityPick\">활동을 골라 단계 기준 비교 · 34개\u003c/label>\u003cselect id=\"activityPick\">\u003c/select>\u003c/div>\u003carticle id=\"activityBox\" class=\"card\">\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>설명용 단계\u003c/th>\u003cth>개인 선호·합의의 차이\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"activityBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"activitySummary\" class=\"callout\">\u003c/div>\u003cdiv class=\"callout caution\">강도 단계는 참여 목표나 진도표가 아니다. 선호가 없거나 사용하지 않는 0도 완전한 선택이다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">중급 / 04\u003c/div>\u003ch2>상한·금지선·조건부 허용\u003c/h2>\u003cp class=\"lede\">원하는 정도와 넘지 않을 선을 따로 표현한다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>선호 범위\u003c/h3>\u003cp>평소 편안하거나 만족스럽게 느끼는 정도. 매번 최대치로 진행하라는 뜻이 아님.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>상한\u003c/h3>\u003cp>현재 합의에서 넘지 않기로 정한 한계. 선호 범위보다 높더라도 목표치가 아님.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>하드 리밋\u003c/h3>\u003cp>하지 않기로 정한 경계. 다른 활동이나 강도를 허용해도 유지.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>소프트 리밋\u003c/h3>\u003cp>꺼려지거나 조건부인 경계. 자동 허용이 아니며 새 논의가 필요.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>조건부 허용을 구체화하는 항목\u003c/th>\u003cth>예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>대상\u003c/td>\u003ctd>합의한 상대에게만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상황\u003c/td>\u003ctd>명시적으로 시작한 장면에서만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표현\u003c/td>\u003ctd>정한 호칭만 / 금지 단어 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시간\u003c/td>\u003ctd>종료 신호 후 즉시 해제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재확인\u003c/td>\u003ctd>새 활동·강도 변경 전 확인\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">중급 / 05\u003c/div>\u003ch2>일상과 플레이를 별도로 설계\u003c/h2>\u003cp class=\"lede\">기질의 표현, 실제 권한, 장면의 몰입을 나눈다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구간\u003c/th>\u003cth>선택 가능한 표현\u003c/th>\u003cth>자동 확장 금지\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>일상: 은근한 기질\u003c/td>\u003ctd>말투·여유·가벼운 주도성\u003c/td>\u003ctd>실제 명령권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일상: 장난\u003c/td>\u003ctd>티키타카·선택형 제안\u003c/td>\u003ctd>벌·훈육·이행 강요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일상: 합의한 규칙\u003c/td>\u003ctd>정한 상황의 약속\u003c/td>\u003ctd>다른 생활 영역\u003c/td>\u003c/tr>\u003ctr>\u003ctd>플레이: 역할 활성\u003c/td>\u003ctd>정한 범위의 역할·규칙\u003c/td>\u003ctd>전면 복종·생활 전권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>종료·중단 후\u003c/td>\u003ctd>역할 해제·원하는 휴식·대화\u003c/td>\u003ctd>장면의 명령·벌 이월\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">시작 조건 → 허용 범위 → 변경 시 재확인 → 종료·복귀. 분위기·호감·이전 참여만으로 시작을 추정하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">중급 / 06\u003c/div>\u003ch2>합의표를 읽는 연습\u003c/h2>\u003cp class=\"lede\">같은 활동이라도 제공·수용·구간별 허용이 다를 수 있다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>일상\u003c/th>\u003cth>플레이\u003c/th>\u003cth>변경 조건\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>말로 주도하기\u003c/td>\u003ctd>제안만\u003c/td>\u003ctd>정한 순서·선택 주도\u003c/td>\u003ctd>새 결정권은 재확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>놀림\u003c/td>\u003ctd>가벼운 농담\u003c/td>\u003ctd>정한 역할 표현\u003c/td>\u003ctd>금지 주제는 계속 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙\u003c/td>\u003ctd>없음\u003c/td>\u003ctd>합의한 몇 가지 규칙\u003c/td>\u003ctd>종료 후 해제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>구속\u003c/td>\u003ctd>없음\u003c/td>\u003ctd>별도 동의한 범위\u003c/td>\u003ctd>새 형태는 재논의\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사후 반응\u003c/td>\u003ctd>일반 대화\u003c/td>\u003ctd>원하는 거리·휴식 확인\u003c/td>\u003ctd>접촉 강요 없음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">이 표는 읽기 연습용 가상 사례다. 모든 사람에게 권하는 기본 설정이 아니다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">중급 / 07\u003c/div>\u003ch2>사례 해설: 서로 다른 상한\u003c/h2>\u003cp class=\"lede\">한쪽이 더 높은 강도를 좋아한다고 다른 쪽이 맞출 의무는 없다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>A는 낮은 자극, B는 높은 자극을 선호한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>활동 이름이 같아도 체감과 원하는 수준이 다르다.\u003c/p>\u003cdiv class=\"callout\">현재 함께 허용한 범위만 선택한다. 합의 영역이 없으면 그 활동을 하지 않을 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>합의한 상한까지 매번 진행한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>상한을 기본 목표로 오해했다.\u003c/p>\u003cdiv class=\"callout\">현재 원하는 수준은 매번 다를 수 있다. 상한은 넘지 않을 선이지 도달 의무가 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>관계가 깊어져서 일상 규칙을 자동 추가했다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>신뢰의 증가를 새 권한에 대한 동의로 바꿨다.\u003c/p>\u003cdiv class=\"callout\">일상 적용은 새 범위의 별도 합의로 다룬다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">중급 / 08\u003c/div>\u003ch2>부록 · 전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003cdiv class=\"coursefooter\">\u003ca href=\"02_beginner.html\">← 이전 과정 · 초급\u003c/a>\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"04_advanced.html\">다음 과정 · 고급 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\": {\"power\": {\"title\": \"권한을 맡기는 범위\", \"axis\": \"결정권·적용 영역\", \"levels\": [\"역할 권한을 맡기지 않는다.\", \"부탁한 단일 선택만 잠시 맡긴다.\", \"정해진 장면의 제한된 결정만 맡긴다.\", \"합의한 장면에서 여러 결정을 맡긴다.\", \"구체적으로 정한 넓은 범위의 권한을 맡긴다. 철회권은 유지된다.\"], \"change\": \"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\", \"not\": \"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"}, \"bondage\": {\"title\": \"본디지·로프·구속\", \"axis\": \"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\", \"levels\": [\"구속 활동을 원하지 않거나 이번에는 사용하지 않는다.\", \"구속의 상징·미적 분위기에만 관심을 둔다.\", \"좁게 정한 활동 범위와 짧은 역할 경험을 선호한다.\", \"활동의 구조·지속·몰입을 더 분명히 합의한다.\", \"본인이 높은 강도로 느끼는 제한·몰입을 선호한다. 구체적 한계는 별도로 정한다.\"], \"change\": \"무엇을 제한하는지, 얼마나 지속하는지, 감각과 몰입을 어떻게 느끼는지가 다르다. 이 네 요소를 한꺼번에 올리지 않는다.\", \"not\": \"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"}, \"impact\": {\"title\": \"스팽킹·임팩트 계열\", \"axis\": \"받는 사람이 느끼는 자극 강도·지속·허용 범위\", \"levels\": [\"해당 자극을 사용하지 않는다.\", \"아주 낮은 감각만 선호하며 통증을 원하지 않을 수도 있다.\", \"낮은 강도의 개별 허용 자극을 선호한다.\", \"본인 기준 중간 정도의 자극을 선호한다.\", \"본인 기준 높은 자극을 선호한다. 동의한 상한을 넘지 않는다.\"], \"change\": \"같은 활동명이라도 체감 강도·반복·지속 선호가 다르다. 공통된 도구·횟수·세기로 이 단계를 정의할 수 없다.\", \"not\": \"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"}, \"discipline\": {\"title\": \"훈육·규칙·과제\", \"axis\": \"규칙의 수·엄격함·적용 시간·피드백 방식\", \"levels\": [\"의무 규칙을 두지 않는다.\", \"선택 가능한 가벼운 약속만 둔다.\", \"소수의 분명한 규칙과 피드백을 합의한다.\", \"여러 규칙을 일관된 구조로 적용한다.\", \"엄격한 규칙 구조를 선호한다. 합의 변경·중단은 위반으로 취급하지 않는다.\"], \"change\": \"규칙의 구조와 엄격함이 달라진다. 벌의 강도·모욕·일상 통제는 별도 항목이다.\", \"not\": \"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"}, \"service\": {\"title\": \"서비스·봉사·돌봄\", \"axis\": \"기여의 비중·담당 범위·지속성\", \"levels\": [\"서비스 역할을 설정하지 않는다.\", \"가끔 작은 도움이나 배려를 선호한다.\", \"합의한 특정 도움·과제를 즐긴다.\", \"관계에서 정기적인 기여나 돌봄 역할을 중요하게 여긴다.\", \"지속적인 기여·돌봄을 핵심 취향으로 여긴다. 생활 전권·자기 소진을 의미하지 않는다.\"], \"change\": \"자발적인 기여의 비중과 구조가 달라진다. 서비스 돔은 상대 필요 중심의 주도, 서비스 서브는 봉사·기여 중심으로 표현될 수 있다.\", \"not\": \"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"}, \"protocol\": {\"title\": \"프로토콜·호칭·의식\", \"axis\": \"격식·절차의 수·일상 적용 범위\", \"levels\": [\"특별한 호칭·절차를 두지 않는다.\", \"상징이나 간단한 인사 정도만 선호한다.\", \"특정 장면에서 정한 호칭·절차를 쓴다.\", \"여러 절차를 일관되게 유지한다.\", \"격식 높은 관계 형식을 선호한다. 장소·상황별 예외는 별도로 정한다.\"], \"change\": \"격식의 정도와 적용 범위가 달라진다. 호칭 하나가 모든 명령권을 부여하지는 않는다.\", \"not\": \"일상·공개 공간에 같은 절차를 자동 확장하지 않는다.\"}, \"primal\": {\"title\": \"프라이멀·헌터/프레이\", \"axis\": \"추격·경쟁 역할의 비중과 몰입\", \"levels\": [\"해당 역할 구도를 사용하지 않는다.\", \"말·분위기 수준의 가벼운 도전만 선호한다.\", \"합의한 짧은 역할 구도를 즐긴다.\", \"역할의 긴장·경쟁·몰입을 뚜렷하게 선호한다.\", \"강한 역할 몰입을 선호한다. 실제 중단·거절과 역할 표현은 구별한다.\"], \"change\": \"역할 몰입과 경쟁 분위기가 달라진다. 헌터·프레이를 자동으로 돔·서브와 동일시하지 않는다.\", \"not\": \"프레이의 실제 거절을 역할 연기로 추정하지 않는다.\"}, \"brat\": {\"title\": \"브랫·티징·장난\", \"axis\": \"도발의 빈도·표현 수위·역할 비중\", \"levels\": [\"도발·반항 역할을 원하지 않는다.\", \"가벼운 농담이나 받아치기를 즐긴다.\", \"합의된 떠보기·장난스러운 반항을 즐긴다.\", \"도전·반응 교환을 관계의 중요한 요소로 여긴다.\", \"강한 반항 역할·긴장감을 선호한다. 표현의 한계는 구체적으로 정한다.\"], \"change\": \"상호작용의 비중과 허용 표현이 달라진다. 상대를 화나게 하거나 굴복시키는 것이 필수 목표는 아니다.\", \"not\": \"브랫이라는 이름이 실제 거절을 무시할 허가가 되지 않는다.\"}, \"language\": {\"title\": \"디그레이데이션·휴밀리에이션\", \"axis\": \"허용 단어·상황·심리적 강도\", \"levels\": [\"비하·수치심 연출을 원하지 않는다.\", \"명시적으로 허용한 아주 가벼운 표현만 선호한다.\", \"정해진 단어·상황에서 제한적인 역할 표현을 선호한다.\", \"허용한 표현과 맥락 안에서 더 깊은 심리적 몰입을 선호한다.\", \"본인이 높은 강도로 느끼는 몰입을 선호한다. 금지 단어·주제는 그대로 유지한다.\"], \"change\": \"단어의 자극성과 수치심은 개인차가 크다. 한 단어를 모든 사람에게 같은 단계로 분류할 수 없다.\", \"not\": \"디그레이데이션은 비하 표현, 휴밀리에이션은 수치심의 맥락에 초점이 있다. 서로 겹치지만 동일하지 않다.\"}, \"sensory\": {\"title\": \"감각·기대·칭찬\", \"axis\": \"감각 집중·기대감·정서적 몰입\", \"levels\": [\"해당 연출을 사용하지 않는다.\", \"편안한 분위기나 약한 감각 변화만 선호한다.\", \"특정 감각·기대·인정 경험에 선택적으로 집중한다.\", \"집중과 몰입을 더 중요한 요소로 여긴다.\", \"강한 집중·정서적 몰입을 선호한다. 통증이나 높은 위험이 필수는 아니다.\"], \"change\": \"집중·감각·감정의 체감이 달라진다. 칭찬 중심 활동은 신체 강도를 높이는 단계가 아니다.\", \"not\": \"감각 제한·강한 기대 연출의 위험이나 부담은 단순 단계와 별도로 확인한다.\"}, \"roleplay\": {\"title\": \"펫·돌봄·상징 역할극\", \"axis\": \"역할의 비중·지속·절차·몰입\", \"levels\": [\"역할극을 사용하지 않는다.\", \"상징·호칭·분위기만 가볍게 즐긴다.\", \"특정 장면에 한정한 역할을 즐긴다.\", \"여러 절차와 반응을 포함해 역할에 몰입한다.\", \"역할을 중요한 취향으로 여긴다. 역할 밖 독립성과 중단권은 유지된다.\"], \"change\": \"역할극의 깊이와 적용 시간이 달라진다. 성인 간 허구적 역할이며 실제 동물·미성년자와 무관하다.\", \"not\": \"역할 명칭을 실제 인격·권리의 소거로 해석하지 않는다.\"}, \"aesthetic\": {\"title\": \"소재·미적 연출·관계 상징\", \"axis\": \"취향의 중요도·연출의 비중\", \"levels\": [\"특별한 선호가 없다.\", \"있으면 좋은 분위기 요소다.\", \"특정 소재·상징을 선택적으로 선호한다.\", \"장면·관계 만족에서 중요한 요소다.\", \"핵심적인 선호다. 신체 자극·권한 범위는 별개다.\"], \"change\": \"소재·복장·상징을 얼마나 중요하게 여기는지가 다르다. 더 강한 자극으로 이어지는 단계가 아니다.\", \"not\": \"칼라·계약 연출·특정 복장이 실제 소유권이나 영구 동의를 만들지는 않는다.\"}}, \"catalog\": [{\"id\": \"role:none\", \"category\": \"role\", \"name\": \"미지정\", \"desc\": \"기존 역할 유지\", \"family\": null}, {\"id\": \"role:dom\", \"category\": \"role\", \"name\": \"도미넌트\", \"desc\": \"합의한 범위에서 주도권을 맡음\", \"family\": null}, {\"id\": \"role:sub\", \"category\": \"role\", \"name\": \"서브미시브 · 서브 · 섭\", \"desc\": \"자발적으로 주도권을 맡김\", \"family\": null}, {\"id\": \"role:switch\", \"category\": \"role\", \"name\": \"스위치\", \"desc\": \"합의에 따라 지배·복종 역할 전환\", \"family\": null}, {\"id\": \"role:top\", \"category\": \"role\", \"name\": \"탑\", \"desc\": \"활동을 진행; 지배권과 별개\", \"family\": null}, {\"id\": \"role:bottom\", \"category\": \"role\", \"name\": \  \"name\": \"마스터·슬레이브 관계\", \"desc\": \"넓은 권한 위임을 표현하는 관계명; 구체적 범위·철회권 유지\", \"family\": null}, {\"id\": \"structure:activity\", \"category\": \"structure\", \"name\": \"활동 중심\", \"desc\": \"관계 위계 없이 특정 활동의 진행·수용에 집중\", \"family\": null}, {\"id\": \"structure:sceneOnly\", \"category\": \"structure\", \"name\": \"장면 한정\", \"desc\": \"정한 장면에서만 역할 활성; 일상은 별개\", \"family\": null}, {\"id\": \"structure:ongoing\", \"category\": \"structure\", \"name\": \"지속 관계\", \"desc\": \"합의한 역할을 장기적으로 유지; 항상 플레이하는 뜻 아님\", \"family\": null}, {\"id\": \"structure:dailyAgreed\", \"category\": \"structure\", \"name\": \"일상 일부 적용\", \"desc\": \"구체적으로 정한 일상 영역만 역할 적용\", \"family\": null}, {\"id\": \"structure:switching\", \"category\": \"structure\", \"name\": \"역할 전환형\", \"desc\": \"상대·상황별 합의로 역할 변경\", \"family\": null}, {\"id\": \"structure:onePartner\", \"category\": \"structure\", \"name\": \"특정 상대 한정\", \"desc\": \"정한 상대에게만 성향 표현; 타인에게 일반화 금지\", \"family\": null}], \"pairs\": [[\"도미넌트 ↔ 서브미시브\", \"합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\", \"결정권의 방향\", \"돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\"], [\"탑 ↔ 바텀\", \"특정 활동을 진행하는 쪽 ↔ 받는 쪽\", \"활동의 방향\", \"탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\"], [\"마스터·미스트리스 ↔ 슬레이브\", \"합의한 관계에서 넓은 권한 위임을 표현하는 명칭\", \"관계의 범위·형식\", \"돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\"], [\"새디스트 ↔ 마조히스트\", \"합의한 자극을 주는 취향 ↔ 받는 취향\", \"자극의 방향·선호\", \"새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\"], [\"스위치·사도마조히스트\", \"역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\", \"전환의 대상·상황\", \"스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\"], [\"브랫 ↔ 브랫 테이머\", \"합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\", \"반응 교환\", \"브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\"], [\"헌터·프레데터 ↔ 프레이\", \"추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\", \"프라이멀 역할\", \"헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\"], [\"리거 ↔ 로프버니·로프 바텀\", \"로프 구속을 구성하는 역할 ↔ 받는 역할\", \"로프 활동의 방향\", \"로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\"], [\"디그레이더 ↔ 디그레이디\", \"합의한 비하 표현을 제공 ↔ 수용\", \"언어·심리적 맥락\", \"실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\"], [\"스팽커 ↔ 스팽키\", \"스팽킹을 제공 ↔ 수용\", \"특정 활동의 방향\", \"스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\"], [\"훈육자·트레이너 ↔ 트레이니\", \"합의한 규칙·과제를 진행 ↔ 배우고 수행\", \"규칙·피드백 구조\", \"훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\"], [\"서비스 돔·서비스 서브\", \"상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\", \"서비스를 표현하는 방식\", \"서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\"], [\"오너·펫·펫 트레이너\", \"성인 간 소속·동물 역할극을 이끌거나 받음\", \"상징 역할·돌봄\", \"실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\"], [\"케어기버 ↔ 돌봄 수용 역할\", \"성인 간 돌봄 제공 ↔ 돌봄 수용\", \"안정감·돌봄\", \"돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\"], [\"센슈얼리스트·감각 지향\", \"감각·분위기·집중을 중심으로 즐김\", \"감각 경험\", \"통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\"]]}\u003c/script>\u003cscript>\n(()=>{'use strict';const q=id=>document.getElementById(id),data=JSON.parse(q('courseData').textContent),chapters=[...document.querySelectorAll('.chapter')];let index=0,present=false;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function update(){chapters.forEach((c,i)=>c.classList.toggle('current',i===index));document.querySelectorAll('.sidebar a').forEach((a,i)=>a.classList.toggle('active',i===index));q('slideCount').textContent=(index+1)+' / '+chapters.length;q('prevButton').disabled=index===0;q('nextButton').disabled=index===chapters.length-1}function go(i){index=Math.max(0,Math.min(chapters.length-1,i));update();if(present)window.scrollTo({top:0,behavior:'instant'});else chapters[index].scrollIntoView({behavior:'smooth',block:'start'})}q('modeButton').onclick=()=>{present=!present;document.body.classList.toggle('present',present);q('modeButton').textContent=present?'읽기 모드':'집중 읽기';q('modeButton').setAttribute('aria-pressed',String(present));q('liveStatus').textContent=present?'집중 읽기 · 좌우 화살표로 장 이동 · 장 안에서는 스크롤':'읽기 모드 · 전체 스크롤';go(index)};document.querySelectorAll('.sidebar a').forEach((a,i)=>a.onclick=e=>{e.preventDefault();go(i)});q('prevButton').onclick=()=>go(index-1);q('nextButton').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(!present||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});q('fullButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else q('liveStatus').textContent='브라우저의 전체 화면 기능을 사용하세요.'}catch(e){q('liveStatus').textContent='전체 화면 전환이 제한됩니다.'}};q('printButton').onclick=()=>window.print();let previous=[];window.addEventListener('beforeprint',()=>{previous=[...document.querySelectorAll('details')].map(d=>[d,d.open]);previous.forEach(([d])=>d.open=true);document.querySelectorAll('.entry').forEach(x=>{x.dataset.beforeprint=x.hidden?'1':'0';x.hidden=false})});window.addEventListener('afterprint',()=>{previous.forEach(([d,v])=>d.open=v);document.querySelectorAll('.entry').forEach(x=>{x.hidden=x.dataset.beforeprint==='1';delete x.dataset.beforeprint})});\nconst categories={role:'역할',traits:'세부 취향',activities:'활동',materials:'소재',style:'스타일',focus:'중심',structure:'관계 구조'};if(q('termGrid')){for(const term of data.catalog){const c=el('article',undefined,'entry');c.dataset.category=term.category;c.dataset.search=(term.name+' '+term.desc).toLowerCase();c.append(el('div',categories[term.category],'category'),el('h3',term.name),el('p',term.desc));q('termGrid').append(c)}const filter=()=>{const text=q('termSearch').value.trim().toLowerCase(),cat=q('termCategory').value;let n=0;document.querySelectorAll('.entry').forEach(c=>{c.hidden=!!((text&&!c.dataset.search.includes(text))||(cat!=='all'&&cat!==c.dataset.category));if(!c.hidden)n++});q('termCount').textContent=n+' / '+data.catalog.length+'개 항목'};q('termSearch').oninput=filter;q('termCategory').onchange=filter;filter()}\nif(q('activityPick')){const activities=data.catalog.filter(x=>x.category==='activities');for(const a of activities){const o=el('option',a.
