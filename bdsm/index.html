ml[data-theme] body{background:white;color:#17202a}html[data-theme] .love-rights{display:block!important;background:white;color:#111}.theme-choice{display:none!important}}\n\u003c/style>\u003cstyle>html{scroll-behavior:auto;scroll-padding-top:20px}body{font:17px/1.85 system-ui,sans-serif}.topbar,.sidebar,.course-bar,.footer-controls,.course-footer{display:none!important}.shell{display:block;max-width:1060px}main,.present main{padding:20px 44px 70px}.chapter,.present .chapter{max-width:960px;padding:28px 0 54px;min-height:0!important;border:0}.chapter h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.5px}.chapter h2{font-size:clamp(26px,3vw,36px);letter-spacing:-1px}.lede{font-size:19px;max-width:760px}.grid{gap:14px}.card{padding:23px;border-radius:12px;box-shadow:none}.grid.three{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.callout{padding:18px 22px}html[data-read-mode=\"page\"] .chapter:not(.reading-current){display:none!important}html[data-read-mode=\"page\"] .chapter.reading-current{display:block!important}.chapter>*{overflow-wrap:anywhere}table{font-size:15px}th,td{line-height:1.75}.eyebrow{letter-spacing:1px}.entry{padding:18px}.entry p{font-size:15px}.reading-kicker{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}.reading-intro{padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}.reading-intro p{color:var(--muted)}@media(max-width:650px){main,.present main{padding:16px 18px 45px}.grid,.glossary-grid{grid-template-columns:1fr}.chapter{padding-top:18px}.card{padding:18px}}@media print{.chapter{display:block!important;break-inside:auto}main{padding:0}.chapter h2{break-after:avoid}}\u003c/style>\u003c/head>\u003cbody>\u003caside class=\"love-rights\" aria-label=\"자료 권리 안내\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\" aria-current=\"page\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">03 중급 · 강도·상한·상황별 합의\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"장별 목차\">\u003ca href=\"#ch0\">01 · 강도는 여러 축의 조합\u003c/a>\u003ca href=\"#ch1\">02 · 자신의 단계 기준을 정의하는 법\u003c/a>\u003ca href=\"#ch2\">03 · 활동 34개의 단계 차이 비교\u003c/a>\u003ca href=\"#ch3\">04 · 상한·금지선·조건부 허용\u003c/a>\u003ca href=\"#ch4\">05 · 일상과 플레이를 별도로 설계\u003c/a>\u003ca href=\"#ch5\">06 · 합의표를 읽는 연습\u003c/a>\u003ca href=\"#ch6\">07 · 사례 해설: 서로 다른 상한\u003c/a>\u003ca href=\"#ch7\">08 · 부록 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection id=\"plain-language\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">기초 용어부터\u003c/div>\u003ch2>낯선 말부터 쉬운 말로\u003c/h2>\u003cp class=\"lede\">이 자료는 국내·해외 통용도를 단정하지 않습니다. 쉬운 한국어 뜻을 먼저 쓰고, 외국어를 소리대로 쓴 말과 별칭을 함께 찾아볼 수 있게 했습니다.\u003c/p>\u003cdiv class=\"callout\">역할 이름은 누가 무엇을 맡는지, 활동 이름은 무엇을 하는지 말합니다. 도구 이름은 물건의 종류를 말합니다. 이 셋은 강도 단계가 아닙니다.\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>BDSM\u003c/h3>\u003cp>구속·규칙, 지배·복종, 가학·피학 등 여러 취향과 관계를 묶는 말입니다. 모든 요소를 함께 좋아해야 하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플레이 · 씬\u003c/h3>\u003cp>당사자가 시작·끝과 범위를 정한 활동 또는 역할 장면입니다. 일상의 모든 관계를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>가학 · 피학\u003c/h3>\u003cp>합의한 맥락에서 고통·강한 자극을 주는 취향 / 받는 취향입니다. 모든 고통·모든 상황을 좋아한다는 뜻은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>본디지 · 로프\u003c/h3>\u003cp>본디지는 움직임 제한 활동의 큰 분류, 로프는 줄을 사용하는 종류입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>임팩트 · 스팽 · 플로깅\u003c/h3>\u003cp>임팩트는 때리는 활동의 큰 분류입니다. 스팽킹은 보통 손이나 도구로 엉덩이 등을 때리는 활동, 플로깅은 여러 가닥 채찍을 쓰는 종류입니다. 서로 단계 이름이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플로거 · 패들 · 채찍\u003c/h3>\u003cp>플로거는 여러 가닥 끈이 달린 도구, 패들은 넓고 납작한 면을 가진 도구입니다. 채찍은 더 넓은 표현이라 실제 종류를 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리밋 · 하드 리밋 · 소프트 리밋\u003c/h3>\u003cp>리밋은 경계·제외 조건입니다. 하드 리밋은 하지 않는 것, 소프트 리밋은 아직 부담이 있거나 조건을 논의해야 하는 것입니다. 소프트 리밋은 자동 허용이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>세이프워드 · 세이프사인\u003c/h3>\u003cp>중단·조절을 위해 미리 정한 말 / 몸 신호입니다. 평범한 말로 거절하거나 동의를 철회하는 권리도 유지됩니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>체크인 · 애프터케어\u003c/h3>\u003cp>체크인은 진행 중 상태·의사를 확인하는 것, 애프터케어는 종료 후 필요한 휴식·도움·대화 등을 뜻합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>위임 · 상한\u003c/h3>\u003cp>위임은 정한 결정을 남에게 맡기는 것, 상한은 허용하기로 정한 최대 범위입니다. 좋아하는 취향과 지금 허용한 범위는 다를 수 있습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>몰입 · 위계\u003c/h3>\u003cp>몰입은 역할·경험에 집중하는 정도, 위계는 누가 어떤 상황의 안내·결정을 맡는지 정한 차이입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프로토콜 · 리추얼\u003c/h3>\u003cp>프로토콜은 호칭·예절 등 약속한 격식, 리추얼은 특별한 의미를 담아 반복하는 순서나 의식입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그 · 휴밀리에이션\u003c/h3>\u003cp>디그는 허용한 낮춤·비하 표현, 휴밀리에이션은 부끄러움을 경험하는 상황입니다. 부끄럽다고 반드시 비하당하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>칼라 · 리시 · 커프\u003c/h3>\u003cp>칼라는 목에 두르는 띠·목걸이, 리시는 연결하는 줄, 커프는 손목·발목 등에 두르는 띠 모양 도구를 가리킵니다. 착용만으로 권한이 생기지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>24/7 · TPE\u003c/h3>\u003cp>24/7은 지속적인 관계 형식을, TPE는 넓은 영역의 권한 위임을 표현할 때 쓰는 말입니다. 시간 범위와 위임 범위는 다른 축이며, 권리 포기나 철회 불가를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>페티시 · 킨크\u003c/h3>\u003cp>페티시는 특정 소재·대상 등에 강하게 끌리는 취향을, 킨크는 비관습적 취향을 넓게 가리킬 때 쓰는 말입니다. 사용 범위는 공동체마다 다를 수 있습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"activities-explained\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">활동 34개 · 뜻과 차이\u003c/div>\u003ch2>그래서, 어떤 활동이라는 뜻일까?\u003c/h2>\u003cp class=\"lede\">제목을 누르면 쉬운 뜻·영어 원어·개념 예시와 해당 활동의 비교 예가 열립니다.\u003c/p>\u003cdiv class=\"callout\">\u003cb>0~4를 읽는 법\u003c/b>\u003cp>이 자료에서 만든 설명용 구분이며 공인 등급이 아닙니다. 0은 하지 않음, 1~4는 각 표에 적힌 관심·범위의 예입니다. 일상의 말투, 관계의 위임 범위, 신체 자극은 서로 다른 축입니다. 4가 숙련자·더 좋은 취향이라는 뜻은 아닙니다.\u003c/p>\u003cp>신체 자극 표는 세기·횟수·시간을 처방하지 않습니다. 같은 힘도 체감이 다르고, 도구만으로 위험이 결정되지 않기 때문입니다. 구체적으로 무엇을 원하는지 설명하기 위한 예로 읽으세요.\u003c/p>\u003c/div>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:bondage\">\u003csummary>움직임을 제한하는 활동\u003csmall style=\"display:block;font-weight:400\">본디지 · 구속 · Bondage\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>몸의 움직임 일부를 제한하는 활동의 묶음입니다. 줄로 묶는 활동은 이 범주에 포함됩니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>손을 자유롭게 움직이는 상황과, 합의한 장면에서 움직임 일부가 제한되는 상황의 차이입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>구속을 하지 않고 소품·분위기만 즐김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>한 가지 움직임만 제한하는 설정을 따로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 움직임의 제한을 구분하고 각각 허용 여부를 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>제한이 관계 경험의 중심이 됨. 제한 부위·시간·해제 조건은 여전히 각각 정함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:rope\">\u003csummary>줄을 사용하는 구속\u003csmall style=\"display:block;font-weight:400\">로프 본디지 · Rope bondage\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>줄을 이용해 움직임을 제한하거나 몸 주변에 무늬·형태를 만드는 활동입니다. 줄을 쓰는 모든 경우가 움직임 제한을 뜻하지는 않습니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>줄이 만드는 모양을 감상하는 관심과, 실제로 움직임이 제한되는 경험을 원하는 관심은 다릅니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>줄의 외관·촉감·장식에만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정해 둔 한 가지 제한 경험에 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>모양을 만드는 과정과 제한 경험을 함께 중요하게 여김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>줄을 통한 제한·집중 경험을 핵심 취향으로 여김. 복잡한 매듭·공중에 매달기를 뜻하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:restraint\">\u003csummary>구속 도구를 사용하는 활동\u003csmall style=\"display:block;font-weight:400\">레스트레인트 · 구속구 · Restraint\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>움직임을 제한하는 도구 또는 제한 자체를 뜻합니다. 손목·발목용 커프는 둘러 채우는 띠 모양 도구입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>도구를 착용하는 상징을 원하는 것과 움직임 제한을 원하는 것은 구분합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>착용 이미지·상징만 선호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>한 종류의 움직임 제한을 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 제한 조건을 별개로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>제한 상태의 경험을 중심에 둠. 더 조이거나 오래 유지한다는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:spanking\">\u003csummary>손 등으로 때리는 활동\u003csmall style=\"display:block;font-weight:400\">스팽 · 스팽킹 · Spanking\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 맥락에서 손이나 도구로 몸을 때리는 활동을 말합니다. 보통 엉덩이를 때리는 맥락에서 많이 쓰며, 스팽이라고 줄여 부르기도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>같은 활동도 장난·감각 경험·합의한 벌 등 의미가 다를 수 있습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>접촉의 느낌만 원하고 아픔은 원하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>때리는 느낌을 원하되 통증이 시작되면 범위를 넘은 것으로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함하는 경험도 허용하되 즐거움보다 견딤에 집중하면 범위를 넘은 것으로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 통증 자체에 관심이 있는 경우. 실제 허용 세기·반복·시간은 별도로 정하며 자동 실행하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:impact\">\u003csummary>몸을 때리는 활동의 큰 분류\u003csmall style=\"display:block;font-weight:400\">임팩트 플레이 · Impact play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>손이나 도구로 몸을 때려 자극을 주고받는 활동 전체를 묶는 말입니다. 스팽킹·플로깅·패들링 등이 여기에 들어갑니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>임팩트는 특정 도구 이름이 아닙니다. 플로깅은 임팩트 안에 포함되는 한 종류입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>통증을 원하지 않고 닿는 감각에만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감을 구분하지만 통증이 생기는 경험은 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함한 자극도 관심 범위에 넣음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 통증을 선호할 수 있음. 도구명·멍의 유무·참는 정도로 등급을 정하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:flogging\">\u003csummary>여러 가닥 채찍을 사용하는 타격 활동\u003csmall style=\"display:block;font-weight:400\">플로깅 · Flogging\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>손잡이 끝에 여러 가닥의 유연한 끈이 달린 도구인 플로거(flogger)로 몸에 타격 자극을 주는 활동입니다. 도구는 플로거, 활동은 플로깅입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>한 가닥 채찍을 쓰는 모습과 구별하세요. 여러 끈이 달린 도구라는 점이 이름을 가르는 기준이며 강도는 별개입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>도구의 생김새·촉감에만 관심. 타격은 하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감은 관심 있지만 통증이 생기는 범위는 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>타격에 따른 통증도 관심 범위에 포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 타격 자극을 선호할 수 있음. 재질·사용 방식에 따라 달라지므로 플로거라는 이유만으로 약하거나 안전하다고 보지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:paddling\">\u003csummary>넓고 납작한 도구를 사용하는 타격 활동\u003csmall style=\"display:block;font-weight:400\">패들링 · Paddling\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>손잡이와 넓고 납작한 면을 가진 패들(paddle)로 몸을 때리는 활동입니다. 패들은 도구 이름, 패들링은 활동 이름입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>여러 가닥 끈이 달린 플로거와 달리 넓은 면이 있는 도구를 뜻합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>패들의 모양·상징만 관심. 타격 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감에 관심이 있지만 통증이 생기면 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함한 타격 경험도 허용 범위로 검토\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 자극을 선호할 수 있음. 패들이라는 이름만으로 특정 단계를 정하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:whipping\">\u003csummary>채찍을 사용하는 타격 활동\u003csmall style=\"display:block;font-weight:400\">휘핑 · Whipping\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>채찍으로 타격 자극을 주는 활동을 넓게 부르는 말입니다. 여러 가닥 도구를 포함해 쓰기도 하므로 실제 도구를 확인해야 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>작품에 채찍질이라고만 나오면 도구 종류와 자극 강도는 아직 알 수 없습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>채찍의 이미지·소리 등 연출만 관심. 타격 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감은 관심 있으나 통증은 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함한 자극도 관심 범위에 넣음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 자극을 선호할 수 있으나 상처를 등급이나 목표로 삼지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:discipline\">\u003csummary>정한 규칙을 지키고 피드백하는 관계 활동\u003csmall style=\"display:block;font-weight:400\">훈육 · 디시플린 · Discipline\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>서로 정한 규칙을 수행하고, 지켰는지 확인하거나 어겼을 때의 반응을 정하는 활동입니다. 훈육이라고 번역합니다. 체벌이 필수는 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>합의한 게임 규칙을 지키고 결과를 함께 확인하는 구조를 생각하면 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>지켜도 되고 거절해도 되는 가벼운 약속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>장면 안에서 규칙 하나와 피드백 방식을 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 규칙과 적용 예외를 정해 일관되게 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>규칙 구조를 관계의 중요한 부분으로 삼음. 거절·중단 요구는 위반으로 취급하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:rules\">\u003csummary>지킬 약속 정하기\u003csmall style=\"display:block;font-weight:400\">규칙 설정 · Rules\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>무엇을 언제 어떻게 할지 당사자끼리 정한 약속입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>장면 중에 쓸 호칭 하나를 정하는 것도 규칙의 한 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>부담 없이 선택하는 약속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 상황에만 적용할 약속 하나\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 약속의 적용 상황·예외를 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>일상 일부에도 약속을 적용하되 영역마다 별도 허용을 정함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:reward\">\u003csummary>인정이나 보상을 주고받기\u003csmall style=\"display:block;font-weight:400\">보상 중심 · Reward\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>원한 행동이나 노력을 알아주고, 미리 정한 칭찬·작은 보상 등을 주고받는 방식입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>약속을 지킨 것에 대해 고맙다고 말하는 것이 개념 예시입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>잘한 점을 말로 알아줌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 과제와 보상을 연결\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 과제별 보상을 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>정기적인 보상 구조를 중요하게 여김. 기본 권리를 보상으로 거래하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:correction\">\u003csummary>약속에 대한 피드백\u003csmall style=\"display:block;font-weight:400\">교정 중심 · Correction\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 규칙과 실제 행동의 차이를 짚고 다시 조정하는 방식입니다. 상대 인격을 고친다는 뜻은 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>정해 둔 약속을 서로 다르게 이해했다면 그 내용을 다시 맞추는 것입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>어떻게 이해했는지 함께 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 약속 하나를 짧게 되짚음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 약속을 점검하고 예외도 조정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>일관된 피드백 구조를 선호. 실제 거절이나 의견 차이를 잘못으로 취급하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:service\">\u003csummary>도움·시중·기여를 즐기는 활동\u003csmall style=\"display:block;font-weight:400\">봉사 · 서비스 · Service\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>상대에게 필요한 도움이나 맡은 일을 제공하는 데 의미를 두는 활동입니다. 봉사라는 말도 쓰지만 강제 노동을 뜻하지 않습니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>차를 준비하거나 필요한 물건을 챙겨주는 일도 당사자가 그 역할을 원한다면 예가 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가끔 작은 도움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 도움 한 가지를 맡음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>몇 가지 도움을 정기적으로 맡음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>기여하는 역할이 관계의 중심. 감당할 일·쉬는 시간·거절 범위를 함께 정함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:protocol\">\u003csummary>관계 안의 호칭·예절·절차\u003csmall style=\"display:block;font-weight:400\">프로토콜 · 예절 · Protocol\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>서로 어떤 호칭을 쓰고 어떻게 인사하거나 요청할지 정한 격식입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>특정 장면에서만 정한 호칭을 쓰기로 약속하는 것입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>호칭이나 인사 한 가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 장면의 호칭과 요청 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>장면 시작·진행·종료의 여러 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>격식이 관계에서 큰 비중을 차지함. 공개 장소·일상 적용은 별도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:ritual\">\u003csummary>의미를 담아 반복하는 절차\u003csmall style=\"display:block;font-weight:400\">리추얼 · 의식 · Ritual\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>당사자에게 상징적 의미가 있는 행동이나 순서를 반복하는 것입니다. 리추얼이라고도 씁니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>장면을 시작하기 전에 서로 준비됐는지 확인하는 일정한 인사가 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>작은 시작·종료 신호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정해 둔 순서 한 가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>시작과 종료에 여러 순서를 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>반복 절차 자체를 중요한 관계 경험으로 여김. 의무 강도와는 별개\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:commands\">\u003csummary>맡긴 범위의 지시 주고받기\u003csmall style=\"display:block;font-weight:400\">지시 수행 · Commands\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>한 사람이 구체적인 요청·지시를 하고 다른 사람이 합의한 범위에서 수행하는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>대신 골라 달라고 부탁한 선택을 상대가 정해 주는 상황을 생각하면 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>선택 가능한 제안\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>맡긴 선택 하나에 대한 지시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>정한 장면에서 여러 선택을 맡김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>맡기는 선택 범위가 넓음. 일상 전권이나 거절 불가를 뜻하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:primal\">\u003csummary>정해진 예절보다 즉흥적 반응을 중시하는 역할 활동\u003csmall style=\"display:block;font-weight:400\">프라이멀 플레이 · Primal play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>격식 있는 호칭·절차보다 추격·경쟁·몸짓 같은 즉흥적 상호작용을 중시하는 활동입니다. 본능형이라고 설명하기도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>추격하는 역할과 피하는 역할을 정한 허구 놀이가 한 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>말로 도전하는 분위기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>미리 정한 짧은 역할 구도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>경쟁 구도와 즉흥적 반응이 장면의 중심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>역할에 깊게 몰입. 실제 거절·중단 요구는 놀이로 재해석하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:chase\">\u003csummary>쫓고 피하는 역할극\u003csmall style=\"display:block;font-weight:400\">추격·회피 역할극 · Chase play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>쫓는 쪽과 피하는 쪽의 역할을 합의한 활동입니다. 실제로 도망가고 싶다는 표현과 구별해야 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>술래·추격자와 도망가는 등장인물처럼 역할을 정하는 개념입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>추격을 소재로 말장난\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 시작·끝이 있는 짧은 역할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>추격·회피 구도를 장면의 중심으로 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>추격 역할에 깊게 몰입하되 종료 신호·범위를 그대로 유지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:bratPlay\">\u003csummary>장난스럽게 반항하고 받아주기\u003csmall style=\"display:block;font-weight:400\">브랫 플레이 · Brat play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 장난·말대꾸·도발과 상대의 응수를 즐기는 활동입니다. 실제 불편함의 표현은 포함하지 않습니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>가벼운 말장난을 주고받고 상대가 재치 있게 받아주는 모습이 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가벼운 말장난\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>서로 받아주기로 한 특정 도발\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>반항과 응수가 장면의 주요 흐름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>반응 교환에 깊게 몰입. 굴복·벌·제압으로 끝나야 하는 것은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:teasing\">\u003csummary>놀리며 반응 주고받기\u003csmall style=\"display:block;font-weight:400\">티징 · 떠보기 · Teasing\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>상대가 허용한 범위의 놀림이나 떠보기로 반응을 교환하는 것입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>서로 불편하지 않은 별명으로 짧게 놀리고 웃는 상황이 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>한 번의 가벼운 농담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>합의한 소재의 놀림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>떠보기·응수가 이어지는 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>놀림이 상호작용의 중심. 실제 약점·거절을 압박하는 말은 별도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:degradation\">\u003csummary>합의한 낮춤·비하 표현\u003csmall style=\"display:block;font-weight:400\">디그레이데이션 · Degradation\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>미리 허용한 낮춤 표현을 역할 안에서 주고받는 활동입니다. 디그라고 줄여 부르기도 합니다. 실제 인격 평가와 구분합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>특정 호칭은 허용하되 외모·가족을 건드리는 말은 제외하는 식으로 허용 단어를 구체적으로 구분합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>낮춤 표현 없이 분위기만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>허용한 호칭 한 가지로 제한\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>몇 가지 허용 표현과 적용 상황을 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>낮춤 역할이 장면의 중심. 실제 가치·인격을 부정할 허가가 생기지는 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:humiliation\">\u003csummary>부끄러움을 느끼는 상황의 역할극\u003csmall style=\"display:block;font-weight:400\">휴밀리에이션 · Humiliation\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 상황에서 부끄럽거나 민망한 감정을 경험하는 활동입니다. 말로 비하하지 않아도 성립합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>칭찬을 크게 받는 것을 쑥스러워하는 상황과 모욕을 당하는 상황은 다릅니다. 무엇이 부끄러운지부터 확인합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>쑥스러운 분위기만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 상대 앞의 특정 상황 하나\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>몇 가지 상황과 공개 범위를 따로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>부끄러움이 경험의 중심. 허락하지 않은 관객·공개는 포함하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:praise\">\u003csummary>칭찬과 인정 주고받기\u003csmall style=\"display:block;font-weight:400\">프레이즈 · 칭찬 · Praise\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>말이나 태도로 상대의 노력·선택을 알아주고 인정하는 활동입니다. 프레이즈라고 음역합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>막연한 칭찬보다 약속을 지켜 줘서 고맙다고 구체적으로 말하는 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가끔 칭찬 한마디\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 행동을 구체적으로 칭찬\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>반복적인 칭찬·확인이 관계에서 중요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>칭찬받거나 해 주는 경험이 핵심. 칭찬 없이는 판단할 수 없게 만드는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:sensory\">\u003csummary>촉감·소리 등 감각에 집중하기\u003csmall style=\"display:block;font-weight:400\">센세이션 · 감각 · Sensation play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>촉감·소리·온도처럼 감각의 차이를 경험하는 활동의 큰 묶음입니다. 센세이션 플레이라고도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>부드러운 천과 매끈한 천의 촉감 차이에 집중하는 것이 개념 예시입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>익숙한 감각 하나에 집중\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>서로 구분되는 감각 한 쌍을 비교\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 감각의 조합과 제외할 감각을 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>감각에 집중하는 경험이 장면의 중심. 강한 통증·극단 온도를 뜻하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:blindfold\">\u003csummary>눈가리개 등으로 시야를 줄이는 활동\u003csmall style=\"display:block;font-weight:400\">시야 제한 · Blindfold\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>보이는 정보를 줄여 다른 감각이나 상대의 안내에 집중하는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>아무것도 보이지 않는 상태와 일부만 가려지는 상태는 서로 다르게 느껴질 수 있습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>성인끼리 강아지·고양이 같은 허구 역할을 빌려 애칭·몸짓·돌봄을 주고받는 활동입니다. 실제 동물과는 무관합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>펫 애칭만 쓰는 사람도 있고, 별도 역할 장면을 원하는 사람도 있습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>펫 애칭만 사용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 장면에 몸짓·돌봄 일부 포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>시작·종료를 정한 역할 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>역할 몰입이 중심. 성인으로서의 의사 표현·중단권은 유지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:carePlay\">\u003csummary>돌보고 돌봄받는 역할극\u003csmall style=\"display:block;font-weight:400\">돌봄 역할극 · Care play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>성인으로서 돌봄을 제공하거나 받는 역할을 경험하는 것입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>피곤할 때 쉬는 공간을 챙겨 주되 무엇이 필요한지는 본인에게 묻는 모습입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가벼운 안부·배려\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 도움 하나를 맡김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>정한 시간에 여러 도움을 주고받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>돌봄 역할이 관계의 중심. 상대의 판단력·독립성을 없애는 것은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:worship\">\u003csummary>존중·찬미를 강조하는 표현\u003csmall style=\"display:block;font-weight:400\">워십 · 숭배적 표현 · Worship\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>상대를 특별히 존중하거나 찬미하는 태도를 강조하는 표현입니다. 워십이라고도 합니다. 실제 종교 행위와 같다는 뜻은 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>상대의 장점을 말로 찬미하거나 정중한 인사에 의미를 두는 경우입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>존중 표현 한마디\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 인사·찬미 표현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 표현을 정한 장면에 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>찬미하는 태도가 중심. 실제 권리나 결정권을 넘긴다는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:objectRole\">\u003csummary>사물의 역할을 빌리는 성인 역할극\u003csmall style=\"display:block;font-weight:400\">오브젝트 역할극 · Objectification roleplay\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>성인 당사자가 허구적으로 사물의 역할을 맡는 설정입니다. 실제 인격이나 의사를 없애는 것이 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>조각상 역할처럼 정한 순간 동안 말없이 한 자세를 표현하는 허구 설정이 개념 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>역할 이름·이미지만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 짧은 상황 하나의 역할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>시작·종료·표현 범위를 정한 역할 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>허구 역할 몰입이 중심. 의사 표현·중단권을 없애는 설정은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:roleplay\">\u003csummary>허구의 인물·상황을 맡는 놀이\u003csmall style=\"display:block;font-weight:400\">역할극 · Roleplay\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>현실의 직업·권한과 별도로 허구 인물이나 관계를 정해 연기하는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>집사와 손님처럼 역할을 정하더라도 실제 고용 관계가 생기지는 않습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>호칭·대사만 역할에 맞춤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>상황 한 가지를 정해 짧게 연기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>배경·관계·시작과 종료가 있는 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>역할에 깊게 몰입. 장면 밖 권한·실제 동의는 별도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:aesthetic\">\u003csummary>복장·소품·분위기 연출\u003csmall style=\"display:block;font-weight:400\">미적 연출 · Aesthetic play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>어떤 모습으로 보이는지, 어떤 분위기를 만드는지에 의미를 두는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>같은 대화라도 정장·조명·소품을 통해 격식 있는 분위기를 만드는 경우입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>소품 한 가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>복장과 소품을 함께 선택\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>장소·복장·소품에 일관된 주제를 둠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>시각적 연출이 장면의 중심. 행동 강도·권한 위임과는 별개\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:collar\">\u003csummary>목걸이 등으로 관계의 약속을 표현하기\u003csmall style=\"display:block;font-weight:400\">칼라링 · 관계 상징 · Collaring\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>목에 두르는 칼라(collar) 등을 관계의 상징으로 삼거나 이를 주고받는 의식을 말합니다. 목줄을 뜻하는 리시(leash)와는 다른 말입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>커플 반지처럼 상징에 의미를 두되, 무엇을 약속하는지는 당사자가 정하는 경우입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>장신구 디자인만 선호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 장면의 상징으로 사용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>관계의 약속을 담아 주고받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>정식 의식·지속적 의미를 중요하게 여김. 실제 소유권·상시 통제권이 생기지는 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:contracts\">\u003csummary>관계의 약속을 글로 정리하기\u003csmall style=\"display:block;font-weight:400\">관계 약속·계약 연출 · Relationship agreement\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>원하는 관계·범위·금지·변경 방법을 문서로 정리하는 것입니다. 역할극 안에서 계약처럼 연출하기도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>동의한 범위와 언제든 바꿀 수 있는 내용을 함께 적는 약속표를 생각하면 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>짧은 약속 메모\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>한 장면의 범위·종료 조건 기록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>관계의 여러 영역과 예외를 구분해 기록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>장기적인 약속 문서를 주기적으로 확인·변경. 철회할 수 없는 동의서라는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003csection id=\"reading-overview\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">먼저 읽기\u003c/div>\u003ch2>시작 전 네 가지 질문\u003c/h2>\u003cp class=\"lede\">원하는 것 · 제외할 것 · 멈추는 방법 · 종료 후 필요한 것.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>Yes / Maybe / No\u003c/h3>\u003cp>Yes는 관심·의사를 표현하는 칸이며 현재 실행에 대한 무조건적인 허가는 아닙니다. Maybe는 아직 허용이 확정되지 않은 항목입니다. No는 제외합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>상한은 세 겹으로\u003c/h3>\u003cp>영역별 상한, 활동별 조건, 일상·장면 범위를 함께 확인합니다. 숫자가 같아도 서로 다른 축의 의미는 같지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>단계를 올리는 것이 목적은 아닙니다\u003c/h3>\u003cp>변화가 필요하지 않을 수 있습니다. 한 번에 한 단계라는 표현도 안전을 보장하는 보편 규칙은 아닙니다. 미리 정한 범위를 자동으로 확대하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>도구는 등급표가 아닙니다\u003c/h3>\u003cp>같은 도구도 사용 맥락에 따라 경험과 위험이 달라집니다. 자국이 없다고 안전한 것도, 오래 남는다고 특정 등급인 것도 아닙니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">아래 목차에서 상세 설명과 전체 용어 사전을 이어서 확인할 수 있습니다. 0~4는 이 자료의 비교 틀이며, 공식 등급이나 필수 상승 순서가 아닙니다.\u003c/div>\u003c/section>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">중급 / 01\u003c/div>\u003ch2>강도는 여러 축의 조합\u003c/h2>\u003cp class=\"lede\">이 자료에서 알아볼 것: 모호한 “소프트·하드”를 개인별 기준과 상한으로 구체화한다.\u003c/p>\u003cdiv class=\"controls\">\u003clabel for=\"profilePick\">가상 프로필 선택\u003c/label>\u003cselect id=\"profilePick\">\u003coption value=\"0\">약한 신체 자극 / 깊은 몰입\u003c/option>\u003coption value=\"1\">높은 자극 / 권한 위임 없음\u003c/option>\u003coption value=\"2\">엄격한 규칙 / 일상 적용 없음\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"profileBox\" class=\"card\">\u003c/div>\u003cdiv class=\"callout\">그래프의 0~4는 가상 사례의 설명값이다. 진단·숙련도·안전 점수가 아니다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">중급 / 02\u003c/div>\u003ch2>자신의 단계 기준을 정의하는 법\u003c/h2>\u003cp class=\"lede\">표현·허용 범위·상한을 정하지 않은 숫자는 사람마다 다르게 해석된다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>축\u003c/th>\u003cth>낮은 쪽\u003c/th>\u003cth>높은 쪽\u003c/th>\u003cth>단계 기준의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>신체 자극\u003c/td>\u003ctd>약한 감각\u003c/td>\u003ctd>본인 기준 강한 자극\u003c/td>\u003ctd>본인이 느끼는 감각·허용 범위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>심리 몰입\u003c/td>\u003ctd>가벼운 분위기\u003c/td>\u003ctd>깊은 역할 몰입\u003c/td>\u003ctd>허용하는 역할·말·긴장감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권한 위임(정한 선택을 다른 사람에게 맡김)\u003c/td>\u003ctd>특정 선택\u003c/td>\u003ctd>여러 합의 영역\u003c/td>\u003ctd>누가 어떤 결정을 맡는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙 엄격함\u003c/td>\u003ctd>선택형 약속\u003c/td>\u003ctd>일관된 규칙\u003c/td>\u003ctd>규칙 수·예외·변경 조건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지속·빈도\u003c/td>\u003ctd>가끔·짧게\u003c/td>\u003ctd>정기적·길게\u003c/td>\u003ctd>빈도·종료 조건·부담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일상 적용\u003c/td>\u003ctd>장면만\u003c/td>\u003ctd>여러 합의 영역\u003c/td>\u003ctd>허용 장소·대상·상황\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">멍·상처·참는 능력을 성향 강도의 공통 등급표로 쓰지 않는다. 활동의 기술적 위험은 별도로 판단한다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">중급 / 03\u003c/div>\u003ch2>활동 34개의 단계 차이 비교\u003c/h2>\u003cp class=\"lede\">활동마다 다른 기준을 사용한다. 같은 설명 축을 공유하는 활동도 있다.\u003c/p>\u003cdiv class=\"controls\">\u003clabel for=\"activityPick\">활동을 골라 단계 기준 비교 · 34개\u003c/label>\u003cselect id=\"activityPick\">\u003c/select>\u003c/div>\u003carticle id=\"activityBox\" class=\"card\">\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>설명용 단계\u003c/th>\u003cth>개인 선호·합의의 차이\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"activityBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"activitySummary\" class=\"callout\">\u003c/div>\u003cdiv class=\"callout caution\">강도 단계는 참여 목표나 진도표가 아니다. 선호가 없거나 사용하지 않는 0도 완전한 선택이다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">중급 / 04\u003c/div>\u003ch2>상한·금지선·조건부 허용\u003c/h2>\u003cp class=\"lede\">원하는 정도와 넘지 않을 선을 따로 표현한다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>선호 범위\u003c/h3>\u003cp>평소 편안하거나 만족스럽게 느끼는 정도. 매번 최대치로 진행하라는 뜻이 아님.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>상한\u003c/h3>\u003cp>현재 합의에서 넘지 않기로 정한 한계. 선호 범위보다 높더라도 목표치가 아님.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>하드 리밋\u003c/h3>\u003cp>하지 않기로 정한 경계. 다른 활동이나 강도를 허용해도 유지.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>소프트 리밋\u003c/h3>\u003cp>꺼려지거나 조건부인 경계. 자동 허용이 아니며 새 논의가 필요.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>조건부 허용을 구체화하는 항목\u003c/th>\u003cth>예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>대상\u003c/td>\u003ctd>합의한 상대에게만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상황\u003c/td>\u003ctd>명시적으로 시작한 장면에서만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표현\u003c/td>\u003ctd>정한 호칭만 / 금지 단어 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시간\u003c/td>\u003ctd>종료 신호 후 즉시 해제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재확인\u003c/td>\u003ctd>새 활동·강도 변경 전 확인\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">중급 / 05\u003c/div>\u003ch2>일상과 플레이를 별도로 설계\u003c/h2>\u003cp class=\"lede\">기질의 표현, 실제 권한, 장면의 몰입을 나눈다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구간\u003c/th>\u003cth>선택 가능한 표현\u003c/th>\u003cth>자동 확장 금지\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>일상: 은근한 기질\u003c/td>\u003ctd>말투·여유·가벼운 주도성\u003c/td>\u003ctd>실제 명령권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일상: 장난\u003c/td>\u003ctd>티키타카·선택형 제안\u003c/td>\u003ctd>벌·훈육·이행 강요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일상: 합의한 규칙\u003c/td>\u003ctd>정한 상황의 약속\u003c/td>\u003ctd>다른 생활 영역\u003c/td>\u003c/tr>\u003ctr>\u003ctd>플레이: 역할 활성\u003c/td>\u003ctd>정한 범위의 역할·규칙\u003c/td>\u003ctd>전면 복종·생활 전권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>종료·중단 후\u003c/td>\u003ctd>역할 해제·원하는 휴식·대화\u003c/td>\u003ctd>장면의 명령·벌 이월\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">시작 조건 → 허용 범위 → 변경 시 재확인 → 종료·복귀. 분위기·호감·이전 참여만으로 시작을 추정하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">중급 / 06\u003c/div>\u003ch2>합의표를 읽는 연습\u003c/h2>\u003cp class=\"lede\">같은 활동이라도 제공·수용·구간별 허용이 다를 수 있다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>일상\u003c/th>\u003cth>플레이\u003c/th>\u003cth>변경 조건\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>말로 주도하기\u003c/td>\u003ctd>제안만\u003c/td>\u003ctd>정한 순서·선택 주도\u003c/td>\u003ctd>새 결정권은 재확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>놀림\u003c/td>\u003ctd>가벼운 농담\u003c/td>\u003ctd>정한 역할 표현\u003c/td>\u003ctd>금지 주제는 계속 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙\u003c/td>\u003ctd>없음\u003c/td>\u003ctd>합의한 몇 가지 규칙\u003c/td>\u003ctd>종료 후 해제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>구속\u003c/td>\u003ctd>없음\u003c/td>\u003ctd>별도 동의한 범위\u003c/td>\u003ctd>새 형태는 재논의\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사후 반응\u003c/td>\u003ctd>일반 대화\u003c/td>\u003ctd>원하는 거리·휴식 확인\u003c/td>\u003ctd>접촉 강요 없음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">이 표는 읽기 연습용 가상 사례다. 모든 사람에게 권하는 기본 설정이 아니다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">중급 / 07\u003c/div>\u003ch2>사례 해설: 서로 다른 상한\u003c/h2>\u003cp class=\"lede\">한쪽이 더 높은 강도를 좋아한다고 다른 쪽이 맞출 의무는 없다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>A는 낮은 자극, B는 높은 자극을 선호한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>활동 이름이 같아도 체감과 원하는 수준이 다르다.\u003c/p>\u003cdiv class=\"callout\">현재 함께 허용한 범위만 선택한다. 합의 영역이 없으면 그 활동을 하지 않을 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>합의한 상한까지 매번 진행한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>상한을 기본 목표로 오해했다.\u003c/p>\u003cdiv class=\"callout\">현재 원하는 수준은 매번 다를 수 있다. 상한은 넘지 않을 선이지 도달 의무가 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>관계가 깊어져서 일상 규칙을 자동 추가했다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>신뢰의 증가를 새 권한에 대한 동의로 바꿨다.\u003c/p>\u003cdiv class=\"callout\">일상 적용은 새 범위의 별도 합의로 다룬다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">중급 / 08\u003c/div>\u003ch2>부록 · 전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003cdiv class=\"coursefooter\">\u003ca href=\"02_beginner.html\">← 이전 과정 · 초급\u003c/a>\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"04_advanced.html\">다음 과정 · 고급 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\":{\"power\":{\"title\":\"권한을 맡기는 범위\",\"axis\":\"결정권·적용 영역\",\"levels\":[\"어떤 선택도 맡기지 않음. 제안은 거절할 수 있음.\",\"메뉴 고르기처럼 요청한 선택 한 가지만 맡김.\",\"정한 장면의 몇 가지 선택만 맡김. 장면 밖은 제외.\",\"장면 안의 여러 선택을 맡기되 제외할 결정은 따로 정함.\",\"일상 일부까지 맡기는 경우. 직장·재정·교류 등 영역별로 허용·제외를 따로 정함.\"],\"change\":\"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\",\"not\":\"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"},\"bondage\":{\"title\":\"본디지·로프·구속\",\"axis\":\"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"구속을 하지 않고 소품·분위기만 즐김\",\"한 가지 움직임만 제한하는 설정을 따로 정함\",\"여러 움직임의 제한을 구분하고 각각 허용 여부를 정함\",\"제한이 관계 경험의 중심이 됨. 제한 부위·시간·해제 조건은 여전히 각각 정함\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"},\"impact\":{\"title\":\"스팽킹·임팩트 계열\",\"axis\":\"받는 사람이 느끼는 자극 강도·지속·허용 범위\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"통증을 원하지 않고 닿는 감각에만 관심\",\"타격감을 구분하지만 통증이 생기는 경험은 제외\",\"통증을 포함한 자극도 관심 범위에 넣음\",\"강한 통증을 선호할 수 있음. 도구명·멍의 유무·참는 정도로 등급을 정하지 않음\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"},\"discipline\":{\"title\":\"훈육·규칙·과제\",\"axis\":\"규칙의 수·엄격함·적용 시간·피드백 방식\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"지켜도 되고 거절해도 되는 가벼운 약속\",\"장면 안에서 규칙 하나와 피드백 방식을 정함\",\"여러 규칙과 적용 예외를 정해 일관되게 유지\",\"규칙 구조를 관계의 중요한 부분으로 삼음. 거절·중단 요구는 위반으로 취급하지 않음\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"},\"service\":{\"title\":\"서비스·봉사·돌봄\",\"axis\":\"기여의 비중·담당 범위·지속성\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가끔 작은 도움\",\"정한 도움 한 가지를 맡음\",\"몇 가지 도움을 정기적으로 맡음\",\"기여하는 역할이 관계의 중심. 감당할 일·쉬는 시간·거절 범위를 함께 정함\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"},\"protocol\":{\"title\":\"프로토콜·호칭·의식\",\"axis\":\"격식·절차의 수·일상 적용 범위\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\
