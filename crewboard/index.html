<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>크루보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--panel:#12151a;--panel2:#181c22;--border:#262b33;--border-lit:#3a4250;--text:#dfe4ea;--muted:#7c8493;--amber:#c9974a;--amber-dim:#8a6b3a;--mono:'JetBrains Mono',monospace;--sans:'Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 15% 0%,rgba(201,151,74,.06),transparent 40%),var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
header{border-bottom:1px solid var(--border);padding:22px 24px 18px}
.eyebrow{font:11px var(--mono);letter-spacing:.18em;color:var(--amber);margin-bottom:6px}
h1{font-size:22px;font-weight:900}
.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:700 11.5px var(--mono);text-decoration:none;border:1px solid var(--border);background:var(--panel2);color:var(--muted);padding:8px 12px;border-radius:5px;cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--border-lit)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#12151a}
main{max-width:980px;margin:0 auto;padding:22px 24px 48px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px 12px;font:12.5px var(--sans);outline:none}
.search:focus{border-color:var(--amber-dim)}
.meta{font:11px var(--mono);color:var(--muted);margin:0 0 12px}
.board{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
pre{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font:12.5px/1.8 var(--mono);color:var(--text)}
mark{background:rgba(201,151,74,.24);color:#f5d79f;border-radius:2px}
.status{color:var(--muted)}
@media(max-width:600px){header,main{padding-left:16px;padding-right:16px}.board{padding:16px}pre{font-size:11.5px}}
</style>
</head>
<body>
<header>
<div class="eyebrow">DOOMCHIT · CREW REFERENCE</div>
<h1>크루보드</h1>
<div class="sub">세계관·키워드북·캐릭터·제작 진행상태 통합 참고자료</div>
<div class="actions">
<a class="btn" href="../">제작 콘솔로 돌아가기</a>
<a class="btn" href="./README.md">안내 보기</a>
<a class="btn" href="./크루보드.txt" download>TXT 다운로드</a>
<button class="btn primary" id="copyBtn">전체 복사</button>
</div>
</header>
<main>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="크루보드에서 검색"></div>
<div class="meta" id="meta">불러오는 중</div>
<div class="board"><pre id="content" class="status">크루보드를 불러오는 중입니다</pre></div>
</main>
<script>
let original='';
const content=document.getElementById('content');
const meta=document.getElementById('meta');
const search=document.getElementById('search');
const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
fetch('./크루보드.txt').then(r=>{if(!r.ok)throw new Error('load');return r.text()}).then(t=>{original=t.replace(/^\uFEFF/,'');content.classList.remove('status');render();meta.textContent='전체 '+original.split(/\r?\n/).length+'줄'}).catch(()=>{content.textContent='크루보드를 불러오지 못했습니다';meta.textContent='오류'});
function render(){const q=search.value.trim();if(!q){content.textContent=original;return}const safe=escapeHtml(original);const escaped=q.replace(/[.*+?^{}()|[\]\\]/g,'\\$&');const re=new RegExp(escaped,'gi');content.innerHTML=safe.replace(re,m=>'<mark>'+m+'</mark>');meta.textContent='검색어 · '+q}
search.addEventListener('input',render);
document.getElementById('copyBtn').addEventListener('click',async e=>{if(!original)return;await navigator.clipboard.writeText(original);e.target.textContent='복사됨';setTimeout(()=>e.target.textContent='전체 복사',1000)});
</script>
</body>
</html>
