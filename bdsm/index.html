r>*{overflow-wrap:anywhere}table{font-size:15px}th,td{line-height:1.75}.eyebrow{letter-spacing:1px}.entry{padding:18px}.entry p{font-size:15px}.reading-kicker{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}.reading-intro{padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}.reading-intro p{color:var(--muted)}@media(max-width:650px){main,.present main{padding:16px 18px 45px}.grid,.glossary-grid{grid-template-columns:1fr}.chapter{padding-top:18px}.card{padding:18px}}@media print{.chapter{display:block!important;break-inside:auto}main{padding:0}.chapter h2{break-after:avoid}}\u003c/style>\u003c/head>\u003cbody>\u003caside class=\"love-rights\" aria-label=\"자료 권리 안내\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\" aria-current=\"page\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">04 고급 · 관계 운영과 복합 사례\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"장별 목차\">\u003ca href=\"#ch0\">01 · 고급은 강한 활동이 아니라 복잡한 판단\u003c/a>\u003ca href=\"#ch1\">02 · 넓은 권한 위임도 영역별로 나누기\u003c/a>\u003ca href=\"#ch2\">03 · 정신적 몰입과 실제 압박을 구분\u003c/a>\u003ca href=\"#ch3\">04 · 엇갈린 취향을 조정하는 선택지\u003c/a>\u003ca href=\"#ch4\">05 · 언어·수치심·프라이멀의 맥락\u003c/a>\u003ca href=\"#ch5\">06 · 변경·중단·종료 후의 관계 운영\u003c/a>\u003ca href=\"#ch6\">07 · 복합 사례 종합 분석\u003c/a>\u003ca href=\"#ch7\">08 · 부록 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection id=\"plain-language\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">기초 용어부터\u003c/div>\u003ch2>낯선 말부터 쉬운 말로\u003c/h2>\u003cp class=\"lede\">이 자료는 국내·해외 통용도를 단정하지 않습니다. 쉬운 한국어 뜻을 먼저 쓰고, 외국어를 소리대로 쓴 말과 별칭을 함께 찾아볼 수 있게 했습니다.\u003c/p>\u003cdiv class=\"callout\">역할 이름은 누가 무엇을 맡는지, 활동 이름은 무엇을 하는지 말합니다. 도구 이름은 물건의 종류를 말합니다. 이 셋은 강도 단계가 아닙니다.\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>BDSM\u003c/h3>\u003cp>구속·규칙, 지배·복종, 가학·피학 등 여러 취향과 관계를 묶는 말입니다. 모든 요소를 함께 좋아해야 하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플레이 · 씬\u003c/h3>\u003cp>당사자가 시작·끝과 범위를 정한 활동 또는 역할 장면입니다. 일상의 모든 관계를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>가학 · 피학\u003c/h3>\u003cp>합의한 맥락에서 고통·강한 자극을 주는 취향 / 받는 취향입니다. 모든 고통·모든 상황을 좋아한다는 뜻은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>본디지 · 로프\u003c/h3>\u003cp>본디지는 움직임 제한 활동의 큰 분류, 로프는 줄을 사용하는 종류입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>임팩트 · 스팽 · 플로깅\u003c/h3>\u003cp>임팩트는 때리는 활동의 큰 분류입니다. 스팽킹은 보통 손이나 도구로 엉덩이 등을 때리는 활동, 플로깅은 여러 가닥 채찍을 쓰는 종류입니다. 서로 단계 이름이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플로거 · 패들 · 채찍\u003c/h3>\u003cp>플로거는 여러 가닥 끈이 달린 도구, 패들은 넓고 납작한 면을 가진 도구입니다. 채찍은 더 넓은 표현이라 실제 종류를 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리밋 · 하드 리밋 · 소프트 리밋\u003c/h3>\u003cp>리밋은 경계·제외 조건입니다. 하드 리밋은 하지 않는 것, 소프트 리밋은 아직 부담이 있거나 조건을 논의해야 하는 것입니다. 소프트 리밋은 자동 허용이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>세이프워드 · 세이프사인\u003c/h3>\u003cp>중단·조절을 위해 미리 정한 말 / 몸 신호입니다. 평범한 말로 거절하거나 동의를 철회하는 권리도 유지됩니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>체크인 · 애프터케어\u003c/h3>\u003cp>체크인은 진행 중 상태·의사를 확인하는 것, 애프터케어는 종료 후 필요한 휴식·도움·대화 등을 뜻합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>위임 · 상한\u003c/h3>\u003cp>위임은 정한 결정을 남에게 맡기는 것, 상한은 허용하기로 정한 최대 범위입니다. 좋아하는 취향과 지금 허용한 범위는 다를 수 있습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>몰입 · 위계\u003c/h3>\u003cp>몰입은 역할·경험에 집중하는 정도, 위계는 누가 어떤 상황의 안내·결정을 맡는지 정한 차이입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프로토콜 · 리추얼\u003c/h3>\u003cp>프로토콜은 호칭·예절 등 약속한 격식, 리추얼은 특별한 의미를 담아 반복하는 순서나 의식입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그 · 휴밀리에이션\u003c/h3>\u003cp>디그는 허용한 낮춤·비하 표현, 휴밀리에이션은 부끄러움을 경험하는 상황입니다. 부끄럽다고 반드시 비하당하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>칼라 · 리시 · 커프\u003c/h3>\u003cp>칼라는 목에 두르는 띠·목걸이, 리시는 연결하는 줄, 커프는 손목·발목 등에 두르는 띠 모양 도구를 가리킵니다. 착용만으로 권한이 생기지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>24/7 · TPE\u003c/h3>\u003cp>24/7은 지속적인 관계 형식을, TPE는 넓은 영역의 권한 위임을 표현할 때 쓰는 말입니다. 시간 범위와 위임 범위는 다른 축이며, 권리 포기나 철회 불가를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>페티시 · 킨크\u003c/h3>\u003cp>페티시는 특정 소재·대상 등에 강하게 끌리는 취향을, 킨크는 비관습적 취향을 넓게 가리킬 때 쓰는 말입니다. 사용 범위는 공동체마다 다를 수 있습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"reading-overview\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">먼저 읽기\u003c/div>\u003ch2>중단과 회복을 별도로 이해하기\u003c/h2>\u003cp class=\"lede\">몰입의 깊이, 실제 상태, 권한 범위는 구분해서 판단합니다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>거절은 특정 암호에만 달려 있지 않습니다\u003c/h3>\u003cp>세이프워드(중단·조절을 위해 정한 말)·몸 신호와 함께 일상적인 중단 요구와 동의 철회를 존중합니다. 의미가 불분명하면 멈추고 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>체크인은 필요할 때\u003c/h3>\u003cp>새로운 변화뿐 아니라 불편함·반응 변화·의사소통이 어려워진 상황에도 상태를 확인합니다. 정해진 횟수만으로 충분하다고 단정하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>애프터케어에는 고정 등급이 없습니다\u003c/h3>\u003cp>접촉·대화·혼자 있는 시간 등 원하는 방식은 개인마다 다릅니다. 스킨십을 원하지 않을 수도 있으며 종료 후 필요한 것을 미리 이야기합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>몰입·드롭 용어의 한계\u003c/h3>\u003cp>누구나 같은 상태를 경험하는 것은 아닙니다. 용어만으로 불편함의 원인을 단정하거나 판단·동의 능력이 유지된다고 가정하지 않습니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">아래 목차에서 상세 설명과 전체 용어 사전을 이어서 확인할 수 있습니다. 0~4는 이 자료의 비교 틀이며, 공식 등급이나 필수 상승 순서가 아닙니다.\u003c/div>\u003c/section>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">고급 / 01\u003c/div>\u003ch2>고급은 강한 활동이 아니라 복잡한 판단\u003c/h2>\u003cp class=\"lede\">이 자료에서 알아볼 것: 여러 역할·감정·시간·합의가 겹칠 때 경계를 읽고 관계를 조정한다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>관계의 복잡성\u003c/h3>\u003cp>한 사람이 여러 역할을 갖거나 상대·상황별로 다른 역할을 선택할 수 있다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>판단의 복잡성\u003c/h3>\u003cp>취향·동의·체감·위험·관계 감정을 구분하며 모호함을 줄인다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>운영의 복잡성\u003c/h3>\u003cp>합의 변경·갈등·종료·사생활·회복 방식을 지속적으로 조정한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>진도와 무관한 선택\u003c/h3>\u003cp>높은 강도·지속 관계·특정 역할을 선택하지 않아도 이해 수준과 무관하다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">고급 / 02\u003c/div>\u003ch2>넓은 권한 위임도 영역별로 나누기\u003c/h2>\u003cp class=\"lede\">마스터·슬레이브·지속 관계 같은 이름만으로 실제 권한을 정할 수 없다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>확인할 영역\u003c/th>\u003cth>설명해야 하는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>관계 명칭\u003c/td>\u003ctd>두 사람이 그 단어에 부여한 의미\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권한 목록\u003c/td>\u003ctd>맡긴 결정과 맡기지 않은 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시간·장소\u003c/td>\u003ctd>언제 시작·종료하고 어디서 적용하는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예외\u003c/td>\u003ctd>업무·가족·개인 일정 등 역할을 적용하지 않는 맥락\u003c/td>\u003c/tr>\u003ctr>\u003ctd>변경권\u003c/td>\u003ctd>논의·유예·철회의 방식\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인 생활\u003c/td>\u003ctd>외부 관계·생계·의료 등 일방 통제로 확대하지 않기\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">명칭의 강렬함보다 실제 합의 내용을 본다. 상징적 소속감과 실제 소유권은 다르다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">고급 / 03\u003c/div>\u003ch2>정신적 몰입과 실제 압박을 구분\u003c/h2>\u003cp class=\"lede\">권위·인정·안도감을 선호하는 것과 거절하기 어렵게 만드는 것은 다르다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>관찰 지점\u003c/th>\u003cth>합의된 역할 표현\u003c/th>\u003cth>다시 점검할 상황\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>인정\u003c/td>\u003ctd>구체적 선택·노력을 칭찬\u003c/td>\u003ctd>애정을 잃을까 봐 원치 않는 참여\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권위\u003c/td>\u003ctd>맡긴 결정을 책임 있게 주도\u003c/td>\u003ctd>명칭을 이유로 새 권한 요구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>장난\u003c/td>\u003ctd>주고받는 도발과 반격\u003c/td>\u003ctd>거절을 계속 역할로 재해석\u003c/td>\u003c/tr>\u003ctr>\u003ctd>복종\u003c/td>\u003ctd>스스로 선택한 범위에서 맡김\u003c/td>\u003ctd>관계 유지를 위해 한계를 숨김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돌봄\u003c/td>\u003ctd>원하는 도움·거리 확인\u003c/td>\u003ctd>도움을 이유로 독립성 제한\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">개별 행동 하나로 사람을 진단하지 않는다. 현재 의사·선택권·거절 후 반응을 구체적으로 확인한다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">고급 / 04\u003c/div>\u003ch2>엇갈린 취향을 조정하는 선택지\u003c/h2>\u003cp class=\"lede\">함께 할 수 있는 영역을 찾는 것과 한쪽의 경계를 바꾸려는 것은 다르다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>유지\u003c/h3>\u003cp>현재 양쪽이 원하는 범위를 계속 유지한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>축소\u003c/h3>\u003cp>활동·빈도·적용 시간을 줄이거나 일부를 제외한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>대체\u003c/h3>\u003cp>같은 동기를 충족하는 다른 합의된 활동을 선택한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>보류·종료\u003c/h3>\u003cp>불확실하면 보류하고, 겹치는 영역이 없으면 해당 관계·활동을 끝낼 수 있다.\u003c/p>\u003c/article>\u003c/div>\u003cdetails class=\"role-pair\">\u003csummary>규율은 원하는데 수치심 표현은 싫다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>규칙과 수치심을 한 묶음으로 취급할 필요가 없다.\u003c/p>\u003cdiv class=\"callout\">명확한 규칙·과제는 남기고 비하·수치심 표현은 제외할 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>구속은 좋아하지만 지배 관계는 싫다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>활동 수용과 권한 위임(정한 선택을 다른 사람에게 맡김)은 별개다.\u003c/p>\u003cdiv class=\"callout\">활동 중심의 대등한 구조가 가능한지 별도로 합의한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>프레이지만 항상 수동적이고 싶지는 않다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>추격 구도의 역할이 일상 성격이나 모든 권한을 정하지 않는다.\u003c/p>\u003cdiv class=\"callout\">상황·활동별 역할과 전환 조건을 분리한다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">고급 / 05\u003c/div>\u003ch2>언어·수치심·프라이멀의 맥락\u003c/h2>\u003cp class=\"lede\">같은 말이나 반응의 의미가 사람·관계·장면에 따라 바뀐다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>맥락\u003c/th>\u003cth>확인할 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>비하 표현\u003c/td>\u003ctd>허용 단어·호칭·금지 주제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수치심\u003c/td>\u003ctd>누가 있는지, 공개 여부, 허용 상황\u003c/td>\u003c/tr>\u003ctr>\u003ctd>프라이멀(추격·경쟁 등 즉흥적 반응을 중시하는 역할)\u003c/td>\u003ctd>역할 표현과 실제 거절·중단의 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>브랫\u003c/td>\u003ctd>장난의 범위, 반격의 허용, 실제 불쾌감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>칭찬·인정\u003c/td>\u003ctd>좋아하는 표현, 부담이 되는 표현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>새 상황\u003c/td>\u003ctd>이전의 동의가 새 관객·장소·활동까지 포함하는지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">과거에 좋아했던 단어라도 현재 싫다고 하면 현재 의사를 따른다. 취향은 맥락과 시간에 따라 바뀔 수 있다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">고급 / 06\u003c/div>\u003ch2>변경·중단·종료 후의 관계 운영\u003c/h2>\u003cp class=\"lede\">원하는 사후 반응과 다음 합의를 다룬다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>즉시 대응\u003c/h3>\u003cp>중단·철회가 있으면 해당 활동과 역할 권한을 멈춘다. 설명이나 설득을 먼저 요구하지 않는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>원하는 반응\u003c/h3>\u003cp>접촉·대화·휴식·거리를 각각 확인한다. 상대를 편하게 해주려는 돌봄도 강요하지 않는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>나중의 대화\u003c/h3>\u003cp>편한 시점에 좋았던 점·불편한 점·다음에 바꿀 점을 구체적으로 나눈다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>기록과 사생활\u003c/h3>\u003cp>역할명·기록·사진·대화 공개는 별도 동의 문제다. 활동 참여를 공개 동의로 바꾸지 않는다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout caution\">몸이나 마음의 문제가 생긴 경우 이 자료로 상태를 판단하거나 치료하지 않는다. 필요한 전문 지원과 활동 합의는 별개다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">고급 / 07\u003c/div>\u003ch2>복합 사례 종합 분석\u003c/h2>\u003cp class=\"lede\">역할·동의·강도·맥락·관계 감정을 나누어 해석한다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>서브가 오늘은 규칙을 적용하지 말자고 했다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>정체성과 현재 참여 여부가 다르다.\u003c/p>\u003cdiv class=\"callout\">기존 규칙에 대한 변경·중단 요청을 현재 의사로 다룬다. 불복종의 벌로 바꾸지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>장면 밖에서 같은 호칭을 쓰지 않아 상대가 화났다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>호칭의 적용 구간이 불명확하다.\u003c/p>\u003cdiv class=\"callout\">일상 적용과 예외를 다시 정한다. 합의가 없었던 부분을 위반으로 확정하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>강한 자극은 원하지만 소유 표현은 싫다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>신체 자극과 정서·권한 취향이 다르다.\u003c/p>\u003cdiv class=\"callout\">강도만으로 소유 표현·지배 관계를 추가하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>관계가 지속되며 이전 한계가 달라졌다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>변화 자체를 실패나 가짜 성향으로 평가하지 않는다.\u003c/p>\u003cdiv class=\"callout\">새 한계를 기준으로 범위·빈도·활동을 재조정한다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">고급 / 08\u003c/div>\u003ch2>부록 · 전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003cdiv class=\"coursefooter\">\u003ca href=\"03_intermediate.html\">← 이전 과정 · 중급\u003c/a>\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"05_situations.html\">다음 과정 · 상황별 이해 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\":{\"power\":{\"title\":\"권한을 맡기는 범위\",\"axis\":\"결정권·적용 영역\",\"levels\":[\"어떤 선택도 맡기지 않음. 제안은 거절할 수 있음.\",\"메뉴 고르기처럼 요청한 선택 한 가지만 맡김.\",\"정한 장면  주도 쪽을 가리키는 명칭입니다. 예: 일부 생활 약속까지 포함할 수 있지만 맡긴 영역과 제외 영역은 따로 정합니다.\",\"family\":null,\"aliases\":\"마스터\",\"example\":\"일부 생활 약속까지 포함할 수 있지만 맡긴 영역과 제외 영역은 따로 정합니다.\"},{\"id\":\"role:mistress\",\"category\":\"role\",\"name\":\"지속적인 권한 관계의 주도 역할 명칭 — 미스트리스\",\"desc\":\"마스터와 비슷한 맥락에서 주도 역할에 사용하는 호칭입니다. 사용자의 정체성과 호칭 선호에 따라 달라집니다. 예: 호칭만으로 성별·허용 활동·강도를 확정하지 않습니다.\",\"family\":null,\"aliases\":\"미스트리스\",\"example\":\"호칭만으로 성별·허용 활동·강도를 확정하지 않습니다.\"},{\"id\":\"role:slave\",\"category\":\"role\",\"name\":\"폭넓은 권한을 맡기는 관계 역할 — 슬레이브\",\"desc\":\"당사자가 정한 관계에서 여러 영역의 결정권을 맡기는 쪽을 부르는 명칭입니다. 실제 노예 신분이 아닙니다. 예: 어떤 생활 약속을 맡기더라도 마음이 바뀌면 변경·중단을 요구할 수 있습니다.\",\"family\":null,\"aliases\":\"슬레이브\",\"example\":\"어떤 생활 약속을 맡기더라도 마음이 바뀌면 변경·중단을 요구할 수 있습니다.\"},{\"id\":\"role:sadist\",\"category\":\"role\",\"name\":\"고통·강한 자극을 주는 취향 — 새디스트 · 새디\",\"desc\":\"상대가 원하고 허용한 맥락에서 고통이나 강한 자극을 주는 경험에 관심이 있는 사람입니다. 예: 돔이 아니어도 이런 취향이 있을 수 있으며 실제 괴롭힘을 좋아한다는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"새디스트 · 새디\",\"example\":\"돔이 아니어도 이런 취향이 있을 수 있으며 실제 괴롭힘을 좋아한다는 뜻은 아닙니다.\"},{\"id\":\"role:masochist\",\"category\":\"role\",\"name\":\"고통·강한 자극을 받는 취향 — 마조히스트 · 매저\",\"desc\":\"본인이 원하는 특정 상황의 고통이나 강한 자극을 경험하는 데 관심이 있는 사람입니다. 예: 원하는 활동의 자극을 좋아해도 원치 않는 통증·일상 폭력은 싫을 수 있습니다.\",\"family\":null,\"aliases\":\"마조히스트 · 매저\",\"example\":\"원하는 활동의 자극을 좋아해도 원치 않는 통증·일상 폭력은 싫을 수 있습니다.\"},{\"id\":\"role:sadomasochist\",\"category\":\"role\",\"name\":\"주는 쪽과 받는 쪽 모두에 관심 — 사도마조히스트\",\"desc\":\"고통·자극을 주는 경험과 받는 경험 양쪽에 관심이 있는 사람입니다. 예: 가학·피학 취향의 방향을 말하며, 결정권을 바꾸는 스위치와는 다른 축입니다.\",\"family\":null,\"aliases\":\"사도마조히스트\",\"example\":\"가학·피학 취향의 방향을 말하며, 결정권을 바꾸는 스위치와는 다른 축입니다.\"},{\"id\":\"role:brat\",\"category\":\"role\",\"name\":\"장난스러운 반항을 즐기는 역할 — 브랫\",\"desc\":\"서로 즐기기로 한 말대꾸·도발·장난으로 상대 반응을 주고받는 사람입니다. 예: 말장난을 원하는 것이지 모든 거절을 무시해 달라는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"브랫\",\"example\":\"말장난을 원하는 것이지 모든 거절을 무시해 달라는 뜻은 아닙니다.\"},{\"id\":\"role:tamer\",\"category\":\"role\",\"name\":\"장난스러운 반항에 응수하는 역할 — 브랫 테이머\",\"desc\":\"브랫의 합의한 장난을 받아주고 반응을 주고받는 쪽입니다. 예: 웃으며 되받아치는 방식도 가능하며 반드시 벌을 주거나 굴복시켜야 하지는 않습니다.\",\"family\":null,\"aliases\":\"브랫 테이머\",\"example\":\"웃으며 되받아치는 방식도 가능하며 반드시 벌을 주거나 굴복시켜야 하지는 않습니다.\"},{\"id\":\"role:hunter\",\"category\":\"role\",\"name\":\"추격 역할을 맡는 쪽 — 헌터 · 프라이멀 헌터\",\"desc\":\"합의한 허구의 추격·경쟁 장면에서 쫓는 쪽입니다. 예: 술래 같은 추격 역할을 맡더라도 관계 전체의 결정권을 가진다는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"헌터 · 프라이멀 헌터\",\"example\":\"술래 같은 추격 역할을 맡더라도 관계 전체의 결정권을 가진다는 뜻은 아닙니다.\"},{\"id\":\"role:predator\",\"category\":\"role\",\"name\":\"포식자 이미지를 맡는 쪽 — 프레데터\",\"desc\":\"프라이멀 역할극에서 추격·포식자 이미지를 맡는 쪽의 명칭입니다. 예: 실제 위협·폭력을 허용한다는 말이 아니라 허구 역할을 가리킵니다.\",\"family\":null,\"aliases\":\"프레데터\",\"example\":\"실제 위협·폭력을 허용한다는 말이 아니라 허구 역할을 가리킵니다.\"},{\"id\":\"role:prey\",\"category\":\"role\",\"name\":\"쫓기는 역할을 맡는 쪽 — 프레이 · 프라이멀 프레이\",\"desc\":\"합의한 추격 장면에서 피하거나 쫓기는 쪽입니다. 예: 추격 역할은 좋아하지만 지배·복종 관계는 원하지 않는 경우도 있습니다.\",\"family\":null,\"aliases\":\"프레이 · 프라이멀 프레이\",\"example\":\"추격 역할은 좋아하지만 지배·복종 관계는 원하지 않는 경우도 있습니다.\"},{\"id\":\"role:primalSwitch\",\"category\":\"role\",\"name\":\"추격·피하기 역할을 바꾸는 사람 — 프라이멀 스위치\",\"desc\":\"추격자와 쫓기는 역할을 합의에 따라 바꾸는 사람입니다. 예: 누가 쫓는지 바뀌는 것이며, 일상의 결정권까지 바뀐다는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"프라이멀 스위치\",\"example\":\"누가 쫓는지 바뀌는 것이며, 일상의 결정권까지 바뀐다는 뜻은 아닙니다.\"},{\"id\":\"role:rigger\",\"category\":\"role\",\"name\":\"줄을 다루는 활동의 진행자 — 리거 · 로프 탑\",\"desc\":\"줄을 사용하는 구속·형태 만들기 활동을 진행하는 쪽입니다. 예: 줄로 모양을 만드는 데 관심이 있어도 지배 역할이나 고통을 주는 취향은 없을 수 있습니다.\",\"family\":null,\"aliases\":\"리거 · 로프 탑\",\"example\":\"줄로 모양을 만드는 데 관심이 있어도 지배 역할이나 고통을 주는 취향은 없을 수 있습니다.\"},{\"id\":\"role:ropeBunny\",\"category\":\"role\",\"name\":\"줄 활동을 받는 쪽 — 로프버니 · 로프 바텀\",\"desc\":\"줄로 형태를 만들거나 구속하는 활동을 받는 쪽을 부르는 명칭입니다. 로프 바텀이라는 표현도 씁니다. 예: 묶이는 느낌을 좋아해도 통증이나 복종 역할은 좋아하지 않을 수 있습니다.\",\"family\":null,\"aliases\":\"로프버니 · 로프 바텀\",\"example\":\"묶이는 느낌을 좋아해도 통증이나 복종 역할은 좋아하지 않을 수 있습니다.\"},{\"id\":\"role:ropeSwitch\",\"category\":\"role\",\"name\":\"줄 활동의 양쪽 역할 — 로프 스위치\",\"desc\":\"줄 활동을 진행하는 쪽과 받는 쪽 모두에 관심이 있는 사람입니다. 예: 상대와 합의해 누가 줄을 다루고 누가 받는지 바꿀 수 있습니다.\",\"family\":null,\"aliases\":\"로프 스위치\",\"example\":\"상대와 합의해 누가 줄을 다루고 누가 받는지 바꿀 수 있습니다.\"},{\"id\":\"role:bondageTop\",\"category\":\"role\",\"name\":\"구속 활동을 진행하는 쪽 — 본디지 탑 · 바인더\",\"desc\":\"줄이나 다른 도구를 사용하는 움직임 제한 활동의 진행자입니다. 예: 로프 탑보다 넓은 표현으로, 줄 외의 도구를 쓰는 경우도 포함합니다.\",\"family\":null,\"aliases\":\"본디지 탑 · 바인더\",\"example\":\"로프 탑보다 넓은 표현으로, 줄 외의 도구를 쓰는 경우도 포함합니다.\"},{\"id\":\"role:bondageBottom\",\"category\":\"role\",\"name\":\"구속 활동을 받는 쪽 — 본디지 바텀\",\"desc\":\"합의한 움직임 제한 활동을 받는 사람입니다. 예: 구속 활동의 방향을 말할 뿐, 아픔을 좋아하는지까지 말해 주지는 않습니다.\",\"family\":null,\"aliases\":\"본디지 바텀\",\"example\":\"구속 활동의 방향을 말할 뿐, 아픔을 좋아하는지까지 말해 주지는 않습니다.\"},{\"id\":\"role:degrader\",\"category\":\"role\",\"name\":\"합의한 낮춤 표현을 하는 쪽 — 디그레이더\",\"desc\":\"상대가 허용한 호칭·낮춤 표현을 역할 안에서 제공하는 사람입니다. 예: 허용한 단어와 금지한 단어를 나눠 정하며 실제 인격을 평가하는 것은 아닙니다.\",\"family\":null,\"aliases\":\"디그레이더\",\"example\":\"허용한 단어와 금지한 단어를 나눠 정하며 실제 인격을 평가하는 것은 아닙니다.\"},{\"id\":\"role:degradee\",\"category\":\"role\",\"name\":\"합의한 낮춤 표현을 받는 쪽 — 디그레이디\",\"desc\":\"허용한 낮춤·비하 표현을 역할 안에서 받는 데 관심이 있는 사람입니다. 예: 장면 속 호칭은 허용해도 일상에서 같은 말을 듣는 것은 싫을 수 있습니다.\",\"family\":null,\"aliases\":\"디그레이디\",\"example\":\"장면 속 호칭은 허용해도 일상에서 같은 말을 듣는 것은 싫을 수 있습니다.\"},{\"id\":\"role:humiliator\",\"category\":\"role\",\"name\":\"부끄러운 상황을 연출하는 쪽 — 휴밀리에이터\",\"desc\":\"상대가 원하고 허용한 민망함·부끄러움의 상황을 만드는 역할입니다. 예: 모욕적인 말을 하지 않아도 성립하며, 무엇이 민망한지는 개인마다 다릅니다.\",\"family\":null,\"aliases\":\"휴밀리에이터\",\"example\":\"모욕적인 말을 하지 않아도 성립하며, 무엇이 민망한지는 개인마다 다릅니다.\"},{\"id\":\"role:humiliationBottom\",\"category\":\"role\",\"name\":\"부끄러운 상황을 경험하는 쪽 — 휴밀리에이션 바텀\",\"desc\":\"합의한 민망함·부끄러움의 상황을 경험하는 쪽입니다. 예: 특정 상대 앞에서만 원할 수 있으며 공개 망신을 모두 허용하는 것은 아닙니다.\",\"family\":null,\"aliases\":\"휴밀리에이션 바텀\",\"example\":\"특정 상대 앞에서만 원할 수 있으며 공개 망신을 모두 허용하는 것은 아닙니다.\"},{\"id\":\"role:spanker\",\"category\":\"role\",\"name\":\"스팽킹을 제공하는 쪽 — 스팽커\",\"desc\":\"합의한 스팽킹, 즉 보통 손이나 도구로 엉덩이 등을 때리는 활동의 진행 쪽입니다. 예: 스팽킹 역할을 말할 뿐, 다른 활동까지 이끈다는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"스팽커\",\"example\":\"스팽킹 역할을 말할 뿐, 다른 활동까지 이끈다는 뜻은 아닙니다.\"},{\"id\":\"role:spankee\",\"category\":\"role\",\"name\":\"스팽킹을 받는 쪽 — 스팽키 · 스팽 수용\",\"desc\":\"합의한 스팽킹 활동을 받는 쪽입니다. 예: 받는 활동을 좋아해도 복종 관계나 벌을 원하는 것은 아닐 수 있습니다.\",\"family\":null,\"aliases\":\"스팽키 · 스팽 수용\",\"example\":\"받는 활동을 좋아해도 복종 관계나 벌을 원하는 것은 아닐 수 있습니다.\"},{\"id\":\"role:spanko\",\"category\":\"role\",\"name\":\"스팽킹에 관심 있는 사람 — 스팽코\",\"desc\":\"스팽킹을 주거나 받는 경험에 관심이 있는 사람을 넓게 부르는 말입니다. 예: 제공·수용 어느 쪽인지 이 단어 하나로는 알 수 없습니다.\",\"family\":null,\"aliases\":\"스팽코\",\"example\":\"제공·수용 어느 쪽인지 이 단어 하나로는 알 수 없습니다.\"},{\"id\":\"role:trainer\",\"category\":\"role\",\"name\":\"정한 과제·역할을 안내하는 쪽 — 트레이너\",\"desc\":\"합의한 과제나 역할의 기준을 설명하고 수행을 돕는 사람입니다. 예: 특정 인사 절차를 함께 익히는 역할처럼 범위를 정합니다.\",\"family\":null,\"aliases\":\"트레이너\",\"example\":\"특정 인사 절차를 함께 익히는 역할처럼 범위를 정합니다.\"},{\"id\":\"role:disciplineTop\",\"category\":\"role\",\"name\":\"정한 규칙을 확인하는 쪽 — 훈육자 · 디시플리너\",\"desc\":\"합의한 규칙과 피드백을 진행하는 사람입니다. 훈육자라는 말도 씁니다. 예: 규칙을 확인하는 역할이지 실제 거절을 잘못으로 꾸짖는 권한은 아닙니다.\",\"family\":null,\"aliases\":\"훈육자 · 디시플리너\",\"example\":\"규칙을 확인하는 역할이지 실제 거절을 잘못으로 꾸짖는 권한은 아닙니다.\"},{\"id\":\"role:trainee\",\"category\":\"role\",\"name\":\"정한 과제·역할을 수행하는 쪽 — 훈련 수용 · 트레이니\",\"desc\":\"합의한 과제나 절차를 익히고 수행하는 역할입니다. 예: 일상 능력이나 지능이 부족하다는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"훈련 수용 · 트레이니\",\"example\":\"일상 능력이나 지능이 부족하다는 뜻은 아닙니다.\"},{\"id\":\"role:owner\",\"category\":\"role\",\"name\":\"소속·펫 관계를 이끄는 쪽 — 오너\",\"desc\":\"합의한 상징적 소속 관계나 성인 펫 역할극을 이끄는 쪽의 명칭입니다. 예: 역할 안의 소유 표현일 뿐 실제 사람에 대한 소유권은 아닙니다.\",\"family\":null,\"aliases\":\"오너\",\"example\":\"역할 안의 소유 표현일 뿐 실제 사람에 대한 소유권은 아닙니다.\"},{\"id\":\"role:pet\",\"category\":\"role\",\"name\":\"반려동물 역할을 빌리는 성인 — 펫\",\"desc\":\"성인끼리 동물의 애칭·몸짓을 빌려 돌봄·소속감을 경험하는 허구 역할입니다. 예: 강아지 애칭만 선호하는 경우와 별도 역할 장면을 원하는 경우가 다릅니다.\",\"family\":null,\"aliases\":\"펫\",\"example\":\"강아지 애칭만 선호하는 경우와 별도 역할 장면을 원하는 경우가 다릅니다.\"},{\"id\":\"role:petTrainer\",\"category\":\"role\",\"name\":\"성인 펫 역할극을 안내하는 쪽 — 펫 트레이너\",\"desc\":\"합의한 펫 역할의 상호작용이나 과제를 진행하는 쪽입니다. 예: 실제 동물 훈련이 아니라 성인 당사자끼리 정한 허구 역할입니다.\",\"family\":null,\"aliases\":\"펫 트레이너\",\"example\":\"실제 동물 훈련이 아니라 성인 당사자끼리 정한 허구 역할입니다.\"},{\"id\":\"role:caregiver\",\"category\":\"role\",\"name\":\"돌봄을 제공하는 역할 — 케어기버\",\"desc\":\"성인 상대에게 원한 도움·안정감을 제공하는 역할입니다. 예: 휴식을 챙기되 무엇이 필요한지 상대에게 묻는 모습이 예입니다.\",\"family\":null,\"aliases\":\"케어기버\",\"example\":\"휴식을 챙기되 무엇이 필요한지 상대에게 묻는 모습이 예입니다.\"},{\"id\":\"role:careReceiver\",\"category\":\"role\",\"name\":\"돌봄받는 역할 — 돌봄 수용 역할\",\"desc\":\"성인으로서 원하는 도움이나 안정감을 받는 역할입니다. 예: 돌봄을 받고 싶다는 것이 판단력이나 독립성이 없다는 뜻은 아닙니다.\",\"family\":null,\"aliases\":\"돌봄 수용 역할\",\"example\":\"돌봄을 받고 싶다는 것이 판단력이나 독립성이 없다는 뜻은 아닙니다.\"},{\"id\":\"role:serviceSub\",\"category\":\"role\",\"name\":\"도움·기여를 즐기는 서브 — 서비스 서브 · 봉사형 서브\",\"desc\":\"합의한 관계에서 도움·시중·약속 이행 같은 기여를 중요하게 여기는 서브입니다. 예: 차 준비를 자발적으로 맡는 것처럼 어떤 기여인지 구체적으로 정합니다.\",\"family\":null,\"aliases\":\"서비스 서브 · 봉사형 서브\",\"example\":\"차 준비를 자발적으로 맡는 것처럼 어떤 기여인지 구체적으로 정합니다.\"},{\"id\":\"role:serviceDom\",\"category\":\"role\",\"name\":\"상대 필요를 중심에 두는 돔 — 서비스 돔\",\"desc\":\"상대가 원하는 경험·도움을 살피면서 합의한 진행을 이끄는 돔입니다. 예: 진행은 주도하되 내용은 상대가 원하는 것과 감당할 범위에 맞춥니다.\",\"family\":null,\"aliases\":\"서비스 돔\",\"example\":\"진행은 주도하되 내용은 상대가 원하는 것과 감당할 범위에 맞춥니다.\"},{\"id\":\"role:sensualist\",\"category\":\"role\",\"name\":\"감각 경험을 중시하는 사람 — 센슈얼리스트 · 감각 중심\",\"desc\":\"촉감·소리·분위기에 집중하는 경험에 관심이 있는 사람입니다. 예: 천의 촉감이나 목소리의 차이를 좋아해도 통증은 원하지 않을 수 있습니다.\",\"family\":null,\"aliases\":\"센슈얼리스트 · 감각 중심\",\"example\":\"천의 촉감이나 목소리의 차이를 좋아해도 통증은 원하지 않을 수 있습니다.\"},{\"id\":\"role:vanilla\",\"category\":\"role\",\"name\":\"BDSM을 선호하지 않는다는 표현 — 바닐라\",\"desc\":\"BDSM 역할·활동을 원하지 않거나 자신을 그렇게 설명하는 사람이 쓰는 말입니다. 예: 낮은 등급이나 경험 부족을 뜻하지 않으며 취향의 우열도 아닙니다.\",\"family\":null,\"aliases\":\"바닐라\",\"example\":\"낮은 등급이나 경험 부족을 뜻하지 않으며 취향의 우열도 아닙니다.\"},{\"id\":\"traits:brat\",\"category\":\"traits\",\"name\":\"브랫\",\"desc\":\"장난스러운 반항·상대 반응 떠보기; 실제 거절과 구별 예: 가벼운 말대꾸를 하고 상대가 웃으며 받아주는 상호작용을 원할 수 있습니다.\",\"family\":null,\"example\":\"가벼운 말대꾸를 하고 상대가 웃으며 받아주는 상호작용을 원할 수 있습니다.\"},{\"id\":\"traits:tamer\",\"category\":\"traits\",\"name\":\"브랫 테이머\",\"desc\":\"합의된 장난·반항을 받아주며 이끎; 굴복 결말 필수 아님 예: 장난을 유머로 받아주되 벌로 끝내지는 않을 수 있습니다.\",\"family\":null,\"example\":\"장난을 유머로 받아주되 벌로 끝내지는 않을 수 있습니다.\"},{\"id\":\"traits:sadist\",\"category\":\"traits\",\"name\":\"가학 성향\",\"desc\":\"상대가 허용한 자극을 주는 데 관심; 지배 역할과 별개 예: 상대가 원한 고통 자극에 관심이 있어도 관계의 결정권은 맡지 않을 수 있습니다.\",\"family\":null,\"example\":\"상대가 원한 고통 자극에 관심이 있어도 관계의 결정권은 맡지 않을 수 있습니다.\"},{\"id\":\"traits:masochist\",\"category\":\"traits\",\"name\":\"피학 성향\",\"desc\":\"허용한 상황의 자극을 받는 데 관심; 복종과 별개 예: 원하는 상황의 고통을 좋아해도 일상의 원치 않는 통증은 싫을 수 있습니다.\",\"family\":null,\"example\":\"원하는 상황의 고통을 좋아해도 일상의 원치 않는 통증은 싫을 수 있습니다.\"},{\"id\":\"traits:service\",\"category\":\"traits\",\"name\":\"서비스 지향\",\"desc\":\"상대의 필요·만족을 살피며 자신의 역할 수행 예: 어떤 도움을 제공하고 싶은지, 어떤 도움을 받고 싶은지 나눠 말합니다.\",\"family\":null,\"example\":\"어떤 도움을 제공하고 싶은지, 어떤 도움을 받고 싶은지 나눠 말합니다.\"},{\"id\":\"traits:praise\",\"category\":\"traits\",\"name\":\"칭찬 중심\",\"desc\":\"칭찬·인정의 교환 중시; 주고받는 방향은 역할과 상황 예: 약속을 지켜 줘서 고맙다는 구체적인 말을 좋아할 수 있습니다.\",\"family\":null,\"example\":\"약속을 지켜 줘서 고맙다는 구체적인 말을 좋아할 수 있습니다.\"},{\"id\":\"traits:care\",\"category\":\"traits\",\"name\":\"돌봄 지향\",\"desc\":\"돌봄·안정감 중시; 무능력화·의존 강요와 구별 예: 안아 주기보다 혼자 쉴 시간을 챙겨 주는 돌봄을 원할 수도 있습니다.\",\"family\":null,\"example\":\"안아 주기보다 혼자 쉴 시간을 챙겨 주는 돌봄을 원할 수도 있습니다.\"},{\"id\":\"traits:discipline\",\"category\":\"traits\",\"name\":\"규율 지향\",\"desc\":\"합의한 규칙·과제·일관된 기준 중시 예: 합의한 장면에서 호칭을 지키는 약속을 중요하게 여길 수 있습니다.\",\"family\":null,\"example\":\"합의한 장면에서 호칭을 지키는 약속을 중요하게 여길 수 있습니다.\"},{\"id\":\"traits:sensory\",\"category\":\"traits\",\"name\":\"감각 지향\",\"desc\":\"감각의 변화·집중 중시; 통증 필수 아님 예: 부드러운 천과 매끈한 천의 촉감 차이에 집중할 수 있습니다.\",\"family\":null,\"example\":\"부드러운 천과 매끈한 천의 촉감 차이에 집중할 수 있습니다.\"},{\"id\":\"traits:bondage\",\"category\":\"traits\",\"name\":\"구속 지향\",\"desc\":\"합의한 구속이라는 설정에 관심; 방법 지침 아님 예: 움직임이 제한되는 느낌은 원하지만 통증은 원하지 않을 수 있습니다.\",\"family\":null,\"example\":\"움직임이 제한되는 느낌은 원하지만 통증은 원하지 않을 수 있습니다.\"},{\"id\":\"traits:delegation\",\"category\":\"traits\",\"name\":\"선택적 위임\",\"desc\":\"신뢰하는 상황·선택만 맡김; 전면 복종 아님 예: 식사 메뉴 선택만 맡기고 다른 생활 결정은 스스로 할 수 있습니다.\",\"family\":null,\"example\":\"식사 메뉴 선택만 맡기고 다른 생활 결정은 스스로 할 수 있습니다.\"},{\"id\":\"traits:devotion\",\"category\":\"traits\",\"name\":\"헌신 지향\",\"desc\":\"자발적 기여·약속 이행 중시; 자기희생 강요 아님 예: 맡기로 한 작은 일을 꾸준히 지키는 데 의미를 둘 수 있습니다.\",\"family\":null,\"example\":\"맡기로 한 작은 일을 꾸준히 지키는 데 의미를 둘 수 있습니다.\"},{\"id\":\"traits:ritual\",\"category\":\"traits\",\"name\":\"의식·절차 지향\",\"desc\":\"합의한 인사·순서·절차를 중시 예: 장면을 시작하고 끝내는 인사 순서를 정할 수 있습니다.\",\"family\":null,\"example\":\"장면을 시작하고 끝내는 인사 순서를 정할 수 있습니다.\"},{\"id\":\"traits:protocol\",\"category\":\"traits\",\"name\":\"예절·호칭 지향\",\"desc\":\"합의한 호칭·예절 선호; 일상에 자동 적용 금지 예: 특정 장면에서만 정한 호칭을 쓸 수 있습니다.\",\"family\":null,\"example\":\"특정 장면에서만 정한 호칭을 쓸 수 있습니다.\"},{\"id\":\"traits:pet\",\"category\":\"traits\",\"name\":\"펫 역할 지향\",\"desc\":\"성인 간 상징적 반려 역할·돌봄 선호; 실제 동물과 무관 예: 일상에서는 대등하게 지내고 정한 시간에만 펫 애칭을 쓸 수 있습니다.\",\"family\":null,\"example\":\"일상에서는 대등하게 지내고 정한 시간에만 펫 애칭을 쓸 수 있습니다.\"},{\"id\":\"traits:owner\",\"category\":\"traits\",\"name\":\"오너 역할 지향\",\"desc\":\"성인 간 합의한 펫 역할을 이끔; 실제 소유권 아님 예: 펫 역할을 이끌되 실제 외출이나 인간관계를 통제하지 않습니다.\",\"family\":null,\"example\":\"펫 역할을 이끌되 실제 외출이나 인간관계를 통제하지 않습니다.\"},{\"id\":\"traits:caregiver\",\"category\":\"traits\",\"name\":\"케어기버 역할\",\"desc\":\"성인 상대에게 돌봄을 제공; 실제 권리 박탈 금지 예: 피곤한 상대에게 필요한 도움을 먼저 물어볼 수 있습니다.\",\"family\":null,\"example\":\"피곤한 상대에게 필요한 도움을 먼저 물어볼 수 있습니다.\"},{\"id\":\"traits:careReceiver\",\"category\":\"traits\",\"name\":\"돌봄 수용\",\"desc\":\"성인으로서 돌봄받는 역할 선호; 무능력·미성년 설정 아님 예: 성인으로서 자기 판단을 유지하면서 도움받는 시간을 원할 수 있습니다.\",\"family\":null,\"example\":\"성인으로서 자기 판단을 유지하면서 도움받는 시간을 원할 수 있습니다.\"},{\"id\":\"traits:primal\",\"category\":\"traits\",\"name\":\"본능형\",\"desc\":\"정형화된 예절보다 즉흥적 반응·경쟁 분위기 선호; 합의 유지 예: 격식 있는 인사보다 추격 역할의 즉흥적인 반응을 좋아할 수 있습니다.\",\"family\":null,\"example\":\"격식 있는 인사보다 추격 역할의 즉흥적인 반응을 좋아할 수 있습니다.\"},{\"id\":\"traits:restraintGive\",\"category\":\"traits\",\"name\":\"구속 제공 역할\",\"desc\":\"구속 장면을 구성하는 역할 선호; 구체적 방법은 별도 예: 상대가 요청한 움직임 제한 활동을 진행하는 쪽에 관심이 있을 수 있습니다.\",\"family\":null,\"example\":\"상대가 요청한 움직임 제한 활동을 진행하는 쪽에 관심이 있을 수 있습니다.\"},{\"id\":\"traits:restraintReceive\",\"category\":\"traits\",\"name\":\"구속 수용 역할\",\"desc\":\"합의한 구속을 받는 역할 선호; 복종과 별개 예: 제한을 받는 역할을 원해도 다른 결정을 맡기지는 않을 수 있습니다.\",\"family\":null,\"example\":\"제한을 받는 역할을 원해도 다른 결정을 맡기지는 않을 수 있습니다.\"},{\"id\":\"traits:challenge\",\"category\":\"traits\",\"name\":\"도전 지향\",\"desc\":\"합의한 도전·경쟁·과제 선호; 패배를 동의로 간주 금지 예: 합의한 게임에서 경쟁하더라도 패배가 복종 동의는 아닙니다.\",\"family\":null,\"example\":\"합의한 게임에서 경쟁하더라도 패배가 복종 동의는 아닙니다.\"},{\"id\":\"traits:humiliation\",\"category\":\"traits\",\"name\":\"수치심 지향\",\"desc\":\"별도로 허용한 수치심의 상황 선호; 비하 표현 자동 허용 아님 예: 칭찬받아 쑥스러운 상황은 원해도 모욕적인 말은 싫을 수 있습니다.\",\"family\":null,\"example\":\"칭찬받아 쑥스러운 상황은 원해도 모욕적인 말은 싫을 수 있습니다.\"},{\"id\":\"traits:degradation\",\"category\":\"traits\",\"name\":\"비하 표현 지향\",\"desc\":\"개별 허용한 표현만; 실제 가치·인격 훼손과 구별 예: 정한 호칭만 허용하고 외모나 가족에 관한 말은 제외할 수 있습니다.\",\"family\":null,\"example\":\"정한 호칭만 허용하고 외모나 가족에 관한 말은 제외할 수 있습니다.\"},{\"id\":\"traits:reassurance\",\"category\":\"traits\",\"name\":\"안심 지향\",\"desc\":\"확인·예측 가능한 반응·정서적 안정 중시 예: 다음에 무엇을 할지 미리 아는 것을 편안하게 느낄 수 있습니다.\",\"family\":null,\"example\":\"다음에 무엇을 할지 미리 아는 것을 편안하게 느낄 수 있습니다.\"},{\"id\":\"traits:aesthetic\",\"category\":\"traits\",\"name\":\"미적 연출 지향\",\"desc\":\"의상·소재·상징·장면 분위기 중시 예: 의상과 소품의 색을 맞추는 분위기에 의미를 둘 수 있습니다.\",\"family\":null,\"example\":\"의상과 소품의 색을 맞추는 분위기에 의미를 둘 수 있습니다.\"},{\"id\":\"traits:fetish\",\"category\":\"traits\",\"name\":\"특정 대상·소재 지향\",\"desc\":\"특정 복장·소재·대상에 대한 선호; 상세 대상은 직접 입력 예: 특정 장갑이나 소재를 좋아해도 그 소재와 연결된 모든 활동을 원하지는 않습니다.\",\"family\":null,\"example\":\"특정 장갑이나 소재를 좋아해도 그 소재와 연결된 모든 활동을 원하지는 않습니다.\"},{\"id\":\"traits:roleplay\",\"category\":\"traits\",\"name\":\"역할극 지향\",\"desc\":\"합의한 허구 역할·상황 몰입; 역할 밖 권한으로 확대 금지 예: 허구의 집사 역할은 좋아해도 실제 고용·복종 관계는 원하지 않을 수 있습니다.\",\"family\":null,\"example\":\"허구의 집사 역할은 좋아해도 실제 고용·복종 관계는 원하지 않을 수 있습니다.\"},{\"id\":\"activities:bondage\",\"category\":\"activities\",\"name\":\"움직임을 제한하는 활동 — 본디지 · 구속\",\"desc\":\"몸의 움직임 일부를 제한하는 활동의 묶음입니다. 줄로 묶는 활동은 이 범주에 포함됩니다. 예: 손을 자유롭게 움직이는 상황과, 합의한 장면에서 움직임 일부가 제한되는 상황의 차이입니다.\",\"family\":\"bondage\",\"aliases\":\"본디지 · 구속\",\"plain\":\"움직임을 제한하는 활동\",\"english\":\"Bondage\",\"example\":\"손을 자유롭게 움직이는 상황과, 합의한 장면에서 움직임 일부가 제한되는 상황의 차이입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"구속을 하지 않고 소품·분위기만 즐김\",\"한 가지 움직임만 제한하는 설정을 따로 정함\",\"여러 움직임의 제한을 구분하고 각각 허용 여부를 정함\",\"제한이 관계 경험의 중심이 됨. 제한 부위·시간·해제 조건은 여전히 각각 정함\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:rope\",\"category\":\"activities\",\"name\":\"줄을 사용하는 구속 — 로프 본디지\",\"desc\":\"줄을 이용해 움직임을 제한하거나 몸 주변에 무늬·형태를 만드는 활동입니다. 줄을 쓰는 모든 경우가 움직임 제한을 뜻하지는 않습니다. 예: 줄이 만드는 모양을 감상하는 관심과, 실제로 움직임이 제한되는 경험을 원하는 관심은 다릅니다.\",\"family\":\"bondage\",\"aliases\":\"로프 본디지\",\"plain\":\"줄을 사용하는 구속\",\"english\":\"Rope bondage\",\"example\":\"줄이 만드는 모양을 감상하는 관심과, 실제로 움직임이 제한되는 경험을 원하는 관심은 다릅니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"줄의 외관·촉감·장식에만 관심\",\"정해 둔 한 가지 제한 경험에 관심\",\"모양을 만드는 과정과 제한 경험을 함께 중요하게 여김\",\"줄을 통한 제한·집중 경험을 핵심 취향으로 여김. 복잡한 매듭·공중에 매달기를 뜻하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:restraint\",\"category\":\"activities\",\"name\":\"구속 도구를 사용하는 활동 — 레스트레인트 · 구속구\",\"desc\":\"움직임을 제한하는 도구 또는 제한 자체를 뜻합니다. 손목·발목용 커프는 둘러 채우는 띠 모양 도구입니다. 예: 도구를 착용하는 상징을 원하는 것과 움직임 제한을 원하는 것은 구분합니다.\",\"family\":\"bondage\",\"aliases\":\"레스트레인트 · 구속구\",\"plain\":\"구속 도구를 사용하는 활동\",\"english\":\"Restraint\",\"example\":\"도구를 착용하는 상징을 원하는 것과 움직임 제한을 원하는 것은 구분합니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"착용 이미지·상징만 선호\",\"한 종류의 움직임 제한을 정함\",\"여러 제한 조건을 별개로 정함\",\"제한 상태의 경험을 중심에 둠. 더 조이거나 오래 유지한다는 뜻은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:spanking\",\"category\":\"activities\",\"name\":\"손 등으로 때리는 활동 — 스팽 · 스팽킹\",\"desc\":\"합의한 맥락에서 손이나 도구로 몸을 때리는 활동을 말합니다. 보통 엉덩이를 때리는 맥락에서 많이 쓰며, 스팽이라고 줄여 부르기도 합니다. 예: 같은 활동도 장난·감각 경험·합의한 벌 등 의미가 다를 수 있습니다.\",\"family\":\"impact\",\"aliases\":\"스팽 · 스팽킹\",\"plain\":\"손 등으로 때리는 활동\",\"english\":\"Spanking\",\"example\":\"같은 활동도 장난·감각 경험·합의한 벌 등 의미가 다를 수 있습니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"접촉의 느낌만 원하고 아픔은 원하지 않음\",\"때리는 느낌을 원하되 통증이 시작되면 범위를 넘은 것으로 정함\",\"통증을 포함하는 경험도 허용하되 즐거움보다 견딤에 집중하면 범위를 넘은 것으로 정함\",\"강한 통증 자체에 관심이 있는 경우. 실제 허용 세기·반복·시간은 별도로 정하며 자동 실행하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:impact\",\"category\":\"activities\",\"name\":\"몸을 때리는 활동의 큰 분류 — 임팩트 플레이\",\"desc\":\"손이나 도구로 몸을 때려 자극을 주고받는 활동 전체를 묶는 말입니다. 스팽킹·플로깅·패들링 등이 여기에 들어갑니다. 예: 임팩트는 특정 도구 이름이 아닙니다. 플로깅은 임팩트 안에 포함되는 한 종류입니다.\",\"family\":\"impact\",\"aliases\":\"임팩트 플레이\",\"plain\":\"몸을 때리는 활동의 큰 분류\",\"english\":\"Impact play\",\"example\":\"임팩트는 특정 도구 이름이 아닙니다. 플로깅은 임팩트 안에 포함되는 한 종류입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"통증을 원하지 않고 닿는 감각에만 관심\",\"타격감을 구분하지만 통증이 생기는 경험은 제외\",\"통증을 포함한 자극도 관심 범위에 넣음\",\"강한 통증을 선호할 수 있음. 도구명·멍의 유무·참는 정도로 등급을 정하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:flogging\",\"category\":\"activities\",\"name\":\"여러 가닥 채찍을 사용하는 타격 활동 — 플로깅\",\"desc\":\"손잡이 끝에 여러 가닥의 유연한 끈이 달린 도구인 플로거(flogger)로 몸에 타격 자극을 주는 활동입니다. 도구는 플로거, 활동은 플로깅입니다. 예: 한 가닥 채찍을 쓰는 모습과 구별하세요. 여러 끈이 달린 도구라는 점이 이름을 가르는 기준이며 강도는 별개입니다.\",\"family\":\"impact\",\"aliases\":\"플로깅\",\"plain\":\"여러 가닥 채찍을 사용하는 타격 활동\",\"english\":\"Flogging\",\"example\":\"한 가닥 채찍을 쓰는 모습과 구별하세요. 여러 끈이 달린 도구라는 점이 이름을 가르는 기준이며 강도는 별개입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"도구의 생김새·촉감에만 관심. 타격은 하지 않음\",\"타격감은 관심 있지만 통증이 생기는 범위는 제외\",\"타격에 따른 통증도 관심 범위에 포함\",\"강한 타격 자극을 선호할 수 있음. 재질·사용 방식에 따라 달라지므로 플로거라는 이유만으로 약하거나 안전하다고 보지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:paddling\",\"category\":\"activities\",\"name\":\"넓고 납작한 도구를 사용하는 타격 활동 — 패들링\",\"desc\":\"손잡이와 넓고 납작한 면을 가진 패들(paddle)로 몸을 때리는 활동입니다. 패들은 도구 이름, 패들링은 활동 이름입니다. 예: 여러 가닥 끈이 달린 플로거와 달리 넓은 면이 있는 도구를 뜻합니다.\",\"family\":\"impact\",\"aliases\":\"패들링\",\"plain\":\"넓고 납작한 도구를 사용하는 타격 활동\",\"english\":\"Paddling\",\"example\":\"여러 가닥 끈이 달린 플로거와 달리 넓은 면이 있는 도구를 뜻합니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"패들의 모양·상징만 관심. 타격 제외\",\"타격감에 관심이 있지만 통증이 생기면 제외\",\"통증을 포함한 타격 경험도 허용 범위로 검토\",\"강한 자극을 선호할 수 있음. 패들이라는 이름만으로 특정 단계를 정하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:whipping\",\"category\":\"activities\",\"name\":\"채찍을 사용하는 타격 활동 — 휘핑\",\"desc\":\"채찍으로 타격 자극을 주는 활동을 넓게 부르는 말입니다. 여러 가닥 도구를 포함해 쓰기도 하므로 실제 도구를 확인해야 합니다. 예: 작품에 채찍질이라고만 나오면 도구 종류와 자극 강도는 아직 알 수 없습니다.\",\"family\":\"impact\",\"aliases\":\"휘핑\",\"plain\":\"채찍을 사용하는 타격 활동\",\"english\":\"Whipping\",\"example\":\"작품에 채찍질이라고만 나오면 도구 종류와 자극 강도는 아직 알 수 없습니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"채찍의 이미지·소리 등 연출만 관심. 타격 제외\",\"타격감은 관심 있으나 통증은 제외\",\"통증을 포함한 자극도 관심 범위에 넣음\",\"강한 자극을 선호할 수 있으나 상처를 등급이나 목표로 삼지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:discipline\",\"category\":\"activities\",\"name\":\"정한 규칙을 지키고 피드백하는 관계 활동 — 훈육 · 디시플린\",\"desc\":\"서로 정한 규칙을 수행하고, 지켰는지 확인하거나 어겼을 때의 반응을 정하는 활동입니다. 훈육이라고 번역합니다. 체벌이 필수는 아닙니다. 예: 합의한 게임 규칙을 지키고 결과를 함께 확인하는 구조를 생각하면 됩니다.\",\"family\":\"discipline\",\"aliases\":\"훈육 · 디시플린\",\"plain\":\"정한 규칙을 지키고 피드백하는 관계 활동\",\"english\":\"Discipline\",\"example\":\"합의한 게임 규칙을 지키고 결과를 함께 확인하는 구조를 생각하면 됩니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"지켜도 되고 거절해도 되는 가벼운 약속\",\"장면 안에서 규칙 하나와 피드백 방식을 정함\",\"여러 규칙과 적용 예외를 정해 일관되게 유지\",\"규칙 구조를 관계의 중요한 부분으로 삼음. 거절·중단 요구는 위반으로 취급하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:rules\",\"category\":\"activities\",\"name\":\"지킬 약속 정하기 — 규칙 설정\",\"desc\":\"무엇을 언제 어떻게 할지 당사자끼리 정한 약속입니다. 예: 장면 중에 쓸 호칭 하나를 정하는 것도 규칙의 한 예입니다.\",\"family\":\"discipline\",\"aliases\":\"규칙 설정\",\"plain\":\"지킬 약속 정하기\",\"english\":\"Rules\",\"example\":\"장면 중에 쓸 호칭 하나를 정하는 것도 규칙의 한 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"부담 없이 선택하는 약속\",\"특정 상황에만 적용할 약속 하나\",\"여러 약속의 적용 상황·예외를 구분\",\"일상 일부에도 약속을 적용하되 영역마다 별도 허용을 정함\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:reward\",\"category\":\"activities\",\"name\":\"인정이나 보상을 주고받기 — 보상 중심\",\"desc\":\"원한 행동이나 노력을 알아주고, 미리 정한 칭찬·작은 보상 등을 주고받는 방식입니다. 예: 약속을 지킨 것에 대해 고맙다고 말하는 것이 개념 예시입니다.\",\"family\":\"discipline\",\"aliases\":\"보상 중심\",\"plain\":\"인정이나 보상을 주고받기\",\"english\":\"Reward\",\"example\":\"약속을 지킨 것에 대해 고맙다고 말하는 것이 개념 예시입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"잘한 점을 말로 알아줌\",\"특정 과제와 보상을 연결\",\"여러 과제별 보상을 구분\",\"정기적인 보상 구조를 중요하게 여김. 기본 권리를 보상으로 거래하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:correction\",\"category\":\"activities\",\"name\":\"약속에 대한 피드백 — 교정 중심\",\"desc\":\"합의한 규칙과 실제 행동의 차이를 짚고 다시 조정하는 방식입니다. 상대 인격을 고친다는 뜻은 아닙니다. 예: 정해 둔 약속을 서로 다르게 이해했다면 그 내용을 다시 맞추는 것입니다.\",\"family\":\"discipline\",\"aliases\":\"교정 중심\",\"plain\":\"약속에 대한 피드백\",\"english\":\"Correction\",\"example\":\"정해 둔 약속을 서로 다르게 이해했다면 그 내용을 다시 맞추는 것입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"어떻게 이해했는지 함께 확인\",\"정한 약속 하나를 짧게 되짚음\",\"여러 약속을 점검하고 예외도 조정\",\"일관된 피드백 구조를 선호. 실제 거절이나 의견 차이를 잘못으로 취급하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:service\",\"category\":\"activities\",\"name\":\"도움·시중·기여를 즐기는 활동 — 봉사 · 서비스\",\"desc\":\"상대에게 필요한 도움이나 맡은 일을 제공하는 데 의미를 두는 활동입니다. 봉사라는 말도 쓰지만 강제 노동을 뜻하지 않습니다. 예: 차를 준비하거나 필요한 물건을 챙겨주는 일도 당사자가 그 역할을 원한다면 예가 됩니다.\",\"family\":\"service\",\"aliases\":\"봉사 · 서비스\",\"plain\":\"도움·시중·기여를 즐기는 활동\",\"english\":\"Service\",\"example\":\"차를 준비하거나 필요한 물건을 챙겨주는 일도 당사자가 그 역할을 원한다면 예가 됩니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가끔 작은 도움\",\"정한 도움 한 가지를 맡음\",\"몇 가지 도움을 정기적으로 맡음\",\"기여하는 역할이 관계의 중심. 감당할 일·쉬는 시간·거절 범위를 함께 정함\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:protocol\",\"category\":\"activities\",\"name\":\"관계 안의 호칭·예절·절차 — 프로토콜 · 예절\",\"desc\":\"서로 어떤 호칭을 쓰고 어떻게 인사하거나 요청할지 정한 격식입니다. 예: 특정 장면에서만 정한 호칭을 쓰기로 약속하는 것입니다.\",\"family\":\"protocol\",\"aliases\":\"프로토콜 · 예절\",\"plain\":\"관계 안의 호칭·예절·절차\",\"english\":\"Protocol\",\"example\":\"특정 장면에서만 정한 호칭을 쓰기로 약속하는 것입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"호칭이나 인사 한 가지\",\"특정 장면의 호칭과 요청 절차\",\"장면 시작·진행·종료의 여러 절차\",\"격식이 관계에서 큰 비중을 차지함. 공개 장소·일상 적용은 별도\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:ritual\",\"category\":\"activities\",\"name\":\"의미를 담아 반복하는 절차 — 리추얼 · 의식\",\"desc\":\"당사자에게 상징적 의미가 있는 행동이나 순서를 반복하는 것입니다. 리추얼이라고도 씁니다. 예: 장면을 시작하기 전에 서로 준비됐는지 확인하는 일정한 인사가 예입니다.\",\"family\":\"protocol\",\"aliases\":\"리추얼 · 의식\",\"plain\":\"의미를 담아 반복하는 절차\",\"english\":\"Ritual\",\"example\":\"장면을 시작하기 전에 서로 준비됐는지 확인하는 일정한 인사가 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"작은 시작·종료 신호\",\"정해 둔 순서 한 가지\",\"시작과 종료에 여러 순서를 유지\",\"반복 절차 자체를 중요한 관계 경험으로 여김. 의무 강도와는 별개\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:commands\",\"category\":\"activities\",\"name\":\"맡긴 범위의 지시 주고받기 — 지시 수행\",\"desc\":\"한 사람이 구체적인 요청·지시를 하고 다른 사람이 합의한 범위에서 수행하는 활동입니다. 예: 대신 골라 달라고 부탁한 선택을 상대가 정해 주는 상황을 생각하면 됩니다.\",\"family\":\"discipline\",\"aliases\":\"지시 수행\",\"plain\":\"맡긴 범위의 지시 주고받기\",\"english\":\"Commands\",\"example\":\"대신 골라 달라고 부탁한 선택을 상대가 정해 주는 상황을 생각하면 됩니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"선택 가능한 제안\",\"맡긴 선택 하나에 대한 지시\",\"정한 장면에서 여러 선택을 맡김\",\"맡기는 선택 범위가 넓음. 일상 전권이나 거절 불가를 뜻하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:primal\",\"category\":\"activities\",\"name\":\"정해진 예절보다 즉흥적 반응을 중시하는 역할 활동 — 프라이멀 플레이\",\"desc\":\"격식 있는 호칭·절차보다 추격·경쟁·몸짓 같은 즉흥적 상호작용을 중시하는 활동입니다. 본능형이라고 설명하기도 합니다. 예: 추격하는 역할과 피하는 역할을 정한 허구 놀이가 한 예입니다.\",\"family\":\"primal\",\"aliases\":\"프라이멀 플레이\",\"plain\":\"정해진 예절보다 즉흥적 반응을 중시하는 역할 활동\",\"english\":\"Primal play\",\"example\":\"추격하는 역할과 피하는 역할을 정한 허구 놀이가 한 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"말로 도전하는 분위기\",\"미리 정한 짧은 역할 구도\",\"경쟁 구도와 즉흥적 반응이 장면의 중심\",\"역할에 깊게 몰입. 실제 거절·중단 요구는 놀이로 재해석하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:chase\",\"category\":\"activities\",\"name\":\"쫓고 피하는 역할극 — 추격·회피 역할극\",\"desc\":\"쫓는 쪽과 피하는 쪽의 역할을 합의한 활동입니다. 실제로 도망가고 싶다는 표현과 구별해야 합니다. 예: 술래·추격자와 도망가는 등장인물처럼 역할을 정하는 개념입니다.\",\"family\":\"primal\",\"aliases\":\"추격·회피 역할극\",\"plain\":\"쫓고 피하는 역할극\",\"english\":\"Chase play\",\"example\":\"술래·추격자와 도망가는 등장인물처럼 역할을 정하는 개념입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"추격을 소재로 말장난\",\"정한 시작·끝이 있는 짧은 역할\",\"추격·회피 구도를 장면의 중심으로 유지\",\"추격 역할에 깊게 몰입하되 종료 신호·범위를 그대로 유지\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:bratPlay\",\"category\":\"activities\",\"name\":\"장난스럽게 반항하고 받아주기 — 브랫 플레이\",\"desc\":\"합의한 장난·말대꾸·도발과 상대의 응수를 즐기는 활동입니다. 실제 불편함의 표현은 포함하지 않습니다. 예: 가벼운 말장난을 주고받고 상대가 재치 있게 받아주는 모습이 예입니다.\",\"family\":\"brat\",\"aliases\":\"브랫 플레이\",\"plain\":\"장난스럽게 반항하고 받아주기\",\"english\":\"Brat play\",\"example\":\"가벼운 말장난을 주고받고 상대가 재치 있게 받아주는 모습이 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가벼운 말장난\",\"서로 받아주기로 한 특정 도발\",\"반항과 응수가 장면의 주요 흐름\",\"반응 교환에 깊게 몰입. 굴복·벌·제압으로 끝나야 하는 것은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:teasing\",\"category\":\"activities\",\"name\":\"놀리며 반응 주고받기 — 티징 · 떠보기\",\"desc\":\"상대가 허용한 범위의 놀림이나 떠보기로 반응을 교환하는 것입니다. 예: 서로 불편하지 않은 별명으로 짧게 놀리고 웃는 상황이 예입니다.\",\"family\":\"brat\",\"aliases\":\"티징 · 떠보기\",\"plain\":\"놀리며 반응 주고받기\",\"english\":\"Teasing\",\"example\":\"서로 불편하지 않은 별명으로 짧게 놀리고 웃는 상황이 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"한 번의 가벼운 농담\",\"합의한 소재의 놀림\",\"떠보기·응수가 이어지는 장면\",\"놀림이 상호작용의 중심. 실제 약점·거절을 압박하는 말은 별도\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:degradation\",\"category\":\"activities\",\"name\":\"합의한 낮춤·비하 표현 — 디그레이데이션\",\"desc\":\"미리 허용한 낮춤 표현을 역할 안에서 주고받는 활동입니다. 디그라고 줄여 부르기도 합니다. 실제 인격 평가와 구분합니다. 예: 특정 호칭은 허용하되 외모·가족을 건드리는 말은 제외하는 식으로 허용 단어를 구체적으로 구분합니다.\",\"family\":\"language\",\"aliases\":\"디그레이데이션\",\"plain\":\"합의한 낮춤·비하 표현\",\"english\":\"Degradation\",\"example\":\"특정 호칭은 허용하되 외모·가족을 건드리는 말은 제외하는 식으로 허용 단어를 구체적으로 구분합니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"낮춤 표현 없이 분위기만 관심\",\"허용한 호칭 한 가지로 제한\",\"몇 가지 허용 표현과 적용 상황을 구분\",\"낮춤 역할이 장면의 중심. 실제 가치·인격을 부정할 허가가 생기지는 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:humiliation\",\"category\":\"activities\",\"name\":\"부끄러움을 느끼는 상황의 역할극 — 휴밀리에이션\",\"desc\":\"합의한 상황에서 부끄럽거나 민망한 감정을 경험하는 활동입니다. 말로 비하하지 않아도 성립합니다. 예: 칭찬을 크게 받는 것을 쑥스러워하는 상황과 모욕을 당하는 상황은 다릅니다. 무엇이 부끄러운지부터 확인합니다.\",\"family\":\"language\",\"aliases\":\"휴밀리에이션\",\"plain\":\"부끄러움을 느끼는 상황의 역할극\",\"english\":\"Humiliation\",\"example\":\"칭찬을 크게 받는 것을 쑥스러워하는 상황과 모욕을 당하는 상황은 다릅니다. 무엇이 부끄러운지부터 확인합니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"쑥스러운 분위기만 관심\",\"정한 상대 앞의 특정 상황 하나\",\"몇 가지 상황과 공개 범위를 따로 정함\",\"부끄러움이 경험의 중심. 허락하지 않은 관객·공개는 포함하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:praise\",\"category\":\"activities\",\"name\":\"칭찬과 인정 주고받기 — 프레이즈 · 칭찬\",\"desc\":\"말이나 태도로 상대의 노력·선택을 알아주고 인정하는 활동입니다. 프레이즈라고 음역합니다. 예: 막연한 칭찬보다 약속을 지켜 줘서 고맙다고 구체적으로 말하는 예입니다.\",\"family\":\"sensory\",\"aliases\":\"프레이즈 · 칭찬\",\"plain\":\"칭찬과 인정 주고받기\",\"english\":\"Praise\",\"example\":\"막연한 칭찬보다 약속을 지켜 줘서 고맙다고 구체적으로 말하는 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가끔 칭찬 한마디\",\"특정 행동을 구체적으로 칭찬\",\"반복적인 칭찬·확인이 관계에서 중요\",\"칭찬받거나 해 주는 경험이 핵심. 칭찬 없이는 판단할 수 없게 만드는 뜻은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:sensory\",\"category\":\"activities\",\"name\":\"촉감·소리 등 감각에 집중하기 — 센세이션 · 감각\",\"desc\":\"촉감·소리·온도처럼 감각의 차이를 경험하는 활동의 큰 묶음입니다. 센세이션 플레이라고도 합니다. 예: 부드러운 천과 매끈한 천의 촉감 차이에 집중하는 것이 개념 예시입니다.\",\"family\":\"sensory\",\"aliases\":\"센세이션 · 감각\",\"plain\":\"촉감·소리 등 감각에 집중하기\",\"english\":\"Sensation play\",\"example\":\"부드러운 천과 매끈한 천의 촉감 차이에 집중하는 것이 개념 예시입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"익숙한 감각 하나에 집중\",\"서로 구분되는 감각 한 쌍을 비교\",\"여러 감각의 조합과 제외할 감각을 정함\",\"감각에 집중하는 경험이 장면의 중심. 강한 통증·극단 온도를 뜻하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:blindfold\",\"category\":\"activities\",\"name\":\"눈가리개 등으로 시야를 줄이는 활동 — 시야 제한\",\"desc\":\"보이는 정보를 줄여 다른 감각이나 상대의 안내에 집중하는 활동입니다. 예: 아무것도 보이지 않는 상태와 일부만 가려지는 상태는 서로 다르게 느껴질 수 있습니다.\",\"family\":\"sensory\",\"aliases\":\"시야 제한\",\"plain\":\"눈가리개 등으로 시야를 줄이는 활동\",\"english\":\"Blindfold\",\"example\":\"아무것도 보이지 않는 상태와 일부만 가려지는 상태는 서로 다르게 느껴질 수 있습니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가리는 이미지·분위기만 관심\",\"시야의 일부를 제한하는 설정\",\"정한 장면에서 시야를 가리는 경험\",\"보이지 않는 경험을 장면의 중심에 둠. 청각·발화·다른 감각까지 자동 제한하지 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:anticipation\",\"category\":\"activities\",\"name\":\"기다림·예상을 이용하는 연출 — 기대·긴장 연출\",\"desc\":\"다음 일을 기다리거나 예상하는 마음에 집중하는 방식입니다. 예: 선물을 열기 전 무엇일지 기다리는 느낌처럼 결과보다 기다림이 중심인 경우입니다.\",\"family\":\"sensory\",\"aliases\":\"기대·긴장 연출\",\"plain\":\"기다림·예상을 이용하는 연출\",\"english\":\"Anticipation\",\"example\":\"선물을 열기 전 무엇일지 기다리는 느낌처럼 결과보다 기다림이 중심인 경우입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"다음 일을 짧게 예고\",\"정한 상황에서 기다리는 순서 하나\",\"예고·기다림·확인 순서가 장면에 반복\",\"기대감 자체가 중심. 끝을 알 수 없는 방치·불안 유발과는 구분\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:petPlay\",\"category\":\"activities\",\"name\":\"반려동물 역할을 빌린 성인 역할극 — 펫 플레이\",\"desc\":\"성인끼리 강아지·고양이 같은 허구 역할을 빌려 애칭·몸짓·돌봄을 주고받는 활동입니다. 실제 동물과는 무관합니다. 예: 펫 애칭만 쓰는 사람도 있고, 별도 역할 장면을 원하는 사람도 있습니다.\",\"family\":\"roleplay\",\"aliases\":\"펫 플레이\",\"plain\":\"반려동물 역할을 빌린 성인 역할극\",\"english\":\"Pet play\",\"example\":\"펫 애칭만 쓰는 사람도 있고, 별도 역할 장면을 원하는 사람도 있습니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"펫 애칭만 사용\",\"정한 장면에 몸짓·돌봄 일부 포함\",\"시작·종료를 정한 역할 장면\",\"역할 몰입이 중심. 성인으로서의 의사 표현·중단권은 유지\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:carePlay\",\"category\":\"activities\",\"name\":\"돌보고 돌봄받는 역할극 — 돌봄 역할극\",\"desc\":\"성인으로서 돌봄을 제공하거나 받는 역할을 경험하는 것입니다. 예: 피곤할 때 쉬는 공간을 챙겨 주되 무엇이 필요한지는 본인에게 묻는 모습입니다.\",\"family\":\"service\",\"aliases\":\"돌봄 역할극\",\"plain\":\"돌보고 돌봄받는 역할극\",\"english\":\"Care play\",\"example\":\"피곤할 때 쉬는 공간을 챙겨 주되 무엇이 필요한지는 본인에게 묻는 모습입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가벼운 안부·배려\",\"특정 도움 하나를 맡김\",\"정한 시간에 여러 도움을 주고받음\",\"돌봄 역할이 관계의 중심. 상대의 판단력·독립성을 없애는 것은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:worship\",\"category\":\"activities\",\"name\":\"존중·찬미를 강조하는 표현 — 워십 · 숭배적 표현\",\"desc\":\"상대를 특별히 존중하거나 찬미하는 태도를 강조하는 표현입니다. 워십이라고도 합니다. 실제 종교 행위와 같다는 뜻은 아닙니다. 예: 상대의 장점을 말로 찬미하거나 정중한 인사에 의미를 두는 경우입니다.\",\"family\":\"aesthetic\",\"aliases\":\"워십 · 숭배적 표현\",\"plain\":\"존중·찬미를 강조하는 표현\",\"english\":\"Worship\",\"example\":\"상대의 장점을 말로 찬미하거나 정중한 인사에 의미를 두는 경우입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"존중 표현 한마디\",\"정한 인사·찬미 표현\",\"여러 표현을 정한 장면에 유지\",\"찬미하는 태도가 중심. 실제 권리나 결정권을 넘긴다는 뜻은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:objectRole\",\"category\":\"activities\",\"name\":\"사물의 역할을 빌리는 성인 역할극 — 오브젝트 역할극\",\"desc\":\"성인 당사자가 허구적으로 사물의 역할을 맡는 설정입니다. 실제 인격이나 의사를 없애는 것이 아닙니다. 예: 조각상 역할처럼 정한 순간 동안 말없이 한 자세를 표현하는 허구 설정이 개념 예입니다.\",\"family\":\"roleplay\",\"aliases\":\"오브젝트 역할극\",\"plain\":\"사물의 역할을 빌리는 성인 역할극\",\"english\":\"Objectification roleplay\",\"example\":\"조각상 역할처럼 정한 순간 동안 말없이 한 자세를 표현하는 허구 설정이 개념 예입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"역할 이름·이미지만 관심\",\"정한 짧은 상황 하나의 역할\",\"시작·종료·표현 범위를 정한 역할 장면\",\"허구 역할 몰입이 중심. 의사 표현·중단권을 없애는 설정은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:roleplay\",\"category\":\"activities\",\"name\":\"허구의 인물·상황을 맡는 놀이 — 역할극\",\"desc\":\"현실의 직업·권한과 별도로 허구 인물이나 관계를 정해 연기하는 활동입니다. 예: 집사와 손님처럼 역할을 정하더라도 실제 고용 관계가 생기지는 않습니다.\",\"family\":\"roleplay\",\"aliases\":\"역할극\",\"plain\":\"허구의 인물·상황을 맡는 놀이\",\"english\":\"Roleplay\",\"example\":\"집사와 손님처럼 역할을 정하더라도 실제 고용 관계가 생기지는 않습니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"호칭·대사만 역할에 맞춤\",\"상황 한 가지를 정해 짧게 연기\",\"배경·관계·시작과 종료가 있는 장면\",\"역할에 깊게 몰입. 장면 밖 권한·실제 동의는 별도\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:aesthetic\",\"category\":\"activities\",\"name\":\"복장·소품·분위기 연출 — 미적 연출\",\"desc\":\"어떤 모습으로 보이는지, 어떤 분위기를 만드는지에 의미를 두는 활동입니다. 예: 같은 대화라도 정장·조명·소품을 통해 격식 있는 분위기를 만드는 경우입니다.\",\"family\":\"aesthetic\",\"aliases\":\"미적 연출\",\"plain\":\"복장·소품·분위기 연출\",\"english\":\"Aesthetic play\",\"example\":\"같은 대화라도 정장·조명·소품을 통해 격식 있는 분위기를 만드는 경우입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"소품 한 가지\",\"복장과 소품을 함께 선택\",\"장소·복장·소품에 일관된 주제를 둠\",\"시각적 연출이 장면의 중심. 행동 강도·권한 위임과는 별개\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:collar\",\"category\":\"activities\",\"name\":\"목걸이 등으로 관계의 약속을 표현하기 — 칼라링 · 관계 상징\",\"desc\":\"목에 두르는 칼라(collar) 등을 관계의 상징으로 삼거나 이를 주고받는 의식을 말합니다. 목줄을 뜻하는 리시(leash)와는 다른 말입니다. 예: 커플 반지처럼 상징에 의미를 두되, 무엇을 약속하는지는 당사자가 정하는 경우입니다.\",\"family\":\"aesthetic\",\"aliases\":\"칼라링 · 관계 상징\",\"plain\":\"목걸이 등으로 관계의 약속을 표현하기\",\"english\":\"Collaring\",\"example\":\"커플 반지처럼 상징에 의미를 두되, 무엇을 약속하는지는 당사자가 정하는 경우입니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"장신구 디자인만 선호\",\"특정 장면의 상징으로 사용\",\"관계의 약속을 담아 주고받음\",\"정식 의식·지속적 의미를 중요하게 여김. 실제 소유권·상시 통제권이 생기지는 않음\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"activities:contracts\",\"category\":\"activities\",\"name\":\"관계의 약속을 글로 정리하기 — 관계 약속·계약 연출\",\"desc\":\"원하는 관계·범위·금지·변경 방법을 문서로 정리하는 것입니다. 역할극 안에서 계약처럼 연출하기도 합니다. 예: 동의한 범위와 언제든 바꿀 수 있는 내용을 함께 적는 약속표를 생각하면 됩니다.\",\"family\":\"aesthetic\",\"aliases\":\"관계 약속·계약 연출\",\"plain\":\"관계의 약속을 글로 정리하기\",\"english\":\"Relationship agreement\",\"example\":\"동의한 범위와 언제든 바꿀 수 있는 내용을 함께 적는 약속표를 생각하면 됩니다.\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"짧은 약속 메모\",\"한 장면의 범위·종료 조건 기록\",\"관계의 여러 영역과 예외를 구분해 기록\",\"장기적인 약속 문서를 주기적으로 확인·변경. 철회할 수 없는 동의서라는 뜻은 아님\"],\"axis\":\"0은 하지 않음. 1~4는 아래 문장으로 정의한 관심·허용 범위의 비교 예입니다. 도구별 세기·횟수·위험 등급이 아닙니다.\"},{\"id\":\"materials:rope\",\"category\":\"materials\",\"name\":\"로프 소재\",\"desc\":\"로프의 시각·촉감·상징 선호 예: 줄의 무늬는 좋아하지만 움직임 제한은 원하지 않을 수 있습니다.\",\"family\":null,\"example\":\"줄의 무늬는 좋아하지만 움직임 제한은 원하지 않을 수 있습니다.\"},{\"id\":\"materials:leather\",\"category\":\"materials\",\"name\":\"레더 · 가죽\",\"desc\":\"가죽 소재·복장·분위기 선호 예: 가죽 재킷의 질감이나 외관을 선호할 수 있습니다.\",\"family\":null,\"example\":\"가죽 재킷의 질감이나 외관을 선호할 수 있습니다.\"},{\"id\":\"materials:latex\",\"category\":\"materials\",\"name\":\"라텍스\",\"desc\":\"라텍스 소재·복장 선호 예: 표면이 매끈하고 몸에 붙는 고무계 의상의 외관에 관심이 있을 수 있습니다.\",\"family\":null,\"example\":\"표면이 매끈하고 몸에 붙는 고무계 의상의 외관에 관심이 있을 수 있습니다.\"},{\"id\":\"materials:rubber\",\"category\":\"materials\",\"name\":\"러버\",\"desc\":\"고무 소재·복장 선호 예: 고무 소재의 냄새·질감·외관 중 무엇을 좋아하는지 다를 수 있습니다.\",\"family\":null,\"example\":\"고무 소재의 냄새·질감·외관 중 무엇을 좋아하는지 다를 수 있습니다.\"},{\"id\":\"materials:metal\",\"category\":\"materials\",\"name\":\"금속 소재\",\"desc\":\"금속 소재의 미적·감각적 선호 예: 금속의 반짝임이 좋아도 금속 구속 도구는 싫을 수 있습니다.\",\"family\":null,\"example\":\"금속의 반짝임이 좋아도 금속 구속 도구는 싫을 수 있습니다.\"},{\"id\":\"materials:fabric\",\"category\":\"materials\",\"name\":\"패브릭 · 천\",\"desc\":\"천 소재의 시각·감각 선호 예: 면·새틴처럼 천마다 다른 촉감을 선호할 수 있습니다.\",\"family\":null,\"example\":\"면·새틴처럼 천마다 다른 촉감을 선호할 수 있습니다.\"},{\"id\":\"materials:uniform\",\"category\":\"materials\",\"name\":\"유니폼\",\"desc\":\"성인 역할의 복장·상징 선호 예: 허구의 제복 차림을 좋아해도 실제 직업 권한을 맡기는 것은 아닙니다.\",\"family\":null,\"example\":\"허구의 제복 차림을 좋아해도 실제 직업 권한을 맡기는 것은 아닙니다.\"},{\"id\":\"materials:formal\",\"category\":\"materials\",\"name\":\"정장·격식\",\"desc\":\"격식 있는 복장·태도 선호 예: 정장·격식 있는 인사 같은 분위기를 좋아할 수 있습니다.\",\"family\":null,\"example\":\"정장·격식 있는 인사 같은 분위기를 좋아할 수 있습니다.\"},{\"id\":\"materials:gloves\",\"category\":\"materials\",\"name\":\"장갑\",\"desc\":\"장갑의 시각·상징 선호 예: 장갑을 낀 외관만 좋아할 수도 있습니다.\",\"family\":null,\"example\":\"장갑을 낀 외관만 좋아할 수도 있습니다.\"},{\"id\":\"materials:collar\",\"category\":\"materials\",\"name\":\"칼라·목걸이 상징\",\"desc\":\"관계 상징 선호; 실제 통제권 아님 예: 목에 두르는 장신구를 관계의 상징으로 삼을 수 있습니다.\",\"family\":null,\"example\":\"목에 두르는 장신구를 관계의 상징으로 삼을 수 있습니다.\"},{\"id\":\"materials:voice\",\"category\":\"materials\",\"name\":\"목소리·말투\",\"desc\":\"음성·어조·말의 리듬 선호 예: 차분한 어조는 좋아해도 명령조는 싫을 수 있습니다.\",\"family\":null,\"example\":\"차분한 어조는 좋아해도 명령조는 싫을 수 있습니다.\"},{\"id\":\"materials:ritualObjects\",\"category\":\"materials\",\"name\":\"의식용 상징물\",\"desc\":\"관계의 상징·절차를 표현하는 소품 선호 예: 특별한 반지나 편지를 약속의 상징으로 삼을 수 있습니다.\",\"family\":null,\"example\":\"특별한 반지나 편지를 약속의 상징으로 삼을 수 있습니다.\"},{\"id\":\"style:soft\",\"category\":\"style\",\"name\":\"소프트\",\"desc\":\"배려·유연한 주도와 반응; 신체 자극 수준과 별개 예: 말투는 부드러워도 신체 자극 선호는 별개이므로 함께 확인해야 합니다.\",\"family\":null,\"example\":\"말투는 부드러워도 신체 자극 선호는 별개이므로 함께 확인해야 합니다.\"},{\"id\":\"style:gentle\",\"category\":\"style\",\"name\":\"온화형\",\"desc\":\"온화한 말투·차분함·기다림 예: 상대가 생각할 시간을 기다리고 차분하게 말하는 태도입니다.\",\"family\":null,\"example\":\"상대가 생각할 시간을 기다리고 차분하게 말하는 태도입니다.\"},{\"id\":\"style:playful\",\"category\":\"style\",\"name\":\"장난형\",\"desc\":\"티키타카·재치·여유로운 반응 예: 말장난을 주고받되 상대가 싫어하면 멈추는 태도입니다.\",\"family\":null,\"example\":\"말장난을 주고받되 상대가 싫어하면 멈추는 태도입니다.\"},{\"id\":\"style:strict\",\"category\":\"style\",\"name\":\"엄격형\",\"desc\":\"명확한 기준·단호함; 강압과 구별 예: 약속을 일관되게 확인하되 변경·중단 요구는 받아들이는 태도입니다.\",\"family\":null,\"example\":\"약속을 일관되게 확인하되 변경·중단 요구는 받아들이는 태도입니다.\"},{\"id\":\"style:structured\",\"category\":\"style\",\"name\":\"구조형\",\"desc\":\"순서·약속·예측 가능한 진행 예: 시작·중간·끝의 순서를 미리 아는 것을 선호할 수 있습니다.\",\"family\":null,\"example\":\"시작·중간·끝의 순서를 미리 아는 것을 선호할 수 있습니다.\"},{\"id\":\"style:supportive\",\"category\":\"style\",\"name\":\"지지형\",\"desc\":\"격려·안심·상태 확인 예: 잘한 점을 말해 주고 필요한 도움을 묻는 태도입니다.\",\"family\":null,\"example\":\"잘한 점을 말해 주고 필요한 도움을 묻는 태도입니다.\"},{\"id\":\"style:reserved\",\"category\":\"style\",\"name\":\"절제형\",\"desc\":\"필요할 때만 표현; 명령·확인 반복 억제 예: 관심 표현이 있어도 모든 대화를 명령으로 바꾸지는 않습니다.\",\"family\":null,\"example\":\"관심 표현이 있어도 모든 대화를 명령으로 바꾸지는 않습니다.\"},{\"id\":\"style:assertive\",\"category\":\"style\",\"name\":\"자기주장형\",\"desc\":\"자기 의견·조건·거절을 분명하게 표현 예: 원하는 것과 싫은 것을 짧고 분명하게 말하는 태도입니다.\",\"family\":null,\"example\":\"원하는 것과 싫은 것을 짧고 분명하게 말하는 태도입니다.\"},{\"id\":\"style:responsive\",\"category\":\"style\",\"name\":\"반응형\",\"desc\":\"상대가 표현한 반응에 맞춰 조절; 속마음 추정 금지 예: 상대가 직접 말한 반응을 듣고 방식을 바꾸는 태도입니다.\",\"family\":null,\"example\":\"상대가 직접 말한 반응을 듣고 방식을 바꾸는 태도입니다.\"},{\"id\":\"style:provocative\",\"category\":\"style\",\"name\":\"도발형\",\"desc\":\"합의된 범위의 떠보기·도전; 거절 압박 금지 예: 합의한 게임에서 도전적인 말을 하되 실제 약점을 공격하지 않습니다.\",\"family\":null,\"example\":\"합의한 게임에서 도전적인 말을 하되 실제 약점을 공격하지 않습니다.\"},{\"id\":\"focus:trust\",\"category\":\"focus\",\"name\":\"신뢰 중심\",\"desc\":\"예측 가능성·약속 이행·자발적 맡김 예: 상대가 약속을 지킨 경험이 쌓이면 특정 선택을 맡길 수 있습니다.\",\"family\":null,\"example\":\"상대가 약속을 지킨 경험이 쌓이면 특정 선택을 맡길 수 있습니다.\"},{\"id\":\"focus:recognition\",\"category\":\"focus\",\"name\":\"인정 중심\",\"desc\":\"노력·선택을 알아주고 인정받음 예: 결과만 칭찬받기보다 들인 노력을 알아주기를 원할 수 있습니다.\",\"family\":null,\"example\":\"결과만 칭찬받기보다 들인 노력을 알아주기를 원할 수 있습니다.\"},{\"id\":\"focus:banter\",\"category\":\"focus\",\"name\":\"반응 교환\",\"desc\":\"놀림·반격·상호작용 자체를 즐김 예: 말장난에 답하고 다시 되받는 흐름 자체가 즐거울 수 있습니다.\",\"family\":null,\"example\":\"말장난에 답하고 다시 되받는 흐름 자체가 즐거울 수 있습니다.\"},{\"id\":\"focus:authority\",\"category\":\"focus\",\"name\":\"권위 중심\",\"desc\":\"합의한 역할 차이·명확한 안내 예: 정한 시간에 누가 안내하는지 분명한 것을 선호할 수 있습니다.\",\"family\":null,\"example\":\"정한 시간에 누가 안내하는지 분명한 것을 선호할 수 있습니다.\"},{\"id\":\"focus:order\",\"category\":\"focus\",\"name\":\"질서 중심\",\"desc\":\"명시된 규칙·구조에서 안정감 예: 일정한 순서가 있으면 편안하게 느낄 수 있습니다.\",\"family\":null,\"example\":\"일정한 순서가 있으면 편안하게 느낄 수 있습니다.\"},{\"id\":\"focus:carefocus\",\"category\":\"focus\",\"name\":\"돌봄 중심\",\"desc\":\"필요를 살피고 도움을 주고받음 예: 상대의 휴식이나 필요한 도움을 챙기는 관계에 의미를 둘 수 있습니다.\",\"family\":null,\"example\":\"상대의 휴식이나 필요한 도움을 챙기는 관계에 의미를 둘 수 있습니다.\"},{\"id\":\"focus:belonging\",\"category\":\"focus\",\"name\":\"소속감 중심\",\"desc\":\"합의된 유대감; 외부 교류 차단 아님 예: 함께 쓰는 상징은 좋아해도 외부 친구 관계를 제한받기는 싫을 수 있습니다.\",\"family\":null,\"example\":\"함께 쓰는 상징은 좋아해도 외부 친구 관계를 제한받기는 싫을 수 있습니다.\"},{\"id\":\"focus:competition\",\"category\":\"focus\",\"name\":\"경쟁 중심\",\"desc\":\"실력·말싸움·도전; 패배=복종 아님 예: 게임이나 내기에서 겨루는 것을 좋아해도 벌을 원하지는 않을 수 있습니다.\",\"family\":null,\"example\":\"게임이나 내기에서 겨루는 것을 좋아해도 벌을 원하지는 않을 수 있습니다.\"},{\"id\":\"structure:ds\",\"category\":\"structure\",\"name\":\"지배·복종 관계\",\"desc\":\"합의한 권한을 주고받는 관계 예: 합의한 장면의 진행 선택을 한쪽이 맡는 경우가 예입니다.\",\"family\":null,\"example\":\"합의한 장면의 진행 선택을 한쪽이 맡는 경우가 예입니다.\"},{\"id\":\"structure:ms\",\"category\":\"structure\",\"name\":\"마스터·슬레이브 관계\",\"desc\":\"넓은 권한 맡김을 표현하는 관계명; 구체적 범위·철회권 유지 예: 생활 일부의 약속까지 정할 수 있으나 제외 영역과 변경권을 함께 둡니다.\",\"family\":null,\"example\":\"생활 일부의 약속까지 정할 수 있으나 제외 영역과 변경권을 함께 둡니다.\"},{\"id\":\"structure:activity\",\"category\":\"structure\",\"name\":\"활동 중심\",\"desc\":\"관계 위계 없이 특정 활동의 진행·받기에 집중 예: 같은 활동을 함께하되 관계 안의 위계는 정하지 않을 수 있습니다.\",\"family\":null,\"example\":\"같은 활동을 함께하되 관계 안의 위계는 정하지 않을 수 있습니다.\"},{\"id\":\"structure:sceneOnly\",\"category\":\"structure\",\"name\":\"장면 한정\",\"desc\":\"정한 장면에서만 역할 활성; 일상은 별개 예: 장면이 끝나면 정한 호칭이나 지시 권한도 끝나는 구조입니다.\",\"family\":null,\"example\":\"장면이 끝나면 정한 호칭이나 지시 권한도 끝나는 구조입니다.\"},{\"id\":\"structure:ongoing\",\"category\":\"structure\",\"name\":\"지속 관계\",\"desc\":\"합의한 역할을 장기적으로 유지; 항상 플레이하는 뜻 아님 예: 오랫동안 같은 관계 이름을 쓰더라도 하루 종일 활동하는 것은 아닙니다.\",\"family\":null,\"example\":\"오랫동안 같은 관계 이름을 쓰더라도 하루 종일 활동하는 것은 아닙니다.\"},{\"id\":\"structure:dailyAgreed\",\"category\":\"structure\",\"name\":\"일상 일부 적용\",\"desc\":\"구체적으로 정한 일상 영역만 역할 적용 예: 식사 선택은 맡겨도 직장·재정 결정은 맡기지 않을 수 있습니다.\",\"family\":null,\"example\":\"식사 선택은 맡겨도 직장·재정 결정은 맡기지 않을 수 있습니다.\"},{\"id\":\"structure:switching\",\"category\":\"structure\",\"name\":\"역할 전환형\",\"desc\":\"상대·상황별 합의로 역할 변경 예: 누가 안내할지는 상황마다 함께 정할 수 있습니다.\",\"family\":null,\"example\":\"누가 안내할지는 상황마다 함께 정할 수 있습니다.\"},{\"id\":\"structure:onePartner\",\"category\":\"structure\",\"name\":\"특정 상대 한정\",\"desc\":\"정한 상대에게만 성향 표현; 타인에게 일반화 금지 예: A에게 맡기는 선택도 B에게는 맡기지 않을 수 있습니다.\",\"family\":null,\"example\":\"A에게 맡기는 선택도 B에게는 맡기지 않을 수 있습니다.\"}],\"pairs\":[[\"도미넌트 ↔ 서브미시브\",\"합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\",\"결정권의 방향\",\"돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\"],[\"탑 ↔ 바텀\",\"특정 활동을 진행하는 쪽 ↔ 받는 쪽\",\"활동의 방향\",\"탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\"],[\"마스터·미스트리스 ↔ 슬레이브\",\"합의한 관계에서 넓은 권한 위임을 표현하는 명칭\",\"관계의 범위·형식\",\"돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\"],[\"새디스트 ↔ 마조히스트\",\"합의한 자극을 주는 취향 ↔ 받는 취향\",\"자극의 방향·선호\",\"새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\"],[\"스위치·사도마조히스트\",\"역할을 전환하거나 가학·피학 양쪽 취향을 갖는 경우\",\"전환의 대상·상황\",\"스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\"],[\"브랫 ↔ 브랫 테이머\",\"합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\",\"반응 교환\",\"브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\"],[\"헌터·프레데터 ↔ 프레이\",\"추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\",\"프라이멀 역할\",\"헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\"],[\"리거 ↔ 로프버니·로프 바텀\",\"로프 구속을 구성하는 역할 ↔ 받는 역할\",\"로프 활동의 방향\",\"로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\"],[\"디그레이더 ↔ 디그레이디\",\"합의한 비하 표현을 제공 ↔ 수용\",\"언어·심리적 맥락\",\"실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\"],[\"스팽커 ↔ 스팽키\",\"스팽킹을 제공 ↔ 수용\",\"특정 활동의 방향\",\"스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\"],[\"훈육자·트레이너 ↔ 트레이니\",\"합의한 규칙·과제를 진행 ↔ 배우고 수행\",\"규칙·피드백 구조\",\"훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\"],[\"서비스 돔·서비스 서브\",\"상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\",\"서비스를 표현하는 방식\",\"서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\"],[\"오너·펫·펫 트레이너\",\"성인 간 소속·동물 역할극을 이끌거나 받음\",\"상징 역할·돌봄\",\"실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\"],[\"케어기버 ↔ 돌봄 수용 역할\",\"성인 간 돌봄 제공 ↔ 돌봄 수용\",\"안정감·돌봄\",\"돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\"],[\"센슈얼리스트·감각 지향\",\"감각·분위기·집중을 중심으로 즐김\",\"감각 경험\",\"통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\"]]}\u003c/script>\u003cscript>\n(()=>{'use strict';const q=id=>document.getElementById(id),data=JSON.parse(q('courseData').textContent),chapters=[...document.querySelectorAll('.chapter')];let index=0,present=false;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function update(){chapters.forEach((c,i)=>c.classList.toggle('current',i===index));document.querySelectorAll('.sidebar a').forEach((a,i)=>a.classList.toggle('active',i===index));q('slideCount').textContent=(index+1)+' / '+chapters.length;q('prevButton').disabled=index===0;q('nextButton').disabled=index===chapters.length-1}function go(i){index=Math.max(0,Math.min(chapters.length-1,i));update();if(present)window.scrollTo({top:0,behavior:'instant'});else chapters[index].scrollIntoView({behavior:'smooth',block:'start'})}q('modeButton').onclick=()=>{present=!present;document.body.classList.toggle('present',present);q('modeButton').textContent=present?'읽기 모드':'집중 읽기';q('modeButton').setAttribute('aria-pressed',String(present));q('liveStatus').textContent=present?'집중 읽기 · 좌우 화살표로 장 이동 · 장 안에서는 스크롤':'읽기 모드 · 전체 스크롤';go(index)};document.querySelectorAll('.sidebar a').forEach((a,i)=>a.onclick=e=>{e.preventDefault();go(i)});q('prevButton').onclick=()=>go(index-1);q('nextButton').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(!present||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});q('fullButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else q('liveStatus').textContent='브라우저의 전체 화면 기능을 사용하세요.'}catch(e){q('liveStatus').textContent='전체 화면 전환이 제한됩니다.'}};q('printButton').onclick=()=>window.print();let previous=[];window.addEventListener('beforeprint',()=>{previous=[...document.querySelectorAll('details')].map(d=>[d,d.open]);previous.forEach(([d])=>d.open=true);document.querySelectorAll('.entry').forEach(x=>{x.dataset.beforeprint=x.hidden?'1':'0';x.hidden=false})});window.addEventListener('afterprint',()=>{previous.forEach(([d,v])=>d.open=v);document.querySelectorAll('.entry').forEach(x=>{x.hidden=x.dataset.beforeprint==='1';delete x.dataset.beforeprint})});\nconst categories={role:'역할',traits:'세부 취향',activities:'활동',materials:'소재',style:'스타일',focus:'중심',structure:'관계 구조'};if(q('termGrid')){for(const term of data.catalog){const c=el('article',undefined,'entry');c.dataset.category=term.category;c.dataset.search=(term.name+' '+term.desc).toLowerCase();c.append(el('div',categories[term.category],'category'),el('h3',term.name),el('p',term.desc));q('termGrid').append(c)}const filter=()=>{const text=q('termSearch').value.trim().toLowerCase(),cat=q('termCategory').value;let n=0;document.querySelectorAll('.entry').forEach(c=>{c.hidden=!!((text&&!c.dataset.search.includes(text))||(cat!=='all'&&cat!==c.dataset.category));if(!c.hidden)n++});q('termCount').textContent=n+' / '+data.catalog.length+'개 항목'};q('termSearch').oninput=filter;q('termCategory').onchange=filter;filter()}\nif(q('activityPick')){const activities=data.catalog.filter(x=>x.category==='activities');for(const a of activities){const o=el('option',a.name);o.value=a.id;q('activityPick').append(o)}const render=()=>{const a=activities.find(x=>x.id===q('activityPick').value),f=data.families[a.family];q('activityBox').replaceChildren(el('h3',a.name),el('p',a.desc),el('p','比較基準'.replace('比較基準','비교 기준')+': '+(a.axis||f.axis),'muted'));q('activityBody').replaceChildren();(a.levels||f.levels).forEach((t,i)=>{const tr=el('tr');tr.append(el('td',String(i)),el('td',t));q('activityBody').append(tr)});q('activitySummary').replaceChildren(el('p',f.change),el('p','혼동하지 않기: '+f.not))};q('activityPick').onchange=render;render()}\nif(q('profilePick')){const profiles=[['약한 신체 자극 / 깊은 몰입',[1,4,3,2,0],'신체 강도는 낮아도 신뢰·권한 위임·몰입을 중요하게 여길 수 있다.'],['높은 자극 / 권한 위임 없음',[4,2,0,0,0],'강한 자극을 선호해도 지배·복종 관계나 일상 통제는 원하지 않을 수 있다.'],['엄격한 규칙 / 일상 적용 없음',[0,3,2,4,0],'신체 자극 없이 규칙과 몰입을 선호하고, 장면 밖 역할은 원하지 않을 수 있다.']];const render=()=>{const [name,values,text]=profiles[+q('profilePick').value];q('profileBox').replaceChildren(el('h3',name),el('p',text));['신체 자극','심리 몰입','권한 위임','규칙 엄격함','일상 적용'].forEach((name,i)=>{const c=el('div',undefined,'metric'),r=el('div',undefined,'metric-line');r.append(el('span',name),el('span',values[i]+' / 4'));const track=el('div',undefined,'track'),bar=el('span');bar.style.width=values[i]*25+'%';track.append(bar);c.append(r,track);q('profileBox').append(c)})};q('profilePick').onchange=render;render()}\n\nif('IntersectionObserver'in window){const o=new IntersectionObserver(entries=>{if(present)return;for(const x of entries)if(x.isIntersecting){index=chapters.indexOf(x.target);update()}},{rootMargin:'-10% 0px -65% 0px'});chapters.forEach(c=>o.observe(c))}update();})();\n\u003c/script>\u003cfooter class=\"love-rights love-rights-footer\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/footer>\u003cscript>\n(()=>{'use strict';const key='love-bdsm-theme';const filenames=['01_intro.html','02_beginner.html','03_intermediate.html','04_advanced.html','05_situations.html'];let theme='light';try{const saved=localStorage.getItem(key);if(saved==='dark')theme='dark'}catch(e){}const embedded=window.parent!==window;if(embedded)document.documentElement.dataset.embedded='true';function apply(t){theme=t==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-choice]').forEach(s=>s.value=theme)}apply(theme);const tools=document.querySelector('.tools');if(tools&&!embedded){const l=document.createElement('label');l.className='theme-choice';l.append(document.createTextNode('화면'));const s=document.createElement('select');s.setAttribute('aria-label','화면 모드');s.dataset.themeChoice='true';for(const [v,t]of [['light','밝은 모드'],['dark','어두운 모드']]){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}s.value=theme;s.onchange=()=>{apply(s.value);try{localStorage.setItem(key,theme)}catch(e){}if(embedded)parent.postMessage({type:'love-bdsm-theme',theme},'*')};l.append(s);tools.prepend(l)}window.addEventListener('message',e=>{if(e.source!==parent||!e.data)return;if(e.data.type==='love-bdsm-set-theme')apply(e.data.theme)});document.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(!embedded||!a)return;const href=a.getAttribute('href');let index=filenames.indexOf(href);if(href==='index.html')index=0;if(index>=0){e.preventDefault();parent.postMessage({type:'love-bdsm-navigate',index},'*')}});if(embedded)parent.postMessage({type:'love-bdsm-ready'},'*');})();\n\u003c/script>\u003cscript>(()=>{const chapters=[...document.querySelectorAll('.chapter')];let index=0;function show(i,mode){index=Math.max(0,Math.min(chapters.length-1,i));document.documentElement.dataset.readMode=mode==='scroll'?'scroll':'page';chapters.forEach((c,n)=>c.classList.toggle('reading-current',n===index));document.body.classList.remove('present');chapters[index].scrollIntoView({block:'start'});parent.postMessage({type:'reading-position',index},'*')}window.addEventListener('message',e=>{if(e.source!==parent||!e.data)return;if(e.data.type==='reading-go')show(e.data.index,e.data.mode);if(e.data.type==='reading-print'){const old=document.documentElement.dataset.readMode;document.documentElement.dataset.readMode='scroll';window.print();document.documentElement.dataset.readMode=old}});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,summary,button')||e.ctrlKey||e.metaKey||e.altKey)return;if(document.documentElement.dataset.readMode==='page'&&['ArrowRight','PageDown','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();parent.postMessage({type:'reading-step',step:['ArrowRight','PageDown'].includes(e.key)?1:-1},'*')}});show(0,'page')})();\u003c/script>\u003c/body>\u003c/html>","chapters":[{"id":"plain-language","title":"낯선 말부터 쉬운 말로","text":"기초 용어부터낯선 말부터 쉬운 말로이 자료는 국내·해외 통용도를 단정하지 않습니다. 쉬운 한국어 뜻을 먼저 쓰고, 외국어를 소리대로 쓴 말과 별칭을 함께 찾아볼 수 있게 했습니다.역할 이름은 누가 무엇을 맡는지, 활동 이름은 무엇을 하는지 말합니다. 도구 이름은 물건의 종류를 말합니다. 이 셋은 강도 단계가 아닙니다.BDSM구속·규칙, 지배·복종, 가학·피학 등 여러 취향과 관계를 묶는 말입니다. 모든 요소를 함께 좋아해야 하는 것은 아닙니다.플레이 · 씬당사자가 시작·끝과 범위를 정한 활동 또는 역할 장면입니다. 일상의 모든 관계를 뜻하지 않습니다.가학 · 피학합의한 맥락에서 고통·강한 자극을 주는 취향 / 받는 취향입니다. 모든 고통·모든 상황을 좋아한다는 뜻은 아닙니다.본디지 · 로프본디지는 움직임 제한 활동의 큰 분류, 로프는 줄을 사용하는 종류입니다.임팩트 · 스팽 · 플로깅임팩트는 때리는 활동의 큰 분류입니다. 스팽킹은 보통 손이나 도구로 엉덩이 등을 때리는 활동, 플로깅은 여러 가닥 채찍을 쓰는 종류입니다. 서로 단계 이름이 아닙니다.플로거 · 패들 · 채찍플로거는 여러 가닥 끈이 달린 도구, 패들은 넓고 납작한 면을 가진 도구입니다. 채찍은 더 넓은 표현이라 실제 종류를 확인합니다.리밋 · 하드 리밋 · 소프트 리밋리밋은 경계·제외 조건입니다. 하드 리밋은 하지 않는 것, 소프트 리밋은 아직 부담이 있거나 조건을 논의해야 하는 것입니다. 소프트 리밋은 자동 허용이 아닙니다.세이프워드 · 세이프사인중단·조절을 위해 미리 정한 말 / 몸 신호입니다. 평범한 말로 거절하거나 동의를 철회하는 권리도 유지됩니다.체크인 · 애프터케어체크인은 진행 중 상태·의사를 확인하는 것, 애프터케어는 종료 후 필요한 휴식·도움·대화 등을 뜻합니다.위임 · 상한위임은 정한 결정을 남에게 맡기는 것, 상한은 허용하기로 정한 최대 범위입니다. 좋아하는 취향과 지금 허용한 범위는 다를 수 있습니다.몰입 · 위계몰입은 역할·경험에 집중하는 정도, 위계는 누가 어떤 상황의 안내·결정을 맡는지 정한 차이입니다.프로토콜 · 리추얼프로토콜은 호칭·예절 등 약속한 격식, 리추얼은 특별한 의미를 담아 반복하는 순서나 의식입니다.디그 · 휴밀리에이션디그는 허용한 낮춤·비하 표현, 휴밀리에이션은 부끄러움을 경험하는 상황입니다. 부끄럽다고 반드시 비하당하는 것은 아닙니다.칼라 · 리시 · 커프칼라는 목에 두르는 띠·목걸이, 리시는 연결하는 줄, 커프는 손목·발목 등에 두르는 띠 모양 도구를 가리킵니다. 착용만으로 권한이 생기지 않습니다.24/7 · TPE24/7은 지속적인 관계 형식을, TPE는 넓은 영역의 권한 위임을 표현할 때 쓰는 말입니다. 시간 범위와 위임 범위는 다른 축이며, 권리 포기나 철회 불가를 뜻하지 않습니다.페티시 · 킨크페티시는 특정 소재·대상 등에 강하게 끌리는 취향을, 킨크는 비관습적 취향을 넓게 가리킬 때 쓰는 말입니다. 사용 범위는 공동체마다 다를 수 있습니다."},{"id":"reading-overview","title":"중단과 회복을 별도로 이해하기","text":"먼저 읽기중단과 회복을 별도로 이해하기몰입의 깊이, 실제 상태, 권한 범위는 구분해서 판단합니다.거절은 특정 암호에만 달려 있지 않습니다세이프워드(중단·조절을 위해 정한 말)·몸 신호와 함께 일상적인 중단 요구와 동의 철회를 존중합니다. 의미가 불분명하면 멈추고 확인합니다.체크인은 필요할 때새로운 변화뿐 아니라 불편함·반응 변화·의사소통이 어려워진 상황에도 상태를 확인합니다. 정해진 횟수만으로 충분하다고 단정하지 않습니다.애프터케어에는 고정 등급이 없습니다접촉·대화·혼자 있는 시간 등 원하는 방식은 개인마다 다릅니다. 스킨십을 원하지 않을 수도 있으며 종료 후 필요한 것을 미리 이야기합니다.몰입·드롭 용어의 한계누구나 같은 상태를 경험하는 것은 아닙니다. 용어만으로 불편함의 원인을 단정하거나 판단·동의 능력이 유지된다고 가정하지 않습니다.아래 목차에서 상세 설명과 전체 용어 사전을 이어서 확인할 수 있습니다. 0~4는 이 자료의 비교 틀이며, 공식 등급이나 필수 상승 순서가 아닙니다."},{"id":"ch0","title":"고급은 강한 활동이 아니라 복잡한 판단","text":"고급 / 01고급은 강한 활동이 아니라 복잡한 판단이 자료에서 알아볼 것: 여러 역할·감정·시간·합의가 겹칠 때 경계를 읽고 관계를 조정한다.관계의 복잡성한 사람이 여러 역할을 갖거나 상대·상황별로 다른 역할을 선택할 수 있다.판단의 복잡성취향·동의·체감·위험·관계 감정을 구분하며 모호함을 줄인다.운영의 복잡성합의 변경·갈등·종료·사생활·회복 방식을 지속적으로 조정한다.진도와 무관한 선택높은 강도·지속 관계·특정 역할을 선택하지 않아도 이해 수준과 무관하다."},{"id":"ch1","title":"넓은 권한 위임도 영역별로 나누기","text":"고급 / 02넓은 권한 위임도 영역별로 나누기마스터·슬레이브·지속 관계 같은 이름만으로 실제 권한을 정할 수 없다.확인할 영역설명해야 하는 것관계 명칭두 사람이 그 단어에 부여한 의미권한 목록맡긴 결정과 맡기지 않은 결정시간·장소언제 시작·종료하고 어디서 적용하는가예외업무·가족·개인 일정 등 역할을 적용하지 않는 맥락변경권논의·유예·철회의 방식개인 생활외부 관계·생계·의료 등 일방 통제로 확대하지 않기명칭의 강렬함보다 실제 합의 내용을 본다. 상징적 소속감과 실제 소유권은 다르다."},{"id":"ch2","title":"정신적 몰입과 실제 압박을 구분","text":"고급 / 03정신적 몰입과 실제 압박을 구분권위·인정·안도감을 선호하는 것과 거절하기 어렵게 만드는 것은 다르다.관찰 지점합의된 역할 표현다시 점검할 상황인정구체적 선택·노력을 칭찬애정을 잃을까 봐 원치 않는 참여권위맡긴 결정을 책임 있게 주도명칭을 이유로 새 권한 요구장난주고받는 도발과 반격거절을 계속 역할로 재해석복종스스로 선택한 범위에서 맡김관계 유지를 위해 한계를 숨김돌봄원하는 도움·거리 확인도움을 이유로 독립성 제한개별 행동 하나로 사람을 진단하지 않는다. 현재 의사·선택권·거절 후 반응을 구체적으로 확인한다."},{"id":"ch3","title":"엇갈린 취향을 조정하는 선택지","text":"고급 / 04엇갈린 취향을 조정하는 선택지함께 할 수 있는 영역을 찾는 것과 한쪽의 경계를 바꾸려는 것은 다르다.유지현재 양쪽이 원하는 범위를 계속 유지한다.축소활동·빈도·적용 시간을 줄이거나 일부를 제외한다.대체같은 동기를 충족하는 다른 합의된 활동을 선택한다.보류·종료불확실하면 보류하고, 겹치는 영역이 없으면 해당 관계·활동을 끝낼 수 있다.규율은 원하는데 수치심 표현은 싫다.규칙과 수치심을 한 묶음으로 취급할 필요가 없다.명확한 규칙·과제는 남기고 비하·수치심 표현은 제외할 수 있다.구속은 좋아하지만 지배 관계는 싫다.활동 수용과 권한 위임(정한 선택을 다른 사람에게 맡김)은 별개다.활동 중심의 대등한 구조가 가능한지 별도로 합의한다.프레이지만 항상 수동적이고 싶지는 않다.추격 구도의 역할이 일상 성격이나 모든 권한을 정하지 않는다.상황·활동별 역할과 전환 조건을 분리한다."},{"id":"ch4","title":"언어·수치심·프라이멀의 맥락","text":"고급 / 05언어·수치심·프라이멀의 맥락같은 말이나 반응의 의미가 사람·관계·장면에 따라 바뀐다.맥락확인할 것비하 표현허용 단어·호칭·금지 주제수치심누가 있는지, 공개 여부, 허용 상황프라이멀(추격·경쟁 등 즉흥적 반응을 중시하는 역할)역할 표현과 실제 거절·중단의 구분브랫장난의 범위, 반격의 허용, 실제 불쾌감칭찬·인정좋아하는 표현, 부담이 되는 표현새 상황이전의 동의가 새 관객·장소·활동까지 포함하는지과거에 좋아했던 단어라도 현재 싫다고 하면 현재 의사를 따른다. 취향은 맥락과 시간에 따라 바뀔 수 있다."},{"id":"ch5","title":"변경·중단·종료 후의 관계 운영","text":"고급 / 06변경·중단·종료 후의 관계 운영원하는 사후 반응과 다음 합의를 다룬다.즉시 대응중단·철회가 있으면 해당 활동과 역할 권한을 멈춘다. 설명이나 설득을 먼저 요구하지 않는다.원하는 반응접촉·대화·휴식·거리를 각각 확인한다. 상대를 편하게 해주려는 돌봄도 강요하지 않는다.나중의 대화편한 시점에 좋았던 점·불편한 점·다음에 바꿀 점을 구체적으로 나눈다.기록과 사생활역할명·기록·사진·대화 공개는 별도 동의 문제다. 활동 참여를 공개 동의로 바꾸지 않는다.몸이나 마음의 문제가 생긴 경우 이 자료로 상태를 판단하거나 치료하지 않는다. 필요한 전문 지원과 활동 합의는 별개다."},{"id":"ch6","title":"복합 사례 종합 분석","text":"고급 / 07복합 사례 종합 분석역할·동의·강도·맥락·관계 감정을 나누어 해석한다.서브가 오늘은 규칙을 적용하지 말자고 했다.정체성과 현재 참여 여부가 다르다.기존 규칙에 대한 변경·중단 요청을 현재 의사로 다룬다. 불복종의 벌로 바꾸지 않는다.장면 밖에서 같은 호칭을 쓰지 않아 상대가 화났다.호칭의 적용 구간이 불명확하다.일상 적용과 예외를 다시 정한다. 합의가 없었던 부분을 위반으로 확정하지 않는다.강한 자극은 원하지만 소유 표현은 싫다.신체 자극과 정서·권한 취향이 다르다.강도만으로 소유 표현·지배 관계를 추가하지 않는다.관계가 지속되며 이전 한계가 달라졌다.변화 자체를 실패나 가짜 성향으로 평가하지 않는다.새 한계를 기준으로 범위·빈도·활동을 재조정한다."},{"id":"ch7","title":"부록 · 전체 용어 찾아보기","text":"고급 / 08부록 · 전체 용어 찾아보기역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.이름·별칭·뜻 검색분류전체역할취향활동소재스타일중심관계 구조142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.출처·편집 기준NCSF · Consent Counts Statement 및 용어 부록NCSF · Consent CountsFetLife · Kinktionary Roles — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다. 역할 미정 — 미지정 아직 어떤 역할인지 정하지 않은 상태입니다. 예: 관심 활동은 있어도 주도·수용 역할은 정하지 않을 수 있습니다. 주도권을 맡는 역할 — 도미넌트 서로 정한 상황에서 결정이나 진행을 이끄는 사람입니다. 예: 상대가 맡긴 게임 진행을 이끌지만 일상의 모든 선택을 대신하지는 않습니다. 주도권을 맡기는 역할 — 서브미시브 · 서브 · 섭 정한 상황의 선택·진행을 다른 사람에게 자발적으로 맡기는 사람입니다. 예: 특정 장면은 상대에게 맡기더라도 평소 자기 의견과 거절은 그대로 표현합니다. 주도·맡김 역할을 바꾸는 사람 — 스위치 상대나 상황에 따라 주도하는 역할과 맡기는 역할을 바꾸는 사람입니다. 예: A와는 이끌고 B와는 맡기거나, 같은 상대와도 합의해 바꿀 수 있습니다. 활동을 진행하는 쪽 — 탑 특정 활동에서 행동을 제공하거나 진행하는 쪽입니다. 관계의 결정권과는 별개입니다. 예: 상대의 요청대로 활동을 진행할 수도 있으므로 탑이 반드시 돔은 아닙니다. 활동을 받는 쪽 — 바텀 특정 활동의 대상이 되거나 받는 쪽입니다. 관계에서 복종한다는 뜻은 아닙니다. 예: 원하는 활동을 직접 고르고 진행자에게 요청하는 바텀도 있습니다. 지속적인 권한 관계의 주도 역할 — 마스터 당사자가 정한 지속적인 지배·복종 관계의 주도 쪽을 가리키는 명칭입니다. 예: 일부 생활 약속까지 포함할 수 있지만 맡긴 영역과 제외 영역은 따로 정합니다. 지속적인 권한 관계의 주도 역할 명칭 — 미스트리스 마스터와 비슷한 맥락에서 주도 역할에 사용하는 호칭입니다. 사용자의 정체성과 호칭 선호에 따라 달라집니다. 예: 호칭만으로 성별·허용 활동·강도를 확정하지 않습니다. 폭넓은 권한을 맡기는 관계 역할 — 슬레이브 당사자가 정한 관계에서 여러 영역의 결정권을 맡기는 쪽을 부르는 명칭입니다. 실제 노예 신분이 아닙니다. 예: 어떤 생활 약속을 맡기더라도 마음이 바뀌면 변경·중단을 요구할 수 있습니다. 고통·강한 자극을 주는 취향 — 새디스트 · 새디 상대가 원하고 허용한 맥락에서 고통이나 강한 자극을 주는 경험에 관심이 있는 사람입니다. 예: 돔이 아니어도 이런 취향이 있을 수 있으며 실제 괴롭힘을 좋아한다는 뜻은 아닙니다. 고통·강한 자극을 받는 취향 — 마조히스트 · 매저 본인이 원하는 특정 상황의 고통이나 강한 자극을 경험하는 데 관심이 있는 사람입니다. 예: 원하는 활동의 자극을 좋아해도 원치 않는 통증·일상 폭력은 싫을 수 있습니다. 주는 쪽과 받는 쪽 모두에 관심 — 사도마조히스트 고통·자극을 주는 경험과 받는 경험 양쪽에 관심이 있는 사람입니다. 예: 가학·피학 취향의 방향을 말하며, 결정권을 바꾸는 스위치와는 다른 축입니다. 장난스러운 반항을 즐기는 역할 — 브랫 서로 즐기기로 한 말대꾸·도발·장난으로 상대 반응을 주고받는 사람입니다. 예: 말장난을 원하는 것이지 모든 거절을 무시해 달라는 뜻은 아닙니다. 장난스러운 반항에 응수하는 역할 — 브랫 테이머 브랫의 합의한 장난을 받아주고 반응을 주고받는 쪽입니다. 예: 웃으며 되받아치는 방식도 가능하며 반드시 벌을 주거나 굴복시켜야 하지는 않습니다. 추격 역할을 맡는 쪽 — 헌터 · 프라이멀 헌터 합의한 허구의 추격·경쟁 장면에서 쫓는 쪽입니다. 예: 술래 같은 추격 역할을 맡더라도 관계 전체의 결정권을 가진다는 뜻은 아닙니다. 포식자 이미지를 맡는 쪽 — 프레데터 프라이멀 역할극에서 추격·포식자 이미지를 맡는 쪽의 명칭입니다. 예: 실제 위협·폭력을 허용한다는 말이 아니라 허구 역할을 가리킵니다. 쫓기는 역할을 맡는 쪽 — 프레이 · 프라이멀 프레이 합의한 추격 장면에서 피하거나 쫓기는 쪽입니다. 예: 추격 역할은 좋아하지만 지배·복종 관계는 원하지 않는 경우도 있습니다. 추격·피하기 역할을 바꾸는 사람 — 프라이멀 스위치 추격자와 쫓기는 역할을 합의에 따라 바꾸는 사람입니다. 예: 누가 쫓는지 바뀌는 것이며, 일상의 결정권까지 바뀐다는 뜻은 아닙니다. 줄을 다루는 활동의 진행자 — 리거 · 로프 탑 줄을 사용하는 구속·형태 만들기 활동을 진행하는 쪽입니다. 예: 줄로 모양을 만드는 데 관심이 있어도 지배 역할이나 고통을 주는 취향은 없을 수 있습니다. 줄 활동을 받는 쪽 — 로프버니 · 로프 바텀 줄로 형태를 만들거나 구속하는 활동을 받는 쪽을 부르는 명칭입니다. 로프 바텀이라는 표현도 씁니다. 예: 묶이는 느낌을 좋아해도 통증이나 복종 역할은 좋아하지 않을 수 있습니다. 줄 활동의 양쪽 역할 — 로프 스위치 줄 활동을 진행하는 쪽과 받는 쪽 모두에 관심이 있는 사람입니다. 예: 상대와 합의해 누가 줄을 다루고 누가 받는지 바꿀 수 있습니다. 구속 활동을 진행하는 쪽 — 본디지 탑 · 바인더 줄이나 다른 도구를 사용하는 움직임 제한 활동의 진행자입니다. 예: 로프 탑보다 넓은 표현으로, 줄 외의 도구를 쓰는 경우도 포함합니다. 구속 활동을 받는 쪽 — 본디지 바텀 합의한 움직임 제한
