을 원하지는 않습니다. 역할극 지향 합의한 허구 역할·상황 몰입; 역할 밖 권한으로 확대 금지 예: 허구의 집사 역할은 좋아해도 실제 고용·복종 관계는 원하지 않을 수 있습니다. 움직임을 제한하는 활동 — 본디지 · 구속 몸의 움직임 일부를 제한하는 활동의 묶음입니다. 줄로 묶는 활동은 이 범주에 포함됩니다. 예: 손을 자유롭게 움직이는 상황과, 합의한 장면에서 움직임 일부가 제한되는 상황의 차이입니다. 줄을 사용하는 구속 — 로프 본디지 줄을 이용해 움직임을 제한하거나 몸 주변에 무늬·형태를 만드는 활동입니다. 줄을 쓰는 모든 경우가 움직임 제한을 뜻하지는 않습니다. 예: 줄이 만드는 모양을 감상하는 관심과, 실제로 움직임이 제한되는 경험을 원하는 관심은 다릅니다. 구속 도구를 사용하는 활동 — 레스트레인트 · 구속구 움직임을 제한하는 도구 또는 제한 자체를 뜻합니다. 손목·발목용 커프는 둘러 채우는 띠 모양 도구입니다. 예: 도구를 착용하는 상징을 원하는 것과 움직임 제한을 원하는 것은 구분합니다. 손 등으로 때리는 활동 — 스팽 · 스팽킹 합의한 맥락에서 손이나 도구로 몸을 때리는 활동을 말합니다. 보통 엉덩이를 때리는 맥락에서 많이 쓰며, 스팽이라고 줄여 부르기도 합니다. 예: 같은 활동도 장난·감각 경험·합의한 벌 등 의미가 다를 수 있습니다. 몸을 때리는 활동의 큰 분류 — 임팩트 플레이 손이나 도구로 몸을 때려 자극을 주고받는 활동 전체를 묶는 말입니다. 스팽킹·플로깅·패들링 등이 여기에 들어갑니다. 예: 임팩트는 특정 도구 이름이 아닙니다. 플로깅은 임팩트 안에 포함되는 한 종류입니다. 여러 가닥 채찍을 사용하는 타격 활동 — 플로깅 손잡이 끝에 여러 가닥의 유연한 끈이 달린 도구인 플로거(flogger)로 몸에 타격 자극을 주는 활동입니다. 도구는 플로거, 활동은 플로깅입니다. 예: 한 가닥 채찍을 쓰는 모습과 구별하세요. 여러 끈이 달린 도구라는 점이 이름을 가르는 기준이며 강도는 별개입니다. 넓고 납작한 도구를 사용하는 타격 활동 — 패들링 손잡이와 넓고 납작한 면을 가진 패들(paddle)로 몸을 때리는 활동입니다. 패들은 도구 이름, 패들링은 활동 이름입니다. 예: 여러 가닥 끈이 달린 플로거와 달리 넓은 면이 있는 도구를 뜻합니다. 채찍을 사용하는 타격 활동 — 휘핑 채찍으로 타격 자극을 주는 활동을 넓게 부르는 말입니다. 여러 가닥 도구를 포함해 쓰기도 하므로 실제 도구를 확인해야 합니다. 예: 작품에 채찍질이라고만 나오면 도구 종류와 자극 강도는 아직 알 수 없습니다. 정한 규칙을 지키고 피드백하는 관계 활동 — 훈육 · 디시플린 서로 정한 규칙을 수행하고, 지켰는지 확인하거나 어겼을 때의 반응을 정하는 활동입니다. 훈육이라고 번역합니다. 체벌이 필수는 아닙니다. 예: 합의한 게임 규칙을 지키고 결과를 함께 확인하는 구조를 생각하면 됩니다. 지킬 약속 정하기 — 규칙 설정 무엇을 언제 어떻게 할지 당사자끼리 정한 약속입니다. 예: 장면 중에 쓸 호칭 하나를 정하는 것도 규칙의 한 예입니다. 인정이나 보상을 주고받기 — 보상 중심 원한 행동이나 노력을 알아주고, 미리 정한 칭찬·작은 보상 등을 주고받는 방식입니다. 예: 약속을 지킨 것에 대해 고맙다고 말하는 것이 개념 예시입니다. 약속에 대한 피드백 — 교정 중심 합의한 규칙과 실제 행동의 차이를 짚고 다시 조정하는 방식입니다. 상대 인격을 고친다는 뜻은 아닙니다. 예: 정해 둔 약속을 서로 다르게 이해했다면 그 내용을 다시 맞추는 것입니다. 도움·시중·기여를 즐기는 활동 — 봉사 · 서비스 상대에게 필요한 도움이나 맡은 일을 제공하는 데 의미를 두는 활동입니다. 봉사라는 말도 쓰지만 강제 노동을 뜻하지 않습니다. 예: 차를 준비하거나 필요한 물건을 챙겨주는 일도 당사자가 그 역할을 원한다면 예가 됩니다. 관계 안의 호칭·예절·절차 — 프로토콜 · 예절 서로 어떤 호칭을 쓰고 어떻게 인사하거나 요청할지 정한 격식입니다. 예: 특정 장면에서만 정한 호칭을 쓰기로 약속하는 것입니다. 의미를 담아 반복하는 절차 — 리추얼 · 의식 당사자에게 상징적 의미가 있는 행동이나 순서를 반복하는 것입니다. 리추얼이라고도 씁니다. 예: 장면을 시작하기 전에 서로 준비됐는지 확인하는 일정한 인사가 예입니다. 맡긴 범위의 지시 주고받기 — 지시 수행 한 사람이 구체적인 요청·지시를 하고 다른 사람이 합의한 범위에서 수행하는 활동입니다. 예: 대신 골라 달라고 부탁한 선택을 상대가 정해 주는 상황을 생각하면 됩니다. 정해진 예절보다 즉흥적 반응을 중시하는 역할 활동 — 프라이멀 플레이 격식 있는 호칭·절차보다 추격·경쟁·몸짓 같은 즉흥적 상호작용을 중시하는 활동입니다. 본능형이라고 설명하기도 합니다. 예: 추격하는 역할과 피하는 역할을 정한 허구 놀이가 한 예입니다. 쫓고 피하는 역할극 — 추격·회피 역할극 쫓는 쪽과 피하는 쪽의 역할을 합의한 활동입니다. 실제로 도망가고 싶다는 표현과 구별해야 합니다. 예: 술래·추격자와 도망가는 등장인물처럼 역할을 정하는 개념입니다. 장난스럽게 반항하고 받아주기 — 브랫 플레이 합의한 장난·말대꾸·도발과 상대의 응수를 즐기는 활동입니다. 실제 불편함의 표현은 포함하지 않습니다. 예: 가벼운 말장난을 주고받고 상대가 재치 있게 받아주는 모습이 예입니다. 놀리며 반응 주고받기 — 티징 · 떠보기 상대가 허용한 범위의 놀림이나 떠보기로 반응을 교환하는 것입니다. 예: 서로 불편하지 않은 별명으로 짧게 놀리고 웃는 상황이 예입니다. 합의한 낮춤·비하 표현 — 디그레이데이션 미리 허용한 낮춤 표현을 역할 안에서 주고받는 활동입니다. 디그라고 줄여 부르기도 합니다. 실제 인격 평가와 구분합니다. 예: 특정 호칭은 허용하되 외모·가족을 건드리는 말은 제외하는 식으로 허용 단어를 구체적으로 구분합니다. 부끄러움을 느끼는 상황의 역할극 — 휴밀리에이션 합의한 상황에서 부끄럽거나 민망한 감정을 경험하는 활동입니다. 말로 비하하지 않아도 성립합니다. 예: 칭찬을 크게 받는 것을 쑥스러워하는 상황과 모욕을 당하는 상황은 다릅니다. 무엇이 부끄러운지부터 확인합니다. 칭찬과 인정 주고받기 — 프레이즈 · 칭찬 말이나 태도로 상대의 노력·선택을 알아주고 인정하는 활동입니다. 프레이즈라고 음역합니다. 예: 막연한 칭찬보다 약속을 지켜 줘서 고맙다고 구체적으로 말하는 예입니다. 촉감·소리 등 감각에 집중하기 — 센세이션 · 감각 촉감·소리·온도처럼 감각의 차이를 경험하는 활동의 큰 묶음입니다. 센세이션 플레이라고도 합니다. 예: 부드러운 천과 매끈한 천의 촉감 차이에 집중하는 것이 개념 예시입니다. 눈가리개 등으로 시야를 줄이는 활동 — 시야 제한 보이는 정보를 줄여 다른 감각이나 상대의 안내에 집중하는 활동입니다. 예: 아무것도 보이지 않는 상태와 일부만 가려지는 상태는 서로 다르게 느껴질 수 있습니다. 기다림·예상을 이용하는 연출 — 기대·긴장 연출 다음 일을 기다리거나 예상하는 마음에 집중하는 방식입니다. 예: 선물을 열기 전 무엇일지 기다리는 느낌처럼 결과보다 기다림이 중심인 경우입니다. 반려동물 역할을 빌린 성인 역할극 — 펫 플레이 성인끼리 강아지·고양이 같은 허구 역할을 빌려 애칭·몸짓·돌봄을 주고받는 활동입니다. 실제 동물과는 무관합니다. 예: 펫 애칭만 쓰는 사람도 있고, 별도 역할 장면을 원하는 사람도 있습니다. 돌보고 돌봄받는 역할극 — 돌봄 역할극 성인으로서 돌봄을 제공하거나 받는 역할을 경험하는 것입니다. 예: 피곤할 때 쉬는 공간을 챙겨 주되 무엇이 필요한지는 본인에게 묻는 모습입니다. 존중·찬미를 강조하는 표현 — 워십 · 숭배적 표현 상대를 특별히 존중하거나 찬미하는 태도를 강조하는 표현입니다. 워십이라고도 합니다. 실제 종교 행위와 같다는 뜻은 아닙니다. 예: 상대의 장점을 말로 찬미하거나 정중한 인사에 의미를 두는 경우입니다. 사물의 역할을 빌리는 성인 역할극 — 오브젝트 역할극 성인 당사자가 허구적으로 사물의 역할을 맡는 설정입니다. 실제 인격이나 의사를 없애는 것이 아닙니다. 예: 조각상 역할처럼 정한 순간 동안 말없이 한 자세를 표현하는 허구 설정이 개념 예입니다. 허구의 인물·상황을 맡는 놀이 — 역할극 현실의 직업·권한과 별도로 허구 인물이나 관계를 정해 연기하는 활동입니다. 예: 집사와 손님처럼 역할을 정하더라도 실제 고용 관계가 생기지는 않습니다. 복장·소품·분위기 연출 — 미적 연출 어떤 모습으로 보이는지, 어떤 분위기를 만드는지에 의미를 두는 활동입니다. 예: 같은 대화라도 정장·조명·소품을 통해 격식 있는 분위기를 만드는 경우입니다. 목걸이 등으로 관계의 약속을 표현하기 — 칼라링 · 관계 상징 목에 두르는 칼라(collar) 등을 관계의 상징으로 삼거나 이를 주고받는 의식을 말합니다. 목줄을 뜻하는 리시(leash)와는 다른 말입니다. 예: 커플 반지처럼 상징에 의미를 두되, 무엇을 약속하는지는 당사자가 정하는 경우입니다. 관계의 약속을 글로 정리하기 — 관계 약속·계약 연출 원하는 관계·범위·금지·변경 방법을 문서로 정리하는 것입니다. 역할극 안에서 계약처럼 연출하기도 합니다. 예: 동의한 범위와 언제든 바꿀 수 있는 내용을 함께 적는 약속표를 생각하면 됩니다. 로프 소재 로프의 시각·촉감·상징 선호 예: 줄의 무늬는 좋아하지만 움직임 제한은 원하지 않을 수 있습니다. 레더 · 가죽 가죽 소재·복장·분위기 선호 예: 가죽 재킷의 질감이나 외관을 선호할 수 있습니다. 라텍스 라텍스 소재·복장 선호 예: 표면이 매끈하고 몸에 붙는 고무계 의상의 외관에 관심이 있을 수 있습니다. 러버 고무 소재·복장 선호 예: 고무 소재의 냄새·질감·외관 중 무엇을 좋아하는지 다를 수 있습니다. 금속 소재 금속 소재의 미적·감각적 선호 예: 금속의 반짝임이 좋아도 금속 구속 도구는 싫을 수 있습니다. 패브릭 · 천 천 소재의 시각·감각 선호 예: 면·새틴처럼 천마다 다른 촉감을 선호할 수 있습니다. 유니폼 성인 역할의 복장·상징 선호 예: 허구의 제복 차림을 좋아해도 실제 직업 권한을 맡기는 것은 아닙니다. 정장·격식 격식 있는 복장·태도 선호 예: 정장·격식 있는 인사 같은 분위기를 좋아할 수 있습니다. 장갑 장갑의 시각·상징 선호 예: 장갑을 낀 외관만 좋아할 수도 있습니다. 칼라·목걸이 상징 관계 상징 선호; 실제 통제권 아님 예: 목에 두르는 장신구를 관계의 상징으로 삼을 수 있습니다. 목소리·말투 음성·어조·말의 리듬 선호 예: 차분한 어조는 좋아해도 명령조는 싫을 수 있습니다. 의식용 상징물 관계의 상징·절차를 표현하는 소품 선호 예: 특별한 반지나 편지를 약속의 상징으로 삼을 수 있습니다. 소프트 배려·유연한 주도와 반응; 신체 자극 수준과 별개 예: 말투는 부드러워도 신체 자극 선호는 별개이므로 함께 확인해야 합니다. 온화형 온화한 말투·차분함·기다림 예: 상대가 생각할 시간을 기다리고 차분하게 말하는 태도입니다. 장난형 티키타카·재치·여유로운 반응 예: 말장난을 주고받되 상대가 싫어하면 멈추는 태도입니다. 엄격형 명확한 기준·단호함; 강압과 구별 예: 약속을 일관되게 확인하되 변경·중단 요구는 받아들이는 태도입니다. 구조형 순서·약속·예측 가능한 진행 예: 시작·중간·끝의 순서를 미리 아는 것을 선호할 수 있습니다. 지지형 격려·안심·상태 확인 예: 잘한 점을 말해 주고 필요한 도움을 묻는 태도입니다. 절제형 필요할 때만 표현; 명령·확인 반복 억제 예: 관심 표현이 있어도 모든 대화를 명령으로 바꾸지는 않습니다. 자기주장형 자기 의견·조건·거절을 분명하게 표현 예: 원하는 것과 싫은 것을 짧고 분명하게 말하는 태도입니다. 반응형 상대가 표현한 반응에 맞춰 조절; 속마음 추정 금지 예: 상대가 직접 말한 반응을 듣고 방식을 바꾸는 태도입니다. 도발형 합의된 범위의 떠보기·도전; 거절 압박 금지 예: 합의한 게임에서 도전적인 말을 하되 실제 약점을 공격하지 않습니다. 신뢰 중심 예측 가능성·약속 이행·자발적 맡김 예: 상대가 약속을 지킨 경험이 쌓이면 특정 선택을 맡길 수 있습니다. 인정 중심 노력·선택을 알아주고 인정받음 예: 결과만 칭찬받기보다 들인 노력을 알아주기를 원할 수 있습니다. 반응 교환 놀림·반격·상호작용 자체를 즐김 예: 말장난에 답하고 다시 되받는 흐름 자체가 즐거울 수 있습니다. 권위 중심 합의한 역할 차이·명확한 안내 예: 정한 시간에 누가 안내하는지 분명한 것을 선호할 수 있습니다. 질서 중심 명시된 규칙·구조에서 안정감 예: 일정한 순서가 있으면 편안하게 느낄 수 있습니다. 돌봄 중심 필요를 살피고 도움을 주고받음 예: 상대의 휴식이나 필요한 도움을 챙기는 관계에 의미를 둘 수 있습니다. 소속감 중심 합의된 유대감; 외부 교류 차단 아님 예: 함께 쓰는 상징은 좋아해도 외부 친구 관계를 제한받기는 싫을 수 있습니다. 경쟁 중심 실력·말싸움·도전; 패배=복종 아님 예: 게임이나 내기에서 겨루는 것을 좋아해도 벌을 원하지는 않을 수 있습니다. 지배·복종 관계 합의한 권한을 주고받는 관계 예: 합의한 장면의 진행 선택을 한쪽이 맡는 경우가 예입니다. 마스터·슬레이브 관계 넓은 권한 맡김을 표현하는 관계명; 구체적 범위·철회권 유지 예: 생활 일부의 약속까지 정할 수 있으나 제외 영역과 변경권을 함께 둡니다. 활동 중심 관계 위계 없이 특정 활동의 진행·받기에 집중 예: 같은 활동을 함께하되 관계 안의 위계는 정하지 않을 수 있습니다. 장면 한정 정한 장면에서만 역할 활성; 일상은 별개 예: 장면이 끝나면 정한 호칭이나 지시 권한도 끝나는 구조입니다. 지속 관계 합의한 역할을 장기적으로 유지; 항상 플레이하는 뜻 아님 예: 오랫동안 같은 관계 이름을 쓰더라도 하루 종일 활동하는 것은 아닙니다. 일상 일부 적용 구체적으로 정한 일상 영역만 역할 적용 예: 식사 선택은 맡겨도 직장·재정 결정은 맡기지 않을 수 있습니다. 역할 전환형 상대·상황별 합의로 역할 변경 예: 누가 안내할지는 상황마다 함께 정할 수 있습니다. 특정 상대 한정 정한 상대에게만 성향 표현; 타인에게 일반화 금지 예: A에게 맡기는 선택도 B에게는 맡기지 않을 수 있습니다."}]},{"label":"상황별 이해","slug":"situations","title":"내 취향과 경계 알아보기","html":"\u003c!DOCTYPE html>\u003chtml lang=\"ko\" data-theme=\"light\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"author\" content=\"러브\">\u003cmeta name=\"rights\" content=\"러브 작가 자료 · 무단 배포 및 수정 금지\">\u003ctitle>05 상황별 이해 · 내 취향과 경계 알아보기\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#12161d;--panel:#1d2530;--line:#3c4a59;--text:#f0f3f7;--muted:#bdc9d7;--accent:#a6cdbf;--soft:#d1c0ea;--warn:#e8c991;--nav:#151b24}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.8 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit;color:inherit}button,select,input{background:#131b24;border:1px solid #697b8e;border-radius:9px;min-height:46px;padding:9px 13px}button{cursor:pointer}button:hover{background:#2e3a47}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-vis heme]{color-scheme:light;--bg:#fff;--panel:#f5f7f6;--nav:#f1f4f2;--text:#17202a;--muted:#45505b;--line:#bbc3ca;--accent:#315c50;--soft:#6a537f;--warn:#785d2e}html[data-theme] body{background:white;color:#17202a}html[data-theme] .love-rights{display:block!important;background:white;color:#111}.theme-choice{display:none!important}}\n\u003c/style>\u003cstyle>html{scroll-behavior:auto;scroll-padding-top:20px}body{font:17px/1.85 system-ui,sans-serif}.topbar,.sidebar,.course-bar,.footer-controls,.course-footer{display:none!important}.shell{display:block;max-width:1060px}main,.present main{padding:20px 44px 70px}.chapter,.present .chapter{max-width:960px;padding:28px 0 54px;min-height:0!important;border:0}.chapter h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.5px}.chapter h2{font-size:clamp(26px,3vw,36px);letter-spacing:-1px}.lede{font-size:19px;max-width:760px}.grid{gap:14px}.card{padding:23px;border-radius:12px;box-shadow:none}.grid.three{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.callout{padding:18px 22px}html[data-read-mode=\"page\"] .chapter:not(.reading-current){display:none!important}html[data-read-mode=\"page\"] .chapter.reading-current{display:block!important}.chapter>*{overflow-wrap:anywhere}table{font-size:15px}th,td{line-height:1.75}.eyebrow{letter-spacing:1px}.entry{padding:18px}.entry p{font-size:15px}.reading-kicker{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}.reading-intro{padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}.reading-intro p{color:var(--muted)}@media(max-width:650px){main,.present main{padding:16px 18px 45px}.grid,.glossary-grid{grid-template-columns:1fr}.chapter{padding-top:18px}.card{padding:18px}}@media print{.chapter{display:block!important;break-inside:auto}main{padding:0}.chapter h2{break-after:avoid}}\u003c/style>\u003c/head>\u003cbody>\u003caside class=\"love-rights\" aria-label=\"자료 권리 안내\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\" aria-current=\"page\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">05 상황별 이해 · 내 취향과 경계 알아보기\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"내용 목차\">\u003ca href=\"#ch0\">01 · 나에게 맞는 취향을 알아가는 법\u003c/a>\u003ca href=\"#ch1\">02 · 같은 취향인데 왜 다르게 느낄까?\u003c/a>\u003ca href=\"#ch2\">03 · 좋아하지만 여기까지는 싫을 수 있다\u003c/a>\u003ca href=\"#ch3\">04 · 모호한 취향을 구체적으로 말하기\u003c/a>\u003ca href=\"#ch4\">05 · 일상과 플레이가 헷갈리는 상황\u003c/a>\u003ca href=\"#ch5\">06 · 마음이 바뀌거나 불편할 때\u003c/a>\u003ca href=\"#ch6\">07 · 취향을 설명할 때 확인할 것\u003c/a>\u003ca href=\"#ch7\">08 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection id=\"plain-language\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">기초 용어부터\u003c/div>\u003ch2>낯선 말부터 쉬운 말로\u003c/h2>\u003cp class=\"lede\">이 자료는 국내·해외 통용도를 단정하지 않습니다. 쉬운 한국어 뜻을 먼저 쓰고, 외국어를 소리대로 쓴 말과 별칭을 함께 찾아볼 수 있게 했습니다.\u003c/p>\u003cdiv class=\"callout\">역할 이름은 누가 무엇을 맡는지, 활동 이름은 무엇을 하는지 말합니다. 도구 이름은 물건의 종류를 말합니다. 이 셋은 강도 단계가 아닙니다.\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>BDSM\u003c/h3>\u003cp>구속·규칙, 지배·복종, 가학·피학 등 여러 취향과 관계를 묶는 말입니다. 모든 요소를 함께 좋아해야 하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플레이 · 씬\u003c/h3>\u003cp>당사자가 시작·끝과 범위를 정한 활동 또는 역할 장면입니다. 일상의 모든 관계를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>가학 · 피학\u003c/h3>\u003cp>합의한 맥락에서 고통·강한 자극을 주는 취향 / 받는 취향입니다. 모든 고통·모든 상황을 좋아한다는 뜻은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>본디지 · 로프\u003c/h3>\u003cp>본디지는 움직임 제한 활동의 큰 분류, 로프는 줄을 사용하는 종류입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>임팩트 · 스팽 · 플로깅\u003c/h3>\u003cp>임팩트는 때리는 활동의 큰 분류입니다. 스팽킹은 보통 손이나 도구로 엉덩이 등을 때리는 활동, 플로깅은 여러 가닥 채찍을 쓰는 종류입니다. 서로 단계 이름이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플로거 · 패들 · 채찍\u003c/h3>\u003cp>플로거는 여러 가닥 끈이 달린 도구, 패들은 넓고 납작한 면을 가진 도구입니다. 채찍은 더 넓은 표현이라 실제 종류를 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리밋 · 하드 리밋 · 소프트 리밋\u003c/h3>\u003cp>리밋은 경계·제외 조건입니다. 하드 리밋은 하지 않는 것, 소프트 리밋은 아직 부담이 있거나 조건을 논의해야 하는 것입니다. 소프트 리밋은 자동 허용이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>세이프워드 · 세이프사인\u003c/h3>\u003cp>중단·조절을 위해 미리 정한 말 / 몸 신호입니다. 평범한 말로 거절하거나 동의를 철회하는 권리도 유지됩니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>체크인 · 애프터케어\u003c/h3>\u003cp>체크인은 진행 중 상태·의사를 확인하는 것, 애프터케어는 종료 후 필요한 휴식·도움·대화 등을 뜻합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>위임 · 상한\u003c/h3>\u003cp>위임은 정한 결정을 남에게 맡기는 것, 상한은 허용하기로 정한 최대 범위입니다. 좋아하는 취향과 지금 허용한 범위는 다를 수 있습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>몰입 · 위계\u003c/h3>\u003cp>몰입은 역할·경험에 집중하는 정도, 위계는 누가 어떤 상황의 안내·결정을 맡는지 정한 차이입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프로토콜 · 리추얼\u003c/h3>\u003cp>프로토콜은 호칭·예절 등 약속한 격식, 리추얼은 특별한 의미를 담아 반복하는 순서나 의식입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그 · 휴밀리에이션\u003c/h3>\u003cp>디그는 허용한 낮춤·비하 표현, 휴밀리에이션은 부끄러움을 경험하는 상황입니다. 부끄럽다고 반드시 비하당하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>칼라 · 리시 · 커프\u003c/h3>\u003cp>칼라는 목에 두르는 띠·목걸이, 리시는 연결하는 줄, 커프는 손목·발목 등에 두르는 띠 모양 도구를 가리킵니다. 착용만으로 권한이 생기지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>24/7 · TPE\u003c/h3>\u003cp>24/7은 지속적인 관계 형식을, TPE는 넓은 영역의 권한 위임을 표현할 때 쓰는 말입니다. 시간 범위와 위임 범위는 다른 축이며, 권리 포기나 철회 불가를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>페티시 · 킨크\u003c/h3>\u003cp>페티시는 특정 소재·대상 등에 강하게 끌리는 취향을, 킨크는 비관습적 취향을 넓게 가리킬 때 쓰는 말입니다. 사용 범위는 공동체마다 다를 수 있습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"reading-overview\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">먼저 읽기\u003c/div>\u003ch2>상황을 해석할 때 먼저 볼 것\u003c/h2>\u003cp class=\"lede\">이름보다 현재 말과 구체적인 경계를 우선하세요.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>일상과 장면이 달라질 때\u003c/h3>\u003cp>말투의 차이와 실제 결정권의 위임(정한 선택을 다른 사람에게 맡김)을 구분합니다. 일상 범위가 넓어도 건강·직장·외부 관계의 권한을 자동으로 넘기지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>마음이 바뀌었을 때\u003c/h3>\u003cp>이전에 좋아했거나 합의했던 경험도 지금 원하지 않을 수 있습니다. 변경·중단에 대한 설명이나 증명을 요구하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>혐관과 취향을 혼동하지 않기\u003c/h3>\u003cp>반감은 반감이며 장난·브랫·복종 욕구로 자동 해석하지 않습니다. 인물의 성격·관계와 관심 취향을 따로 읽습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>자료의 범위\u003c/h3>\u003cp>용어와 단계는 이해를 돕는 참고입니다. 모든 취향의 완결된 목록, 의료적 안전 기준, 숙련도 인증 또는 자동 실행 지침은 아닙니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">아래 목차에서 상세 설명과 전체 용어 사전을 이어서 확인할 수 있습니다. 0~4는 이 자료의 비교 틀이며, 공식 등급이나 필수 상승 순서가 아닙니다.\u003c/div>\u003c/section>\u003csection id=\"character-reading\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">창작 자료 읽기\u003c/div>\u003ch2>AI 캐릭터의 반응을 판단할 때\u003c/h2>\u003cp class=\"lede\">설정된 성격, 현재 관계, 사용자가 직접 표현한 선택을 구분합니다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>역할명은 성격 전체가 아닙니다\u003c/h3>\u003cp>같은 역할이라도 말투·판단·관계는 다를 수 있습니다. 성향명을 넣었다고 냉혹함·집착·감금 같은 성격이 자동으로 생기는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>사용자의 반응은 미정입니다\u003c/h3>\u003cp>사용자가 말하지 않은 감정·대사·동의·속마음을 확정해 서술하면 주도권이 사라집니다. 관찰 가능한 표현과 추정을 구분해서 읽습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>관계 밖의 생활은 별도입니다\u003c/h3>\u003cp>외출·친구·직장·연락 같은 일상 선택이 설정된 관계만으로 제한되는지 확인합니다. 합의한 범위와 무관한 통제가 반복되면 설정 해석의 문제입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>표현보다 실제 결과를 확인합니다\u003c/h3>\u003cp>멈춰 달라는 요구가 반영되는지, 장면이 끝난 뒤 경계가 유지되는지, 시간이 지나도 상한이 자동으로 확대되지 않는지 확인합니다. 지침이 있다는 것만으로 모델의 준수를 보장하지 않습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">상황별 이해 / 01\u003c/div>\u003ch2>나에게 맞는 취향을 알아가는 법\u003c/h2>\u003cp class=\"lede\">성향 이름을 바로 정하지 않아도 괜찮다. 궁금한 것과 원하는 것을 조금씩 구분하면 된다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>궁금함\u003c/h3>\u003cp>뜻이 궁금하거나 상상만 흥미로울 수 있다. 실제로 경험하고 싶다는 뜻은 아니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>좋아함\u003c/h3>\u003cp>어떤 분위기·감각·관계 방식이 마음에 들 수 있다. 그 활동의 모든 형태를 좋아할 필요는 없다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>원함\u003c/h3>\u003cp>지금 이 상대·상황·범위에서 원하는지는 별도의 질문이다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>원하지 않음\u003c/h3>\u003cp>이유를 길게 설명하지 않아도 된다. 싫은 것을 견뎌야 성향이 인정되는 것은 아니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">성향은 시험 결과처럼 하나로 고정하지 않아도 된다. 여러 키워드가 겹치거나 상대·상황·시간에 따라 달라질 수 있다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">상황별 이해 / 02\u003c/div>\u003ch2>같은 취향인데 왜 다르게 느낄까?\u003c/h2>\u003cp class=\"lede\">활동의 이름보다 좋아하는 지점과 싫은 조건이 더 구체적인 정보를 준다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>같은 이름\u003c/th>\u003cth>서로 다른 선호의 예\u003c/th>\u003cth>확인할 부분\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>도미넌트\u003c/td>\u003ctd>차분한 안내 / 장난스러운 주도 / 명확한 규칙\u003c/td>\u003ctd>주도 방식과 맡기는 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>서브미시브\u003c/td>\u003ctd>특정 선택만 맡김 / 인정받는 경험 / 합의한 규칙\u003c/td>\u003ctd>위임(정한 선택을 다른 사람에게 맡김) 범위와 자기 의견\u003c/td>\u003c/tr>\u003ctr>\u003ctd>본디지(움직임을 제한하는 활동)\u003c/td>\u003ctd>미적 분위기 / 집중 / 구속의 감각\u003c/td>\u003ctd>무엇에 끌리는지와 제외할 부분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스팽킹\u003c/td>\u003ctd>감각 / 역할 분위기 / 합의된 규칙의 맥락\u003c/td>\u003ctd>자극과 역할의 의미를 따로\u003c/td>\u003c/tr>\u003ctr>\u003ctd>디그레이디(합의한 낮춤 표현을 받는 역할)\u003c/td>\u003ctd>특정 표현만 허용 / 특정 장면만 허용\u003c/td>\u003ctd>허용 단어·금지 주제·상황\u003c/td>\u003c/tr>\u003ctr>\u003ctd>프레이(추격 역할극에서 쫓기는 역할)\u003c/td>\u003ctd>추격 역할의 긴장 / 장난스러운 경쟁\u003c/td>\u003ctd>역할과 실제 거절의 구분\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">이 표는 가능한 차이의 예시다. 어떤 동기를 가졌는지 이름만 보고 추측하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">상황별 이해 / 03\u003c/div>\u003ch2>좋아하지만 여기까지는 싫을 수 있다\u003c/h2>\u003cp class=\"lede\">관심·역할·강도·일상 적용은 각각 선택할 수 있다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>“지시는 좋지만 일상 간섭은 싫어요.”\u003c/h3>\u003cp>합의한 장면에서의 주도권과 외출·교류 같은 일상 결정권은 별개다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>“강한 감각은 좋지만 소유 표현은 싫어요.”\u003c/h3>\u003cp>신체 자극 선호가 정서적 소속감이나 지배 관계를 자동 포함하지 않는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>“구속은 좋지만 통증은 원하지 않아요.”\u003c/h3>\u003cp>본디지(움직임을 제한하는 활동) 취향과 피학(합의한 고통·자극을 받는 취향) 취향을 같은 것으로 볼 필요가 없다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>“장난은 좋지만 그 호칭은 싫어요.”\u003c/h3>\u003cp>브랫·티징 취향이 모든 단어와 반격을 허용하는 것은 아니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">좋아하는 항목을 말하는 것만큼, 싫은 조건과 제외할 부분을 말하는 것도 취향 설명의 일부다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">상황별 이해 / 04\u003c/div>\u003ch2>모호한 취향을 구체적으로 말하기\u003c/h2>\u003cp class=\"lede\">“소프트하게” 한마디보다 어떤 점이 가볍기를 원하는지 덧붙이면 전달하기 쉽다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>모호한 표현\u003c/th>\u003cth>더 구체적으로 표현한 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>소프트한 게 좋아요.\u003c/td>\u003ctd>말투는 부드럽게, 일상에서는 제안까지만 원해요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>복종하는 게 좋아요.\u003c/td>\u003ctd>제가 맡기겠다고 한 선택만 이끌어주면 좋아요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>브랫 같은 관계가 좋아요.\u003c/td>\u003ctd>가벼운 떠보기와 반격은 좋지만 굴복을 강요하는 결말은 싫어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙이 있으면 좋아요.\u003c/td>\u003ctd>몇 가지 분명한 약속은 좋지만 종료 후에는 적용하지 않았으면 해요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수치심 취향이 있어요.\u003c/td>\u003ctd>허용하는 표현과 금지 단어를 먼저 나눠서 정하고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>아직 잘 모르겠어요.\u003c/td>\u003ctd>궁금한 것과 실제로 원하는 것을 구분해 알아가고 싶어요.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">예시 문장은 그대로 사용할 의무가 없다. 자신의 말로 범위·상한·제외 항목을 덧붙이면 된다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">상황별 이해 / 05\u003c/div>\u003ch2>일상과 플레이가 헷갈리는 상황\u003c/h2>\u003cp class=\"lede\">한 구간에서의 합의가 다른 구간으로 자동 이어지는 것은 아니다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>장면에서는 지시를 따랐는데, 다음 날도 같은 규칙을 요구한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>이전 장면의 역할 권한과 다음 날 일상에 대한 합의는 다르다.\u003c/p>\u003cdiv class=\"callout\">일상에도 적용하기로 한 범위가 없다면 장면의 규칙을 그대로 이월하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>도발하거나 말싸움에서 밀렸으니 참여하기로 한 것이라고 한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>장난·논쟁·경쟁의 결과는 활동에 대한 동의가 아니다.\u003c/p>\u003cdiv class=\"callout\">현재 실제로 원하는지, 어떤 역할·상황에 동의하는지 별도로 구분한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>같은 역할 이름을 쓰니 취향도 잘 맞을 거라고 생각한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>역할 이름이 같아도 좋아하는 스타일·활동·강도는 다를 수 있다.\u003c/p>\u003cdiv class=\"callout\">키워드가 겹치는 것과 함께 원하는 범위가 겹치는 것은 다르다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>관계가 깊어졌으니 더 높은 강도로 가야 한다고 생각한다.\u003c/summary>\u003cdiv class=\"body\">\u003cp>관계의 깊이와 활동 강도는 같은 척도가 아니다.\u003c/p>\u003cdiv class=\"callout\">같은 범위를 유지하거나 줄이거나 제외하는 선택도 가능하다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">상황별 이해 / 06\u003c/div>\u003ch2>마음이 바뀌거나 불편할 때\u003c/h2>\u003cp class=\"lede\">과거 취향과 현재 의사가 다를 수 있다. 바뀐 한계를 기준으로 이야기하면 된다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>지금 느끼는 것\u003c/th>\u003cth>표현할 수 있는 말\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>그만하고 싶다\u003c/td>\u003ctd>지금은 멈추고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>강도가 부담스럽다\u003c/td>\u003ctd>이 정도는 원하지 않아요. 범위를 줄이고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특정 표현이 싫다\u003c/td>\u003ctd>그 단어·호칭은 빼주세요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>오늘은 참여하고 싶지 않다\u003c/td>\u003ctd>오늘은 역할 없이 평소처럼 지내고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>혼자 있고 싶다\u003c/td>\u003ctd>지금은 접촉보다 거리를 두고 쉬고 싶어요.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나중에 정리하고 싶다\u003c/td>\u003ctd>지금 설명하기는 어려워요. 편해진 뒤 다시 이야기하고 싶어요.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">중단·거절 뒤에 설명이나 설득을 먼저 요구하지 않는다. 명백한 거절을 숨은 욕망이나 역할 장난으로 바꾸지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">상황별 이해 / 07\u003c/div>\u003ch2>취향을 설명할 때 확인할 것\u003c/h2>\u003cp class=\"lede\">자기 성향을 증명하는 평가표가 아니라, 아직 미정인 부분을 찾는 참고 목록이다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>역할\u003c/h3>\u003cp>내가 맡고 싶은 역할은 무엇인가? 상대·상황에 따라 달라지는가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>좋아하는 경험\u003c/h3>\u003cp>자극·신뢰·인정·기여·질서·장난 중 무엇이 중요한가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>현재 원하는 범위\u003c/h3>\u003cp>상상·관심과 실제 참여 의사를 구분했는가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>구간과 상한\u003c/h3>\u003cp>일상과 플레이에서 원하는 표현과 넘지 않을 선은 무엇인가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>금지·조건\u003c/h3>\u003cp>싫은 단어·상황·활동, 별도로 확인할 조건이 있는가?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>변경·종료\u003c/h3>\u003cp>마음이 바뀌면 어떻게 말하고, 끝난 뒤 어떤 거리·대화·휴식을 원하는가?\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">빈칸이 있어도 괜찮다. 아직 모르는 것은 미정으로 남기고, 자동으로 허용된 것으로 다루지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">상황별 이해 / 08\u003c/div>\u003ch2>전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\":{\"power\":{\"title\":\"권한을 맡기는 범위\",\"axis\":\"결정권·적용 영역\",\"levels\":[\"어떤 선택도 맡기지 않음. 제안은 거절할 수 있음.\",\"메뉴 고르기처럼 요청한 선택 한 가지만 맡김.\",\"정한 장면의 몇 가지 선택만 맡김. 장면 밖은 제외.\",\"장면 안의 여러 선택을 맡기되 제외할 결정은 따로 정함.\",\"일상 일부까지 맡기는 경우. 직장·재정·교류 등 영역별로 허용·제외를 따로 정함.\"],\"change\":\"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\",\"not\":\"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"},\"bondage\":{\"title\":\"본디지·로프·구속\",\"axis\":\"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"구속을 하지 않고 소품·분위기만 즐김\",\"한 가지 움직임만 제한하는 설정을 따로 정함\",\"여러 움직임의 제한을 구분하고 각각 허용 여부를 정함\",\"제한이 관계 경험의 중심이 됨. 제한 부위·시간·해제 조건은 여전히 각각 정함\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"},\"impact\":{\"title\":\"스팽킹·임팩트 계열\",\"axis\":\"받는 사람이 느끼는 자극 강도·지속·허용 범위\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"통증을 원하지 않고 닿는 감각에만 관심\",\"타격감을 구분하지만 통증이 생기는 경험은 제외\",\"통증을 포함한 자극도 관심 범위에 넣음\",\"강한 통증을 선호할 수 있음. 도구명·멍의 유무·참는 정도로 등급을 정하지 않음\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"},\"discipline\":{\"title\":\"훈육·규칙·과제\",\"axis\":\"규칙의 수·엄격함·적용 시간·피드백 방식\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"지켜도 되고 거절해도 되는 가벼운 약속\",\"장면 안에서 규칙 하나와 피드백 방식을 정함\",\"여러 규칙과 적용 예외를 정해 일관되게 유지\",\"규칙 구조를 관계의 중요한 부분으로 삼음. 거절·중단 요구는 위반으로 취급하지 않음\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"실제 의견 차이·거절·경계 표현을 훈육 대상으로 삼는 것은 같은 개념이 아니다.\"},\"service\":{\"title\":\"서비스·봉사·돌봄\",\"axis\":\"기여의 비중·담당 범위·지속성\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"가끔 작은 도움\",\"정한 도움 한 가지를 맡음\",\"몇 가지 도움을 정기적으로 맡음\",\"기여하는 역할이 관계의 중심. 감당할 일·쉬는 시간·거절 범위를 함께 정함\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"상대 만족을 우선한다는 이유로 자신의 한계가 사라지는 것은 아니다.\"},\"protocol\":{\"title\":\"프로
