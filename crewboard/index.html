<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>크루보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--panel:#12151a;--panel2:#181c22;--border:#262b33;--border-lit:#3a4250;--text:#dfe4ea;--muted:#7c8493;--amber:#c9974a;--amber-dim:#8a6b3a;--amber-glow:rgba(201,151,74,.12);--mono:'JetBrains Mono',monospace;--sans:'Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 15% 0%,rgba(201,151,74,.06),transparent 40%),var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
header{border-bottom:1px solid var(--border);padding:22px 24px 18px}
.eyebrow{font:11px var(--mono);letter-spacing:.18em;color:var(--amber);margin-bottom:6px}
h1{font-size:22px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:700 11.5px var(--mono);text-decoration:none;border:1px solid var(--border);background:var(--panel2);color:var(--muted);padding:8px 12px;border-radius:5px;cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--border-lit)}.btn.primary{background:var(--amber);border-color:var(--amber);color:#12151a}
main{max-width:980px;margin:0 auto;padding:22px 24px 48px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px 12px;font:12.5px var(--sans);outline:none}.search:focus{border-color:var(--amber-dim)}
.jumpbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px}.jump{font:11px var(--mono);color:var(--muted);text-decoration:none;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:7px 10px;white-space:nowrap}.jump:hover{color:var(--amber);border-color:var(--amber-dim)}
.group{margin:10px 0 26px}.group-title{font-size:17px;font-weight:900;margin-bottom:10px;color:var(--amber)}.group-note{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}.card-title{font-size:12.5px;font-weight:700}.copy-one{font:700 10.5px var(--mono);color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:4px;padding:5px 8px;cursor:pointer}.copy-one:hover{color:var(--amber);border-color:var(--amber-dim)}
pre{padding:15px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font:12px/1.75 var(--mono);color:var(--text)}mark{background:rgba(201,151,74,.24);color:#f5d79f;border-radius:2px}.status{color:var(--muted)}
@media(max-width:600px){header,main{padding-left:16px;padding-right:16px}.card-head{padding:9px 11px}pre{padding:12px;font-size:11.2px}}

/* 전체 텍스트 +2pt */
.eyebrow{font-size:calc(11px + 2pt)}
h1{font-size:calc(22px + 2pt)}
.sub{font-size:calc(13px + 2pt)}
.btn{font-size:calc(11.5px + 2pt)}
.search{font-size:calc(12.5px + 2pt)}
.jump{font-size:calc(11px + 2pt)}
.group-title{font-size:calc(17px + 2pt)}
.group-note{font-size:calc(12px + 2pt)}
.card-title{font-size:calc(12.5px + 2pt)}
.copy-one{font-size:calc(10.5px + 2pt)}
pre{font-size:calc(12px + 2pt)}
@media(max-width:600px){pre{font-size:calc(11.2px + 2pt)}}
</style>
</head>
<body>
<header>
<div class="eyebrow">DOOMCHIT · CREW REFERENCE</div>
<h1>크루보드</h1>
<div class="sub">메인 프롬프트·키워드북·캐릭터·제작 진행상태 통합 참고자료</div>
<div class="actions"><a class="btn" href="../">제작 콘솔로 돌아가기</a><a class="btn" href="./크루보드.txt" download>TXT 다운로드</a><button class="btn primary" id="copyAll">전체 복사</button></div>
</header>
<main>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="전체 내용에서 검색"></div>
<div class="jumpbar"><a class="jump" href="#mainPrompt">메인</a><a class="jump" href="#keywordBook">키워드북</a><a class="jump" href="#reference">캐릭터·진행 참고</a></div>
<div id="content" class="status">크루보드를 불러오는 중입니다</div>
</main>
<script>
let original='';
const host=document.getElementById('content');
const search=document.getElementById('search');
const keywordTitles=['키워드북 공통 LOCK','룬가르드 마탑','룬가르드 자아성물','탈론 용병길드','스카른 설산','정보길드','마족 계통','엘프','드워프','드래곤','봄 역병사건','몬스터 번식기','몬스터 식량부족','마족 계약의식'];
const mainTitles=['작품','StoryFlow','세계구조','신·신계','세력','칼두스','힘 체계','인간계 존재','마족','폴리모프','몬스터·마족','마족 계약','지역 핵심','이종족·드래곤','유저·NPC·관계','사건','출력','성인 콘텐츠'];
function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function regexEsc(s){return s.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')}
function highlight(s,q){const safe=esc(s);if(!q)return safe;return safe.replace(new RegExp(regexEsc(q),'gi'),function(m){return '<mark>'+m+'</mark>'})}
function makeCard(title,text,q){const card=document.createElement('section');card.className='card';const head=document.createElement('div');head.className='card-head';const label=document.createElement('div');label.className='card-title';label.textContent=title;const btn=document.createElement('button');btn.className='copy-one';btn.textContent='복사';btn.onclick=async function(){await navigator.clipboard.writeText(text);btn.textContent='복사됨';setTimeout(function(){btn.textContent='복사'},900)};const pre=document.createElement('pre');pre.innerHTML=highlight(text,q);head.append(label,btn);card.append(head,pre);return card}
function splitKeywords(lines){const blocks=[];let title='키워드북';let buf=[];lines.forEach(function(line){if(keywordTitles.includes(line.trim())){if(buf.length)blocks.push([title,buf.join('\n').trim()]);title=line.trim();buf=[]}else{buf.push(line)}});if(buf.length)blocks.push([title,buf.join('\n').trim()]);return blocks.filter(function(x){return x[1]})}
function formatMain(lines){const out=[];lines.forEach(function(line){const t=line.trim();if(mainTitles.includes(t)){if(out.length&&out[out.length-1]!=='')out.push('');out.push('['+t+']')}else{out.push(line)}});return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function group(id,title,note){const g=document.createElement('section');g.className='group';g.id=id;const h=document.createElement('h2');h.className='group-title';h.textContent=title;g.appendChild(h);if(note){const p=document.createElement('div');p.className='group-note';p.textContent=note;g.appendChild(p)}return g}
function render(){if(!original)return;const q=search.value.trim();const lines=original.split(/\r?\n/);const mi=lines.indexOf('메인 프롬프트 통합본');const ki=lines.indexOf('키워드북 통합본');const ri=lines.indexOf('기존 크루보드에서 유지되는 캐릭터·파티 자료');const mainLines=lines.slice(mi+1,ki);const workIndex=mainLines.indexOf('작품');const lockLines=workIndex>=0?mainLines.slice(0,workIndex):[];const mainBody=workIndex>=0?mainLines.slice(workIndex):mainLines;const main=formatMain(mainBody);const lock=lockLines.filter(function(x){return x.trim()&&x.trim()!=='LOCK'}).join('\n').trim();const keys=lines.slice(ki+1,ri).filter(function(x){return x.trim()});const rest=lines.slice(ri).join('\n').trim();host.innerHTML='';host.className='';const gm=group('mainPrompt','메인 프롬프트','세계관·서사·시스템·출력에 상시 적용되는 본문');if(lock)gm.appendChild(makeCard('적용 규칙 · 본문 외 관리지침',lock,q));gm.appendChild(makeCard('메인 프롬프트 본문',main,q));host.appendChild(gm);const gk=group('keywordBook','키워드북','호출 항목별 분리');splitKeywords(keys).forEach(function(b){gk.appendChild(makeCard(b[0],b[1],q))});host.appendChild(gk);const gr=group('reference','캐릭터·진행 참고','기존 크루보드 보존자료와 STEP2~5 진행시트');gr.appendChild(makeCard('제작 참고자료',rest,q));host.appendChild(gr)}
fetch('./크루보드.txt?v=20260901-3',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('load');return r.text()}).then(function(t){original=t.replace(/^\uFEFF/,'');render()}).catch(function(){host.textContent='크루보드를 불러오지 못했습니다'});
search.addEventListener('input',render);
document.getElementById('copyAll').addEventListener('click',async function(e){if(!original)return;await navigator.clipboard.writeText(original);e.target.textContent='복사됨';setTimeout(function(){e.target.textContent='전체 복사'},900)});
</script>
</body>
</html>
