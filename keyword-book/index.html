<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키워드북 · 크루보드</title><style>:root{--bg:#f3f0e9;--paper:#fffdf8;--ink:#28241f;--muted:#756d61;--line:#d8d0c2;--gold:#b98722;--nav:#211e32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif}nav{position:sticky;top:0;z-index:9;display:flex;gap:7px;flex-wrap:wrap;padding:12px 4vw;background:var(--nav)}nav a{color:#dedbea;text-decoration:none;padding:8px 10px;border-radius:6px;font-weight:700;font-size:14px}nav a:hover,nav a.active{background:var(--gold);color:#171421}.wrap{width:min(1050px,94vw);margin:30px auto 60px}header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}h1{margin:0;font-size:32px}.sub{margin-top:7px;color:var(--muted);font-size:15px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:7px;padding:10px 14px;background:var(--gold);color:#18141f;text-decoration:none;font-weight:800;cursor:pointer;font-size:14px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:16px;margin-bottom:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden;box-shadow:0 7px 22px #4d412512}.head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#eee7da;border-bottom:1px solid var(--line)}h2{font-size:18px;margin:0}.copy{border:1px solid var(--line);background:var(--paper);padding:6px 9px;border-radius:5px;cursor:pointer}pre{margin:0;padding:15px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font:15px/1.75 "D2Coding","Consolas",monospace}mark{background:#ffe19a}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:700px){nav{position:static}.wrap{width:96vw}header{align-items:start;flex-direction:column}pre{font-size:14px}}</style></head><body><nav><a href="../world-detail/">세계관 디테일</a><a href="../crewboard/크루보드.html">메인 프롬프트</a><a class="active" href="../keyword-book/">키워드북</a><a class="" href="../command-book/">커맨드북</a><a href="../character-ppt/">캐릭터 PPT</a><a href="../images/">이미지</a><a href="../image-prompts/">이미지 프롬프트</a></nav><div class="wrap"><header><div><h1>키워드북</h1><div class="sub">작품 전용 호출 항목 · 항목별 복사 가능</div></div><div class="actions"><a class="btn" href="./키워드북.txt" download>TXT 다운로드</a><button class="btn" id="all">전체 복사</button></div></header><input id="q" class="search" type="search" placeholder="항목 검색"><main id="list"></main></div><script>let raw='';const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function blocks(){const a=[];let h='',b=[];raw.split(/\r?\n/).forEach(x=>{if(/^\[[^\]]+\]$/.test(x.trim())){if(h)a.push([h,b.join('\n').trim()]);h=x.trim().slice(1,-1);b=[]}else b.push(x)});if(h)a.push([h,b.join('\n').trim()]);return a}function render(){const q=document.getElementById('q').value.trim().toLowerCase(),host=document.getElementById('list');const found=blocks().filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));host.innerHTML=found.length?found.map((x,i)=>`<section class="card"><div class="head"><h2>[${esc(x[0])}]</h2><button class="copy" data-i="${i}">복사</button></div><pre>${esc(x[1])}</pre></section>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>';[...host.querySelectorAll('.copy')].forEach((e,i)=>e.onclick=()=>navigator.clipboard.writeText('['+found[i][0]+']\n'+found[i][1]))}fetch('./키워드북.txt',{cache:'no-store'}).then(r=>r.text()).then(t=>{raw=t.replace(/^\uFEFF/,'');render()});document.getElementById('q').oninput=render;document.getElementById('all').onclick=()=>navigator.clipboard.writeText(raw)</script></body></html>
