c/a>\u003ca href=\"#ch4\">05 · 활동별 단계 비교\u003c/a>\u003ca href=\"#ch5\">06 · 일상과 플레이\u003c/a>\u003ca href=\"#ch6\">07 · 경계·오해 정리\u003c/a>\u003ca href=\"#ch7\">08 · 용어 사전·출처\u003c/a>\u003c/nav>\u003cmain>\u003csection id=\"plain-language\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">기초 용어부터\u003c/div>\u003ch2>낯선 말부터 쉬운 말로\u003c/h2>\u003cp class=\"lede\">이 자료는 국내·해외 통용도를 단정하지 않습니다. 쉬운 한국어 뜻을 먼저 쓰고, 외국어를 소리대로 쓴 말과 별칭을 함께 찾아볼 수 있게 했습니다.\u003c/p>\u003cdiv class=\"callout\">역할 이름은 누가 무엇을 맡는지, 활동 이름은 무엇을 하는지 말합니다. 도구 이름은 물건의 종류를 말합니다. 이 셋은 강도 단계가 아닙니다.\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>BDSM\u003c/h3>\u003cp>구속·규칙, 지배·복종, 가학·피학 등 여러 취향과 관계를 묶는 말입니다. 모든 요소를 함께 좋아해야 하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플레이 · 씬\u003c/h3>\u003cp>당사자가 시작·끝과 범위를 정한 활동 또는 역할 장면입니다. 일상의 모든 관계를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>가학 · 피학\u003c/h3>\u003cp>합의한 맥락에서 고통·강한 자극을 주는 취향 / 받는 취향입니다. 모든 고통·모든 상황을 좋아한다는 뜻은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>본디지 · 로프\u003c/h3>\u003cp>본디지는 움직임 제한 활동의 큰 분류, 로프는 줄을 사용하는 종류입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>임팩트 · 스팽 · 플로깅\u003c/h3>\u003cp>임팩트는 때리는 활동의 큰 분류입니다. 스팽킹은 보통 손이나 도구로 엉덩이 등을 때리는 활동, 플로깅은 여러 가닥 채찍을 쓰는 종류입니다. 서로 단계 이름이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플로거 · 패들 · 채찍\u003c/h3>\u003cp>플로거는 여러 가닥 끈이 달린 도구, 패들은 넓고 납작한 면을 가진 도구입니다. 채찍은 더 넓은 표현이라 실제 종류를 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리밋 · 하드 리밋 · 소프트 리밋\u003c/h3>\u003cp>리밋은 경계·제외 조건입니다. 하드 리밋은 하지 않는 것, 소프트 리밋은 아직 부담이 있거나 조건을 논의해야 하는 것입니다. 소프트 리밋은 자동 허용이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>세이프워드 · 세이프사인\u003c/h3>\u003cp>중단·조절을 위해 미리 정한 말 / 몸 신호입니다. 평범한 말로 거절하거나 동의를 철회하는 권리도 유지됩니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>체크인 · 애프터케어\u003c/h3>\u003cp>체크인은 진행 중 상태·의사를 확인하는 것, 애프터케어는 종료 후 필요한 휴식·도움·대화 등을 뜻합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>위임 · 상한\u003c/h3>\u003cp>위임은 정한 결정을 남에게 맡기는 것, 상한은 허용하기로 정한 최대 범위입니다. 좋아하는 취향과 지금 허용한 범위는 다를 수 있습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>몰입 · 위계\u003c/h3>\u003cp>몰입은 역할·경험에 집중하는 정도, 위계는 누가 어떤 상황의 안내·결정을 맡는지 정한 차이입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프로토콜 · 리추얼\u003c/h3>\u003cp>프로토콜은 호칭·예절 등 약속한 격식, 리추얼은 특별한 의미를 담아 반복하는 순서나 의식입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그 · 휴밀리에이션\u003c/h3>\u003cp>디그는 허용한 낮춤·비하 표현, 휴밀리에이션은 부끄러움을 경험하는 상황입니다. 부끄럽다고 반드시 비하당하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>칼라 · 리시 · 커프\u003c/h3>\u003cp>칼라는 목에 두르는 띠·목걸이, 리시는 연결하는 줄, 커프는 손목·발목 등에 두르는 띠 모양 도구를 가리킵니다. 착용만으로 권한이 생기지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>24/7 · TPE\u003c/h3>\u003cp>24/7은 지속적인 관계 형식을, TPE는 넓은 영역의 권한 위임을 표현할 때 쓰는 말입니다. 시간 범위와 위임 범위는 다른 축이며, 권리 포기나 철회 불가를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>페티시 · 킨크\u003c/h3>\u003cp>페티시는 특정 소재·대상 등에 강하게 끌리는 취향을, 킨크는 비관습적 취향을 넓게 가리킬 때 쓰는 말입니다. 사용 범위는 공동체마다 다를 수 있습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"activities-explained\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">활동 34개 · 뜻과 차이\u003c/div>\u003ch2>그래서, 어떤 활동이라는 뜻일까?\u003c/h2>\u003cp class=\"lede\">제목을 누르면 쉬운 뜻·영어 원어·개념 예시와 해당 활동의 비교 예가 열립니다.\u003c/p>\u003cdiv class=\"callout\">\u003cb>0~4를 읽는 법\u003c/b>\u003cp>이 자료에서 만든 설명용 구분이며 공인 등급이 아닙니다. 0은 하지 않음, 1~4는 각 표에 적힌 관심·범위의 예입니다. 일상의 말투, 관계의 위임 범위, 신체 자극은 서로 다른 축입니다. 4가 숙련자·더 좋은 취향이라는 뜻은 아닙니다.\u003c/p>\u003cp>신체 자극 표는 세기·횟수·시간을 처방하지 않습니다. 같은 힘도 체감이 다르고, 도구만으로 위험이 결정되지 않기 때문입니다. 구체적으로 무엇을 원하는지 설명하기 위한 예로 읽으세요.\u003c/p>\u003c/div>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:bondage\">\u003csummary>움직임을 제한하는 활동\u003csmall style=\"display:block;font-weight:400\">본디지 · 구속 · Bondage\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>몸의 움직임 일부를 제한하는 활동의 묶음입니다. 줄로 묶는 활동은 이 범주에 포함됩니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>손을 자유롭게 움직이는 상황과, 합의한 장면에서 움직임 일부가 제한되는 상황의 차이입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>구속을 하지 않고 소품·분위기만 즐김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>한 가지 움직임만 제한하는 설정을 따로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 움직임의 제한을 구분하고 각각 허용 여부를 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>제한이 관계 경험의 중심이 됨. 제한 부위·시간·해제 조건은 여전히 각각 정함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:rope\">\u003csummary>줄을 사용하는 구속\u003csmall style=\"display:block;font-weight:400\">로프 본디지 · Rope bondage\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>줄을 이용해 움직임을 제한하거나 몸 주변에 무늬·형태를 만드는 활동입니다. 줄을 쓰는 모든 경우가 움직임 제한을 뜻하지는 않습니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>줄이 만드는 모양을 감상하는 관심과, 실제로 움직임이 제한되는 경험을 원하는 관심은 다릅니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>줄의 외관·촉감·장식에만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정해 둔 한 가지 제한 경험에 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>모양을 만드는 과정과 제한 경험을 함께 중요하게 여김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>줄을 통한 제한·집중 경험을 핵심 취향으로 여김. 복잡한 매듭·공중에 매달기를 뜻하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:restraint\">\u003csummary>구속 도구를 사용하는 활동\u003csmall style=\"display:block;font-weight:400\">레스트레인트 · 구속구 · Restraint\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>움직임을 제한하는 도구 또는 제한 자체를 뜻합니다. 손목·발목용 커프는 둘러 채우는 띠 모양 도구입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>도구를 착용하는 상징을 원하는 것과 움직임 제한을 원하는 것은 구분합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>착용 이미지·상징만 선호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>한 종류의 움직임 제한을 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 제한 조건을 별개로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>제한 상태의 경험을 중심에 둠. 더 조이거나 오래 유지한다는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:spanking\">\u003csummary>손 등으로 때리는 활동\u003csmall style=\"display:block;font-weight:400\">스팽 · 스팽킹 · Spanking\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 맥락에서 손이나 도구로 몸을 때리는 활동을 말합니다. 보통 엉덩이를 때리는 맥락에서 많이 쓰며, 스팽이라고 줄여 부르기도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>같은 활동도 장난·감각 경험·합의한 벌 등 의미가 다를 수 있습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>접촉의 느낌만 원하고 아픔은 원하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>때리는 느낌을 원하되 통증이 시작되면 범위를 넘은 것으로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함하는 경험도 허용하되 즐거움보다 견딤에 집중하면 범위를 넘은 것으로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 통증 자체에 관심이 있는 경우. 실제 허용 세기·반복·시간은 별도로 정하며 자동 실행하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:impact\">\u003csummary>몸을 때리는 활동의 큰 분류\u003csmall style=\"display:block;font-weight:400\">임팩트 플레이 · Impact play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>손이나 도구로 몸을 때려 자극을 주고받는 활동 전체를 묶는 말입니다. 스팽킹·플로깅·패들링 등이 여기에 들어갑니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>임팩트는 특정 도구 이름이 아닙니다. 플로깅은 임팩트 안에 포함되는 한 종류입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>통증을 원하지 않고 닿는 감각에만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감을 구분하지만 통증이 생기는 경험은 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함한 자극도 관심 범위에 넣음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 통증을 선호할 수 있음. 도구명·멍의 유무·참는 정도로 등급을 정하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:flogging\">\u003csummary>여러 가닥 채찍을 사용하는 타격 활동\u003csmall style=\"display:block;font-weight:400\">플로깅 · Flogging\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>손잡이 끝에 여러 가닥의 유연한 끈이 달린 도구인 플로거(flogger)로 몸에 타격 자극을 주는 활동입니다. 도구는 플로거, 활동은 플로깅입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>한 가닥 채찍을 쓰는 모습과 구별하세요. 여러 끈이 달린 도구라는 점이 이름을 가르는 기준이며 강도는 별개입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>도구의 생김새·촉감에만 관심. 타격은 하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감은 관심 있지만 통증이 생기는 범위는 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>타격에 따른 통증도 관심 범위에 포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 타격 자극을 선호할 수 있음. 재질·사용 방식에 따라 달라지므로 플로거라는 이유만으로 약하거나 안전하다고 보지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:paddling\">\u003csummary>넓고 납작한 도구를 사용하는 타격 활동\u003csmall style=\"display:block;font-weight:400\">패들링 · Paddling\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>손잡이와 넓고 납작한 면을 가진 패들(paddle)로 몸을 때리는 활동입니다. 패들은 도구 이름, 패들링은 활동 이름입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>여러 가닥 끈이 달린 플로거와 달리 넓은 면이 있는 도구를 뜻합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>패들의 모양·상징만 관심. 타격 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감에 관심이 있지만 통증이 생기면 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함한 타격 경험도 허용 범위로 검토\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 자극을 선호할 수 있음. 패들이라는 이름만으로 특정 단계를 정하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:whipping\">\u003csummary>채찍을 사용하는 타격 활동\u003csmall style=\"display:block;font-weight:400\">휘핑 · Whipping\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>채찍으로 타격 자극을 주는 활동을 넓게 부르는 말입니다. 여러 가닥 도구를 포함해 쓰기도 하므로 실제 도구를 확인해야 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>작품에 채찍질이라고만 나오면 도구 종류와 자극 강도는 아직 알 수 없습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>채찍의 이미지·소리 등 연출만 관심. 타격 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>타격감은 관심 있으나 통증은 제외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>통증을 포함한 자극도 관심 범위에 넣음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>강한 자극을 선호할 수 있으나 상처를 등급이나 목표로 삼지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:discipline\">\u003csummary>정한 규칙을 지키고 피드백하는 관계 활동\u003csmall style=\"display:block;font-weight:400\">훈육 · 디시플린 · Discipline\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>서로 정한 규칙을 수행하고, 지켰는지 확인하거나 어겼을 때의 반응을 정하는 활동입니다. 훈육이라고 번역합니다. 체벌이 필수는 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>합의한 게임 규칙을 지키고 결과를 함께 확인하는 구조를 생각하면 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>지켜도 되고 거절해도 되는 가벼운 약속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>장면 안에서 규칙 하나와 피드백 방식을 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 규칙과 적용 예외를 정해 일관되게 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>규칙 구조를 관계의 중요한 부분으로 삼음. 거절·중단 요구는 위반으로 취급하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:rules\">\u003csummary>지킬 약속 정하기\u003csmall style=\"display:block;font-weight:400\">규칙 설정 · Rules\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>무엇을 언제 어떻게 할지 당사자끼리 정한 약속입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>장면 중에 쓸 호칭 하나를 정하는 것도 규칙의 한 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>부담 없이 선택하는 약속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 상황에만 적용할 약속 하나\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 약속의 적용 상황·예외를 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>일상 일부에도 약속을 적용하되 영역마다 별도 허용을 정함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:reward\">\u003csummary>인정이나 보상을 주고받기\u003csmall style=\"display:block;font-weight:400\">보상 중심 · Reward\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>원한 행동이나 노력을 알아주고, 미리 정한 칭찬·작은 보상 등을 주고받는 방식입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>약속을 지킨 것에 대해 고맙다고 말하는 것이 개념 예시입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>잘한 점을 말로 알아줌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 과제와 보상을 연결\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 과제별 보상을 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>정기적인 보상 구조를 중요하게 여김. 기본 권리를 보상으로 거래하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:correction\">\u003csummary>약속에 대한 피드백\u003csmall style=\"display:block;font-weight:400\">교정 중심 · Correction\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 규칙과 실제 행동의 차이를 짚고 다시 조정하는 방식입니다. 상대 인격을 고친다는 뜻은 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>정해 둔 약속을 서로 다르게 이해했다면 그 내용을 다시 맞추는 것입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>어떻게 이해했는지 함께 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 약속 하나를 짧게 되짚음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 약속을 점검하고 예외도 조정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>일관된 피드백 구조를 선호. 실제 거절이나 의견 차이를 잘못으로 취급하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:service\">\u003csummary>도움·시중·기여를 즐기는 활동\u003csmall style=\"display:block;font-weight:400\">봉사 · 서비스 · Service\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>상대에게 필요한 도움이나 맡은 일을 제공하는 데 의미를 두는 활동입니다. 봉사라는 말도 쓰지만 강제 노동을 뜻하지 않습니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>차를 준비하거나 필요한 물건을 챙겨주는 일도 당사자가 그 역할을 원한다면 예가 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가끔 작은 도움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 도움 한 가지를 맡음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>몇 가지 도움을 정기적으로 맡음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>기여하는 역할이 관계의 중심. 감당할 일·쉬는 시간·거절 범위를 함께 정함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:protocol\">\u003csummary>관계 안의 호칭·예절·절차\u003csmall style=\"display:block;font-weight:400\">프로토콜 · 예절 · Protocol\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>서로 어떤 호칭을 쓰고 어떻게 인사하거나 요청할지 정한 격식입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>특정 장면에서만 정한 호칭을 쓰기로 약속하는 것입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>호칭이나 인사 한 가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 장면의 호칭과 요청 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>장면 시작·진행·종료의 여러 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>격식이 관계에서 큰 비중을 차지함. 공개 장소·일상 적용은 별도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:ritual\">\u003csummary>의미를 담아 반복하는 절차\u003csmall style=\"display:block;font-weight:400\">리추얼 · 의식 · Ritual\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>당사자에게 상징적 의미가 있는 행동이나 순서를 반복하는 것입니다. 리추얼이라고도 씁니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>장면을 시작하기 전에 서로 준비됐는지 확인하는 일정한 인사가 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>작은 시작·종료 신호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정해 둔 순서 한 가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>시작과 종료에 여러 순서를 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>반복 절차 자체를 중요한 관계 경험으로 여김. 의무 강도와는 별개\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:commands\">\u003csummary>맡긴 범위의 지시 주고받기\u003csmall style=\"display:block;font-weight:400\">지시 수행 · Commands\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>한 사람이 구체적인 요청·지시를 하고 다른 사람이 합의한 범위에서 수행하는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>대신 골라 달라고 부탁한 선택을 상대가 정해 주는 상황을 생각하면 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>선택 가능한 제안\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>맡긴 선택 하나에 대한 지시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>정한 장면에서 여러 선택을 맡김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>맡기는 선택 범위가 넓음. 일상 전권이나 거절 불가를 뜻하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:primal\">\u003csummary>정해진 예절보다 즉흥적 반응을 중시하는 역할 활동\u003csmall style=\"display:block;font-weight:400\">프라이멀 플레이 · Primal play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>격식 있는 호칭·절차보다 추격·경쟁·몸짓 같은 즉흥적 상호작용을 중시하는 활동입니다. 본능형이라고 설명하기도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>추격하는 역할과 피하는 역할을 정한 허구 놀이가 한 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>말로 도전하는 분위기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>미리 정한 짧은 역할 구도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>경쟁 구도와 즉흥적 반응이 장면의 중심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>역할에 깊게 몰입. 실제 거절·중단 요구는 놀이로 재해석하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:chase\">\u003csummary>쫓고 피하는 역할극\u003csmall style=\"display:block;font-weight:400\">추격·회피 역할극 · Chase play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>쫓는 쪽과 피하는 쪽의 역할을 합의한 활동입니다. 실제로 도망가고 싶다는 표현과 구별해야 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>술래·추격자와 도망가는 등장인물처럼 역할을 정하는 개념입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>추격을 소재로 말장난\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 시작·끝이 있는 짧은 역할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>추격·회피 구도를 장면의 중심으로 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>추격 역할에 깊게 몰입하되 종료 신호·범위를 그대로 유지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:bratPlay\">\u003csummary>장난스럽게 반항하고 받아주기\u003csmall style=\"display:block;font-weight:400\">브랫 플레이 · Brat play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 장난·말대꾸·도발과 상대의 응수를 즐기는 활동입니다. 실제 불편함의 표현은 포함하지 않습니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>가벼운 말장난을 주고받고 상대가 재치 있게 받아주는 모습이 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가벼운 말장난\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>서로 받아주기로 한 특정 도발\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>반항과 응수가 장면의 주요 흐름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>반응 교환에 깊게 몰입. 굴복·벌·제압으로 끝나야 하는 것은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:teasing\">\u003csummary>놀리며 반응 주고받기\u003csmall style=\"display:block;font-weight:400\">티징 · 떠보기 · Teasing\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>상대가 허용한 범위의 놀림이나 떠보기로 반응을 교환하는 것입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>서로 불편하지 않은 별명으로 짧게 놀리고 웃는 상황이 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>한 번의 가벼운 농담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>합의한 소재의 놀림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>떠보기·응수가 이어지는 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>놀림이 상호작용의 중심. 실제 약점·거절을 압박하는 말은 별도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:degradation\">\u003csummary>합의한 낮춤·비하 표현\u003csmall style=\"display:block;font-weight:400\">디그레이데이션 · Degradation\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>미리 허용한 낮춤 표현을 역할 안에서 주고받는 활동입니다. 디그라고 줄여 부르기도 합니다. 실제 인격 평가와 구분합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>특정 호칭은 허용하되 외모·가족을 건드리는 말은 제외하는 식으로 허용 단어를 구체적으로 구분합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>낮춤 표현 없이 분위기만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>허용한 호칭 한 가지로 제한\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>몇 가지 허용 표현과 적용 상황을 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>낮춤 역할이 장면의 중심. 실제 가치·인격을 부정할 허가가 생기지는 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:humiliation\">\u003csummary>부끄러움을 느끼는 상황의 역할극\u003csmall style=\"display:block;font-weight:400\">휴밀리에이션 · Humiliation\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>합의한 상황에서 부끄럽거나 민망한 감정을 경험하는 활동입니다. 말로 비하하지 않아도 성립합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>칭찬을 크게 받는 것을 쑥스러워하는 상황과 모욕을 당하는 상황은 다릅니다. 무엇이 부끄러운지부터 확인합니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>쑥스러운 분위기만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 상대 앞의 특정 상황 하나\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>몇 가지 상황과 공개 범위를 따로 정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>부끄러움이 경험의 중심. 허락하지 않은 관객·공개는 포함하지 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:praise\">\u003csummary>칭찬과 인정 주고받기\u003csmall style=\"display:block;font-weight:400\">프레이즈 · 칭찬 · Praise\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>말이나 태도로 상대의 노력·선택을 알아주고 인정하는 활동입니다. 프레이즈라고 음역합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>막연한 칭찬보다 약속을 지켜 줘서 고맙다고 구체적으로 말하는 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가끔 칭찬 한마디\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 행동을 구체적으로 칭찬\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>반복적인 칭찬·확인이 관계에서 중요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>칭찬받거나 해 주는 경험이 핵심. 칭찬 없이는 판단할 수 없게 만드는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:sensory\">\u003csummary>촉감·소리 등 감각에 집중하기\u003csmall style=\"display:block;font-weight:400\">센세이션 · 감각 · Sensation play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>촉감·소리·온도처럼 감각의 차이를 경험하는 활동의 큰 묶음입니다. 센세이션 플레이라고도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>부드러운 천과 매끈한 천의 촉감 차이에 집중하는 것이 개념 예시입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:carePlay\">\u003csummary>돌보고 돌봄받는 역할극\u003csmall style=\"display:block;font-weight:400\">돌봄 역할극 · Care play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>성인으로서 돌봄을 제공하거나 받는 역할을 경험하는 것입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>피곤할 때 쉬는 공간을 챙겨 주되 무엇이 필요한지는 본인에게 묻는 모습입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>가벼운 안부·배려\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 도움 하나를 맡김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>정한 시간에 여러 도움을 주고받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>돌봄 역할이 관계의 중심. 상대의 판단력·독립성을 없애는 것은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:worship\">\u003csummary>존중·찬미를 강조하는 표현\u003csmall style=\"display:block;font-weight:400\">워십 · 숭배적 표현 · Worship\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>상대를 특별히 존중하거나 찬미하는 태도를 강조하는 표현입니다. 워십이라고도 합니다. 실제 종교 행위와 같다는 뜻은 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>상대의 장점을 말로 찬미하거나 정중한 인사에 의미를 두는 경우입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>존중 표현 한마디\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 인사·찬미 표현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>여러 표현을 정한 장면에 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>찬미하는 태도가 중심. 실제 권리나 결정권을 넘긴다는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:objectRole\">\u003csummary>사물의 역할을 빌리는 성인 역할극\u003csmall style=\"display:block;font-weight:400\">오브젝트 역할극 · Objectification roleplay\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>성인 당사자가 허구적으로 사물의 역할을 맡는 설정입니다. 실제 인격이나 의사를 없애는 것이 아닙니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>조각상 역할처럼 정한 순간 동안 말없이 한 자세를 표현하는 허구 설정이 개념 예입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>역할 이름·이미지만 관심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>정한 짧은 상황 하나의 역할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>시작·종료·표현 범위를 정한 역할 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>허구 역할 몰입이 중심. 의사 표현·중단권을 없애는 설정은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:roleplay\">\u003csummary>허구의 인물·상황을 맡는 놀이\u003csmall style=\"display:block;font-weight:400\">역할극 · Roleplay\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>현실의 직업·권한과 별도로 허구 인물이나 관계를 정해 연기하는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>집사와 손님처럼 역할을 정하더라도 실제 고용 관계가 생기지는 않습니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>호칭·대사만 역할에 맞춤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>상황 한 가지를 정해 짧게 연기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>배경·관계·시작과 종료가 있는 장면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>역할에 깊게 몰입. 장면 밖 권한·실제 동의는 별도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:aesthetic\">\u003csummary>복장·소품·분위기 연출\u003csmall style=\"display:block;font-weight:400\">미적 연출 · Aesthetic play\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>어떤 모습으로 보이는지, 어떤 분위기를 만드는지에 의미를 두는 활동입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>같은 대화라도 정장·조명·소품을 통해 격식 있는 분위기를 만드는 경우입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>소품 한 가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>복장과 소품을 함께 선택\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>장소·복장·소품에 일관된 주제를 둠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>시각적 연출이 장면의 중심. 행동 강도·권한 위임과는 별개\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:collar\">\u003csummary>목걸이 등으로 관계의 약속을 표현하기\u003csmall style=\"display:block;font-weight:400\">칼라링 · 관계 상징 · Collaring\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>목에 두르는 칼라(collar) 등을 관계의 상징으로 삼거나 이를 주고받는 의식을 말합니다. 목줄을 뜻하는 리시(leash)와는 다른 말입니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>커플 반지처럼 상징에 의미를 두되, 무엇을 약속하는지는 당사자가 정하는 경우입니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>장신구 디자인만 선호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>특정 장면의 상징으로 사용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>관계의 약속을 담아 주고받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>정식 의식·지속적 의미를 중요하게 여김. 실제 소유권·상시 통제권이 생기지는 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair activity-explained\" data-activity=\"activities:contracts\">\u003csummary>관계의 약속을 글로 정리하기\u003csmall style=\"display:block;font-weight:400\">관계 약속·계약 연출 · Relationship agreement\u003c/small>\u003c/summary>\u003cdiv class=\"body\">\u003ch3>무엇인가요?\u003c/h3>\u003cp>원하는 관계·범위·금지·변경 방법을 문서로 정리하는 것입니다. 역할극 안에서 계약처럼 연출하기도 합니다.\u003c/p>\u003ch3>이런 뜻입니다\u003c/h3>\u003cp>동의한 범위와 언제든 바꿀 수 있는 내용을 함께 적는 약속표를 생각하면 됩니다.\u003c/p>\u003ch3>단계마다 무엇이 달라지나요?\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>이 자료에서 구별하는 관심·허용 범위의 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>이번에는 해당 활동을 하지 않습니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>짧은 약속 메모\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>한 장면의 범위·종료 조건 기록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>관계의 여러 영역과 예외를 구분해 기록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>장기적인 약속 문서를 주기적으로 확인·변경. 철회할 수 없는 동의서라는 뜻은 아님\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">도구명은 단계명이 아닙니다. 이 예와 맞지 않는 취향은 본인의 기준을 따로 적습니다. 단계 표시는 자동 실행이나 안전 보장이 아닙니다.\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003csection id=\"reading-overview\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">먼저 읽기\u003c/div>\u003ch2>다섯 칸으로 먼저 읽기\u003c/h2>\u003cp class=\"lede\">역할 이름보다 구체적인 범위를 먼저 확인하세요.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>역할\u003c/h3>\u003cp>주도권과 활동의 진행·수용은 서로 다른 축입니다. 같은 사람에게 여러 역할이 함께 있을 수 있습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>태도와 방식\u003c/h3>\u003cp>온화함·엄격함은 표현 방식입니다. 소프트라는 말만으로 통증·위임(정한 선택을 다른 사람에게 맡김) 범위를 정하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>관심 활동\u003c/h3>\u003cp>관심이 있다는 것과 지금 하고 싶다는 것은 다릅니다. 상대방의 취향도 별도로 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>개별 상한\u003c/h3>\u003cp>활동마다 시작 기준·허용 조건·제외할 내용을 따로 적습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>적용 범위\u003c/h3>\u003cp>일상과 합의한 장면의 범위를 구분합니다. 관계 이름은 포괄적인 동의가 아닙니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">아래 목차에서 상세 설명과 전체 용어 사전을 이어서 확인할 수 있습니다. 0~4는 이 자료의 비교 틀이며, 공식 등급이나 필수 상승 순서가 아닙니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">01 / INTRODUCTION\u003c/div>\u003ch1>같은 이름,\u003cbr>다른 취향과 강도.\u003c/h1>\u003cp class=\"lede\">BDSM의 역할·성향·활동을 구분하고, 무엇을 기준으로 ‘가볍다’ 혹은 ‘강하다’고 말하는지 이해하는 자료.\u003c/p>\u003cdiv class=\"row\">\u003cspan class=\"tag\">성인 대상\u003c/span>\u003cspan class=\"tag\">입문·개념 안내\u003c/span>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>오늘의 중심 질문\u003c/strong>\u003cbr>“나는 무슨 성향인가?”와 “어느 정도를 원하는가?”는 다른 질문입니다. 역할 이름 하나로 허용 행동·강도·관계 전체를 알 수 없습니다.\u003c/div>\u003cdiv class=\"grid three\">\u003cdiv class=\"card\">\u003cdiv class=\"num\">B / D\u003c/div>\u003ch3>구속·훈육\u003c/h3>\u003cp>움직임의 제한, 합의한 규칙·과제·피드백 구조.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"num\">D / S\u003c/div>\u003ch3>지배·복종\u003c/h3>\u003cp>누가 어떤 결정권을 맡고, 어떤 범위에서 위임(정한 선택을 다른 사람에게 맡김)하는가.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"num\">S / M\u003c/div>\u003ch3>가학·피학\u003c/h3>\u003cp>특정 맥락의 자극을 주고받는 취향. 권한 관계와는 별개.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"reference\">BDSM의 큰 분류: NCSF 용어 자료 [1]. 모든 요소를 동시에 선호할 필요는 없습니다.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>이 자료에서 배우는 것\u003c/h3>\u003cp>역할과 활동의 차이 / 여러 성향의 조합 / 활동별 비교 기준 / 일상과 플레이의 분리 / 개인별 경계.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>먼저 정할 전제\u003c/h3>\u003cp>성인 간 명시적 합의, 동의 변경·철회, 개인차를 전제로 설명합니다. 성적 활동 없이 역할·신뢰·미적 경험을 즐기는 경우도 있습니다.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">02 / ROLES &amp; PREFERENCES\u003c/div>\u003ch2>성향명은 무엇을 말해줄까?\u003c/h2>\u003cp class=\"lede\">주도권, 활동의 방향, 자극 취향, 관계 명칭은 서로 다른 정보를 담습니다.\u003c/p>\u003cdiv class=\"callout\">\u003cstrong>돔 = 탑 = 새디스트, 서브 = 바텀 = 마조히스트?\u003c/strong>\u003cbr>겹칠 수 있지만 같은 말은 아닙니다. 한 사람에게 여러 키워드가 함께 붙을 수 있습니다.\u003c/div>\u003cdiv id=\"rolePairs\">\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>마스터·슬레이브는 ‘하드 다음 단계’가 아닙니다.\u003c/strong>\u003cbr>관계 이름은 합의한 구조를 표현합니다. 실제 권한 범위·활동·자극·지속 시간을 따로 확인해야 합니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">03 / COMBINATIONS\u003c/div>\u003ch2>수식어가 붙으면 표현 방식이 달라집니다.\u003c/h2>\u003cp class=\"lede\">소프트·서비스·브랫을 하나의 강도 순서에 놓지 않습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>분류\u003c/th>\u003cth>예시 키워드\u003c/th>\u003cth>알려주는 정보\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>역할\u003c/td>\u003ctd>돔·서브·리거(줄 활동을 진행하는 역할)·프레이(추격 역할극에서 쫓기는 역할)\u003c/td>\u003ctd>주도권 또는 맡는 활동 역할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지향점\u003c/td>\u003ctd>서비스·돌봄·칭찬·규율\u003c/td>\u003ctd>어떤 경험·상호작용을 중요하게 여기는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스타일\u003c/td>\u003ctd>소프트·온화형·엄격형·장난형\u003c/td>\u003ctd>어떤 태도로 표현하는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반응 성향\u003c/td>\u003ctd>브랫·선택적 위임(정한 선택을 다른 사람에게 맡김)·자기주장\u003c/td>\u003ctd>어떤 방식으로 호응·반응하는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>활동\u003c/td>\u003ctd>본디지(움직임을 제한하는 활동)·스팽킹·훈육\u003c/td>\u003ctd>무엇에 관심이 있는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>강도·범위\u003c/td>\u003ctd>낮은 신체 자극·깊은 몰입·장면 한정\u003c/td>\u003ctd>어느 축에서 어느 정도를 원하는가\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"styleCards\" class=\"grid\">\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>소프트 + 서비스 지향 + 돔\u003c/h3>\u003cp>부드러운 태도로 상대의 필요를 살피며 주도할 수 있습니다. 신체 자극 강도는 이 조합만으로 알 수 없습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>자기주장형 + 브랫 + 서브\u003c/h3>\u003cp>의견·반격·조건을 표현하면서 합의한 상황에 자발적으로 참여할 수 있습니다. 소심하거나 무조건 순종적일 필요는 없습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>온화형 + 새디스트\u003c/h3>\u003cp>말투는 온화하고 자극 취향은 가학(합의한 고통·자극을 주는 취향)적일 수 있습니다. 태도의 온화함과 자극 수준은 다른 축입니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>엄격형 + 장면 한정\u003c/h3>\u003cp>플레이의 합의 규칙은 엄격하게 적용해도 일상 관계는 대등할 수 있습니다.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"reference\">소프트 돔은 커뮤니티에서 쓰이는 스타일 표현입니다 [3]. ‘온화형·절제형·자기주장형’ 등 일부 표현은 이해를 돕는 설명용 수식어이며 공식 유형명이 아닙니다.\u003c/p>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">04 / INTENSITY AXES\u003c/div>\u003ch2>‘얼마나 강한가’를 한 숫자로 묶지 않기.\u003c/h2>\u003cp class=\"lede\">신체 자극이 낮아도 심리 몰입은 깊을 수 있습니다. 적용 시간이 길어도 매 순간 강한 활동을 하는 것은 아닙니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>비교 축\u003c/th>\u003cth>낮거나 좁은 쪽\u003c/th>\u003cth>높거나 넓은 쪽\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>신체 자극\u003c/td>\u003ctd>통증을 원하지 않음·약한 감각\u003c/td>\u003ctd>본인 기준 강한 자극 선호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>심리적 몰입\u003c/td>\u003ctd>가벼운 분위기·짧은 역할\u003c/td>\u003ctd>강한 긴장·깊은 역할 몰입\u003c/td>\u003c/tr>\u003ctr>\u003ctd>권한 위임(정한 선택을 다른 사람에게 맡김)\u003c/td>\u003ctd>특정 선택만 잠시 맡김\u003c/td>\u003ctd>구체적으로 합의한 여러 결정·영역\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙 엄격함\u003c/td>\u003ctd>선택 가능한 약속·유연한 조정\u003c/td>\u003ctd>명확한 기준·일관된 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지속·빈도\u003c/td>\u003ctd>짧게·가끔\u003c/td>\u003ctd>길게·정기적으로\u003c/td>\u003c/tr>\u003ctr>\u003ctd>적용 범위\u003c/td>\u003ctd>특정 장면만\u003c/td>\u003ctd>합의한 일부 일상 영역에도 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>취향의 중요도\u003c/td>\u003ctd>있으면 좋은 요소\u003c/td>\u003ctd>만족에서 중요한 요소\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"controls\">\u003clabel for=\"profileSelect\">가상 인물의 취향 비교\u003c/label>\u003cselect id=\"profileSelect\">\u003coption value=\"0\">신체 자극은 낮게 / 신뢰·몰입은 깊게\u003c/option>\u003coption value=\"1\">자극은 높게 / 권한 관계는 대등하게\u003c/option>\u003coption value=\"2\">규칙은 분명하게 / 일상 적용은 없이\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"profileReadout\" class=\"card\">\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>이 숫자는 가상 사례의 설명값입니다.\u003c/strong>\u003cbr>진단·숙련도·안전성 점수가 아닙니다. 위험도는 강도와 별도이며, 낮은 강도처럼 보여도 활동 특성에 따라 위험할 수 있습니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">05 / ACTIVITY COMPARISON\u003c/div>\u003ch2>활동마다 다른 단계 기준.\u003c/h2>\u003cp class=\"lede\">활동을 골라 어떤 축이 달라지는지 비교하세요. 0~4는 설명용 비교 칸이며 입문 순서나 공통 등급이 아닙니다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"activitySelect\">활동 선택 · 34개\u003c/label>\u003cselect id=\"activitySelect\">\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"familySelect\">설명 기준으로 선택\u003c/label>\u003cselect id=\"familySelect\">\u003c/select>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"activityReadout\">\u003cdiv class=\"card\">\u003cspan class=\"eyebrow\" id=\"activityAxis\">\u003c/span>\u003ch3 id=\"activityTitle\">\u003c/h3>\u003cp aria-live=\"polite\" id=\"activityDefinition\">\u003c/p>\u003cp id=\"activityFamily\" class=\"muted\">\u003c/p>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>비교 칸\u003c/th>\u003cth>선호·합의의 차이\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"activityStages\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>무엇이 달라지나요?\u003c/strong>\u003cp id=\"activityChange\">\u003c/p>\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>혼동하지 않기\u003c/strong>\u003cp id=\"activityNot\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>같은 단계 ≠ 같은 경험\u003c/h3>\u003cp>한 사람이 ‘낮음’이라고 느끼는 것을 다른 사람은 부담스럽게 느낄 수 있습니다. 허용 단어·상황·시간·강도를 개인의 말로 구체화해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>단계 ≠ 목표\u003c/h3>\u003cp>0에 머물러도 되고 특정 활동을 제외해도 됩니다. 관계가 깊어진다고 높은 단계로 옮겨가야 하는 것은 아닙니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"print-note hidden\">\u003cp>인쇄본에는 현재 선택한 활동·기준의 비교표가 들어갑니다. 다른 활동은 HTML의 선택 메뉴에서 확인할 수 있습니다.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">06 / CONTEXT &amp; LIMITS\u003c/div>\u003ch2>일상과 플레이의 상한은 따로.\u003c/h2>\u003cp class=\"lede\">같은 사람도 상황에 따라 다른 표현을 원합니다. 성향이 존재한다는 사실과 지금 실행해도 된다는 것은 다릅니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>일상 표현의 예\u003c/th>\u003cth>가능한 모습\u003c/th>\u003cth>자동 포함되지 않는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>표현 없음\u003c/td>\u003ctd>기존 성격·관계로 대화\u003c/td>\u003ctd>BDSM 역할 도입\u003c/td>\u003c/tr>\u003ctr>\u003ctd>은근한 기질\u003c/td>\u003ctd>말투·여유·가벼운 주도성\u003c/td>\u003ctd>실제 명령권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>장난·제안\u003c/td>\u003ctd>티키타카·선택 가능한 제안\u003c/td>\u003ctd>이행 강요·거절 처벌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특정 규칙\u003c/td>\u003ctd>정한 상황에서만 합의한 약속\u003c/td>\u003ctd>다른 생활 영역의 통제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지속적 관계\u003c/td>\u003ctd>합의한 여러 영역에서 역할 유지\u003c/td>\u003ctd>생활 전권·철회 불가\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>일상은 은근하게, 플레이는 분명하게\u003c/h3>\u003cp>평소에는 가벼운 주도성만 드러내고, 별도 합의한 장면에서는 역할과 규칙을 더 분명하게 표현할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>일상 관계는 혐관·라이벌일 수도\u003c/h3>\u003cp>반감·경쟁심과 활동 취향은 별개입니다. 말싸움에서 밀리는 것, 도발하는 것, 장난을 받아주는 것은 플레이 동의가 아닙니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>시작 → 범위 유지 → 종료 → 복귀\u003c/strong>\u003cbr>시작 조건을 확인하고 합의한 범위 안에서만 진행합니다. 종료·중단 후에는 역할 권한을 계속 행사하지 않습니다. 사후의 대화·거리·휴식도 개인 선호에 맞춥니다.\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">07 / BOUNDARIES &amp; MISCONCEPTIONS\u003c/div>\u003ch2>강도를 말하기 전에, 경계를 구분하기.\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>하드 리밋\u003c/h3>\u003cp>하지 않기로 정한 경계. 다른 활동을 좋아하거나 높은 강도를 선호해도 이 경계는 별개입니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>소프트 리밋\u003c/h3>\u003cp>현재는 꺼려지거나 조건부인 경계. 자동 허용이 아니며, 새 논의와 명시적 동의가 필요합니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>중단 표현·신호\u003c/h3>\u003cp>합의한 중단 표현과 신호를 존중합니다. 명백한 동의 철회도 적용되며 역할 연기로 재해석하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>사후 돌봄\u003c/h3>\u003cp>원하는 휴식·대화·거리·확인 방식은 사람마다 다릅니다. 돌봄이나 접촉도 강요하지 않습니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>흔한 오해\u003c/th>\u003cth>구분해서 이해하기\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>바닐라는 0단계 입문자다\u003c/td>\u003ctd>BDSM 선호 여부를 나타낼 수 있는 말이다. 모두가 입문해야 하는 것이 아니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>하드일수록 진짜 성향이다\u003c/td>\u003ctd>정체성의 진위·숙련도와 강도는 다른 문제다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돔이면 통제하고 새디여야 한다\u003c/td>\u003ctd>합의한 권한만 맡는다. 가학(합의한 고통·자극을 주는 취향) 취향·통증은 별도다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>서브면 자기 의견이 없어야 한다\u003c/td>\u003ctd>성격·자기주장과 자발적 권한 위임(정한 선택을 다른 사람에게 맡김)은 다른 축이다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>브랫은 거절해도 사실은 원하는 것이다\u003c/td>\u003ctd>역할 장난과 실제 거절을 구분한다. 이름으로 동의를 추정하지 않는다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>로프버니(줄 활동을 받는 역할)면 강한 통증을 좋아한다\u003c/td>\u003ctd>구속·미적 경험·집중·신뢰 등 동기가 다양하다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>엣지플레이는 하드의 다음 단계다\u003c/td>\u003ctd>위험·개인의 경계와 관련된 표현이다. 권장 성장 단계가 아니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>동의하면 모든 것이 안전해진다\u003c/td>\u003ctd>동의와 위험은 별개다. 합의가 신체적·심리적 위험을 없애지는 않는다.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reference\">동의와 사전 허용의 기본 개념은 NCSF 자료 [1][2]를 참고했습니다. 이 자료는 의료·법률 판단이나 실제 수행 교육을 제공하지 않습니다.\u003c/p>\u003c/section>\n\u003csection class=\"chapter\" id=\"ch7\">\u003cdiv class=\"eyebrow\">08 / GLOSSARY &amp; REFERENCES\u003c/div>\u003ch2>용어를 찾아보는 확장 사전.\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리한 142개 항목. 별칭은 같은 항목에 묶었습니다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"glossarySearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"glossarySearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디, 서비스\">\u003c/div>\u003cdiv>\u003clabel for=\"glossaryCategory\">분류\u003c/label>\u003cselect id=\"glossaryCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">세부 취향\u003c/option>\u003coption value=\"activities\">활동·플레이\u003c/option>\u003coption value=\"materials\">소재·상징\u003c/option>\u003coption value=\"style\">표현 스타일\u003c/option>\u003coption value=\"focus\">만족의 중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv id=\"glossaryCount\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv id=\"glossaryEntries\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">\u003cstrong>사전의 범위\u003c/strong>\u003cbr>모든 커뮤니티의 명칭·개인 취향을 완결한 공식 목록은 아닙니다. 관계·활동 명칭과 설명용 번역·수식어가 함께 포함되어 있습니다. 새 용어를 접하면 역할, 활동, 스타일, 강도 중 무엇을 가리키는지부터 확인하세요.\u003c/div>\u003ch3 style=\"margin-top:40px\">출처와 편집 기준\u003c/h3>\u003col class=\"source-list\">\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003cbr>\u003csmall>BDSM의 큰 분류, 역할·권한·동의에 관한 기본 개념.\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003cbr>\u003csmall>명시적 합의와 허용 범위를 구분하는 참고 자료.\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/roles/dominant-wzwjm\" target=\"_blank\" rel=\"noopener\">Dominant\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/roles/primal-hunter-neeth\" target=\"_blank\" rel=\"noopener\">Primal Hunter\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/roles/rope-bunny-mmklo\" target=\"_blank\" rel=\"noopener\">Rope Bunny\u003c/a>\u003cbr>\u003csmall>커뮤니티에서 사용하는 명칭·별칭의 참고. 이용자 기여형 자료로, 표준 분류나 임상적 근거와 구별.\u003c/small>\u003c/li>\u003cli>쉬운 활동명·도구명 대조: \u003ca href=\"https://fetlife.com/kinktionary/kink-activities/impact-play-eiqpl\" target=\"_blank\" rel=\"noopener\">FetLife · Impact Play\u003c/a> / \u003ca href=\"https://fetlife.com/kinktionary/toys-equipment/impact-tools/flogger-urrya\" target=\"_blank\" rel=\"noopener\">FetLife · Flogger\u003c/a>. 공동체에서 쓰는 용어 참고이며 공식 단계표는 아닙니다.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·가상 사례는 이해를 돕기 위한 자체 구성입니다. 물리적 실행법·매듭·도구 사용·자극 세기 지침은 포함하지 않았습니다.\u003c/p>\u003c/section>\n\u003cdiv class=\"coursefooter\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"02_beginner.html\">다음 과정 · 초급 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">1 / 8\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\n\u003cscript id=\"lectureData\" type=\"application/json\">{\"families\":{\"power\":{\"title\":
