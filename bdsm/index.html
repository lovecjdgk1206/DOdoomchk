ading-current{display:block!important}.chapter>*{overflow-wrap:anywhere}table{font-size:15px}th,td{line-height:1.75}.eyebrow{letter-spacing:1px}.entry{padding:18px}.entry p{font-size:15px}.reading-kicker{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}.reading-intro{padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}.reading-intro p{color:var(--muted)}@media(max-width:650px){main,.present main{padding:16px 18px 45px}.grid,.glossary-grid{grid-template-columns:1fr}.chapter{padding-top:18px}.card{padding:18px}}@media print{.chapter{display:block!important;break-inside:auto}main{padding:0}.chapter h2{break-after:avoid}}\u003c/style>\u003c/head>\u003cbody>\u003caside class=\"love-rights\" aria-label=\"자료 권리 안내\">본 자료는 ‘러브’ 작가의 자료입니다. 무단 배포 및 수정을 금합니다.\u003c/aside>\u003cnav class=\"coursebar\" aria-label=\"자료 과정\">\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"01_intro.html\">1. 입문\u003c/a>\u003ca href=\"02_beginner.html\" aria-current=\"page\">2. 초급\u003c/a>\u003ca href=\"03_intermediate.html\">3. 중급\u003c/a>\u003ca href=\"04_advanced.html\">4. 고급\u003c/a>\u003ca href=\"05_situations.html\">5. 상황별 이해\u003c/a>\u003c/nav>\u003cheader class=\"topbar\">\u003cdiv>\u003cdiv class=\"brand\">02 초급 · 역할·취향·스타일 구분\u003c/div>\u003cdiv id=\"liveStatus\" role=\"status\" aria-live=\"polite\">읽기 모드 · 전체 스크롤\u003c/div>\u003c/div>\u003cdiv class=\"tools\">\u003cbutton id=\"modeButton\" aria-pressed=\"false\">집중 읽기\u003c/button>\u003cbutton id=\"fullButton\">전체 화면\u003c/button>\u003cbutton id=\"printButton\">인쇄·PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"shell\">\u003cnav class=\"sidebar\" aria-label=\"장별 목차\">\u003ca href=\"#ch0\">01 · 이름을 외우기 전에 분류부터\u003c/a>\u003ca href=\"#ch1\">02 · 역할 15쌍을 정확하게 읽기\u003c/a>\u003ca href=\"#ch2\">03 · 본디지·스팽·훈육은 같은 축인가\u003c/a>\u003ca href=\"#ch3\">04 · 수식어 조합을 해석하기\u003c/a>\u003ca href=\"#ch4\">05 · 취향·호기심·동의는 다르다\u003c/a>\u003ca href=\"#ch5\">06 · 사례 해설: 이름만으로 판단한 오류\u003c/a>\u003ca href=\"#ch6\">07 · 부록 · 전체 용어 찾아보기\u003c/a>\u003c/nav>\u003cmain>\u003csection id=\"plain-language\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">기초 용어부터\u003c/div>\u003ch2>낯선 말부터 쉬운 말로\u003c/h2>\u003cp class=\"lede\">이 자료는 국내·해외 통용도를 단정하지 않습니다. 쉬운 한국어 뜻을 먼저 쓰고, 외국어를 소리대로 쓴 말과 별칭을 함께 찾아볼 수 있게 했습니다.\u003c/p>\u003cdiv class=\"callout\">역할 이름은 누가 무엇을 맡는지, 활동 이름은 무엇을 하는지 말합니다. 도구 이름은 물건의 종류를 말합니다. 이 셋은 강도 단계가 아닙니다.\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>BDSM\u003c/h3>\u003cp>구속·규칙, 지배·복종, 가학·피학 등 여러 취향과 관계를 묶는 말입니다. 모든 요소를 함께 좋아해야 하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플레이 · 씬\u003c/h3>\u003cp>당사자가 시작·끝과 범위를 정한 활동 또는 역할 장면입니다. 일상의 모든 관계를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>가학 · 피학\u003c/h3>\u003cp>합의한 맥락에서 고통·강한 자극을 주는 취향 / 받는 취향입니다. 모든 고통·모든 상황을 좋아한다는 뜻은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>본디지 · 로프\u003c/h3>\u003cp>본디지는 움직임 제한 활동의 큰 분류, 로프는 줄을 사용하는 종류입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>임팩트 · 스팽 · 플로깅\u003c/h3>\u003cp>임팩트는 때리는 활동의 큰 분류입니다. 스팽킹은 보통 손이나 도구로 엉덩이 등을 때리는 활동, 플로깅은 여러 가닥 채찍을 쓰는 종류입니다. 서로 단계 이름이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>플로거 · 패들 · 채찍\u003c/h3>\u003cp>플로거는 여러 가닥 끈이 달린 도구, 패들은 넓고 납작한 면을 가진 도구입니다. 채찍은 더 넓은 표현이라 실제 종류를 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리밋 · 하드 리밋 · 소프트 리밋\u003c/h3>\u003cp>리밋은 경계·제외 조건입니다. 하드 리밋은 하지 않는 것, 소프트 리밋은 아직 부담이 있거나 조건을 논의해야 하는 것입니다. 소프트 리밋은 자동 허용이 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>세이프워드 · 세이프사인\u003c/h3>\u003cp>중단·조절을 위해 미리 정한 말 / 몸 신호입니다. 평범한 말로 거절하거나 동의를 철회하는 권리도 유지됩니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>체크인 · 애프터케어\u003c/h3>\u003cp>체크인은 진행 중 상태·의사를 확인하는 것, 애프터케어는 종료 후 필요한 휴식·도움·대화 등을 뜻합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>위임 · 상한\u003c/h3>\u003cp>위임은 정한 결정을 남에게 맡기는 것, 상한은 허용하기로 정한 최대 범위입니다. 좋아하는 취향과 지금 허용한 범위는 다를 수 있습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>몰입 · 위계\u003c/h3>\u003cp>몰입은 역할·경험에 집중하는 정도, 위계는 누가 어떤 상황의 안내·결정을 맡는지 정한 차이입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프로토콜 · 리추얼\u003c/h3>\u003cp>프로토콜은 호칭·예절 등 약속한 격식, 리추얼은 특별한 의미를 담아 반복하는 순서나 의식입니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그 · 휴밀리에이션\u003c/h3>\u003cp>디그는 허용한 낮춤·비하 표현, 휴밀리에이션은 부끄러움을 경험하는 상황입니다. 부끄럽다고 반드시 비하당하는 것은 아닙니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>칼라 · 리시 · 커프\u003c/h3>\u003cp>칼라는 목에 두르는 띠·목걸이, 리시는 연결하는 줄, 커프는 손목·발목 등에 두르는 띠 모양 도구를 가리킵니다. 착용만으로 권한이 생기지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>24/7 · TPE\u003c/h3>\u003cp>24/7은 지속적인 관계 형식을, TPE는 넓은 영역의 권한 위임을 표현할 때 쓰는 말입니다. 시간 범위와 위임 범위는 다른 축이며, 권리 포기나 철회 불가를 뜻하지 않습니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>페티시 · 킨크\u003c/h3>\u003cp>페티시는 특정 소재·대상 등에 강하게 끌리는 취향을, 킨크는 비관습적 취향을 넓게 가리킬 때 쓰는 말입니다. 사용 범위는 공동체마다 다를 수 있습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"reading-overview\" class=\"chapter\">\u003cdiv class=\"reading-kicker\">먼저 읽기\u003c/div>\u003ch2>같은 이름을 다르게 읽는 법\u003c/h2>\u003cp class=\"lede\">역할 + 태도 + 관심 활동 + 범위는 이해를 돕는 틀입니다. 공식 분류식은 아닙니다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>소프트와 서비스는 다릅니다\u003c/h3>\u003cp>소프트는 부드러운 표현을 뜻하는 경우가 많고, 서비스는 상대에게 도움이나 원하는 경험을 제공하는 지향을 뜻합니다. 실제 의미는 당사자에게 확인합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>브랫과 실제 거절\u003c/h3>\u003cp>장난스러운 반항이라는 취향이 모든 거절을 연출로 바꾸지는 않습니다. 실제 불편함·중단 요구를 우선합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>잘 맞는 짝을 단정하지 않기\u003c/h3>\u003cp>서비스 지향인 두 사람이 함께한다고 반드시 주도권 공백이 생기지 않습니다. 구체적인 원하는 경험과 맡을 일을 이야기합니다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>겹치는 역할에 개수 제한은 없습니다\u003c/h3>\u003cp>2~3개는 요약을 위한 편집 선택일 뿐입니다. 역할 수가 많다는 이유만으로 성격이 흐려지거나 취향이 틀린 것은 아닙니다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">아래 목차에서 상세 설명과 전체 용어 사전을 이어서 확인할 수 있습니다. 0~4는 이 자료의 비교 틀이며, 공식 등급이나 필수 상승 순서가 아닙니다.\u003c/div>\u003c/section>\u003csection class=\"chapter current\" id=\"ch0\">\u003cdiv class=\"eyebrow\">초급 / 01\u003c/div>\u003ch2>이름을 외우기 전에 분류부터\u003c/h2>\u003cp class=\"lede\">이 자료에서 알아볼 것: 역할·활동·스타일·강도를 섞지 않고 한 사람의 취향을 읽는다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>역할\u003c/h3>\u003cp>어떤 위치를 맡는가. 도미넌트·서브·리거(줄 활동을 진행하는 역할)·프레이(추격 역할극에서 쫓기는 역할)처럼 권한 또는 활동의 방향을 표현한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>활동\u003c/h3>\u003cp>무엇에 관심이 있는가. 본디지(움직임을 제한하는 활동)·스팽킹·훈육·감각 활동처럼 경험의 종류를 표현한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>스타일·지향\u003c/h3>\u003cp>어떻게 표현하고 무엇을 중시하는가. 소프트·서비스·칭찬·규율 등이 붙는다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>강도·범위\u003c/h3>\u003cp>어느 축에서 어느 정도, 어떤 상황까지 원하는가. 이름에서 자동 추론하지 않는다.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">\u003cb>읽는 순서:\u003c/b> 이름 → 분류 → 제공·수용 방향 → 중심 경험 → 적용 상황 → 개인별 한계.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch1\">\u003cdiv class=\"eyebrow\">초급 / 02\u003c/div>\u003ch2>역할 15쌍을 정확하게 읽기\u003c/h2>\u003cp class=\"lede\">같은 사람이 여러 역할을 가질 수 있고, 상대에 따라 달라질 수 있다.\u003c/p>\u003cdiv>\u003cdetails class=\"role-pair\">\u003csummary>도미넌트 ↔ 서브미시브\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 권한을 맡는 쪽 ↔ 자발적으로 맡기는 쪽\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 결정권의 방향\u003c/p>\u003cdiv class=\"callout\">돔이 항상 가학적이거나 서브가 모든 상황에 순종적인 것은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>탑 ↔ 바텀\u003c/summary>\u003cdiv class=\"body\">\u003cp>특정 활동을 진행하는 쪽 ↔ 받는 쪽\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 활동의 방향\u003c/p>\u003cdiv class=\"callout\">탑=돔, 바텀=서브라고 고정할 수 없다. 관계 권한과 활동 역할은 다른 축이다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>마스터·미스트리스 ↔ 슬레이브\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 관계에서 넓은 권한 위임(정한 선택을 다른 사람에게 맡김)을 표현하는 명칭\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 관계의 범위·형식\u003c/p>\u003cdiv class=\"callout\">돔/서브의 상위 등급이 아니다. 명칭만으로 허용 활동·강도·기간을 알 수 없다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>새디스트 ↔ 마조히스트\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 자극을 주는 취향 ↔ 받는 취향\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 자극의 방향·선호\u003c/p>\u003cdiv class=\"callout\">새디·매저라고도 부른다. 모든 통증·모든 상황을 좋아한다는 뜻은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>스위치·사도마조히스트\u003c/summary>\u003cdiv class=\"body\">\u003cp>역할을 전환하거나 가학(합의한 고통·자극을 주는 취향)·피학(합의한 고통·자극을 받는 취향) 양쪽 취향을 갖는 경우\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 전환의 대상·상황\u003c/p>\u003cdiv class=\"callout\">스위치와 사도마조히스트는 같은 말이 아니다. 권한 전환과 자극 취향을 구분한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>브랫 ↔ 브랫 테이머\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 반항·장난을 즐김 ↔ 이를 받아주며 이끎\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 반응 교환\u003c/p>\u003cdiv class=\"callout\">브랫은 무조건 서브라는 뜻이 아니며, 테이머도 항상 처벌로 대응하는 것은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>헌터·프레데터 ↔ 프레이\u003c/summary>\u003cdiv class=\"body\">\u003cp>추격·경쟁 구도를 맡는 쪽 ↔ 쫓기는 역할을 맡는 쪽\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 프라이멀(추격·경쟁 등 즉흥적 반응을 중시하는 역할) 역할\u003c/p>\u003cdiv class=\"callout\">헌터=돔, 프레이=서브가 자동 성립하지 않는다. 프라이멀 스위치도 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>리거 ↔ 로프버니·로프 바텀\u003c/summary>\u003cdiv class=\"body\">\u003cp>로프 구속을 구성하는 역할 ↔ 받는 역할\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 로프 활동의 방향\u003c/p>\u003cdiv class=\"callout\">로프버니라는 호칭 선호는 개인차가 있다. 본디지 탑/바텀은 로프 외 구속도 포함할 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>디그레이더 ↔ 디그레이디\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 비하 표현을 제공 ↔ 수용\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 언어·심리적 맥락\u003c/p>\u003cdiv class=\"callout\">실제 인격 평가나 일상 비하의 허용이 아니다. 수치심 역할과 겹칠 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>스팽커 ↔ 스팽키\u003c/summary>\u003cdiv class=\"body\">\u003cp>스팽킹을 제공 ↔ 수용\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 특정 활동의 방향\u003c/p>\u003cdiv class=\"callout\">스팽코는 스팽킹에 관심 있는 포괄적 표현이다. 역할명만으로 가학·복종을 확정하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>훈육자·트레이너 ↔ 트레이니\u003c/summary>\u003cdiv class=\"body\">\u003cp>합의한 규칙·과제를 진행 ↔ 배우고 수행\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 규칙·피드백 구조\u003c/p>\u003cdiv class=\"callout\">훈육은 강한 벌과 같은 말이 아니다. 명시한 규칙과 변경 조건을 본다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>서비스 돔·서비스 서브\u003c/summary>\u003cdiv class=\"body\">\u003cp>상대 필요 중심으로 주도 / 자발적 기여·봉사 중심\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 서비스를 표현하는 방식\u003c/p>\u003cdiv class=\"callout\">서비스는 서브에게만 붙는 말이 아니다. 방향과 역할을 함께 읽는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>오너·펫·펫 트레이너\u003c/summary>\u003cdiv class=\"body\">\u003cp>성인 간 소속·동물 역할극을 이끌거나 받음\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 상징 역할·돌봄\u003c/p>\u003cdiv class=\"callout\">실제 소유권·동물과 무관하다. 역할 이름이 강도 등급은 아니다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>케어기버 ↔ 돌봄 수용 역할\u003c/summary>\u003cdiv class=\"body\">\u003cp>성인 간 돌봄 제공 ↔ 돌봄 수용\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 안정감·돌봄\u003c/p>\u003cdiv class=\"callout\">돌봄받는 역할과 판단력·독립성 부족을 동일시하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>센슈얼리스트·감각 지향\u003c/summary>\u003cdiv class=\"body\">\u003cp>감각·분위기·집중을 중심으로 즐김\u003c/p>\u003cp>\u003cb>비교 축:\u003c/b> 감각 경험\u003c/p>\u003cdiv class=\"callout\">통증·권한 위임·높은 강도를 필수로 요구하지 않는다.\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch2\">\u003cdiv class=\"eyebrow\">초급 / 03\u003c/div>\u003ch2>본디지·스팽·훈육은 같은 축인가\u003c/h2>\u003cp class=\"lede\">활동 이름은 강도나 관계 서열을 결정하지 않는다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>활동 묶음\u003c/th>\u003cth>경험의 중심\u003c/th>\u003cth>따로 확인할 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>본디지(움직임을 제한하는 활동)·로프\u003c/td>\u003ctd>구속·미적 표현·신뢰·집중\u003c/td>\u003ctd>제공/수용, 제한의 범위, 지속, 감각\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스팽킹·임팩트(손이나 도구로 몸을 때리는 활동의 큰 분류)\u003c/td>\u003ctd>특정 자극 경험\u003c/td>\u003ctd>체감 자극, 방향, 지속, 제외 범위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>훈육·규율\u003c/td>\u003ctd>규칙·과제·피드백\u003c/td>\u003ctd>규칙 수, 엄격함, 적용 상황\u003c/td>\u003c/tr>\u003ctr>\u003ctd>프라이멀(추격·경쟁 등 즉흥적 반응을 중시하는 역할)·추격 역할\u003c/td>\u003ctd>추격·경쟁·본능적 분위기\u003c/td>\u003ctd>역할, 표현 범위, 중단 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>칭찬·서비스·돌봄\u003c/td>\u003ctd>인정·기여·안정감\u003c/td>\u003ctd>주고받는 방향, 빈도, 부담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>비하·수치심 역할\u003c/td>\u003ctd>언어·상황에 대한 심리적 경험\u003c/td>\u003ctd>허용 단어, 금지 주제, 장소·관객 여부\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout caution\">활동이 같아도 동기가 다를 수 있다. 스팽킹을 좋아한다고 벌을 원한다고 단정하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch3\">\u003cdiv class=\"eyebrow\">초급 / 04\u003c/div>\u003ch2>수식어 조합을 해석하기\u003c/h2>\u003cp class=\"lede\">소프트는 태도, 서비스는 지향점, 브랫은 반응 성향을 설명할 수 있다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>소프트·서비스 지향·돔\u003c/h3>\u003cp>부드러운 태도로 상대의 필요와 반응을 살피며 주도. 신체 자극 수준은 아직 미정.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>규율형·칭찬 중심·돔\u003c/h3>\u003cp>규칙은 분명하게, 피드백은 인정·격려 중심. 모욕·강한 벌은 자동 포함되지 않음.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>자기주장형·브랫·서브\u003c/h3>\u003cp>의견과 장난을 표현하면서 특정 범위에서 자발적으로 권한을 맡김.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>리거·미적 연출 지향\u003c/h3>\u003cp>구속의 시각적 구성이나 몰입을 중시. 서열·통증은 필수 조건이 아님.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>프레이·스위치\u003c/h3>\u003cp>추격 역할에서는 프레이(추격 역할극에서 쫓기는 역할)를 선호하면서 권한 관계는 상황별 전환 가능.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>디그레이디·장면 한정\u003c/h3>\u003cp>허용된 표현을 장면 안에서만 선호. 일상의 무례·비하를 허용한다는 뜻은 아님.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"callout\">조합이 생소하면 짧은 뜻을 덧붙인다. 설명용 수식어를 통일된 공식 유형으로 소개하지 않는다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch4\">\u003cdiv class=\"eyebrow\">초급 / 05\u003c/div>\u003ch2>취향·호기심·동의는 다르다\u003c/h2>\u003cp class=\"lede\">관심이 있다고 지금 참여하고 싶거나 모든 변형을 허용하는 것은 아니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>표현\u003c/th>\u003cth>알 수 있는 것\u003c/th>\u003cth>알 수 없는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>궁금하다\u003c/td>\u003ctd>호기심이 있다\u003c/td>\u003ctd>실제 경험을 원하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상상은 좋다\u003c/td>\u003ctd>상상 속 선호가 있다\u003c/td>\u003ctd>현실 실행을 원하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이 활동을 좋아한다\u003c/td>\u003ctd>어떤 경험의 선호가 있다\u003c/td>\u003ctd>현재 상대·장소·강도에 동의하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지난번에 했다\u003c/td>\u003ctd>과거 참여가 있었다\u003c/td>\u003ctd>오늘도 원하는지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나는 서브다\u003c/td>\u003ctd>본인의 역할 정체성을 표현한다\u003c/td>\u003ctd>누구에게나 복종하는지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">“어떤 상황에서는 좋고 어떤 상황에서는 싫은가?”를 확인하면 취향의 실제 범위를 알기 쉽다.\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"ch5\">\u003cdiv class=\"eyebrow\">초급 / 06\u003c/div>\u003ch2>사례 해설: 이름만으로 판단한 오류\u003c/h2>\u003cp class=\"lede\">해설을 펼쳐 어디서 추론이 과해졌는지 비교한다.\u003c/p>\u003cdetails class=\"role-pair\">\u003csummary>“돔이니까 질투하면 외출을 막아도 된다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>역할 이름을 일상 전권으로 확대했다.\u003c/p>\u003cdiv class=\"callout\">역할 선호와 일상 이동·교류에 대한 합의는 별개다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>“로프버니면 서브이고 통증도 좋아한다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>활동 수용을 관계 복종·통증 취향으로 연결했다.\u003c/p>\u003cdiv class=\"callout\">구속의 미적 경험이나 집중을 좋아할 수도 있다. 각 축을 따로 본다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>“브랫이면 싫다는 말도 장난이다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>성향명으로 현재 거절의 뜻을 지웠다.\u003c/p>\u003cdiv class=\"callout\">합의한 역할 표현과 실제 거절을 구분하며, 명백한 중단은 존중한다.\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"role-pair\">\u003csummary>“서비스 돔은 사실 서브다.”\u003c/summary>\u003cdiv class=\"body\">\u003cp>서비스의 방향과 관계 권한을 섞었다.\u003c/p>\u003cdiv class=\"callout\">상대 필요 중심으로 주도하는 돔도 있을 수 있다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"chapter\" id=\"ch6\">\u003cdiv class=\"eyebrow\">초급 / 07\u003c/div>\u003ch2>부록 · 전체 용어 찾아보기\u003c/h2>\u003cp class=\"lede\">역할·취향·활동·소재·스타일·관계 구조를 분리해 검색한다.\u003c/p>\u003cdiv class=\"controls\">\u003cdiv class=\"search-grid\">\u003cdiv>\u003clabel for=\"termSearch\">이름·별칭·뜻 검색\u003c/label>\u003cinput id=\"termSearch\" type=\"search\" placeholder=\"예: 매저, 프레이, 디그레이디\">\u003c/div>\u003cdiv>\u003clabel for=\"termCategory\">분류\u003c/label>\u003cselect id=\"termCategory\">\u003coption value=\"all\">전체\u003c/option>\u003coption value=\"role\">역할\u003c/option>\u003coption value=\"traits\">취향\u003c/option>\u003coption value=\"activities\">활동\u003c/option>\u003coption value=\"materials\">소재\u003c/option>\u003coption value=\"style\">스타일\u003c/option>\u003coption value=\"focus\">중심\u003c/option>\u003coption value=\"structure\">관계 구조\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cp id=\"termCount\" role=\"status\">\u003c/p>\u003c/div>\u003cdiv id=\"termGrid\" class=\"glossary-grid\">\u003c/div>\u003cdiv class=\"callout caution\">142개 항목은 확장 사전이지 모든 커뮤니티·개인 취향의 공식 전수 목록은 아니다. 별칭·번역·설명용 수식어의 차이를 함께 읽는다.\u003c/div>\u003ch3>출처·편집 기준\u003c/h3>\u003col>\u003cli>\u003ca href=\"https://ncsfreedom.org/wp-content/uploads/2019/12/Consent-Counts-Statement.pdf\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts Statement 및 용어 부록\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ncsfreedom.org/key-programs-2/consent-counts/\" target=\"_blank\" rel=\"noopener\">NCSF · Consent Counts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://fetlife.com/kinktionary/roles-ujio2\" target=\"_blank\" rel=\"noopener\">FetLife · Kinktionary Roles\u003c/a> — 커뮤니티 명칭·별칭의 참고. 공식 표준이나 임상 척도 아님.\u003c/li>\u003c/ol>\u003cp class=\"reference\">편집 기준일 2026-10-30. 단계표·사례는 이해를 돕기 위한 자체 구성. 실제 수행법·매듭·도구 운용·신체 부위·자극 수치 지침은 포함하지 않았습니다. 위험도·숙련도·취향 강도는 서로 다릅니다.\u003c/p>\u003c/section>\u003cdiv class=\"coursefooter\">\u003ca href=\"01_intro.html\">← 이전 과정 · 입문\u003c/a>\u003ca href=\"index.html\">전체 목차\u003c/a>\u003ca href=\"03_intermediate.html\">다음 과정 · 중급 →\u003c/a>\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"footer-controls\">\u003cbutton id=\"prevButton\">← 이전\u003c/button>\u003cspan id=\"slideCount\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"nextButton\">다음 →\u003c/button>\u003c/footer>\u003cscript id=\"courseData\" type=\"application/json\">{\"families\":{\"power\":{\"title\":\"권한을 맡기는 범위\",\"axis\":\"결정권·적용 영역\",\"levels\":[\"어떤 선택도 맡기지 않음. 제안은 거절할 수 있음.\",\"메뉴 고르기처럼 요청한 선택 한 가지만 맡김.\",\"정한 장면의 몇 가지 선택만 맡김. 장면 밖은 제외.\",\"장면 안의 여러 선택을 맡기되 제외할 결정은 따로 정함.\",\"일상 일부까지 맡기는 경우. 직장·재정·교류 등 영역별로 허용·제외를 따로 정함.\"],\"change\":\"주고받는 결정권의 범위가 달라진다. 말투의 거침이나 통증이 함께 증가하는 것은 아니다.\",\"not\":\"슬레이브는 도미넌트·서브의 다음 난도 단계가 아니다.\"},\"bondage\":{\"title\":\"본디지·로프·구속\",\"axis\":\"제한의 범위·지속 시간·감각·심리적 몰입을 각각 구분\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"구속을 하지 않고 소품·분위기만 즐김\",\"한 가지 움직임만 제한하는 설정을 따로 정함\",\"여러 움직임의 제한을 구분하고 각각 허용 여부를 정함\",\"제한이 관계 경험의 중심이 됨. 제한 부위·시간·해제 조건은 여전히 각각 정함\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"단단함·복잡한 매듭·몸을 띄우는 연출을 강도 등급이나 입문 순서로 삼지 않는다. 기술적 위험은 별도다.\"},\"impact\":{\"title\":\"스팽킹·임팩트 계열\",\"axis\":\"받는 사람이 느끼는 자극 강도·지속·허용 범위\",\"levels\":[\"이번에는 해당 활동을 하지 않습니다.\",\"통증을 원하지 않고 닿는 감각에만 관심\",\"타격감을 구분하지만 통증이 생기는 경험은 제외\",\"통증을 포함한 자극도 관심 범위에 넣음\",\"강한 통증을 선호할 수 있음. 도구명·멍의 유무·참는 정도로 등급을 정하지 않음\"],\"change\":\"대표 활동을 통한 비교 예입니다. 같은 분류 안에서도 활동마다 의미가 다르므로 활동을 직접 선택하면 그 활동의 뜻과 단계 예를 볼 수 있습니다.\",\"not\":\"멍·상처·참는 능력으로 단계를 매기지 않는다. 스팽킹이 곧 벌이나 가학 성향이라는 뜻도 아니다.\"},\"discipline\":{\"title\":\"훈육·규칙·과제\",\"axis\":\"규칙의 수·엄격함·적용 시간·피드백 방식\",\"level
